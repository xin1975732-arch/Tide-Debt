<article class="text" lang="zh-CN">
<p>正月初三，消息就传遍了老街：陈守义被刑拘了。</p>
<p>电器铺的卷帘门一直拉着。门口有人放了一袋橘子，有人放了两盒年糕，没留名字。卢彩娣早上出来收了一次，傍晚又出来收了一次，一句话也没说。</p>
<p>群里先是安静了一天。退群的人没有回来。新拉的那个“恒成讨债”群，金彩凤的儿子说，也没人说话。好像大家都在等一个说法，等有人先开口。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>初四下午，开口的是老胡。</p>
<p>他退了群，又被人拉了回来。他发了一条很长的语音，转成文字，错字很多，意思是这样的：</p>
<p>彩娣请的律师今天见到守义阿哥了。守义阿哥讲，那天晚上，老岑要第二天当着四十几户的面，把六户一家一家点出来。守义阿哥求他，不要讲，讲出去，六户在上林就没法做人，四十二户跟六户要结一辈子的仇。老岑不肯，两个人争起来，守义阿哥推了他一把。老岑站起来了，还骂人，叫他滚。他走的时候，老岑好好的。后来怎么死的，他不晓得。</p>
<p>最后一句，老胡是哭着说的，转出来的文字是：他是替阿拉大家挡的。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>群里一下子活了。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">我就晓得守义阿哥不会害人。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">附件也是他拿的？那是怕老岑第二天拿出来念。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">他自己家一分钱都没先拿，图什么？图的就是我们不要打起来。</p>
</div>
</div>
</div>
<p>“老岑那个人，十五年不露面，回来就要当众点名，换我也要拦。”</p>
<p>几天前，群里有人叫他“老陈”，问他早晓得为什么不讲。现在，其中有一些人改回来了，一口一个守义阿哥；另一些人什么也不叫，不说话。</p>
<p>六户里先说话的是俞家媳妇：“我们家那时候老人瘫在床上，没有守义阿哥，那笔钱轮不到我们。他现在为了不让我们家丢脸，人都进去了。”</p>
<p>应家的头像亮了，发了一个合十的表情。</p>
<p>傍晚，钟家那个读研究生的孙子起草了一封联名信，标题是《关于陈守义同志一贯表现的情况说明》。信里写他十五年为工友奔走，写他陪老人看病、替困难户垫钱、修电器不收钱，最后一段写：此次事件，系其为维护工友团结、保护困难家庭名誉，一时冲动所致，恳请从轻处理。</p>
<p>第一个签名的是胡国良。签完，他在群里发：阿拉不是人，守义阿哥是。</p>
<p>签名的人不多。</p>
<p>六户里五户签了，邬家没签。剩下的四十二户里，签的大多是这些年真欠过他人情的：他骑三轮车送去过医院的，他垫过钱的，他修了十几年电器从来不收钱的。也有人是看了老胡后来那一句才签的：没有守义阿哥年年寄催款信，这二百一十万早过了时效，岑家姑娘认都不用认。</p>
<p>到晚上，一共十九个名字。</p>
<p>金彩凤的儿子又发来几张截图。“恒成讨债”那个群里，有人说：他瞒了我们十一年，签什么签。另一个说：那些催款信，邮费都是他自己出的。那个群吵了一晚上，最后谁也没签，也谁都没退群。</p>
<p class="beat">凶手抓到了。有人离他更近了，有人离得更远。群里那道缝没有合上，只是换了个地方裂开。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>晚饭的时候，我妈说她也签了。</p>
<p>“你守义叔替我们家挡的。”她说，“我不签，我在老街上怎么做人？”</p>
<p>她看着我，等我说话。</p>
<p>钟家孙子私下发消息给我，问我签不签。我回：我是证人，不能签。</p>
<p>这是实话，也不全是实话。我签过一张笔录了，在县局三楼，签得很慢。那张纸上写的是八点钟他的手腕上什么也没有。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>初五早上，钟家孙子又在群里发了一段，是他奶奶的原话，他一个字一个字打出来的：</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av" aria-hidden="true">钟</span>
<div>
<p class="who">
<span>钟家孙子</span>
</p>
<p class="bub">守义那年送来十万块钱，现金，用一个信封装着，信封上写着我们家的名字。岑老板只肯打七折，守义去求了好几回，才求下来这十万。老头子那时候化疗，钱用在刀口上，多活了三年。守义的恩，我们家记一辈子。联名信，我们家第一个签。</p>
</div>
</div>
</div>
<p>群里有人回：姓岑的连救命钱都要打七折。又有人回：守义阿哥连这个都替人去求。</p>
<p>联名信底下，又多了两个名字。</p>
<p>过了一会儿，有人问：那六户都打了七折？</p>
<p>俞家媳妇回：我家也是七折。守义阿哥讲，岑老板的钱不够。</p>
<p>又有人问：戴师傅家呢？应家呢？老胡呢？</p>
<p>没有人回。老胡十分钟前还在群里发语音，这时候头像一动不动。应家的头像又灰了。</p>
<p>群里这一回静了很久。有人发了个问号，没人接。</p>
<p>我妈坐在饭桌那头，也在看手机。她把手机放下，又拿起来，又放下。</p>
<p>“我那二十万，一张不少。”她说，“守义从来没讲过打折。”</p>
<p>她说完这句，自己先愣住了，看着我。</p>
<p>我把钟家孙子那段话又看了两遍。</p>
<p>然后我把罗维民那本账簿的照片翻出来，翻到那一页。泡过水的蓝墨水，洇开了，可每一个字都认得出来：</p>
<p>钟德明，十五万。</p>
<p>我又翻出俞家媳妇那天在群里晒的那张收条：本金已全部结清。不写收到多少。</p>
<p>我拿着手机在饭桌边坐了很久。窗外有人家在放初五迎财神的鞭炮，一挂接一挂。</p>
<p>岑启明打给陈守义的是十五万。钟家老太记了十一年的，是十万。</p>
<p>群里大多数人算不出那五万。谁家当年借了多少，登记簿在警察那里，那张四十八户的表只在我手机里；岑启明打给陈守义的是多少，只写在那本冻过的账上。可有三户人家，不用算也晓得：他们拿的是足额。我妈是其中一户。</p>
<p>三户都没有出声。出声，就得先说自己拿了多少，再说为什么别人打了七折、自己没有。</p>
<p>九十万这个数，从来不是六户收到的钱加起来的。它是三百万减二百一十万，是岑启明那一头付出去的钱。付钱的人有转账记录，罗维民也记了账，两本账对得上。收钱的六户，各自只晓得自己那一行，从来没有人把六行加起来。</p>
<p>账要对，得两头对。这笔账，十一年来只对过一头。</p>
<p>“打七折”这三个字，是谁先说出来的，没有人讲得清。俞家媳妇只记得，守义阿哥讲过一句：岑老板的钱不够。中间那五万，账上没有，收条上没有，谁也没有提过。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>晚上九点，有人敲门。</p>
<p>是卢彩娣。她穿着一件旧棉袄，头发全白了，好像这几天才白的。我妈愣了一下，让她进来，给她倒了一杯热水。</p>
<p>她没喝，捧着杯子坐在饭桌边，就坐在我爸那副碗筷的位置上。</p>
<p>“那封信，我没签。”她说。</p>
<p>我妈没说话。</p>
<p>“他那天晚上回来，”卢彩娣看着杯子里的水，“修那台电暖器，修到快十一点。平常一刻钟的活。后盖拧上了又拆开，拆开了又拧上。我在后屋喊他吃饭，他说就好，就好。”</p>
<p>她把杯子放下，手在棉袄上擦了两下。</p>
<p>“警察问过我。我讲他一直在修东西，没讲修了多久。”她抬起头看我，“小许，我讲不出口。你去讲。”</p>
<p>她站起来就走了，门没关严，楼道里的风灌进来。我妈起身去关门，在门口站了很久。</p>
<p>我给邵峻打了电话。他听完，沉默了几秒。</p>
<p class="last">“明天上午，”他说，“你跟我去铺子里，看看那台电暖器。”</p>
</article>

</p>
    <p class="ch-no">第十五章</p>
    <h1 class="ch-title">二〇一五</h1>
    <p class="ch-meta">2,156 字 · 约 5 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>十一月底，岑启明的电话打到了电器铺。四年没联系，号码是外地的。</p>
<p>“守义，凑出来一笔钱，九十万。”他说，“不够还所有人。”</p>
<p>陈守义坐在柜台后面，手里还捏着一把螺丝刀。</p>
<p>“先还几户最急的。”他说，“不要声张。声张了，四十几户一起堵你，谁也拿不到。”</p>
<p>“哪几户？”</p>
<p>陈守义从内袋里摸出那个小本子，翻到中间一页，那一页上记着四十八户，一户一行。他用指甲在纸上划过去，一行一行，划得很慢。</p>
<p>“许家，老许在医院透析，一个礼拜三次。应家，罗会计的内弟，儿子要开刀。钟家，老头化疗。俞家，老人瘫在床上。邬家，小孩要读书。”他停了一下，“老胡。”</p>
<p>“老胡家不缺钱。”</p>
<p>“老胡嘴巴大。他不闹，别人就不闹。”</p>
<p>电话那头沉默了一会儿：“外地的呢？”</p>
<p>陈守义的指甲停在一行字上：老葛，六万。</p>
<p>他想起老葛那间平房，床底下的铁皮饼干筒，还有那个在倒扣的纸箱上写作业的孩子。去年老葛打电话来，说孩子高中没读完，跟着同乡去厂里打工了。</p>
<p>“外地的，送不过去，”他说，“也闹不起来。先本地。”</p>
<p>挂了电话，他在本子那一页的边上，写下六个名字。写到第七行，笔尖顿了顿，写了“老葛”两个字。他看了一会儿，用笔把这两个字划掉了，划了两道。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十二月，钱分六笔，从岑启明的卡上打到陈守义的卡上。每到一笔，罗维民就骑车过来，把金额、日期抄进他的账簿，抄完，喝一杯茶就走。</p>
<p>取现金要预约。陈守义跑了四趟银行，每趟取一点，柜员认得他了，问他是不是家里要买房。他说，帮人取的。</p>
<p>钱拿回来，用旧报纸包着，锁在柜台底下的铁柜里。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十二月十七日夜里，小舅子打来电话。</p>
<p>“姐夫，下个礼拜付首付。那十万，你再不拿来，我去老街上喊。”</p>
<p>“下个礼拜给你。”</p>
<p>“你四年前也这么讲。”</p>
<p>电话挂了。后屋里，卢彩娣在摔东西。先是一只碗，然后是一个锅盖，锅盖在水泥地上转了好几圈才停。</p>
<p>“你自家借出去十五万，四年了，一分不去要。”她在门帘后面喊，“老屋征地补的十六万，你一笔一笔，全垫给了别人家。厂又不是你开的！阿拉弟弟的房子要是买不成，你叫我回娘家怎么做人？”</p>
<p>陈守义没有回答。</p>
<p>这个月，他去过两趟信用社。管贷款的小周是他看着长大的，表格翻了半天，讲铺子是租的，没有抵押，最多贷两万，还要找一个人担保。他想了一圈，能找的担保人，都是借了钱给厂里、到现在还没拿回来的。</p>
<p>他翻开小本子，翻到中间那一页。四十八户，一户一行。他自己那一行：陈守义，十五万。</p>
<p>九十万就锁在柜台底下。先还最急的，是他自己讲的。他不是最急的那一户。</p>
<p>他把本子往后翻，翻到垫款那几页。钟家，五万五。俞家，五万二。邬家，三万六。许家，一万二。</p>
<p>每一笔，都是讲过不用还的。</p>
<p>他把卷帘门拉到底，把铁柜打开，把那几包报纸拿出来，摊在柜台上。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>信封是在小店里买的，牛皮纸的，一摞二十个。</p>
<p>他先拿了一个，写上“许家”，开始数钱。一百张一扎，一扎一扎往里放。数到二十扎，他停下来，又从头数了一遍。二十万，一张不少。</p>
<p>他把信封封上，放在柜台左边。</p>
<p>然后他翻开小本子，翻到后面几页。那几页记的不是借款，是这几年他替人垫的钱。一笔一笔，日期、事由、金额，字写得很工整。</p>
<p>许家那一行：二〇一四年九月，许家小孩学费，一万二。</p>
<p>他看着那一行，看了一会儿，在后面写了一个字：免。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>应家，十五万。老胡，十五万。他数得很快，封好，放在许家的信封旁边。</p>
<p>钟家。</p>
<p>他数到第十五扎，手停住了。</p>
<p>本子上，钟家那一行写着：二〇一二年至二〇一四年，钟师傅化疗，垫医药费，五万五千。底下还有几行小字，是哪一次住院、哪一次送去的。他每次送钱去，钟家老太都拉着他的手，说守义，这钱阿拉一定还你。他每次都说，拿去用，不用还。</p>
<p>铺子里很静，后屋的电视开着，听不清在播什么。</p>
<p>他从信封里抽出五扎，放在柜台的另一边。</p>
<p>然后他从抽屉里找出一支红笔。那是他当车间主任时改工时单用的，笔帽上缠着一圈胶布。他在钟家那一行垫款的金额上，用红笔划了一道，在旁边写：冲五万。又在后面添了两个字：免五千。</p>
<p>他拿起钟家的信封，在正面写：钟家　拾万。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>俞家、邬家，他也是这样：数完，停一会儿，抽出几扎，拿起红笔。</p>
<p>柜台左边，是六只封好的信封。柜台右边，是十三扎钱。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>后屋的电视关了。卢彩娣没有再摔东西。</p>
<p>陈守义又拿了一个空信封，在正面写了两个字：娘舅。他从右边那十三扎里，数出十扎，装了进去。剩下的三扎，锁回了铁柜。</p>
<p>他把七只信封并排摆在柜台上，一只一只看过去。</p>
<p>明天一早，他要骑三轮车，先去许家，再去应家、老胡家。下午去三塘边上的钟家、俞家，晚上去邬家。他已经想好了跟钟家老太说什么：岑老板凑的钱，不够还所有人。就这一句。人家要是问，他不答。</p>
<p>收条的格式也想好了：本金已全部结清。不写数目。写了数目，传出去，大家一比，更难听。</p>
<p>他把小本子翻到最后，在那一页，每一笔垫款，每一道红线，每一个“免”字，都对齐了。借方和贷方，一分不差。</p>
<p>他合上本子，关了柜台上的灯。</p>
<p>“账平了。”他对着黑下来的铺子说。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>第二天下午，三塘边上，钟家。</p>
<p>老太把信封接过去，没有拆，先拉住了他的手。他当着她的面，把钱一张一张数了一遍，然后说了想好的那一句：岑老板凑的钱，不够还所有人。</p>
<p>老太看着信封上的“拾万”，过了一会儿，自己算出来了：“那是打了七折。”</p>
<p>陈守义没有说话。</p>
<p>“又叫你去求人了。”老太说。她在收条上按了手印，手还是没松，“你垫的那些，等孙子工作了，阿拉一定还你。”</p>
<p>“不用还。”陈守义说。</p>
<p class="last">从钟家出来，他推着三轮车走了一段，才骑上去。</p>
</article>

    <p class="ch-no">第十六章</p>
    <h1 class="ch-title">小本子</h1>
    <p class="ch-meta">1,544 字 · 约 4 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>正月初六上午，卢彩娣把卷帘门拉起来一半，让我们弯腰进去。</p>
<p>铺子里一股机油和冷灰的味道。柜台上的电饭煲、电风扇、收音机都还在原地，等着它们的主人回来拧最后一颗螺丝。那台电暖器搁在柜台角上，后盖拧得严严实实。</p>
<p>技术员戴上手套，拿螺丝刀一颗一颗往下拧。一共八颗，他拧下来，排在一张报纸上，跟陈守义平常排的一样整齐。</p>
<p>后盖掀开，里面是发热管、温控器、一圈线。线圈和外壳之间，塞着一个塑料袋，袋口打着结。</p>
<p>袋子里是一个巴掌大的小本子，封皮是蓝色的人造革，四个角磨得发白。</p>
<p>卢彩娣站在门口，看着那个本子，嘴唇动了一下，什么也没说。</p>
<p>邵峻把本子装进证物袋，递给我：“你看。你看得懂。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我隔着证物袋，一页一页往后翻。</p>
<p>最前面几十页，是九几年的字，铅笔写的，已经淡了：某月某日，三号机床，某某加班两小时；某月某日，扳手一把，借给胡国良。后面没有“已还”。</p>
<p>我想起老胡在活动室打牌的样子，差一点笑出来，又没笑出来。</p>
<p>往后，是二〇一一年。四十八户，一户一行，名字，金额，日期，跟罗维民那本登记簿一模一样。最后一行，单独写着：</p>
<div class="doc note">
<p>四十八户，欠。</p>
<div class="blank">
</div>
</div>
<p>再往后，二〇一三年开始，每年一页。头一页最上面写着：委托书四十八户签齐，原件交罗会计。底下是：催款函四十八封，一户一封，寄岑启明老家的地址，挂号，邮费多少；回执四十八张，寄回各家收着。二〇一九年那一页，邮费涨了，他在旁边记了一笔：比去年多九块六。外地户那几行，地址改过好几回，旁边有小字：老葛搬了，问他儿子要的新地址；某某回了四川，电话打了三次才通。</p>
<p>十四年，一年没断。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>二〇一五年那一页，是一个名单。</p>
<p>许家，应家，钟家，俞家，邬家，胡国良。六个名字，第七行写着“老葛”，被划掉了，划了两道。</p>
<p>那两道线划得很重，笔尖把纸都划毛了。</p>
<p>老葛在汽车站上车之前说：剩下的那点钱，俺不急。他是真的不急吗？他儿子高中没读完，现在在哪个厂里打工，我都不知道。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>再往后翻，是垫款。</p>
<p>一笔一笔，日期、事由、金额。钟家，二〇一二年到二〇一四年，钟师傅化疗，五万五千。俞家，轮椅、护工，五万二千。邬家，小孩学费，三万六千。</p>
<p>每一笔垫款的金额上，都有一道红线。</p>
<p>钟家那一行，红笔写着：<span class="redpen">冲五万，免五千。</span>
</p>
<p>俞家：<span class="redpen">冲五万，免二千。</span>
</p>
<p>邬家：<span class="redpen">冲三万，免六千。</span>
</p>
<p>我在会计学里学过这个。红字冲销：一笔账记错了，或者要抵掉，就用红字再记一遍，正负相抵，账面归零。陈守义没学过会计。可他会。</p>
<p>夹在这一页里，有一张折起来的纸。我隔着证物袋看不清，邵峻替我打开了：<span class="pencil">五千，两千，六千，一万三千。</span>
</p>
<p>我把罗维民那本账簿的照片打开，放在旁边。</p>
<p>钟家，岑启明打来十五万，送去十万，冲五万。俞家，十五万，送去十万，冲五万。邬家，十万，送去七万，冲三万。</p>
<p class="num">十三万。</p>
<p>可钟家老太记着的，是“岑老板只肯打七折，守义求了好几回”。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>许家那一行，在垫款的最后。</p>
<div class="doc note">
<p>二〇一四年九月，许家小孩学费，一万二。</p>
<div class="blank">
</div>
</div>
<p>后面一个字：<span class="hand">免。</span>
</p>
<p>没有红线。</p>
<p>我拿着证物袋站在柜台前面，没有动。</p>
<p>二〇一四年九月，我大一，第一次一个人坐大巴去外地报到。学费是开学前一个礼拜打到卡上的。我妈说，是你守义叔想的办法。</p>
<p>那一万二是真的。我的学费里，真的有一万二是他给的。</p>
<p>它也是一行账。他记下了，然后免了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>卢彩娣一直站在门口。邵峻转过去问她，二〇一五年那十万，是怎么还给她弟弟的。</p>
<p>她扶着门框，过了很久才开口。</p>
<p>“他拿回来一个信封，写着娘舅。”她说，“我问他哪里来的钱。他讲，是钟家他们还的。我就信了。”</p>
<p>她低下头。</p>
<p>“我也没问是怎么还的。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>本子的最后几页，是今年的。</p>
<p>腊月二十二：矿泉水两箱，三十六元。橘子一袋，二十元。那天早上在老厂门口，我亲眼看着他记的。</p>
<p>同一天，下一行：盒饭五份，一份不辣，七十五元。</p>
<p>再下面一行，是同一天的日期。日期后面，只写了一个字：</p>
<div class="doc note big">
<p>岑。</p>
<div class="blank">
</div>
<div class="blank">
</div>
</div>
<p>后面是空的。</p>
<p class="last">我想起档案室那张稿纸。关于借款余额的说明。标题下面，只有一个“一”字，一个顿号。</p>
</article>

<span>No.17</span>
<i>
</i>
<b>正月初十</b>
</p>
    <p class="ch-no">第十七章</p>
    <h1 class="ch-title">钟家老太</h1>
    <p class="ch-meta">1,693 字 · 约 4 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>初七，假期结束了。我给公司发了邮件，把剩下的年假一次请完。财务总监回了一句：家里的事处理好再回来，账我们先替你做着。</p>
<p>岑悦也在等。她在电话里说，父亲的后事办完了，那二百一十万，扣掉腊月二十二先付给老葛的五万，剩下的她认，可她要一份能拿给律师看的核对报告，一户一户，谁借了多少，谁收过多少，谁还没收到。</p>
<p>“我爸那天说，明天让各家自己说拿了多少。”她说，“他没等到。你替他问。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>正月初十，我去了三塘边上的钟家。</p>
<p>钟家孙子在门口等我，他过完年就要回学校，背包已经收拾好了，搁在门边。屋里很暗，八仙桌上供着老头的遗像，香炉里插着三根香，烟一直往上走。</p>
<p>老太坐在桌边，穿着一件深蓝色的罩衫，袖口别着一根针。她耳朵背，孙子凑在她耳边，把我的来意说了一遍。</p>
<p>她听完，起身进了里屋。过了好一会儿，抱出来一只铁皮饼干盒，跟我妈那只差不多，盖子上的花早磨掉了。</p>
<p>盒子里是老头的病历，一本一本，用橡皮筋捆着。病历底下，压着一只牛皮纸信封，边角软了，口子拆开过。</p>
<p>信封正面，是陈守义的字：钟家　拾万。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>“那年守义送来的。”老太说，“十万，一张不少，当着我的面数的。”</p>
<p>“奶奶，”我说，“当年你们家借给厂里的，是十五万。”</p>
<p>她点点头：“我晓得。借据上写着的。”</p>
<p>“那另外五万……”</p>
<p>“守义讲，岑老板的钱不够。我一看，是打了七折，晓得是他去求下来的。”她看着那只信封，“厂都倒了，还能拿回来十万，我谢了守义好几年。”</p>
<p>我把手机里罗维民那页账的照片调出来，放大，递到她面前。第四行：钟德明，十五万。</p>
<p>“奶奶，这是罗伯的账。”我说，“那年岑老板打给守义叔的，是十五万，没有打折。”</p>
<p>孙子凑到她耳边，又说了一遍。</p>
<p>老太把手机推回给我，没有说话。</p>
<p>她把病历本一本一本拆开，翻到最后一本的封底。封底内侧，用圆珠笔写着一列数字，字歪歪扭扭，是老人的手写的：</p>
<div class="doc medical">
<p>二〇一二年三月，守义送来，一万。</p>
<p>二〇一二年十月，一万五。</p>
<p>二〇一三年，两万。</p>
<p>二〇一四年正月，一万。</p>
<p>合计，<span class="scratch-t">五万五</span>。</p>
</div>
<p>“老头子化疗那两年，守义前前后后送来的。”老太说，“每回我讲，守义，这钱阿拉一定还你。他每回都讲，拿去用，不用还。”</p>
<p data-fx="scratch">她用指甲在“五万五”那几个字底下划了一下。</p>
<p>“我记着，不是为了算。是怕自己老糊涂了，忘了人家的好。”</p>
<p>钟家孙子站在旁边，一句话也没有。</p>
<p>“十五万，送到我手里十万。”老太把那只信封按在那一列数字旁边，“那就对了。守义拿回去五万，是他垫的钱。他还少拿了五千。”</p>
<p>她把信封放回盒子里，把病历本一本一本码好。</p>
<p>“他拿回去，是应该的。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我问她，年前岑老板有没有来过。</p>
<p>“来过。腊月十几，提了一箱牛奶。”她说，“十几年没见了，人瘦了。我拉着他的手谢他，讲那年那十万，救了老头子的命，多活了三年。”</p>
<p>“他怎么说？”</p>
<p>“他愣了一下，问我：十万？我讲是啊，你钱不够，打了七折，是守义求了好几回才求下来的。”老太停住了，“他脸色一下子就不对了，坐了一会儿就走了，牛奶都没让我拆。”</p>
<p>她看着我，眼睛浑浊，可看得很直。</p>
<p>“许家儿子，是不是我讲错话了？”</p>
<p>我没有回答。窗外有人家在放炮仗，是初十，有人家接灶神。香炉里那三根香，烧到了一半。</p>
<p>腊月二十二下午四点，档案室的门关着，岑启明的手指在桌上点着，一下，一下，像在报数。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>从钟家出来，我又去了俞家。</p>
<p>俞家媳妇听我讲完，站在门口，脸一下子涨红了。</p>
<p>“他就讲一句钱不够，我们就当是打了折……那五万是他自己拿了？”她的声音越来越高，“他垫的钱，我们又不是不认！他开口讲一声，阿拉卖房子也还他！为什么不讲？”</p>
<p>轮椅上的老人醒了，问出了什么事。她转身进屋，把门关上了，门里还在骂，骂着骂着，没声了。</p>
<p>邬家的门开得很慢。邬家女人听我讲到一半，就开始哭。她儿子今年考上了大学，门口那张红纸还贴着。</p>
<p>“他给我们大女儿垫的学费，三万六。”她哭着说，“这些年，我们一直当是他白给的，过年过节都要送两只鸡过去。”</p>
<p>她没说下去，用手背擦了擦眼睛，又说：“现在晓得了，是借的，也是还了的。”</p>
<p>她把门轻轻关上了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>傍晚，钟家孙子追到村口的公交站，把一个塑料袋塞给我，里面是两包他奶奶做的年糕。</p>
<p>“我奶奶让你带给你妈。”他说，“还有一句话，让你带给守义叔。”</p>
<p>公交车来了，车门开着，司机在按喇叭。</p>
<p class="last">“她讲：你跟守义讲，我没怪过他。”</p>
</article>

<b>正月十一</b>
</p>
    <p class="ch-no">第十八章</p>
    <h1 class="ch-title">母亲那一行</h1>
    <p class="ch-meta">1,733 字 · 约 4 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>正月十一，我在我妈家的饭桌上开始写那份报告。</p>
<p>饭桌是我写了九年作业的那张。桌面上有一道划痕，是我初三那年用圆规划的，我妈拿抹布擦了好几年，越擦越亮。</p>
<p>报告要给三个地方：岑悦和她的律师，邵峻，还有工友群。四十八户，每一户都要看到自己那一行，确认无误，自己签字。</p>
<p>我先画了一张表。四十八行，七列：户名，借款人，二〇一一年借款金额，二〇一五年已还，实际到户，本次应付，备注。</p>
<p>前面四十二行，写得很快。都是一样的：二〇一五年已还，零；实际到户，零；本次应付，等于借款金额。只有老葛那一行，备注里多了一句：腊月二十二已先付五万，本次应付一万。</p>
<p>然后是六户。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>应家，应国庆，十五万，已还十五万，实际到户十五万，本次应付零。</p>
<p>胡国良，十五万，十五万，十五万，零。</p>
<p>钟家，钟德明，十五万，已还十五万，实际到户十万。</p>
<p>写到“实际到户”这一列，我停了一下，在备注里写：差额五万，见附注一。</p>
<p>俞家，十五万，十五万，十万，见附注一。邬家，十万，十万，七万，见附注一。</p>
<p>然后是许家。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我手边有两支笔，一支铅笔，一支红笔。红笔是从我妈的针线盒里找出来的，平常她用来给食堂的菜单画圈。</p>
<p>这一行，我得先改一笔旧账。</p>
<p>腊月二十六早上七点十二分，我交给邵峻的那张表上，许家这一行写的是：戴秀琴，二〇一一年三月，二十万，原件，未还。后来我改过一次，可那张表已经交出去了，邵峻那里有，岑悦那里也有。</p>
<p>账记错了，改的办法有好几种。最省事的，是在错的那一笔上划一道线，旁边写上对的。我这份是报告，不是账簿，本来用不着别的。可我选了最麻烦的那一种：用红字把原来那一笔原样再记一遍，正负相抵，再另起一行，把对的记上。这样以后谁来翻，都看得出错在哪里、改在哪里。</p>
<p>我拿起红笔，在许家那一行上面，另起一行，写：</p>
<div class="doc entry red">
<p>戴秀琴，二十万，未还。</p>
</div>
<p class="beat red">红字。</p>
<p>我妈从厨房出来，手里端着一碗汤圆，正月里，是芝麻馅的。她走到桌边，看见那一行红字，站住了。</p>
<p>红笔写名字不吉利。这是她说了三十年的话。我从小到大，核账也好，写作业也好，从来没用红笔写过一个人的名字。</p>
<p>她把汤圆放在桌角，没有说话。</p>
<p>我在红字底下，用铅笔写对的那一行：</p>
<div class="doc entry pencil">
<p>许家，戴秀琴，借款二十万；二〇一五年十二月十八日已还二十万，实际到户二十万；本次应付，零。备注：经手人陈守义、罗维民，收条原件附后。</p>
</div>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>附注我写了两条。</p>
<p class="fn">
<b>附注一</b>二〇一五年十二月，岑启明分六笔向陈守义汇款九十万，委托其转交六户。经核对，实际到户七十七万。差额十三万，系陈守义以此前为钟家、俞家、邬家垫付的医药费、护理费、学费冲抵，冲抵时三户不知情，收条只写“已全部结清”，未写金额。陈守义另免除三户垫款零头共一万三千元。</p>
<p class="fn slow">
<b>附注二</b>二〇一四年九月，陈守义为许家垫付学费一万二千元。该笔未还，陈守义本人记录为“免”。</p>
<p>写附注二的时候，我写得很慢。这一条，跟岑启明的账没有关系，跟四十八户也没有关系。它不写，谁也不知道。</p>
<p>我写了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>正月十二，老胡打来电话。</p>
<p>“许会计，那张表，听讲你要发群里？”</p>
<p>“要发。每户都要自己核，自己签。”</p>
<p>“我那一行……‘实际到户’那一列，能不能不写？就写个已还，不要写十五万。人家一看，我拿足了，钟家、俞家打了七折……”</p>
<p>“胡叔，那一列每户都有。”</p>
<p>他沉默了一会儿，又问：“听讲守义那个本子上，还记着我九八年借的一把扳手？”</p>
<p>“记着。后面没写还。”</p>
<p>电话那头，老胡骂了一句什么，听不清，然后笑了一声，笑得很难听：“那把扳手，早就生锈了。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>正月十三，罗维民来了。他站在楼梯口，没上来，手里拎着一袋年糕。</p>
<p>“应家那一行，”他说，“写进去，我老婆又要哭一场。”</p>
<p>“罗伯，你的账上，那一行也写着。”</p>
<p>他点点头，把年糕递给我，转身下楼。走到一半，又回过头：“附注写得好。账要两头对，你做到了。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>正月十四夜里，报告写完了。十一页，四十八行，两条附注，后面附着十九张收条和借据的照片。</p>
<p>我把它从头到尾核了一遍，又核了一遍。借款金额那一列，加起来是三百万。二〇一五年已还九十万，其中实际到户七十七万，冲抵十三万；这次应付二百零五万；腊月二十二先付给老葛五万。三笔加起来，还是三百万。</p>
<p>我妈一直坐在饭桌对面，没睡。她半夜煮的那碗汤圆早就凉了，也没去热。</p>
<p>快十二点的时候，她站起来，进了房间。过了一会儿出来，手里抱着那只饼干铁盒。</p>
<p>她把铁盒放在报告旁边，推到我面前。</p>
<p class="last">“原件，”她说，“你都附上。”</p>
</article>

<b>元宵</b>
</p>
    <p class="ch-no">第十九章</p>
    <h1 class="ch-title">各自签字</h1>
    <p class="ch-meta">2,788 字 · 约 7 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>元宵节早上八点，我把报告发进了群里。</p>
<p>十一页，一个PDF。我在下面加了一句：每户请核对自己那一行，有不对的，直接跟我讲。</p>
<p>群里静了很久。</p>
<p>第一个回的是金彩凤的儿子：我妈那一行，对的。</p>
<p>然后是钟家孙子：附注一，我念给我奶奶听了，她讲，对的。</p>
<p>应家的头像亮了一下，发了两个字：对的。</p>
<p>老胡隔了一个钟头才回：对的。后面又跟了一句：扳手过两天还。</p>
<p>有人发了一个笑脸，又撤回了。</p>
<p>外地户那边，回得最慢。快中午的时候，老葛的儿子发来一段语音，安徽口音，说他念给他爸听了，他爸讲，一万块，对的，不急。</p>
<p>到晚上，四十八户里，回了三十一户。没有一户说不对。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>那天上午，我妈去了菜场。</p>
<p>她出门前换了一件干净的外套，在镜子前面站了一会儿，把头发重新梳了一遍。</p>
<p>我在楼上的窗口看着她走出老街。快中午她回来了，篮子里是两把青菜、一条带鱼、一块豆腐。</p>
<p>“碰到谁了？”我问。</p>
<p>“碰到好几个。”她把菜放进水池，“有的人讲话，有的人不讲话。金彩凤拉着我讲了半天，讲她儿子在苏州又换工作了。”</p>
<p>她拧开水龙头，水哗哗地响。</p>
<p>“卖鱼的老王，多送了我一根葱。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>二月初，岑悦带着律师来了上林。</p>
<p>签字定在社区居委会的会议室，不是老厂。岑悦说，她不想再去那栋楼。</p>
<p>律师四十多岁，戴一副无框眼镜，把报告翻得很仔细。翻到最后，他抬起头：“按规矩，这些借款早就过了诉讼时效，继承人可以不认。”</p>
<p>岑悦没说话。</p>
<p>“可是这里有十四年的催款函。”律师从包里拿出一沓复印件，是罗维民帮着从各家找出来的，挂号信的回执，一年一张，“每年都催过，时效每年都断一次。这笔债，在法律上一直是活的。”</p>
<p>我想起那个小本子。二〇一九年那一页：邮费，比去年多九块六。</p>
<p>岑悦翻开报告第一页。第一页最上面一行，是我按她的要求写的：</p>
<p>二〇一五年十二月，岑启明已偿还六户借款本金九十万元，有转账记录为证。</p>
<p>她的手指在“已偿还”三个字上按住，过了好一会儿才松开。</p>
<p>“我爸的账，我认。”她说，“二百零五万，从遗产里付。”</p>
<p>她在继承人那一栏签了字，签完，把笔放下，没有抬头。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>签字签了三个礼拜。</p>
<p>规矩是律师定的：每户本人来，核对自己那一行，在“本人核对无误”后面签名，按手印。不能代签。</p>
<p>本地的工友，大多是自己来的。年纪大的，儿女陪着。有人签得很快，有人签之前要我把那一行念三遍。有一个老师傅，签完了又要回笔，在自己名字后面添了一个“已”字，说是怕人家看不出来他签过了。</p>
<p>钟家老太是她孙子扶着来的。她签字的手抖得厉害，一个“钟”字写了半天。签完，她没走，问律师：“守义拿回去的那五万，要我追吗？”</p>
<p>律师说，那是刑事案子里的事，到时候法院会问您。</p>
<p>“到时候再讲。”老太说。</p>
<p>俞家媳妇签得很用力，纸背上都印出了字。邬家来的是那个大女儿，她签完，站着看了一会儿附注一，然后把报告翻过去，扣在桌上。</p>
<p>应国庆是一个人来的。他签完自己那一行，没有走，坐在门口的长凳上等。</p>
<p>罗维民来得晚，快十一点才到。他要签的不是借款人那一栏，是经手人。二〇一五年那六笔，每一笔后面，都要他再签一次名字，证明钱是从哪里来、到哪里去的。</p>
<p>他进门的时候，外套的扣子扣错了一粒。</p>
<p>“来晚了。”他说，“家里那个，不让出门。”</p>
<p>应国庆站起来，看了他一眼，转过来跟我说：“我姐早上讲，签了，我们家那十五万就白纸黑字摆在四十八户面前了。”他停了一下，“我跟她讲，姐，账上写着的，都是真的。”</p>
<p>罗维民坐下来，在六个“经手人”后面，一个一个签上自己的名字。签到第六个，他把笔帽盖上，又打开，把最后一笔重新描了一遍。</p>
<p>老胡来的时候，拎着一个塑料袋。他签完字，把袋子放在桌上，里面是一把扳手，锈得发红。</p>
<p>“守义的。”他说，“等他出来，你交给他。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>外地的十四户，签得最难。</p>
<p>律师要视频核对，再把签好字的纸寄回来。有的人在工地上，背景里全是机器声；有的人在流水线上，休息十分钟，对着手机把那一行念一遍；有一个四川的工友，视频接通了，屏幕里是他八十岁的老娘，他人在新疆，信号断了三回。</p>
<p>老葛不肯视频。他坐了一夜的车，自己来了。</p>
<p>他儿子陪着。那个当年在倒扣的纸箱上写作业的孩子，现在三十岁了，比我高半个头，手很粗，指关节上有几道旧口子。他在苏州一个电子厂里，带一条线。</p>
<p>老葛不太会写字，儿子替他把名字写在旁边，老葛自己按了手印。按完，他看着那一行，用手指头一个字一个字地点过去：借款六万，已付五万，本次应付一万。</p>
<p>“对的。”他说。</p>
<p>他儿子在见证人那一栏签了名，签得很快，一笔下来，像在流水线上贴标签。</p>
<p>签完，他把笔递给我，看了我一眼：“你就是许家那个，读大学的？”</p>
<p>“是。”</p>
<p>“我爸讲过你。”他说，“讲你小时候算术好。”</p>
<p>他把笔帽盖上，扶着老葛出了门。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>晚饭是在我家吃的。</p>
<p>他儿子签完字就去赶车了，苏州那边夜里还有一个班。老葛本来也要跟着走，我妈听说他来了，叫我去车站把他拦了回来。</p>
<p>饭桌上摆了六个菜，中间一锅黄鱼年糕汤。我妈拿出两只碗，一只是好的，一只是那只碗沿有缺口的青瓷碗。她把好的那只推到老葛面前，自己端起了那只缺口的。</p>
<p>老葛看着面前那只碗，没有动。</p>
<p>“戴师傅。”他说。</p>
<p>我妈放下筷子。</p>
<p>“那年你家先拿了钱，俺晓得了。”老葛说，“老许那时候在医院透析，一个礼拜三回。换了俺，俺也拿。”</p>
<p>“那年你儿子……”我妈说到一半，说不下去了。</p>
<p>“他书没读完，不怪你家。”老葛说，“怪那几年。”</p>
<p>他从蛇皮袋里掏出一包苔干，放在桌上，推到我妈面前，然后站了起来。</p>
<p>“戴师傅，饭俺就不吃了。”他说，“等明年吧。”</p>
<p>他拎起蛇皮袋，出了门。楼道里他的脚步声，一级一级，往下去了。</p>
<p>我妈坐在那里，面前是那只缺口的青瓷碗，碗里是空的。桌子对面，那只好碗也是空的。中间那锅黄鱼年糕汤，还冒着热气。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>四十八户里，最后一户的签字，是律师从看守所带回来的。</p>
<p>陈守义那一行：借款十五万，二〇一五年已还，零；本次应付，十五万。</p>
<p>“本人核对无误”后面，是他的名字。字还是那么工整，一笔一画，像他记账。</p>
<p>名字底下，多了一行小字，也是他的笔迹：</p>
<div class="doc sign">
<p>本户应付十五万，其中五万转付钟家，五万转付俞家，三万转付邬家。</p>
</div>
<p>再底下，还有两个字：</p>
<div class="doc sign big">
<p>零头免。</p>
</div>
<p>律师问过他，“零头免”是什么意思。他说：当年免掉的那一万三，还是免。律师又说，这几行是陈守义自己要求加的，他问过，这样写在法律上算主动退赔，对量刑有好处。陈守义说，他不是为了这个。</p>
<p>那天晚上，我把陈守义这一户，单独算了一遍。</p>
<p>二〇一一年，借给厂里十五万，里面有十万，是向小舅子借的。</p>
<p>二〇一二年到二〇一四年，垫钟家五万五，俞家五万二，邬家三万六，许家一万二，合计十五万五。</p>
<p>二〇一五年，冲回十三万。其中十万，装在写着“娘舅”的信封里，还了小舅子。</p>
<p>今年，本户应付十五万，转付钟家、俞家、邬家十三万，零头免。</p>
<p>进出相抵，这一户少了十五万五千，正好是他这些年垫出去的数。</p>
<p>十四年的催款函，邮费都记在小本子上，没有算进来。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>三月底，四十八户都签完了。</p>
<p>我把签字页一张一张扫描，排在报告后面。四十八个名字，四十八个手印，没有一个是别人代签的。</p>
<p>那天晚上，邵峻打来电话。</p>
<p class="last">“开庭定了，”他说，“六月。”</p>
</article>

<article class="text" lang="zh-CN">
<p>六月，上林的杨梅熟了。</p>
<p>老街口一溜排开七八个挑子，竹篮里垫着杨梅叶子，果子紫得发黑。卖杨梅的人见人就喊：“刚落树的，不甜不要钱！”</p>
<p>开庭前一天，我从明州回来。我妈挑了两篮最好的，一篮装进冰箱，一篮用纱罩罩着。</p>
<p>“这篮，你拿下楼去。”她说。</p>
<p>楼下电器铺的卷帘门拉着一半。卢彩娣坐在柜台后面，守义坐惯的那张凳子上，在择豇豆。我把杨梅放在柜台上，又把老胡那把扳手递给她。锈还在，老胡用砂纸打过，打掉了一层，露出一点铁的颜色。</p>
<p>“胡叔讲，等守义叔出来，交给他。”</p>
<p>她接过去，看了一会儿，放进了柜台底下的抽屉里。</p>
<p>“那五万，钟家孙子退回来了。”她说，“讲是他奶奶的意思：老头子化疗用的是守义的钱，这五万，本来就该还他。俞家收了，没说话。邬家那个女人，收到钱那天，站在我家门口哭了半天，我也陪着哭了半天。”</p>
<p>她把抽屉推上。</p>
<p>“他那一万三，还是免着。”</p>
<p>她把抽屉又拉开，从里面拿出一张作业本纸，叠得方方正正。</p>
<p>“昨天，邬家那个大女儿送来的。”她说，“现在在明州一家厂里上班，挣得不多。站在柜台外面，不肯进门。”</p>
<p>纸上是一个小姑娘的字：今借到陈守义人民币叁万陆仟元整，分五年还清。底下按了手印。</p>
<p>“我讲不用，”卢彩娣说，“她讲，不用还是守义叔讲的，还不还，是她自己的事。”</p>
<p>她把那张纸压在老胡的扳手底下，把抽屉推上了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>法庭在县城新区，楼很新，走廊里一股油漆味。</p>
<p>旁听席坐了二十几个人。第一排是岑悦，穿一件黑色的衬衫。她后面是卢彩娣，头发全白了，坐得笔直。我妈坐在卢彩娣旁边。钟家孙子扶着老太坐在靠过道的位置，老胡、罗维民、俞家媳妇坐在后面。最后一排，是老葛。他又坐了一夜的车。</p>
<p>陈守义被带进来的时候，旁听席上有人动了一下。</p>
<p>他瘦了很多，头发剃短了，全白。他朝旁听席看了一眼，看到老胡，看到卢彩娣，看到我，又看到最后一排的老葛，停了一下，转过身去，站好。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>起诉书念了两项。一项是岑启明的死，一项是那十三万。</p>
<p>审判长问他，对起诉书有没有意见。</p>
<p>“推，是推的。”陈守义说，“他站起来了，还骂人，指着门叫滚。走的时候，他好好的。”</p>
<p>他说得很急，跟正月初二在楼梯口说的一模一样。</p>
<p>公诉人随后念了他在看守所的一段供述。那天晚上八点多，他进档案室收饭盒，老岑叫他把门关上，讲：钟家老太讲，她那年拿到手的是十万。明天外地的工友到齐，我当着大家，一户一户问。</p>
<p>后来法医出庭。是一个五十来岁的女人，说话很慢，一个字一个字。她讲颅骨的裂缝，讲裂缝底下慢慢积起来的血，讲这种伤人当场不一定倒，能站起来，能骂人，能写字。</p>
<p>“这个阶段，医学上叫中间清醒期。”她说，“伤者通常会有头痛、头晕、恶心。如果这个时候送医，开颅减压，不少是能救回来的。”</p>
<p>这些话，正月里在审讯室，邵峻大概跟他讲过。律师后来说，他一直摇头，只说老岑站起来了，还骂了人。</p>
<p>陈守义抬起头。</p>
<p>我坐在旁听席上，看见他的手抓住了被告席前面的栏杆，指节一点一点发白。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>钟家老太是作为证人出庭的。她走不快，孙子扶她走到证人席，又被法警请了回去。</p>
<p>公诉人问她，那年陈守义送去的是多少钱。</p>
<p>“十万。”</p>
<p>“您知道您家当年借出去的是十五万吗？”</p>
<p>“晓得。”</p>
<p>“您知道另外五万去了哪里吗？”</p>
<p>“晓得。守义拿回去了。”老太说，“老头子化疗那两年，守义前前后后送来五万五。他拿回去五万，还少拿了五千。”</p>
<p>审判长问她，对这五万的退赔，有什么意见。</p>
<p>老太没有马上回答。她转过头，朝被告席看了一眼。陈守义也在看她。</p>
<p>“那五万，我不要。”她说，“本来就是守义的钱。”</p>
<p>她停了一下，声音大了一点，像是怕他听不见：</p>
<p>“守义，我没怪过你。”</p>
<p>陈守义低下了头。他的肩膀在抖，抖了很久。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>岑悦是作为被害人家属发言的。她站起来，没有看稿子。</p>
<p>“他的道歉，我不接受。”她说。</p>
<p>法庭里很静。</p>
<p>“我爸最后打的那个电话，是想打给一个看得懂账的人。”她看着被告席，“他没打出去。”</p>
<p>她坐下了，一直到休庭，都没有再抬头。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>最后陈述的时候，审判长问陈守义还有什么要说。</p>
<p>他站了很久，久到书记员抬起头来看他。</p>
<p>“那天晚上，”他说，“老岑讲头晕，叫我把门带上。”</p>
<p>他的声音很哑。</p>
<p>“我在门口站了一分钟。”</p>
<p>他没有再说下去。法警扶他坐下的时候，他的嘴唇还在动，没有声音。</p>
<p>那是守义叔第一次在我面前，单说一个“我”字。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>宣判定在一个月以后。</p>
<p>那天夜里，我翻群。</p>
<p>群名不知道什么时候改了。“恒成老工友”后面那个括号，被人删掉了。</p>
<div class="gname" role="img" aria-label="群名：恒成老工友，括号里的“年前结清”被删掉了">
<small>群聊名称</small>恒成老工友<s>（年前结清）</s>
</div>
<p>群里没人问是谁删的。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>第二天一早，我去了二塘。</p>
<p>老厂那栋楼还在，一楼的仓库照样打包，门口的绿色垃圾桶换了一只新的。我没有进去，沿着塘路一直往北走。</p>
<p>二塘外面是三塘，三塘外面是四塘，一道一道排到看不见的地方。最外面那道塘的外头，是退了潮的海涂。</p>
<p>泥滩上一道一道全是潮水留下的印子，深的浅的，一层压着一层。几只白鹭在泥里走，走一步，停一下。</p>
<p class="ending" data-fx="ending">远处，又有人在打桩。</p>
<div class="thud" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>

  if (lightMq && lightMq.addEventListener) lightMq.addEventListener("change", function() {

  function applySize() {

  /* ---------- 夜里的海涂：地平线上一线黄光，近处是一道道塘，远处是潮水留下的印子 ---------- */
  var Scene = (function() {
    var list = [];

    function cssv(n, fb) {
      var v = getComputedStyle(root).getPropertyValue(n).trim();
      return v || fb;
    }

    function rgb(hex) {
      var h = hex.replace("#", "");
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgba(c, a) {
      return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
    }
    // 每一帧都一样的“随机”：反光的碎片不乱跳
    function hash(i) {
      var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    }

    function make(cv) {
      var kind = cv.getAttribute("data-kind") || "jin";
      var ctx = cv.getContext("2d");
      var w = 0,
        h = 0,
        raf = 0,
        seen = true,
        t0 = 0,
        hzF = kind === "hero" ? 0.36 : 0.40;
      var C = {};

      function colors() {
        C.tide = rgb(cssv("--n-tide", "#3D5B63"));
        C.lamp = rgb(cssv("--n-lamp", "#F2B544"));
        C.ink = rgb(cssv("--n-ink", "#ECE6D8"));
        C.red = rgb(cssv("--n-red", "#E0483E"));
      }

      function heroHorizon() {
        var hero = cv.parentNode,
          wm = hero && hero.querySelector(".wordmark");
        if (!wm) return;
        var hr = hero.getBoundingClientRect(),
          r = wm.getBoundingClientRect();
        if (hr.height > 0) hzF = Math.min(0.7, Math.max(0.2, (r.bottom - hr.top + 10) / hr.height));
      }

      function size() {
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var r = cv.getBoundingClientRect();
        w = Math.max(1, r.width);
        h = Math.max(1, r.height);
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (kind === "hero") heroHorizon();
        paint(0);
      }

      function paintCha() {
        // 插章：一页旧账。横线，左边两道红竖线，右上角一点灯光
        ctx.clearRect(0, 0, w, h);
        var g = ctx.createRadialGradient(w * 0.82, h * 0.1, 0, w * 0.82, h * 0.1, Math.max(w, h) * 0.7);
        g.addColorStop(0, rgba(C.lamp, 0.16));
        g.addColorStop(1, rgba(C.lamp, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        var step = 30;
        for (var y = step * 2; y < h; y += step) {
          ctx.fillStyle = rgba(C.ink, 0.06);
          ctx.fillRect(0, y, w, 1);
        }
        var mx = Math.max(24, Math.min(w * 0.1, 90));
        ctx.fillStyle = rgba(C.red, 0.34);
        ctx.fillRect(mx, 0, 1, h);
        ctx.fillRect(mx + 4, 0, 1, h);
        ctx.fillStyle = rgba(C.ink, 0.05);
        ctx.fillRect(w - mx, 0, 1, h);
      }

      function paint(t) {
        if (kind === "cha") {
          paintCha();
          return;
        }
        var warm = kind === "deng",
          hero = kind === "hero";
        ctx.clearRect(0, 0, w, h);
        var hz = Math.round(h * hzF);
        var flick = 0.86 + 0.08 * Math.sin(t * 1.3) + 0.05 * Math.sin(t * 4.7 + 1.1) + 0.03 * Math.sin(t * 11.3);

        // 天：地平线那里亮一点
        var sky = ctx.createLinearGradient(0, 0, 0, hz);
        sky.addColorStop(0, rgba(C.tide, 0));
        sky.addColorStop(1, warm ? rgba(C.lamp, 0.13) : rgba(C.tide, 0.26));
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, hz);

        // 光：门缝里漏出来的一线
        var cx = hero ? w * 0.5 : w * 0.64;
        var slit = Math.min(w * (hero ? 0.46 : 0.34), hero ? 420 : 300) * (warm ? 1.25 : 1);
        var glowR = warm ? Math.max(w, h) * 0.85 : Math.max(w * 0.5, h * 0.55);
        var rg = ctx.createRadialGradient(cx, hz, 0, cx, hz, glowR);
        rg.addColorStop(0, rgba(C.lamp, (warm ? 0.34 : 0.15) * flick));
        rg.addColorStop(0.35, rgba(C.lamp, (warm ? 0.12 : 0.04) * flick));
        rg.addColorStop(1, rgba(C.lamp, 0));
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, w, h);

        // 远处的海：地平线一整道，很淡
        ctx.fillStyle = rgba(warm ? C.lamp : C.tide, warm ? 0.22 : 0.55);
        ctx.fillRect(0, hz, w, 1);
        var lg = ctx.createLinearGradient(cx - slit / 2, 0, cx + slit / 2, 0);
        lg.addColorStop(0, rgba(C.lamp, 0));
        lg.addColorStop(0.2, rgba(C.lamp, 0.95 * flick));
        lg.addColorStop(0.8, rgba(C.lamp, 0.95 * flick));
        lg.addColorStop(1, rgba(C.lamp, 0));
        ctx.fillStyle = lg;
        ctx.fillRect(cx - slit / 2, hz - 1, slit, 2);

        // 海涂：地平线到最外面那道塘之间，一道道潮印，慢慢往岸上爬
        var outer = hz + (h - hz) * 0.2;
        var marks = 7;
        for (var k = 0; k < marks; k++) {
          var f = (k + 1) / (marks + 1);
          var y0 = hz + (outer - hz) * f * f + 1;
          var drift = t * (0.12 + k * 0.02);
          ctx.beginPath();
          for (var x = 0; x <= w + 6; x += 6) {
            var yy = y0 + Math.sin(x / (26 + f * 60) + drift + k * 1.7) * (0.6 + f * 1.6) +
              Math.sin(x / (9 + f * 14) - drift * 1.6) * (0.3 + f * 0.5);
            if (x === 0) ctx.moveTo(x, yy);
            else ctx.lineTo(x, yy);
          }
          ctx.strokeStyle = rgba(warm ? C.lamp : C.tide, (warm ? 0.14 : 0.32) + f * 0.22);
          ctx.lineWidth = 0.6 + f * 0.6;
          ctx.stroke();
        }

        // 湿泥上的倒影：光底下碎成一截一截
        var rows = 16;
        for (var i = 0; i < rows; i++) {
          var fy = (i + 1) / rows;
          var ry = hz + 3 + (outer - hz + (h - outer) * 0.35) * fy * fy;
          var shimmer = 0.5 + 0.5 * Math.sin(t * (1.6 + hash(i) * 1.4) + i * 2.1);
          var rw = slit * (0.55 - fy * 0.35) * (0.5 + hash(i + 9) * 0.7);
          var ox = (hash(i + 3) - 0.5) * slit * 0.25 + Math.sin(t * 0.7 + i) * 3;
          ctx.fillStyle = rgba(C.lamp, (warm ? 0.5 : 0.36) * (1 - fy * 0.8) * (0.35 + 0.65 * shimmer) * flick);
          ctx.fillRect(cx - rw / 2 + ox, ry, rw, fy < 0.3 ? 1 : 1.5);
        }

        // 塘：近处一道道直的，越近越粗
        var walls = [0.2, 0.42, 0.62];
        var dim = hero ? 0.5 : 1;
        for (var j = 0; j < walls.length; j++) {
          var wf = walls[j];
          var wy = hz + (h - hz) * wf * wf + (j === 0 ? 0 : 4);
          if (wy > h * (hero ? 0.5 : 0.58)) break;
          var th = 1 + j * 0.8;
          ctx.fillStyle = rgba(C.ink, (0.07 + j * 0.03) * dim);
          ctx.fillRect(0, wy, w, th);
          ctx.fillStyle = rgba(C.lamp, (warm ? 0.12 : 0.05) * flick * dim);
          ctx.fillRect(cx - slit * (0.4 + j * 0.25), wy, slit * (0.8 + j * 0.5), 1);
        }
      }

      function loop(ts) {
        if (!t0) t0 = ts;
        paint((ts - t0) / 1000);
        raf = window.requestAnimationFrame(loop);
      }

      function start() {
        if (raf || reduce || !animOn || !seen || document.hidden || kind === "cha") return;
        raf = window.requestAnimationFrame(loop);
      }

      function stop() {
        if (raf) window.cancelAnimationFrame(raf);
        raf = 0;
      }
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function(es) {
          seen = es[0].isIntersecting;
          if (seen) start();
          else stop();
        }).observe(cv);
      }
      var tm;
      window.addEventListener("resize", function() {
        clearTimeout(tm);
        tm = setTimeout(size, 150);
      });
      colors();
      size();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() {
        if (kind === "hero") size();
      });
      return {
        start: start,
        stop: function() {
          stop();
          paint(0);
        }
      };
    }

    function init() {
      document.querySelectorAll("canvas.scene").forEach(function(cv) {
        list.push(make(cv));
      });
      document.addEventListener("visibilitychange", function() {
        list.forEach(function(r) {
          if (document.hidden) r.stop();
          else r.start();
        });
      });
      list.forEach(function(r) {
        r.start();
      });
    }
    return {
      init: init,
      toggle: function(on) {
        list.forEach(function(r) {
          if (on) r.start();
          else r.stop();
        });
      }
    };
  })();

  /* ---------- 听风：海塘上的风，远处有人打桩（点了才响） ---------- */
  var Sound = (function() {
    var ctx = null,
      master = null,
      pileBus = null,
      srcs = [],
      timers = [],
      on = false,
      clickBuf = null;

    function noise(secs, pink) {
      var len = Math.floor(ctx.sampleRate * secs),
        b = ctx.createBuffer(1, len, ctx.sampleRate),
        d = b.getChannelData(0);
      var b0 = 0,
        b1 = 0,
        b2 = 0;
      for (var i = 0; i < len; i++) {
        var wv = Math.random() * 2 - 1;
        if (!pink) {
          d[i] = wv * 0.5;
          continue;
        }
        b0 = 0.99765 * b0 + wv * 0.0990460;
        b1 = 0.96300 * b1 + wv * 0.2965164;
        b2 = 0.57000 * b2 + wv * 1.0526913;
        d[i] = (b0 + b1 + b2 + wv * 0.1848) * 0.16;
      }
      return b;
    }

    function lfo(freq, depth, target) {
      var o = ctx.createOscillator();
      o.frequency.value = freq;
      var g = ctx.createGain();
      g.gain.value = depth;
      o.connect(g);
      g.connect(target);
      o.start();
      srcs.push(o);
    }

    function thump(when, vol) {
      // 一下闷响：很低的一声“咚”，前面带一点铁碰铁
      var o = ctx.createOscillator(),
        g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(78, when);
      o.frequency.exponentialRampToValueAtTime(36, when + 0.28);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(vol, when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.7);
      o.connect(g);
      g.connect(pileBus);
      o.start(when);
      o.stop(when + 0.75);
      var n = ctx.createBufferSource();
      n.buffer = clickBuf;
      var bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 700;
      bp.Q.value = 1.2;
      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, when);
      ng.gain.exponentialRampToValueAtTime(vol * 0.5, when + 0.004);
      ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
      n.connect(bp);
      bp.connect(ng);
      ng.connect(pileBus);
      n.start(when);
      n.stop(when + 0.12);
    }

    function burst() {
      if (!on) return;
      var n = 5 + Math.floor(Math.random() * 5),
        gap = 1.35 + Math.random() * 0.25,
        t = ctx.currentTime + 0.1;
      for (var i = 0; i < n; i++) thump(t + i * gap, 0.55 + Math.random() * 0.15);
      timers.push(setTimeout(burst, (n * gap) * 1000 + 26000 + Math.random() * 32000));
    }

    function start() {
      if (on) return true;
      try {
        ctx = ctx || new(window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        return false;
      }
      if (ctx.resume) ctx.resume();
      if (!clickBuf) clickBuf = noise(0.15, false);
      master = ctx.createGain();
      master.gain.value = 0.0001;
      master.connect(ctx.destination);
      // 风：中频一层，一阵一阵
      var s1 = ctx.createBufferSource();
      s1.buffer = noise(6, true);
      s1.loop = true;
      var bp1 = ctx.createBiquadFilter();
      bp1.type = "bandpass";
      bp1.frequency.value = 520;
      bp1.Q.value = 0.8;
      var g1 = ctx.createGain();
      g1.gain.value = 0.5;
      s1.connect(bp1);
      bp1.connect(g1);
      g1.connect(master);
      lfo(0.06, 260, bp1.frequency);
      lfo(0.09, 0.32, g1.gain);
      // 风掠过塘顶：细一点、高一点的哨音
      var s2 = ctx.createBufferSource();
      s2.buffer = noise(5, true);
      s2.loop = true;
      var bp2 = ctx.createBiquadFilter();
      bp2.type = "bandpass";
      bp2.frequency.value = 1350;
      bp2.Q.value = 3.5;
      var g2 = ctx.createGain();
      g2.gain.value = 0.07;
      s2.connect(bp2);
      bp2.connect(g2);
      g2.connect(master);
      lfo(0.13, 380, bp2.frequency);
      lfo(0.05, 0.06, g2.gain);
      // 底下的闷声：远处的海
      var s3 = ctx.createBufferSource();
      s3.buffer = noise(7, true);
      s3.loop = true;
      var lp3 = ctx.createBiquadFilter();
      lp3.type = "lowpass";
      lp3.frequency.value = 170;
      var g3 = ctx.createGain();
      g3.gain.value = 0.55;
      s3.connect(lp3);
      lp3.connect(g3);
      g3.connect(master);
      lfo(0.04, 0.2, g3.gain);
      // 打桩：隔得远，只剩低的
      pileBus = ctx.createBiquadFilter();
      pileBus.type = "lowpass";
      pileBus.frequency.value = 420;
      var pg = ctx.createGain();
      pg.gain.value = 0.5;
      pileBus.connect(pg);
      pg.connect(master);
      s1.start();
      s2.start();
      s3.start();
      srcs.push(s1, s2, s3);
      var t = ctx.currentTime;
      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(0.75, t + 2.5);
      on = true;
      timers.push(setTimeout(burst, 9000 + Math.random() * 7000));
      return true;
    }

    function stop() {
      if (!on) return;
      on = false;
      timers.forEach(clearTimeout);
      timers = [];
      var t = ctx.currentTime,
        m = master,
        ss = srcs;

      m.gain.setValueAtTime(m.gain.value || 0.0001, t);
      m.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);

        ss.forEach(function(s) {
          try {
            s.stop();
          } catch (e) {}

        try {
          m.disconnect();
        } catch (e) {}

    }

    function knock(n) {
      if (!on) return;
      var t = ctx.currentTime + 0.15;
      for (var i = 0; i < n; i++) thump(t + i * 1.4, 0.75);
    }
    document.addEventListener("visibilitychange", function() {
      if (!ctx || !on) return;
      if (document.hidden) ctx.suspend();
      else ctx.resume();
    });
    return {
      start: start,
      stop: stop,
      knock: knock,
      isOn: function() {
        return on;
      }
    };
  })();

  var snd = document.getElementById("snd");
  if (snd) {
    var armed = get("wt.sound") === "on";
    var paintSnd = function() {
      snd.setAttribute("aria-pressed", Sound.isOn() ? "true" : "false");
      snd.setAttribute("aria-label", Sound.isOn() ? "听风：关掉风声" : "听风：开风声");
      snd.classList.toggle("armed", armed && !Sound.isOn());
    };
    snd.addEventListener("click", function(e) {
      e.stopPropagation();
      if (Sound.isOn() || armed) {
        Sound.stop();
        armed = false;
        set("wt.sound", "off");
      } else if (Sound.start()) {
        set("wt.sound", "on");
      }
      paintSnd();
    });
    if (armed) {
      // 上一页开着风声：在这一页第一次点按时接着响
      var wake = function(e) {
        if (e && e.target && snd.contains(e.target)) return;
        document.removeEventListener("pointerdown", wake, true);
        document.removeEventListener("keydown", wake, true);
        if (armed && Sound.start()) armed = false;

      document.addEventListener("keydown", wake, true);
    }
    paintSnd();
  }

  /* ---------- 顶栏：压在夜色上时透明 ---------- */
  var bar = document.querySelector(".bar");
  var dark = document.querySelector(".ch-head, .hero");
  var titleEl = document.querySelector(".ch-title");

  function paintBar() {
    if (!bar) return;
    var bh = bar.offsetHeight;
    if (dark) bar.classList.toggle("over", dark.getBoundingClientRect().bottom > bh + 2);
    if (titleEl) bar.classList.toggle("show-title", titleEl.getBoundingClientRect().bottom < bh);
  }

  /* ---------- 正文里的小动静：锁屏亮一下、指甲划一道、远处三声 ---------- */
  function watchFx() {
    var els = document.querySelectorAll("[data-fx]");
    if (!els.length) return;

    function fire(el) {
      var fx = el.getAttribute("data-fx");
      if (fx === "lock") el.classList.add("lit");
      if (fx === "scratch") document.querySelectorAll(".scratch-t").forEach(function(s) {
        s.classList.add("on");
      });
      if (fx === "ending") {
        var th = document.querySelector(".thud");
        if (th) th.classList.add("go");
        Sound.knock(3);
      }
    }
    if (!("IntersectionObserver" in window)) {
      els.forEach(fire);
      return;
    }
    var io = new IntersectionObserver(function(es) {
      es.forEach(function(en) {
        if (en.isIntersecting) {
          fire(en.target);
          io.unobserve(en.target);
        }
      });
    }, {
      rootMargin: "0px 0px -22% 0px",
      threshold: 0.6
    });
    els.forEach(function(el) {
      io.observe(el);
    });
  }

  /* ---------- 章节页：进度、续读、翻章 ---------- */
  /* 正文按段落记位置：有的手机外壳把整页撑开、由外层滚动，这时 window 不动，只能看段落 */
  var blocks = chNo ? Array.prototype.slice.call(document.querySelectorAll(".text > *")) : [];
  var total = blocks.length,
    curIdx = 0,
    reachedEnd = false;

  function winMax() {
    return document.documentElement.scrollHeight - window.innerHeight;
  }

  function winScrolls() {
    return winMax() > 40 && window.scrollY >= 0 && document.documentElement.clientHeight < document.documentElement.scrollHeight - 40;
  }

  function progress() {
    if (reachedEnd) return 1;
    if (winScrolls() && window.scrollY > 0) return Math.min(1, Math.max(0, window.scrollY / winMax()));
    return total ? Math.min(1, curIdx / total) : 0;
  }

  function goBlock(i) {
    var el = blocks[Math.max(0, Math.min(total - 1, i))];
    if (el && el.scrollIntoView) el.scrollIntoView({
      block: "start"
    });
  }

  function restore(ratio) {
    if (!total) return;
    goBlock(Math.round(ratio * total));
  }

  function toTop() {
    try {
      window.scrollTo(0, 0);
    } catch (e) {}
    var de = document.documentElement,
      keepPad = de.style.scrollPaddingTop;
    de.style.scrollPaddingTop = "0px";
    if (page && page.scrollIntoView) page.scrollIntoView({
      block: "start"
    });
    de.style.scrollPaddingTop = keepPad;
  }

  if (chNo) {
    var prog = document.querySelector(".bar-prog i");
    var tang = document.querySelectorAll(".gauge li");
    set("wt.last", String(chNo));
    try {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    } catch (e) {}

    var saveT = 0;
    var markDone = function() {
      var done = (get("wt.done") || "").split(",").filter(Boolean);
      if (done.indexOf(String(chNo)) < 0) {
        done.push(String(chNo));
        set("wt.done", done.join(","));
      }
    };
    var onScroll = function() {
      var p = progress();
      paintBar();
      if (prog) prog.style.transform = "scaleX(" + p.toFixed(4) + ")";
      if (tang.length) {
        var built = Math.max(1, Math.ceil(p * tang.length));
        tang.forEach(function(li) {
          var i = parseInt(li.getAttribute("data-i"), 10);
          li.classList.toggle("on", i <= built);
          li.classList.toggle("cur", i === built);
        });
      }
      clearTimeout(saveT);
      saveT = setTimeout(function() {
        set("wt.pos." + chNo, p.toFixed(4));
        set("wt.blk." + chNo, String(curIdx));
        if (p > 0.96) markDone();
      }, 300);
    };
    // 离开章节时立即保存，避免最后一次滚动的防抖任务来不及执行。
    window.addEventListener("pagehide", function() {
      clearTimeout(saveT);
      var p = progress();
      set("wt.pos." + chNo, p.toFixed(4));
      set("wt.blk." + chNo, String(curIdx));
      if (p > 0.96) markDone();
    });
    window.addEventListener("scroll", onScroll, {
      passive: true
    });
    window.addEventListener("resize", paintBar);

    // 读到哪一段：看哪些段落在屏幕里，取最上面那一段
    if ("IntersectionObserver" in window && total) {
      var vis = {};
      var bio = new IntersectionObserver(function(es) {
        es.forEach(function(en) {
          var i = parseInt(en.target.getAttribute("data-bi"), 10);
          if (en.isIntersecting) vis[i] = 1;
          else delete vis[i];
        });
        var ks = Object.keys(vis).map(Number).sort(function(x, y) {
          return x - y;
        });
        var line = (bar ? bar.offsetHeight : 52) + 24;
        for (var k = 0; k < ks.length; k++) {
          // 顶栏底下露出一截的上一段不算，取第一段真正在读的
          if (blocks[ks[k]].getBoundingClientRect().bottom > line || k === ks.length - 1) {
            curIdx = ks[k];
            break;
          }
        }
        onScroll();
      });
      blocks.forEach(function(el, i) {
        el.setAttribute("data-bi", i);
        bio.observe(el);
      });
      var endEl = document.querySelector(".ch-end, .fin");
      if (endEl) {
        new IntersectionObserver(function(es) {
          if (es[0].isIntersecting) {
            reachedEnd = true;
            markDone();
            onScroll();
          }
        }).observe(endEl);
      }
    }

    if (window.ReaderRoute.anchor === "resume") {
      var savedBlk = parseInt(get("wt.blk." + chNo) || "-1", 10);
      var r = parseFloat(get("wt.pos." + chNo) || "0");
      var resumeAt = function() {
        if (savedBlk > 0) goBlock(savedBlk);
        else if (r > 0.01) restore(r);
        onScroll();
      };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() {
        setTimeout(resumeAt, 30);
      });
      else setTimeout(resumeAt, 200);
      try {
        history.replaceState(null, "", location.pathname + location.search + "#" + window.ReaderRoute.page);
      } catch (e) {}
    } else {
      // 翻到新的一章，一律从章首读起（外层容器还停在上一章的位置时，也把它拉回来）
      var moved = false;
      var stopTop = function() {
        moved = true;
      };
      ["touchstart", "wheel", "keydown", "mousedown"].forEach(function(ev) {
        window.addEventListener(ev, stopTop, {
          once: true,
          passive: true
        });
      });
      toTop();
      setTimeout(function() {
        if (!moved) toTop();
      }, 120);
      window.addEventListener("load", function() {
        if (!moved) toTop();
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() {
        if (!moved) toTop();
      });
    }
    onScroll();

    document.addEventListener("keydown", function(e) {
      // 打开侧边目录或阅读设置时，方向键不触发翻章。
      if (document.querySelector('#chapter-menu:not([hidden]), #panel:not([hidden])')) return;
      if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      var tag = (e.target && e.target.tagName) || "";
      if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
      var to = null;
      if (e.key === "ArrowLeft") to = page.getAttribute("data-prev");
      if (e.key === "ArrowRight") to = page.getAttribute("data-next");
      if (to) {
        e.preventDefault();
        window.ReaderRoute.go(to);
      }
    });
  }

  /* ---------- 书封：续读与已核 ---------- */
  if (!chNo && page) {
    // 书封里的“目录”“回到书封”：外层容器滚动时，浏览器自己的锚点跳不动，这里替它跳
    var mulu = document.getElementById("mulu");
    var goMulu = function() {
      var de = document.documentElement,
        keepPad = de.style.scrollPaddingTop;
      de.style.scrollPaddingTop = "0px";
      if (mulu && mulu.scrollIntoView) mulu.scrollIntoView({
        block: "start"
      });
      de.style.scrollPaddingTop = keepPad;
    };
    document.querySelectorAll('a[href="#mulu"]').forEach(function(a) {
      a.addEventListener("click", function(e) {
        e.preventDefault();
        goMulu();
      });
    });
    document.querySelectorAll('a[href="#top"]').forEach(function(a) {
      a.addEventListener("click", function(e) {
        e.preventDefault();
        toTop();
      });
    });
    if (window.ReaderRoute.anchor === "mulu") {
      goMulu();
      setTimeout(goMulu, 150);
      window.addEventListener("load", goMulu);
    } else {
      toTop();
      setTimeout(toTop, 120);
    }
    window.addEventListener("scroll", paintBar, {
      passive: true
    });
    window.addEventListener("resize", paintBar);
    paintBar();
    var last = parseInt(get("wt.last") || "0", 10);
    var go = document.getElementById("go");
    var again = document.getElementById("again");
    if (last >= 1 && last <= CH.length && go) {
      var pos = parseFloat(get("wt.pos." + last) || "0");
      var nextUp = last;
      if (pos > 0.96 && last < CH.length) nextUp = last + 1;
      var c = CH[nextUp - 1];
      go.href = "#ch" + pad(nextUp) + (nextUp === last ? "/resume" : "");
      go.textContent = "接着读 · 第" + c[0] + "章　" + c[1];
      if (again) again.hidden = false;
    }
    var done = (get("wt.done") || "").split(",");
    document.querySelectorAll(".toc a").forEach(function(a) {
      var n = a.getAttribute("data-n");
      if (done.indexOf(n) >= 0) {
        a.classList.add("done");
        a.setAttribute("aria-label", a.textContent.replace(/\s+/g, " ").trim() + "（已读）");
      }
      if (String(last) === n) {
        var tag = a.querySelector(".toc-tag");
        if (tag) tag.hidden = false;
      }
    });
  }

  applySize();
  Scene.init();
  applyRead();
  applyAnim();
  watchFx();
})();
</script>
<script>
/* ---------- 侧边目录：全章跳转、键盘焦点管理、关闭后返回触发按钮 ---------- */
(function() {
  "use strict";
  var tools = document.querySelector(".bar-tools");
  var currentPage = document.querySelector(".page");
  var toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "tool reader-menu-toggle";
  toggle.textContent = "章节";
  toggle.setAttribute("aria-label", "打开侧边目录");
  toggle.setAttribute("aria-controls", "chapter-menu");
  toggle.setAttribute("aria-expanded", "false");
  tools.insertBefore(toggle, tools.firstChild);

  var mask = document.createElement("div");
  mask.className = "reader-menu-mask";
  mask.hidden = true;
  mask.setAttribute("aria-hidden", "true");

  var menu = document.createElement("aside");
  menu.id = "chapter-menu";
  menu.className = "reader-menu";
  menu.hidden = true;
  menu.setAttribute("role", "dialog");
  menu.setAttribute("aria-modal", "true");
  menu.setAttribute("aria-labelledby", "chapter-menu-title");
  menu.innerHTML = '<header><h2 id="chapter-menu-title">围涂 · 目录</h2>' +
    '<button type="button" aria-label="关闭侧边目录">关闭</button></header>' +
    '<nav aria-label="全部章节"><a href="#cover">返回书封</a><ol></ol></nav>';
  var list = menu.querySelector("ol");
  var close = menu.querySelector("button");
  var done = [];
  try {
    done = (localStorage.getItem("wt.done") || "").split(",");
  } catch (error) {
    // 无法保存阅读状态时，不影响章节跳转。
  }

  for (var number = 1; number <= 20; number++) {
    var key = "ch" + String(number).padStart(2, "0");
    var template = document.getElementById("page-" + key);
    var item = document.createElement("li");
    var link = document.createElement("a");
    link.href = "#" + key;
    link.textContent = template.getAttribute("data-title").replace(/ · 围涂$/, "");
    if (done.indexOf(String(number)) >= 0) {
      link.textContent += " · 已读";
    }
    if (window.ReaderRoute.page === key) {
      link.setAttribute("aria-current", "page");
    }
    item.appendChild(link);
    list.appendChild(item);
  }
  document.body.appendChild(mask);
  document.body.appendChild(menu);
  var previousOverflow = "";
  var previousFocus = null;

  function setOpen(open) {
    if (open === !menu.hidden) {
      return;
    }
    if (open) {
      previousFocus = document.activeElement;
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      var settings = document.getElementById("panel");
      if (settings) {
        settings.hidden = true;
        document.getElementById("aa").setAttribute("aria-expanded", "false");
      }
    }
    menu.hidden = !open;
    mask.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
    document.getElementById("reader-root").inert = open;
    if (pager) {
      pager.inert = open;
    }
    if (open) {
      close.focus();
    } else {
      document.body.style.overflow = previousOverflow;
      if (previousFocus && previousFocus.isConnected) {
        previousFocus.focus();
      }
    }
  }

  toggle.addEventListener("click", function() {
    setOpen(menu.hidden);
  });
  mask.addEventListener("click", function() {
    setOpen(false);
  });
  close.addEventListener("click", function() {
    setOpen(false);
  });
  menu.addEventListener("click", function(event) {
    var link = event.target.closest("a");
    if (link && link.getAttribute("href") === location.hash) {
      event.preventDefault();
      setOpen(false);
      window.scrollTo(0, 0);
    }
  });
  document.addEventListener("keydown", function(event) {
    if (menu.hidden) {
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      setOpen(false);
    }
    if (event.key === "Tab") {
      var focusable = Array.from(menu.querySelectorAll("button, a[href]"));
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  /* 按屏翻页保留少量重叠行；到章节边界时继续上一章或下一章。 */
  var pager = null;
  if (currentPage.hasAttribute("data-ch")) {
    pager = document.createElement("nav");
    pager.className = "reader-pager";
    pager.setAttribute("aria-label", "按屏翻页");
    pager.innerHTML = '<button type="button" data-page-step="-1">上一页</button>' +
      '<button type="button" data-open-menu>目录</button>' +
      '<button type="button" data-page-step="1">下一页</button>';
    document.body.appendChild(pager);
    var previous = pager.querySelector('[data-page-step="-1"]');
    var next = pager.querySelector('[data-page-step="1"]');

    function boundaries() {
      return {
        top: window.scrollY <= 2,
        bottom: window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 3
      };
    }

    function updatePager() {
      var edge = boundaries();
      previous.disabled = edge.top && !currentPage.getAttribute("data-prev");
      next.disabled = edge.bottom && !currentPage.getAttribute("data-next");
    }

    function turn(step) {
      var edge = boundaries();
      if ((step < 0 && edge.top) || (step > 0 && edge.bottom)) {
        var target = currentPage.getAttribute(step < 0 ? "data-prev" : "data-next");
        if (target) {
          window.ReaderRoute.go(target);
        }
        return;
      }
      var bar = document.querySelector(".bar");
      var distance = Math.max(100, window.innerHeight - bar.offsetHeight - pager.offsetHeight - 60);
      window.scrollBy({
        top: step * distance,
        behavior: "instant"
      });
    }
    pager.addEventListener("click", function(event) {
      var button = event.target.closest("button");
      if (!button) {
        return;
      }
      if (button.hasAttribute("data-open-menu")) {
        setOpen(true);
      } else {
        turn(Number(button.getAttribute("data-page-step")));
      }
    });
    document.addEventListener("keydown", function(event) {
      if (!menu.hidden || !document.getElementById("panel").hidden) {
        return;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.isContentEditable) {
        return;
      }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) {
        return;
      }
      if (event.key === "PageUp" || event.key === "PageDown") {
        event.preventDefault();
        turn(event.key === "PageUp" ? -1 : 1);
      }
    });
    window.addEventListener("scroll", updatePager, {
      passive: true
    });
    window.addEventListener("resize", updatePager);
    if ("ResizeObserver" in window) {
      new ResizeObserver(updatePager).observe(document.documentElement);
    }
    updatePager();
  }
})();
</script>
</body>
