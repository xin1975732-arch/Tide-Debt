的：“查清楚也好。可你妈以后在老街上怎么走路？”<\/p>\n<p data-p=\"57\">我一条都没回。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"58\">晚上九点，楼下有人敲门。<\/p>\n<p data-p=\"59\">是陈守义。他没上楼，站在楼梯底下，叫了我一声。我下去，他把我领进电器铺，卷帘门拉下来一半。后屋的灯亮着，<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>的电视声开得很大。<\/p>\n<p data-p=\"60\">铺子里一股机油味。那台电暖器已经修好了，后盖拧得严严实实，搁在柜台角上。他坐在柜台后面，我站在柜台前面，中间隔着一只拆开的电饭煲。<\/p>\n<p data-p=\"61\">“今天下午，县里又叫去问了两个钟头。”他说，“问九十万，问名单，问钱是怎么送的。”<\/p>\n<p data-p=\"62\">“你怎么说？”<\/p>\n<p data-p=\"63\">“照实讲。钱是<b class=\"rn\" data-c=\"cenqiming\">老岑<\/b>的，送是阿拉送的，名单是阿拉定的。”他停了一下，“这些事，当年是为大家好。”<\/p>\n<p data-p=\"64\">我没接话。<\/p>\n<p data-p=\"65\">他抬起头。他的眼睛里全是红丝。<\/p>\n<p class=\"last\" data-p=\"66\">“知川，这件事到这里停下来。”他说，“再查下去，你妈会成为众矢之的。”<\/p>","paras":["腊月二十八一早，我把罗维民那几页账的照片发给了邵峻，附了一句：六户，九十万，经手人罗维民提供，原件在我这里。","发之前，我先改了那张表。我妈那一行，“已还：零”，我删掉，打上：二十万，二〇一五年十二月已结清。","邵峻十分钟后回了两个字：收到。过了一会儿，又来一条：先别外传。","我也没打算外传。","我去找老胡，只是想当面问一句。","他在老街口的老年活动室打牌，四个人一桌，桌上一壶茶，烟灰缸满了。看见我进来，他把牌往桌上一扣：“许会计，有消息了？钱什么时候打？”","我请他出来说两句。他跟着我走到门口的屋檐下，还在说岑家姑娘要是敢不认，他第一个去她公司门口拉横幅。","“胡叔，”我说，“二〇一五年十二月，你拿过十五万。”","他的嘴还张着，话停在半截。过了几秒，脸一下子红到脖子：“你听谁讲的？”","“账上写着。”","“什么账？谁的账？”他的声音高了，活动室里打牌的都往外看，“我拿什么了？你一个在明州吃皇粮的，回来搅什么搅？”","我没再说什么，转身走了。走到老街拐角，手机响了一声。","是工友群。老胡发了一条，不是语音，是他一个字一个字打出来的：","许家儿子来问了，你们嘴巴紧点，就讲不晓得。","群里安静了大概十秒钟。","然后显示：","胡国良撤回了一条消息","已经晚了。有三个人截了图。第一张截图发出来的时候，我还站在拐角，手里攥着手机。","你们是谁？","嘴巴紧点什么？","老胡，你发错群了吧？","老胡没回话。","接下来的事，快得像一瓢水泼进了热油锅。","先说话的是钟家的孙子，二十出头，在外地读研究生，平常在群里只发过年红包。他发了一段很长的话：","我刚问了我奶奶。二〇一五年，我爷爷化疗那年，家里拿过一笔钱，是守义叔送来的。我奶奶一直以为是守义叔帮忙要来的，她不晓得这是不能讲的事。对不起大家。","后面他又发了一句：钱要是该退，我们家退。有人回他：小孩子别闹，钱的事大人讲。","然后是俞家。俞家的媳妇发了一张照片，是一张收条，跟我妈那张一模一样的格式：本金已全部结清。下面一句：“我家也拿过。要骂就骂。”","邬家没说话，邬家的人默默退了群。","有人问：拿了多少？","没人回答。过了一会儿，俞家媳妇回了一句：收条上写的是结清，结清就是结清。","又有人说：还能拿多少，借多少还多少呗。","这句话底下，六户里没有一家出来说不是。","还有谁？","不止这几家。","有人说应家。应国庆的老婆在群里，一个字没回，头像灰了。","然后有人说：“戴师傅那天拿的是原件。罗会计盯着看了半天，你们没看见？”","我站在老街拐角，看着这一行字。四十八户的群，三百多条消息，这一句底下，没有一个人接话。","下午，有人另外拉了一个群，叫“恒成讨债”，四十多个人。我没被拉进去，是金彩凤的儿子私下发给我的截图，问我：许会计，你妈那一份，是真的吗？","我回：是真的。","他回了一个“哦”，再没说话。","老群里，有人开始叫陈守义“老陈”。","老陈早就晓得，为什么不讲？","六户的钱都是老陈一家一家送去的，名单也是他定的。","警察下午又把老陈叫去了。","也有人照旧叫他守义阿哥：“守义阿哥是为了大家好，讲出去，那年谁家都拿不到。”","两种叫法在群里来来回回。","然后有人翻出了一张旧截图，是腊月二十二夜里，老胡撤回的那条消息。原来那天晚上就有人截了，一直没发。","死得好，那九十万再也对不出来了。","底下有人问：“老胡，对不出来，对你有什么好处？”","老胡退群了。","我妈一整天没出门。","她的手机响了七八回，她一个都没接，把手机扣在饭桌上，跟陈守义扣手机的样子一模一样。傍晚，她说要去菜场买点菜，走到楼梯口，又回来了，说家里还有。","快天黑的时候，我的手机开始收到私信。","小许，你一个在明州的人，回来搅这一摊做什么？","人都死了，钱的事过了年再讲不行吗？非要让活人过不了年？","你妈也拿了，你还查？","还有一条，是一个很少说话的老工友发的：“查清楚也好。可你妈以后在老街上怎么走路？”","我一条都没回。","晚上九点，楼下有人敲门。","是陈守义。他没上楼，站在楼梯底下，叫了我一声。我下去，他把我领进电器铺，卷帘门拉下来一半。后屋的灯亮着，卢彩娣的电视声开得很大。","铺子里一股机油味。那台电暖器已经修好了，后盖拧得严严实实，搁在柜台角上。他坐在柜台后面，我站在柜台前面，中间隔着一只拆开的电饭煲。","“今天下午，县里又叫去问了两个钟头。”他说，“问九十万，问名单，问钱是怎么送的。”","“你怎么说？”","“照实讲。钱是老岑的，送是阿拉送的，名单是阿拉定的。”他停了一下，“这些事，当年是为大家好。”","我没接话。","他抬起头。他的眼睛里全是红丝。","“知川，这件事到这里停下来。”他说，“再查下去，你妈会成为众矢之的。”"],"recap":"罗维民从冰箱冷冻层里取出三本泡过水的旧账：二〇一五年十二月，岑启明分六笔汇给陈守义九十万，名单是陈守义定的，六户是许、应、钟、俞、邬、胡。许知川拍下账页，罗维民把账簿推到他面前。","date":"腊月二十八","mood":"jin"},{"n":11,"cn":"十一","title":"死人房里","era":"","chars":1742,"mins":4,"html":"<p data-p=\"0\">那天晚上，我没有回答<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>。我说了一句“我先上去了”，就上了楼。他在柜台后面坐着，没有叫住我。<\/p>\n<p data-p=\"1\">半夜一点多，手机响了。是<b class=\"rn\" data-c=\"hu\">老胡<\/b>。<\/p>\n<p data-p=\"2\">他喝了酒，舌头有点大，开口第一句是：“<b class=\"rn\" data-c=\"zhichuan\">许会计<\/b>，我不是人。”<\/p>\n<p data-p=\"3\">我等他往下讲。<\/p>\n<p data-p=\"4\">“那天晚上，我在活动室打牌，听讲姓岑的死了。我第一个念头是，好了，明天不用当着大家的面对了。”他在那头喘了口气，“我那十五万是拿过的。我骂他骂得最凶，我怕他第二天当着四十几户的面，一户一户点名，点到我。他一死，那九十万就再也没人对得出来了。我就发了那一句。发出去，自己都吓了一跳，赶紧撤回。”<\/p>\n<p data-p=\"5\">“胡叔，那天晚上你在哪里？”<\/p>\n<p data-p=\"6\">“活动室，打到十一点。十几个人看着，警察都问过了。”他笑了一声，比哭还难听，“我连他死都没那个胆子去看。我就是嘴巴贱，心里也贱。”<\/p>\n<p data-p=\"7\">他挂了电话。我躺在床上，听见楼下电器铺的卷帘门，一直没有响。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"8\">腊月二十九，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>一早打电话来，叫我去一趟县局。<\/p>\n<p data-p=\"9\">“有份东西，要你帮着看看。”他说，“账上的事，你比我们懂。”<\/p>\n<p data-p=\"10\">县局刑侦大队在一栋老楼的三楼，走廊里贴着防诈骗的海报。我在走廊尽头的长椅上等，看见<b class=\"rn\" data-c=\"hanlan\">韩岚<\/b>从一间屋里出来。<\/p>\n<p data-p=\"11\">她没穿那件驼色大衣，穿的是一件灰色羽绒服，头发没梳，脸上一点妆也没有。看见我，她停了一下。<\/p>\n<p data-p=\"12\">“我没见到他。”她说，声音很哑，“许会计，我从头到尾，没见到他。”<\/p>\n<p data-p=\"13\">她身后的门里，有人叫她的名字。她转身回去了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"14\">邵峻把我领进一间小会议室，桌上放着一台笔记本电脑，一个证物袋。<\/p>\n<p data-p=\"15\">“韩岚的车上有行车记录仪。”他说，“她一开始讲坏了，技术科从卡里恢复出来的。”<\/p>\n<p data-p=\"16\">他点开一段音频。先是车门关上的声音，然后是发动机，然后是韩岚的声音，很急，在打电话：<\/p>\n<p data-p=\"17\">“……拿到了，在包里，我拿到了。……没有，没见到他。档案室门关着，灯亮着，我没敢进去。……我怎么敢进去？他要是看见我翻他的包……你别问了，回去再讲。”<\/p>\n<p data-p=\"18\">录音停了。邵峻看了一下时间：21:19。<\/p>\n<p data-p=\"19\">“仓库那个戴毛线帽的小姑娘，也问过了。”他说，“那天晚上九点多，她上二楼厕所，正好看见一个穿大衣的女人进了会议室，就是楼梯边上那间，几分钟就出来了，没往走廊里头走。她还讲，走廊尽头那间门缝里有光，里面椅子响了一下，像有人在挪椅子。”<\/p>\n<p data-p=\"20\">“那就是说，九点十分，人还活着。”<\/p>\n<p data-p=\"21\">邵峻没接这句话。他把证物袋推到我面前。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"22\">是一份协议，三页，复印件，签着<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>和韩岚的名字，日期是二〇一一年八月。<\/p>\n<p data-p=\"23\">“她从岑启明的公文包里拿走的，就是这个。原件她烧了，这份是我们从她公司保险柜里找到的复印件。”邵峻说，“你看看，这里面跟钱有关的，到底是什么意思。”<\/p>\n<p data-p=\"24\">我一页一页往下看。<\/p>\n<div class=\"doc contract\"><p data-p=\"25\"><b>第一条：<\/b>韩岚自愿退出恒成电器经营管理。<\/p><p data-p=\"26\"><b>第二条：<\/b>恒成名下美国三家客户的后续订单，转由韩岚新设立的贸易公司承接。<\/p><p data-p=\"27\"><b>第三条：<\/b>韩岚出借恒成之款项人民币伍拾万元，于本协议签订之日一次性结清。<\/p><\/div>\n<p data-p=\"28\">我在第三条上停了很久。<\/p>\n<p data-p=\"29\">二〇一一年八月。那年四月，车间停了机器，四十几个人站在流水线中间，一个一个在借条上签字。六月，<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>在登记簿扉页写下三百万。八月，副厂长韩岚拿着五十万，带着三家美国客户，走了。<\/p>\n<p data-p=\"30\">“结清。”我说，“又是结清。”<\/p>\n<p data-p=\"31\">“什么意思？”<\/p>\n<p data-p=\"32\">“意思是，厂还没倒，她借给厂里的五十万，先一分不少地拿回去了。工人的钱刚进去，她的钱先出来。她带走的那三家客户，是恒成最大的订单。”我把协议放下，“这份东西要是让工友们看见，她在上林就待不下去了。”<\/p>\n<p data-p=\"33\">“所以她宁可讲自己隔着门跟一个死人吵架。”<\/p>\n<p data-p=\"34\">“她不晓得他死了。”我说，“她以为他在里面写东西。”<\/p>\n<p data-p=\"35\">话说出口，我自己愣了一下。<\/p>\n<p data-p=\"36\">九点十分，韩岚在会议室翻他的包，档案室的门缝里亮着灯，椅子响了一下。她和他隔着一条走廊，不到十米。她怕他出来，他也许正想出来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"37\">“她算是洗清了？”我问。<\/p>\n<p data-p=\"38\">“她讲的那一句是假的，别的基本对得上。”邵峻说，“她没进过档案室。”<\/p>\n<p data-p=\"39\">“那九点十分以后呢？监控上再没人进去。后门呢？”<\/p>\n<p data-p=\"40\">“后门从里面插着插销，我们第二天一早去，还是插着的。”他靠在椅背上，“罗维民那晚六点半到家，他老婆和邻居都能作证。老胡在活动室，十几个人看着。”<\/p>\n<p data-p=\"41\">“那他是怎么死的？”<\/p>\n<p data-p=\"42\">邵峻沉默了一会儿，从文件夹里抽出一张纸，看了一眼，又放回去。<\/p>\n<p data-p=\"43\">“法医的初步意见出来了。后脑撞在柜角上，颅内出血。”他说，“还有一点。法医讲，他受伤以后，人还清醒过一阵子。”<\/p>\n<p data-p=\"44\">我坐在那里，没有动。<\/p>\n<p data-p=\"45\">清醒过一阵子。九点十分，椅子响了一下。<\/p>\n<p class=\"last\" data-p=\"46\">那一阵子，有多长？<\/p>","paras":["那天晚上，我没有回答陈守义。我说了一句“我先上去了”，就上了楼。他在柜台后面坐着，没有叫住我。","半夜一点多，手机响了。是老胡。","他喝了酒，舌头有点大，开口第一句是：“许会计，我不是人。”","我等他往下讲。","“那天晚上，我在活动室打牌，听讲姓岑的死了。我第一个念头是，好了，明天不用当着大家的面对了。”他在那头喘了口气，“我那十五万是拿过的。我骂他骂得最凶，我怕他第二天当着四十几户的面，一户一户点名，点到我。他一死，那九十万就再也没人对得出来了。我就发了那一句。发出去，自己都吓了一跳，赶紧撤回。”","“胡叔，那天晚上你在哪里？”","“活动室，打到十一点。十几个人看着，警察都问过了。”他笑了一声，比哭还难听，“我连他死都没那个胆子去看。我就是嘴巴贱，心里也贱。”","他挂了电话。我躺在床上，听见楼下电器铺的卷帘门，一直没有响。","腊月二十九，邵峻一早打电话来，叫我去一趟县局。","“有份东西，要你帮着看看。”他说，“账上的事，你比我们懂。”","县局刑侦大队在一栋老楼的三楼，走廊里贴着防诈骗的海报。我在走廊尽头的长椅上等，看见韩岚从一间屋里出来。","她没穿那件驼色大衣，穿的是一件灰色羽绒服，头发没梳，脸上一点妆也没有。看见我，她停了一下。","“我没见到他。”她说，声音很哑，“许会计，我从头到尾，没见到他。”","她身后的门里，有人叫她的名字。她转身回去了。","邵峻把我领进一间小会议室，桌上放着一台笔记本电脑，一个证物袋。","“韩岚的车上有行车记录仪。”他说，“她一开始讲坏了，技术科从卡里恢复出来的。”","他点开一段音频。先是车门关上的声音，然后是发动机，然后是韩岚的声音，很急，在打电话：","“……拿到了，在包里，我拿到了。……没有，没见到他。档案室门关着，灯亮着，我没敢进去。……我怎么敢进去？他要是看见我翻他的包……你别问了，回去再讲。”","录音停了。邵峻看了一下时间：21:19。","“仓库那个戴毛线帽的小姑娘，也问过了。”他说，“那天晚上九点多，她上二楼厕所，正好看见一个穿大衣的女人进了会议室，就是楼梯边上那间，几分钟就出来了，没往走廊里头走。她还讲，走廊尽头那间门缝里有光，里面椅子响了一下，像有人在挪椅子。”","“那就是说，九点十分，人还活着。”","邵峻没接这句话。他把证物袋推到我面前。","是一份协议，三页，复印件，签着岑启明和韩岚的名字，日期是二〇一一年八月。","“她从岑启明的公文包里拿走的，就是这个。原件她烧了，这份是我们从她公司保险柜里找到的复印件。”邵峻说，“你看看，这里面跟钱有关的，到底是什么意思。”","我一页一页往下看。","第一条：韩岚自愿退出恒成电器经营管理。","第二条：恒成名下美国三家客户的后续订单，转由韩岚新设立的贸易公司承接。","第三条：韩岚出借恒成之款项人民币伍拾万元，于本协议签订之日一次性结清。","我在第三条上停了很久。","二〇一一年八月。那年四月，车间停了机器，四十几个人站在流水线中间，一个一个在借条上签字。六月，罗维民在登记簿扉页写下三百万。八月，副厂长韩岚拿着五十万，带着三家美国客户，走了。","“结清。”我说，“又是结清。”","“什么意思？”","“意思是，厂还没倒，她借给厂里的五十万，先一分不少地拿回去了。工人的钱刚进去，她的钱先出来。她带走的那三家客户，是恒成最大的订单。”我把协议放下，“这份东西要是让工友们看见，她在上林就待不下去了。”","“所以她宁可讲自己隔着门跟一个死人吵架。”","“她不晓得他死了。”我说，“她以为他在里面写东西。”","话说出口，我自己愣了一下。","九点十分，韩岚在会议室翻他的包，档案室的门缝里亮着灯，椅子响了一下。她和他隔着一条走廊，不到十米。她怕他出来，他也许正想出来。","“她算是洗清了？”我问。","“她讲的那一句是假的，别的基本对得上。”邵峻说，“她没进过档案室。”","“那九点十分以后呢？监控上再没人进去。后门呢？”","“后门从里面插着插销，我们第二天一早去，还是插着的。”他靠在椅背上，“罗维民那晚六点半到家，他老婆和邻居都能作证。老胡在活动室，十几个人看着。”","“那他是怎么死的？”","邵峻沉默了一会儿，从文件夹里抽出一张纸，看了一眼，又放回去。","“法医的初步意见出来了。后脑撞在柜角上，颅内出血。”他说，“还有一点。法医讲，他受伤以后，人还清醒过一阵子。”","我坐在那里，没有动。","清醒过一阵子。九点十分，椅子响了一下。","那一阵子，有多长？"],"recap":"许知川当面问老胡，老胡在群里发了“你们嘴巴紧点”，又撤回。群里翻出六户，钟家孙子和俞家媳妇承认拿过钱，有人另拉了“恒成讨债”群。晚上，陈守义对许知川说：这件事到这里停下来。","date":"腊月二十九","mood":"jin"},{"n":12,"cn":"十二","title":"两种时间","era":"","chars":1455,"mins":4,"html":"<p data-p=\"0\">除夕上午，我给<b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>打了个电话，问她要她父亲公司出纳的号码。<\/p>\n<p data-p=\"1\">她没问我要做什么，过了两分钟，把号码发了过来，又补了一句：她叫<b class=\"rn\" data-c=\"xiaoyao\">小姚<\/b>，这几天一直在哭。<\/p>\n<p data-p=\"2\">小姚接电话的时候，鼻音很重。我说我是上林这边核账的会计，想问一下那天晚上<b class=\"rn\" data-c=\"ge\">老葛<\/b>那笔五万是几点付的。<\/p>\n<p data-p=\"3\">“九点三十八。”她说，“<b class=\"rn\" data-c=\"cenqiming\">岑总<\/b>中午在OA上批的。那天下午我在银行对年底的账，排队排到七点多，回公司又吃了碗面，九点半才坐到电脑前面。”<\/p>\n<p data-p=\"4\">“付完你告诉他了吗？”<\/p>\n<p data-p=\"5\">“发了微信，九点三十九分，跟他说老葛那笔走掉了。”她停了一下，“他没回。他平常都回一个‘好’字的。我还以为他睡了。要是我那时候打个电话过去……”<\/p>\n<p data-p=\"6\">她说不下去了。我这才明白她为什么一直在哭。那个“好”字，她等了七天，到现在还在想，如果那天晚上多打一个电话，会不会不一样。<\/p>\n<p data-p=\"7\">我没告诉她，九点三十九分，他多半已经接不了电话了。<\/p>\n<p data-p=\"8\">挂了电话，我在饭桌边坐了很久。<\/p>\n<p data-p=\"9\">九点三十八分，是小姚点下网银的时间。九点四十一分，是钱到老葛卡上的时间。九点三十九分那条微信，到现在还是未读。<\/p>\n<p data-p=\"10\">这笔钱从头到尾，跟岑启明那时候是死是活，没有一点关系。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"11\">我把这件事告诉<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>。他说出纳前天已经来过了，笔录都做完了。<\/p>\n<p data-p=\"12\">“那到账就不算了。”我说。<\/p>\n<p data-p=\"13\">“本来也不算。”他说，“九点十分椅子响了一下，那个才算。”他停了一下，“初二上午你来县局一趟，补一份笔录。八点钟收盒饭你在边上，有几句我想再问问。”<\/p>\n<p data-p=\"14\">挂了电话，我脑子里一直转着一个东西，转了好几圈才抓住。<\/p>\n<p data-p=\"15\">付款时间和到账时间，是两个时间。中间隔着一个人：出纳什么时候坐到电脑前面，银行什么时候清算。只看到账，你会以为钱是那一刻付的。<\/p>\n<p data-p=\"16\">受伤和死，也是两个时间。法医说，他受伤以后，人还清醒过一阵子。九点十分，椅子响了一下，他还在动。可那时候，伤已经在他身上了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">年夜饭是<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>一个人做的，八个菜，两个人吃。她照老规矩，在桌子上多摆了一副碗筷，是给我爸的。<\/p>\n<p data-p=\"18\">电视开着，春晚的声音关了。楼下电器铺的卷帘门关得严严实实，后屋的灯亮着。<\/p>\n<p data-p=\"19\">吃到一半，我跟我妈说，邵峻叫我初二去一趟县局，问八点钟收盒饭的事。<\/p>\n<p data-p=\"20\">她筷子停在半空，过了一会儿放下来。<\/p>\n<p data-p=\"21\">“问你什么？”<\/p>\n<p data-p=\"22\">“他问什么，我讲什么。”<\/p>\n<p data-p=\"23\">“你<b class=\"rn\" data-c=\"shouyi\">守义叔<\/b>不是那种人。”她说，“他送钱那年，当着我的面数了三遍，一张都没少。你爸住院，他骑三轮车送了一个冬天的饭。”<\/p>\n<p data-p=\"24\">“我没说他是那种人。”我说，“他问什么，我讲什么。”<\/p>\n<p data-p=\"25\">她没再说话，给我夹了一块鱼，又给我爸那只空碗里夹了一块。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"26\">十一点多，我出了门。<\/p>\n<p data-p=\"27\">老街上到处是鞭炮的红纸屑，塘路上一盏灯也没有。我一直走到二塘，走到老厂门口。警戒线已经撤了，仓库的灯还亮着一盏。<\/p>\n<p data-p=\"28\">门口蹲着一个人，捧着一个外卖盒在吃饺子。<\/p>\n<p data-p=\"29\">是那个戴毛线帽的姑娘。她看见我，抬了一下头，认出来了：“你是那天楼上的。”<\/p>\n<p data-p=\"30\">“你过年不回家？”<\/p>\n<p data-p=\"31\">“老板讲除夕值班三倍工资。”她夹起一个饺子，“我算了一下，够我妈一个月的药钱。外卖平台上今天能点的只剩一家饺子馆，送了一个半钟头，都坨了。”<\/p>\n<p data-p=\"32\">她是贵州的，来上林第三年。我在她旁边蹲下来。远处有人家开始放烟花，一朵一朵在海塘那边炸开。<\/p>\n<p data-p=\"33\">“那天晚上，你吃完外卖，盒子扔在这里了？”我指了指门边那只绿色的大垃圾桶。<\/p>\n<p data-p=\"34\">“扔了。”她说，“你们来的时候我刚吃完。”<\/p>\n<p data-p=\"35\">“桶里还有别的吗？”<\/p>\n<p data-p=\"36\">她想了想。<\/p>\n<p data-p=\"37\">“空的。那天傍晚六点，环卫车刚来清过。我扔进去的时候，咚的一声，就我一个盒子。”她又夹了一个饺子，“警察那天夜里也翻过这个桶，翻了一个钟头。我还想呢，楼上你们白天吃了那么多盒饭，盒子都扔哪里去了。”<\/p>\n<p data-p=\"38\">我蹲在那里，没有站起来。<\/p>\n<p class=\"last\" data-p=\"39\">八点四十七分，陈守义拎着一只鼓鼓的塑料袋出了院门。他说是盒饭垃圾。袋子是我看着他装的。<\/p>","paras":["除夕上午，我给岑悦打了个电话，问她要她父亲公司出纳的号码。","她没问我要做什么，过了两分钟，把号码发了过来，又补了一句：她叫小姚，这几天一直在哭。","小姚接电话的时候，鼻音很重。我说我是上林这边核账的会计，想问一下那天晚上老葛那笔五万是几点付的。","“九点三十八。”她说，“岑总中午在OA上批的。那天下午我在银行对年底的账，排队排到七点多，回公司又吃了碗面，九点半才坐到电脑前面。”","“付完你告诉他了吗？”","“发了微信，九点三十九分，跟他说老葛那笔走掉了。”她停了一下，“他没回。他平常都回一个‘好’字的。我还以为他睡了。要是我那时候打个电话过去……”","她说不下去了。我这才明白她为什么一直在哭。那个“好”字，她等了七天，到现在还在想，如果那天晚上多打一个电话，会不会不一样。","我没告诉她，九点三十九分，他多半已经接不了电话了。","挂了电话，我在饭桌边坐了很久。","九点三十八分，是小姚点下网银的时间。九点四十一分，是钱到老葛卡上的时间。九点三十九分那条微信，到现在还是未读。","这笔钱从头到尾，跟岑启明那时候是死是活，没有一点关系。","我把这件事告诉邵峻。他说出纳前天已经来过了，笔录都做完了。","“那到账就不算了。”我说。","“本来也不算。”他说，“九点十分椅子响了一下，那个才算。”他停了一下，“初二上午你来县局一趟，补一份笔录。八点钟收盒饭你在边上，有几句我想再问问。”","挂了电话，我脑子里一直转着一个东西，转了好几圈才抓住。","付款时间和到账时间，是两个时间。中间隔着一个人：出纳什么时候坐到电脑前面，银行什么时候清算。只看到账，你会以为钱是那一刻付的。","受伤和死，也是两个时间。法医说，他受伤以后，人还清醒过一阵子。九点十分，椅子响了一下，他还在动。可那时候，伤已经在他身上了。","年夜饭是我妈一个人做的，八个菜，两个人吃。她照老规矩，在桌子上多摆了一副碗筷，是给我爸的。","电视开着，春晚的声音关了。楼下电器铺的卷帘门关得严严实实，后屋的灯亮着。","吃到一半，我跟我妈说，邵峻叫我初二去一趟县局，问八点钟收盒饭的事。","她筷子停在半空，过了一会儿放下来。","“问你什么？”","“他问什么，我讲什么。”","“你守义叔不是那种人。”她说，“他送钱那年，当着我的面数了三遍，一张都没少。你爸住院，他骑三轮车送了一个冬天的饭。”","“我没说他是那种人。”我说，“他问什么，我讲什么。”","她没再说话，给我夹了一块鱼，又给我爸那只空碗里夹了一块。","十一点多，我出了门。","老街上到处是鞭炮的红纸屑，塘路上一盏灯也没有。我一直走到二塘，走到老厂门口。警戒线已经撤了，仓库的灯还亮着一盏。","门口蹲着一个人，捧着一个外卖盒在吃饺子。","是那个戴毛线帽的姑娘。她看见我，抬了一下头，认出来了：“你是那天楼上的。”","“你过年不回家？”","“老板讲除夕值班三倍工资。”她夹起一个饺子，“我算了一下，够我妈一个月的药钱。外卖平台上今天能点的只剩一家饺子馆，送了一个半钟头，都坨了。”","她是贵州的，来上林第三年。我在她旁边蹲下来。远处有人家开始放烟花，一朵一朵在海塘那边炸开。","“那天晚上，你吃完外卖，盒子扔在这里了？”我指了指门边那只绿色的大垃圾桶。","“扔了。”她说，“你们来的时候我刚吃完。”","“桶里还有别的吗？”","她想了想。","“空的。那天傍晚六点，环卫车刚来清过。我扔进去的时候，咚的一声，就我一个盒子。”她又夹了一个饺子，“警察那天夜里也翻过这个桶，翻了一个钟头。我还想呢，楼上你们白天吃了那么多盒饭，盒子都扔哪里去了。”","我蹲在那里，没有站起来。","八点四十七分，陈守义拎着一只鼓鼓的塑料袋出了院门。他说是盒饭垃圾。袋子是我看着他装的。"],"recap":"老胡半夜打来电话认错。邵峻让许知川看韩岚车里的录音和一份二〇一一年的协议：她借给厂里的五十万，当时就“结清”了。法医说，岑启明受伤后清醒过一阵子。九点十分，档案室里椅子响过。","date":"除夕","mood":"jin"},{"n":13,"cn":"十三","title":"抓痕","era":"","chars":1562,"mins":4,"html":"<p data-p=\"0\">大年初一，我一整天没出门。<\/p>\n<p data-p=\"1\">楼下电器铺没开门。老街上的人来来去去拜年，有人在铺子门口站一下，喊一声“<b class=\"rn\" data-c=\"shouyi\">守义阿哥<\/b>新年好”，后屋的门帘动一动，<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>出来应一声，说他身体不大好，在睡。<\/p>\n<p data-p=\"2\"><b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>去庙里烧了香。回来的时候，手里多了一个平安符，红绳子系着，她没说是给谁求的，放在了饭桌上。<\/p>\n<p data-p=\"3\">晚上十点，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>发来一条短信：明天上午九点，三楼。<\/p>\n<p data-p=\"4\">我回了一个字：好。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"5\">正月初二，县局三楼只有值班的几个人，走廊里的防诈骗海报被人贴上了一个福字。<\/p>\n<p data-p=\"6\">邵峻给我倒了一杯水，翻开本子。<\/p>\n<p data-p=\"7\">“八点钟收盒饭，你在边上。”他说，“陈守义那时候在做什么？”<\/p>\n<p data-p=\"8\">“把盒子摞起来，装进一只大塑料袋。”<\/p>\n<p data-p=\"9\">“他袖子是撸着的，还是放着的？”<\/p>\n<p data-p=\"10\">我想了一下。他把羽绒服的袖子撸到了胳膊肘，两只手腕上沾着酱油，在袋口系了个死结，系得很用力，手背上的筋都绷了起来。<\/p>\n<p data-p=\"11\">“撸着的。”<\/p>\n<p data-p=\"12\">“左手腕上，有没有伤？有没有贴东西？”<\/p>\n<p data-p=\"13\">纸杯被我捏瘪了一点，水漫到虎口上。<\/p>\n<p class=\"beat\" data-p=\"14\">“没有。”<\/p>\n<p data-p=\"15\">邵峻在本子上记了一笔，翻回前面几页，看了一会儿。<\/p>\n<p data-p=\"16\">“你那天晚上说，八点五十五以后，他一直在铺子里。”<\/p>\n<p data-p=\"17\">“是。”<\/p>\n<p data-p=\"18\">“这两句话，都是真的。”<\/p>\n<p data-p=\"19\">“都是真的。”<\/p>\n<p data-p=\"20\">他把一份打印好的笔录推到我面前，叫我看一遍，没问题就签字。<\/p>\n<p data-p=\"21\">我从头看到尾。上面写着我的名字、我的身份证号、我说的每一句话。最后一行空着，等我签。<\/p>\n<p data-p=\"22\">我核了七年的账，签过几千张单子，从来没有一张签得这么慢。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"23\">签完以后，邵峻没让我走。<\/p>\n<p data-p=\"24\">“法医的正式意见出来了。”他说，“你懂账，我讲给你听，你听得懂。”<\/p>\n<p data-p=\"25\">他把一张纸翻过来，指着上面的字。<\/p>\n<p data-p=\"26\">“后脑撞在柜角上，颅骨有一道裂缝，底下是血肿。这种伤，人当场不一定倒，可以爬起来，可以讲话，可以写字，过个几十分钟，血压住了，人就不行了。法医管这个叫中间清醒期。”<\/p>\n<p data-p=\"27\">“他写的那个‘一’。”<\/p>\n<p data-p=\"28\">“对。清醒能有多久，因人而异，几十分钟到一两个钟头都有，法医不肯讲死。死亡大概在九点半前后。”<\/p>\n<p data-p=\"29\">“所以时间只能靠别的东西框。”他说，“八点钟，你看见他手腕上没有伤。八点四十七分，他拎着袋子出了院门。九点十分，档案室里椅子响。前门监控上再没有人进去，后门从里面插着。”他把笔放下，“屋里剩下的，就是他们两个人。”<\/p>\n<p data-p=\"30\">“柜角上的血，和他后脑的伤口对得上。他头发里有柜子上的漆皮。指甲里是陈守义的东西。”邵峻停了一下，“那天夜里两点多拍的伤口照片，法医也看了，讲是新伤。几点抓的，照片上看不出来。”<\/p>\n<p data-p=\"31\">“八点四十一分那个电话……”<\/p>\n<p data-p=\"32\">“打给你的。”他说，“没打出去。”<\/p>\n<p data-p=\"33\">我坐在那里，手里还捏着那支签字笔。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"34\">中午，邵峻带着人去了老街。<\/p>\n<p data-p=\"35\">我跟在后面，没有进铺子，站在楼梯口。我妈站在楼上的窗口，没有下来。<\/p>\n<p data-p=\"36\">卷帘门拉起来的时候，陈守义坐在柜台后面，穿着那件袖口磨亮了的羽绒服，像是早就在等。他看见邵峻，站了起来，又看见了我，没说话。<\/p>\n<p data-p=\"37\">技术员径直去了后门。铺子后门外面是一条窄巷子，墙根下放着一只铁皮桶，桶壁熏得漆黑。卢彩娣跟出来，站在门槛上。<\/p>\n<p data-p=\"38\">“烧什么的？”邵峻问她。<\/p>\n<p data-p=\"39\">“旧挂历。”卢彩娣说，“过年了，清一清。”<\/p>\n<p data-p=\"40\">技术员把桶里的灰倒在一块塑料布上，用镊子一点一点拨开。灰是黑的，有几片没烧透的纸角，卷着，一碰就碎。<\/p>\n<p data-p=\"41\">过了一会儿，技术员夹起一样东西，举起来对着光看。是一角没烧透的纸，边上焦黄卷着，印着表格的横线，格子里还剩半个字，金字旁。<\/p>\n<p data-p=\"42\">邵峻看着那一角纸，又看着卢彩娣：“挂历上，有表格？”<\/p>\n<p data-p=\"43\">卢彩娣张了张嘴，没说出话来。她扶着门框站了一会儿，转身进了后屋。门帘落下来，晃了很久。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"44\">他们给陈守义戴上了手铐。他没有挣，把两只手伸出去，伸得很直，像在车间里递一把扳手给人。<\/p>\n<p data-p=\"45\">走到楼梯口，他在我面前停了下来。<\/p>\n<p data-p=\"46\">邵峻没有催他。<\/p>\n<p data-p=\"47\">他看着我，喉结上下动了两回，才发出声音。<\/p>\n<p data-p=\"48\">“<b class=\"rn\" data-c=\"zhichuan\">知川<\/b>，”他说，“那天晚上……推了他一把。”<\/p>\n<p data-p=\"49\">楼上的窗户响了一下，是我妈把窗推开了。<\/p>\n<p class=\"last\" data-p=\"50\">“可他站起来了。”陈守义说，声音一下子急了，像是怕我不信，“他站起来了，还骂人，指着门叫滚。走的时候，他好好的。”<\/p>","paras":["大年初一，我一整天没出门。","楼下电器铺没开门。老街上的人来来去去拜年，有人在铺子门口站一下，喊一声“守义阿哥新年好”，后屋的门帘动一动，卢彩娣出来应一声，说他身体不大好，在睡。","我妈去庙里烧了香。回来的时候，手里多了一个平安符，红绳子系着，她没说是给谁求的，放在了饭桌上。","晚上十点，邵峻发来一条短信：明天上午九点，三楼。","我回了一个字：好。","正月初二，县局三楼只有值班的几个人，走廊里的防诈骗海报被人贴上了一个福字。","邵峻给我倒了一杯水，翻开本子。","“八点钟收盒饭，你在边上。”他说，“陈守义那时候在做什么？”","“把盒子摞起来，装进一只大塑料袋。”","“他袖子是撸着的，还是放着的？”","我想了一下。他把羽绒服的袖子撸到了胳膊肘，两只手腕上沾着酱油，在袋口系了个死结，系得很用力，手背上的筋都绷了起来。","“撸着的。”","“左手腕上，有没有伤？有没有贴东西？”","纸杯被我捏瘪了一点，水漫到虎口上。","“没有。”","邵峻在本子上记了一笔，翻回前面几页，看了一会儿。","“你那天晚上说，八点五十五以后，他一直在铺子里。”","“是。”","“这两句话，都是真的。”","“都是真的。”","他把一份打印好的笔录推到我面前，叫我看一遍，没问题就签字。","我从头看到尾。上面写着我的名字、我的身份证号、我说的每一句话。最后一行空着，等我签。","我核了七年的账，签过几千张单子，从来没有一张签得这么慢。","签完以后，邵峻没让我走。","“法医的正式意见出来了。”他说，“你懂账，我讲给你听，你听得懂。”","他把一张纸翻过来，指着上面的字。","“后脑撞在柜角上，颅骨有一道裂缝，底下是血肿。这种伤，人当场不一定倒，可以爬起来，可以讲话，可以写字，过个几十分钟，血压住了，人就不行了。法医管这个叫中间清醒期。”","“他写的那个‘一’。”","“对。清醒能有多久，因人而异，几十分钟到一两个钟头都有，法医不肯讲死。死亡大概在九点半前后。”","“所以时间只能靠别的东西框。”他说，“八点钟，你看见他手腕上没有伤。八点四十七分，他拎着袋子出了院门。九点十分，档案室里椅子响。前门监控上再没有人进去，后门从里面插着。”他把笔放下，“屋里剩下的，就是他们两个人。”","“柜角上的血，和他后脑的伤口对得上。他头发里有柜子上的漆皮。指甲里是陈守义的东西。”邵峻停了一下，“那天夜里两点多拍的伤口照片，法医也看了，讲是新伤。几点抓的，照片上看不出来。”","“八点四十一分那个电话……”","“打给你的。”他说，“没打出去。”","我坐在那里，手里还捏着那支签字笔。","中午，邵峻带着人去了老街。","我跟在后面，没有进铺子，站在楼梯口。我妈站在楼上的窗口，没有下来。","卷帘门拉起来的时候，陈守义坐在柜台后面，穿着那件袖口磨亮了的羽绒服，像是早就在等。他看见邵峻，站了起来，又看见了我，没说话。","技术员径直去了后门。铺子后门外面是一条窄巷子，墙根下放着一只铁皮桶，桶壁熏得漆黑。卢彩娣跟出来，站在门槛上。","“烧什么的？”邵峻问她。","“旧挂历。”卢彩娣说，“过年了，清一清。”","技术员把桶里的灰倒在一块塑料布上，用镊子一点一点拨开。灰是黑的，有几片没烧透的纸角，卷着，一碰就碎。","过了一会儿，技术员夹起一样东西，举起来对着光看。是一角没烧透的纸，边上焦黄卷着，印着表格的横线，格子里还剩半个字，金字旁。","邵峻看着那一角纸，又看着卢彩娣：“挂历上，有表格？”","卢彩娣张了张嘴，没说出话来。她扶着门框站了一会儿，转身进了后屋。门帘落下来，晃了很久。","他们给陈守义戴上了手铐。他没有挣，把两只手伸出去，伸得很直，像在车间里递一把扳手给人。","走到楼梯口，他在我面前停了下来。","邵峻没有催他。","他看着我，喉结上下动了两回，才发出声音。","“知川，”他说，“那天晚上……推了他一把。”","楼上的窗户响了一下，是我妈把窗推开了。","“可他站起来了。”陈守义说，声音一下子急了，像是怕我不信，“他站起来了，还骂人，指着门叫滚。走的时候，他好好的。”"],"recap":"出纳小姚说，老葛那笔钱是九点三十八分点的网银，和岑启明死没死没有关系。许知川想明白了，付款和到账是两个时间，受伤和死也是。老厂门口的垃圾桶，那天傍晚刚清过，桶里只有一个外卖盒。","date":"大年初一","mood":"jin"},{"n":14,"cn":"十四","title":"替大家","era":"","chars":2447,"mins":6,"html":"<p data-p=\"0\">正月初三，消息就传遍了老街：<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>被刑拘了。<\/p>\n<p data-p=\"1\">电器铺的卷帘门一直拉着。门口有人放了一袋橘子，有人放了两盒年糕，没留名字。<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>早上出来收了一次，傍晚又出来收了一次，一句话也没说。<\/p>\n<p data-p=\"2\">群里先是安静了一天。退群的人没有回来。新拉的那个“恒成讨债”群，金彩凤的儿子说，也没人说话。好像大家都在等一个说法，等有人先开口。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"3\">初四下午，开口的是<b class=\"rn\" data-c=\"hu\">老胡<\/b>。<\/p>\n<p data-p=\"4\">他退了群，又被人拉了回来。他发了一条很长的语音，转成文字，错字很多，意思是这样的：<\/p>\n<p data-p=\"5\">彩娣请的律师今天见到守义阿哥了。守义阿哥讲，那天晚上，<b class=\"rn\" data-c=\"cenqiming\">老岑<\/b>要第二天当着四十几户的面，把六户一家一家点出来。守义阿哥求他，不要讲，讲出去，六户在上林就没法做人，四十二户跟六户要结一辈子的仇。老岑不肯，两个人争起来，守义阿哥推了他一把。老岑站起来了，还骂人，叫他滚。他走的时候，老岑好好的。后来怎么死的，他不晓得。<\/p>\n<p data-p=\"6\">最后一句，老胡是哭着说的，转出来的文字是：他是替阿拉大家挡的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">群里一下子活了。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"8\">我就晓得守义阿哥不会害人。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"9\">附件也是他拿的？那是怕老岑第二天拿出来念。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"10\">他自己家一分钱都没先拿，图什么？图的就是我们不要打起来。<\/p><\/div><\/div><\/div>\n<p data-p=\"11\">“老岑那个人，十五年不露面，回来就要当众点名，换我也要拦。”<\/p>\n<p data-p=\"12\">几天前，群里有人叫他“老陈”，问他早晓得为什么不讲。现在，其中有一些人改回来了，一口一个守义阿哥；另一些人什么也不叫，不说话。<\/p>\n<p data-p=\"13\">六户里先说话的是<b class=\"rn\" data-c=\"yusao\">俞家媳妇<\/b>：“我们家那时候老人瘫在床上，没有守义阿哥，那笔钱轮不到我们。他现在为了不让我们家丢脸，人都进去了。”<\/p>\n<p data-p=\"14\">应家的头像亮了，发了一个合十的表情。<\/p>\n<p data-p=\"15\">傍晚，钟家那个读研究生的孙子起草了一封联名信，标题是《关于陈守义同志一贯表现的情况说明》。信里写他十五年为工友奔走，写他陪老人看病、替困难户垫钱、修电器不收钱，最后一段写：此次事件，系其为维护工友团结、保护困难家庭名誉，一时冲动所致，恳请从轻处理。<\/p>\n<p data-p=\"16\">第一个签名的是胡国良。签完，他在群里发：阿拉不是人，守义阿哥是。<\/p>\n<p data-p=\"17\">签名的人不多。<\/p>\n<p data-p=\"18\">六户里五户签了，邬家没签。剩下的四十二户里，签的大多是这些年真欠过他人情的：他骑三轮车送去过医院的，他垫过钱的，他修了十几年电器从来不收钱的。也有人是看了老胡后来那一句才签的：没有守义阿哥年年寄催款信，这二百一十万早过了时效，<b class=\"rn\" data-c=\"cenyue\">岑家姑娘<\/b>认都不用认。<\/p>\n<p data-p=\"19\">到晚上，一共十九个名字。<\/p>\n<p data-p=\"20\">金彩凤的儿子又发来几张截图。“恒成讨债”那个群里，有人说：他瞒了我们十一年，签什么签。另一个说：那些催款信，邮费都是他自己出的。那个群吵了一晚上，最后谁也没签，也谁都没退群。<\/p>\n<p class=\"beat\" data-p=\"21\">凶手抓到了。有人离他更近了，有人离得更远。群里那道缝没有合上，只是换了个地方裂开。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"22\">晚饭的时候，<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>说她也签了。<\/p>\n<p data-p=\"23\">“你守义叔替我们家挡的。”她说，“我不签，我在老街上怎么做人？”<\/p>\n<p data-p=\"24\">她看着我，等我说话。<\/p>\n<p data-p=\"25\"><b class=\"rn\" data-c=\"zhongsun\">钟家孙子<\/b>私下发消息给我，问我签不签。我回：我是证人，不能签。<\/p>\n<p data-p=\"26\">这是实话，也不全是实话。我签过一张笔录了，在县局三楼，签得很慢。那张纸上写的是八点钟他的手腕上什么也没有。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"27\">初五早上，钟家孙子又在群里发了一段，是他奶奶的原话，他一个字一个字打出来的：<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av\" aria-hidden=\"true\">钟<\/span><div><p class=\"wwho\"><span>钟家孙子<\/span><\/p><p class=\"wbub\" data-p=\"28\">守义那年送来十万块钱，现金，用一个信封装着，信封上写着我们家的名字。岑老板只肯打七折，守义去求了好几回，才求下来这十万。老头子那时候化疗，钱用在刀口上，多活了三年。守义的恩，我们家记一辈子。联名信，我们家第一个签。<\/p><\/div><\/div><\/div>\n<p data-p=\"29\">群里有人回：姓岑的连救命钱都要打七折。又有人回：守义阿哥连这个都替人去求。<\/p>\n<p data-p=\"30\">联名信底下，又多了两个名字。<\/p>\n<p data-p=\"31\">过了一会儿，有人问：那六户都打了七折？<\/p>\n<p data-p=\"32\">俞家媳妇回：我家也是七折。守义阿哥讲，岑老板的钱不够。<\/p>\n<p data-p=\"33\">又有人问：戴师傅家呢？应家呢？老胡呢？<\/p>\n<p data-p=\"34\">没有人回。老胡十分钟前还在群里发语音，这时候头像一动不动。应家的头像又灰了。<\/p>\n<p data-p=\"35\">群里这一回静了很久。有人发了个问号，没人接。<\/p>\n<p data-p=\"36\">我妈坐在饭桌那头，也在看手机。她把手机放下，又拿起来，又放下。<\/p>\n<p data-p=\"37\">“我那二十万，一张不少。”她说，“守义从来没讲过打折。”<\/p>\n<p data-p=\"38\">她说完这句，自己先愣住了，看着我。<\/p>\n<p data-p=\"39\">我把钟家孙子那段话又看了两遍。<\/p>\n<p data-p=\"40\">然后我把<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>那本账簿的照片翻出来，翻到那一页。泡过水的蓝墨水，洇开了，可每一个字都认得出来：<\/p>\n<p data-p=\"41\">钟德明，十五万。<\/p>\n<p data-p=\"42\">我又翻出俞家媳妇那天在群里晒的那张收条：本金已全部结清。不写收到多少。<\/p>\n<p data-p=\"43\">我拿着手机在饭桌边坐了很久。窗外有人家在放初五迎财神的鞭炮，一挂接一挂。<\/p>\n<p data-p=\"44\">岑启明打给陈守义的是十五万。<b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>记了十一年的，是十万。<\/p>\n<p data-p=\"45\">群里大多数人算不出那五万。谁家当年借了多少，登记簿在警察那里，那张四十八户的表只在我手机里；岑启明打给陈守义的是多少，只写在那本冻过的账上。可有三户人家，不用算也晓得：他们拿的是足额。我妈是其中一户。<\/p>\n<p data-p=\"46\">三户都没有出声。出声，就得先说自己拿了多少，再说为什么别人打了七折、自己没有。<\/p>\n<p data-p=\"47\">九十万这个数，从来不是六户收到的钱加起来的。它是三百万减二百一十万，是岑启明那一头付出去的钱。付钱的人有转账记录，罗维民也记了账，两本账对得上。收钱的六户，各自只晓得自己那一行，从来没有人把六行加起来。<\/p>\n<p data-p=\"48\">账要对，得两头对。这笔账，十一年来只对过一头。<\/p>\n<p data-p=\"49\">“打七折”这三个字，是谁先说出来的，没有人讲得清。俞家媳妇只记得，守义阿哥讲过一句：岑老板的钱不够。中间那五万，账上没有，收条上没有，谁也没有提过。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"50\">晚上九点，有人敲门。<\/p>\n<p data-p=\"51\">是卢彩娣。她穿着一件旧棉袄，头发全白了，好像这几天才白的。我妈愣了一下，让她进来，给她倒了一杯热水。<\/p>\n<p data-p=\"52\">她没喝，捧着杯子坐在饭桌边，就坐在我爸那副碗筷的位置上。<\/p>\n<p data-p=\"53\">“那封信，我没签。”她说。<\/p>\n<p data-p=\"54\">我妈没说话。<\/p>\n<p data-p=\"55\">“他那天晚上回来，”卢彩娣看着杯子里的水，“修那台电暖器，修到快十一点。平常一刻钟的活。后盖拧上了又拆开，拆开了又拧上。我在后屋喊他吃饭，他说就好，就好。”<\/p>\n<p data-p=\"56\">她把杯子放下，手在棉袄上擦了两下。<\/p>\n<p data-p=\"57\">“警察问过我。我讲他一直在修东西，没讲修了多久。”她抬起头看我，“小许，我讲不出口。你去讲。”<\/p>\n<p data-p=\"58\">她站起来就走了，门没关严，楼道里的风灌进来。我妈起身去关门，在门口站了很久。<\/p>\n<p data-p=\"59\">我给<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>打了电话。他听完，沉默了几秒。<\/p>\n<p class=\"last\" data-p=\"60\">“明天上午，”他说，“你跟我去铺子里，看看那台电暖器。”<\/p>","paras":["正月初三，消息就传遍了老街：陈守义被刑拘了。","电器铺的卷帘门一直拉着。门口有人放了一袋橘子，有人放了两盒年糕，没留名字。卢彩娣早上出来收了一次，傍晚又出来收了一次，一句话也没说。","群里先是安静了一天。退群的人没有回来。新拉的那个“恒成讨债”群，金彩凤的儿子说，也没人说话。好像大家都在等一个说法，等有人先开口。","初四下午，开口的是老胡。","他退了群，又被人拉了回来。他发了一条很长的语音，转成文字，错字很多，意思是这样的：","彩娣请的律师今天见到守义阿哥了。守义阿哥讲，那天晚上，老岑要第二天当着四十几户的面，把六户一家一家点出来。守义阿哥求他，不要讲，讲出去，六户在上林就没法做人，四十二户跟六户要结一辈子的仇。老岑不肯，两个人争起来，守义阿哥推了他一把。老岑站起来了，还骂人，叫他滚。他走的时候，老岑好好的。后来怎么死的，他不晓得。","最后一句，老胡是哭着说的，转出来的文字是：他是替阿拉大家挡的。","群里一下子活了。","我就晓得守义阿哥不会害人。","附件也是他拿的？那是怕老岑第二天拿出来念。","他自己家一分钱都没先拿，图什么？图的就是我们不要打起来。","“老岑那个人，十五年不露面，回来就要当众点名，换我也要拦。”","几天前，群里有人叫他“老陈”，问他早晓得为什么不讲。现在，其中有一些人改回来了，一口一个守义阿哥；另一些人什么也不叫，不说话。","六户里先说话的是俞家媳妇：“我们家那时候老人瘫在床上，没有守义阿哥，那笔钱轮不到我们。他现在为了不让我们家丢脸，人都进去了。”","应家的头像亮了，发了一个合十的表情。","傍晚，钟家那个读研究生的孙子起草了一封联名信，标题是《关于陈守义同志一贯表现的情况说明》。信里写他十五年为工友奔走，写他陪老人看病、替困难户垫钱、修电器不收钱，最后一段写：此次事件，系其为维护工友团结、保护困难家庭名誉，一时冲动所致，恳请从轻处理。","第一个签名的是胡国良。签完，他在群里发：阿拉不是人，守义阿哥是。","签名的人不多。","六户里五户签了，邬家没签。剩下的四十二户里，签的大多是这些年真欠过他人情的：他骑三轮车送去过医院的，他垫过钱的，他修了十几年电器从来不收钱的。也有人是看了老胡后来那一句才签的：没有守义阿哥年年寄催款信，这二百一十万早过了时效，岑家姑娘认都不用认。","到晚上，一共十九个名字。","金彩凤的儿子又发来几张截图。“恒成讨债”那个群里，有人说：他瞒了我们十一年，签什么签。另一个说：那些催款信，邮费都是他自己出的。那个群吵了一晚上，最后谁也没签，也谁都没退群。","凶手抓到了。有人离他更近了，有人离得更远。群里那道缝没有合上，只是换了个地方裂开。","晚饭的时候，我妈说她也签了。","“你守义叔替我们家挡的。”她说，“我不签，我在老街上怎么做人？”","她看着我，等我说话。","钟家孙子私下发消息给我，问我签不签。我回：我是证人，不能签。","这是实话，也不全是实话。我签过一张笔录了，在县局三楼，签得很慢。那张纸上写的是八点钟他的手腕上什么也没有。","初五早上，钟家孙子又在群里发了一段，是他奶奶的原话，他一个字一个字打出来的：","守义那年送来十万块钱，现金，用一个信封装着，信封上写着我们家的名字。岑老板只肯打七折，守义去求了好几回，才求下来这十万。老头子那时候化疗，钱用在刀口上，多活了三年。守义的恩，我们家记一辈子。联名信，我们家第一个签。","群里有人回：姓岑的连救命钱都要打七折。又有人回：守义阿哥连这个都替人去求。","联名信底下，又多了两个名字。","过了一会儿，有人问：那六户都打了七折？","俞家媳妇回：我家也是七折。守义阿哥讲，岑老板的钱不够。","又有人问：戴师傅家呢？应家呢？老胡呢？","没有人回。老胡十分钟前还在群里发语音，这时候头像一动不动。应家的头像又灰了。","群里这一回静了很久。有人发了个问号，没人接。","我妈坐在饭桌那头，也在看手机。她把手机放下，又拿起来，又放下。","“我那二十万，一张不少。”她说，“守义从来没讲过打折。”","她说完这句，自己先愣住了，看着我。","我把钟家孙子那段话又看了两遍。","然后我把罗维民那本账簿的照片翻出来，翻到那一页。泡过水的蓝墨水，洇开了，可每一个字都认得出来：","钟德明，十五万。","我又翻出俞家媳妇那天在群里晒的那张收条：本金已全部结清。不写收到多少。","我拿着手机在饭桌边坐了很久。窗外有人家在放初五迎财神的鞭炮，一挂接一挂。","岑启明打给陈守义的是十五万。钟家老太记了十一年的，是十万。","群里大多数人算不出那五万。谁家当年借了多少，登记簿在警察那里，那张四十八户的表只在我手机里；岑启明打给陈守义的是多少，只写在那本冻过的账上。可有三户人家，不用算也晓得：他们拿的是足额。我妈是其中一户。","三户都没有出声。出声，就得先说自己拿了多少，再说为什么别人打了七折、自己没有。","九十万这个数，从来不是六户收到的钱加起来的。它是三百万减二百一十万，是岑启明那一头付出去的钱。付钱的人有转账记录，罗维民也记了账，两本账对得上。收钱的六户，各自只晓得自己那一行，从来没有人把六行加起来。","账要对，得两头对。这笔账，十一年来只对过一头。","“打七折”这三个字，是谁先说出来的，没有人讲得清。俞家媳妇只记得，守义阿哥讲过一句：岑老板的钱不够。中间那五万，账上没有，收条上没有，谁也没有提过。","晚上九点，有人敲门。","是卢彩娣。她穿着一件旧棉袄，头发全白了，好像这几天才白的。我妈愣了一下，让她进来，给她倒了一杯热水。","她没喝，捧着杯子坐在饭桌边，就坐在我爸那副碗筷的位置上。","“那封信，我没签。”她说。","我妈没说话。","“他那天晚上回来，”卢彩娣看着杯子里的水，“修那台电暖器，修到快十一点。平常一刻钟的活。后盖拧上了又拆开，拆开了又拧上。我在后屋喊他吃饭，他说就好，就好。”","她把杯子放下，手在棉袄上擦了两下。","“警察问过我。我讲他一直在修东西，没讲修了多久。”她抬起头看我，“小许，我讲不出口。你去讲。”","她站起来就走了，门没关严，楼道里的风灌进来。我妈起身去关门，在门口站了很久。","我给邵峻打了电话。他听完，沉默了几秒。","“明天上午，”他说，“你跟我去铺子里，看看那台电暖器。”"],"recap":"正月初二，许知川补笔录，说出八点钟陈守义手腕上没有伤。邵峻讲了法医的结论：中间清醒期。铺子后门的铁桶里，有一角没烧透的纸。陈守义戴上手铐，在楼梯口说：那天晚上……推了他一把，可他站起来了。","date":"正月初三","mood":"jin"},{"n":15,"cn":"十五","title":"二〇一五","era":"插章","chars":2156,"mins":5,"html":"<p data-p=\"0\">十一月底，<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>的电话打到了电器铺。四年没联系，号码是外地的。<\/p>\n<p data-p=\"1\">“<b class=\"rn\" data-c=\"shouyi\">守义<\/b>，凑出来一笔钱，九十万。”他说，“不够还所有人。”<\/p>\n<p data-p=\"2\">陈守义坐在柜台后面，手里还捏着一把螺丝刀。<\/p>\n<p data-p=\"3\">“先还几户最急的。”他说，“不要声张。声张了，四十几户一起堵你，谁也拿不到。”<\/p>\n<p data-p=\"4\">“哪几户？”<\/p>\n<p data-p=\"5\">陈守义从内袋里摸出那个小本子，翻到中间一页，那一页上记着四十八户，一户一行。他用指甲在纸上划过去，一行一行，划得很慢。<\/p>\n<p data-p=\"6\">“许家，老许在医院透析，一个礼拜三次。应家，<b class=\"rn\" data-c=\"luoweimin\">罗会计<\/b>的内弟，儿子要开刀。钟家，老头化疗。俞家，老人瘫在床上。邬家，小孩要读书。”他停了一下，“<b class=\"rn\" data-c=\"hu\">老胡<\/b>。”<\/p>\n<p data-p=\"7\">“老胡家不缺钱。”<\/p>\n<p data-p=\"8\">“老胡嘴巴大。他不闹，别人就不闹。”<\/p>\n<p data-p=\"9\">电话那头沉默了一会儿：“外地的呢？”<\/p>\n<p data-p=\"10\">陈守义的指甲停在一行字上：<b class=\"rn\" data-c=\"ge\">老葛<\/b>，六万。<\/p>\n<p data-p=\"11\">他想起老葛那间平房，床底下的铁皮饼干筒，还有那个在倒扣的纸箱上写作业的孩子。去年老葛打电话来，说孩子高中没读完，跟着同乡去厂里打工了。<\/p>\n<p data-p=\"12\">“外地的，送不过去，”他说，“也闹不起来。先本地。”<\/p>\n<p data-p=\"13\">挂了电话，他在本子那一页的边上，写下六个名字。写到第七行，笔尖顿了顿，写了“老葛”两个字。他看了一会儿，用笔把这两个字划掉了，划了两道。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"14\">十二月，钱分六笔，从岑启明的卡上打到陈守义的卡上。每到一笔，罗维民就骑车过来，把金额、日期抄进他的账簿，抄完，喝一杯茶就走。<\/p>\n<p data-p=\"15\">取现金要预约。陈守义跑了四趟银行，每趟取一点，柜员认得他了，问他是不是家里要买房。他说，帮人取的。<\/p>\n<p data-p=\"16\">钱拿回来，用旧报纸包着，锁在柜台底下的铁柜里。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">十二月十七日夜里，<b class=\"rn\" data-c=\"zhigang\">小舅子<\/b>打来电话。<\/p>\n<p data-p=\"18\">“姐夫，下个礼拜付首付。那十万，你再不拿来，我去老街上喊。”<\/p>\n<p data-p=\"19\">“下个礼拜给你。”<\/p>\n<p data-p=\"20\">“你四年前也这么讲。”<\/p>\n<p data-p=\"21\">电话挂了。后屋里，<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>在摔东西。先是一只碗，然后是一个锅盖，锅盖在水泥地上转了好几圈才停。<\/p>\n<p data-p=\"22\">“你自家借出去十五万，四年了，一分不去要。”她在门帘后面喊，“老屋征地补的十六万，你一笔一笔，全垫给了别人家。厂又不是你开的！阿拉弟弟的房子要是买不成，你叫我回娘家怎么做人？”<\/p>\n<p data-p=\"23\">陈守义没有回答。<\/p>\n<p data-p=\"24\">这个月，他去过两趟信用社。管贷款的小周是他看着长大的，表格翻了半天，讲铺子是租的，没有抵押，最多贷两万，还要找一个人担保。他想了一圈，能找的担保人，都是借了钱给厂里、到现在还没拿回来的。<\/p>\n<p data-p=\"25\">他翻开小本子，翻到中间那一页。四十八户，一户一行。他自己那一行：陈守义，十五万。<\/p>\n<p data-p=\"26\">九十万就锁在柜台底下。先还最急的，是他自己讲的。他不是最急的那一户。<\/p>\n<p data-p=\"27\">他把本子往后翻，翻到垫款那几页。钟家，五万五。俞家，五万二。邬家，三万六。许家，一万二。<\/p>\n<p data-p=\"28\">每一笔，都是讲过不用还的。<\/p>\n<p data-p=\"29\">他把卷帘门拉到底，把铁柜打开，把那几包报纸拿出来，摊在柜台上。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\">信封是在小店里买的，牛皮纸的，一摞二十个。<\/p>\n<p data-p=\"31\">他先拿了一个，写上“许家”，开始数钱。一百张一扎，一扎一扎往里放。数到二十扎，他停下来，又从头数了一遍。二十万，一张不少。<\/p>\n<p data-p=\"32\">他把信封封上，放在柜台左边。<\/p>\n<p data-p=\"33\">然后他翻开小本子，翻到后面几页。那几页记的不是借款，是这几年他替人垫的钱。一笔一笔，日期、事由、金额，字写得很工整。<\/p>\n<p data-p=\"34\">许家那一行：二〇一四年九月，许家小孩学费，一万二。<\/p>\n<p data-p=\"35\">他看着那一行，看了一会儿，在后面写了一个字：免。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"36\">应家，十五万。老胡，十五万。他数得很快，封好，放在许家的信封旁边。<\/p>\n<p data-p=\"37\">钟家。<\/p>\n<p data-p=\"38\">他数到第十五扎，手停住了。<\/p>\n<p data-p=\"39\">本子上，钟家那一行写着：二〇一二年至二〇一四年，钟师傅化疗，垫医药费，五万五千。底下还有几行小字，是哪一次住院、哪一次送去的。他每次送钱去，<b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>都拉着他的手，说守义，这钱阿拉一定还你。他每次都说，拿去用，不用还。<\/p>\n<p data-p=\"40\">铺子里很静，后屋的电视开着，听不清在播什么。<\/p>\n<p data-p=\"41\">他从信封里抽出五扎，放在柜台的另一边。<\/p>\n<p data-p=\"42\">然后他从抽屉里找出一支红笔。那是他当车间主任时改工时单用的，笔帽上缠着一圈胶布。他在钟家那一行垫款的金额上，用红笔划了一道，在旁边写：冲五万。又在后面添了两个字：免五千。<\/p>\n<p data-p=\"43\">他拿起钟家的信封，在正面写：钟家　拾万。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"44\">俞家、邬家，他也是这样：数完，停一会儿，抽出几扎，拿起红笔。<\/p>\n<p data-p=\"45\">柜台左边，是六只封好的信封。柜台右边，是十三扎钱。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"46\">后屋的电视关了。卢彩娣没有再摔东西。<\/p>\n<p data-p=\"47\">陈守义又拿了一个空信封，在正面写了两个字：娘舅。他从右边那十三扎里，数出十扎，装了进去。剩下的三扎，锁回了铁柜。<\/p>\n<p data-p=\"48\">他把七只信封并排摆在柜台上，一只一只看过去。<\/p>\n<p data-p=\"49\">明天一早，他要骑三轮车，先去许家，再去应家、老胡家。下午去三塘边上的钟家、俞家，晚上去邬家。他已经想好了跟钟家老太说什么：岑老板凑的钱，不够还所有人。就这一句。人家要是问，他不答。<\/p>\n<p data-p=\"50\">收条的格式也想好了：本金已全部结清。不写数目。写了数目，传出去，大家一比，更难听。<\/p>\n<p data-p=\"51\">他把小本子翻到最后，在那一页，每一笔垫款，每一道红线，每一个“免”字，都对齐了。借方和贷方，一分不差。<\/p>\n<p data-p=\"52\">他合上本子，关了柜台上的灯。<\/p>\n<p data-p=\"53\">“账平了。”他对着黑下来的铺子说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"54\">第二天下午，三塘边上，钟家。<\/p>\n<p data-p=\"55\">老太把信封接过去，没有拆，先拉住了他的手。他当着她的面，把钱一张一张数了一遍，然后说了想好的那一句：岑老板凑的钱，不够还所有人。<\/p>\n<p data-p=\"56\">老太看着信封上的“拾万”，过了一会儿，自己算出来了：“那是打了七折。”<\/p>\n<p data-p=\"57\">陈守义没有说话。<\/p>\n<p data-p=\"58\">“又叫你去求人了。”老太说。她在收条上按了手印，手还是没松，“你垫的那些，等孙子工作了，阿拉一定还你。”<\/p>\n<p data-p=\"59\">“不用还。”陈守义说。<\/p>\n<p class=\"last\" data-p=\"60\">从钟家出来，他推着三轮车走了一段，才骑上去。<\/p>","paras":["十一月底，岑启明的电话打到了电器铺。四年没联系，号码是外地的。","“守义，凑出来一笔钱，九十万。”他说，“不够还所有人。”","陈守义坐在柜台后面，手里还捏着一把螺丝刀。","“先还几户最急的。”他说，“不要声张。声张了，四十几户一起堵你，谁也拿不到。”","“哪几户？”","陈守义从内袋里摸出那个小本子，翻到中间一页，那一页上记着四十八户，一户一行。他用指甲在纸上划过去，一行一行，划得很慢。","“许家，老许在医院透析，一个礼拜三次。应家，罗会计的内弟，儿子要开刀。钟家，老头化疗。俞家，老人瘫在床上。邬家，小孩要读书。”他停了一下，“老胡。”","“老胡家不缺钱。”","“老胡嘴巴大。他不闹，别人就不闹。”","电话那头沉默了一会儿：“外地的呢？”","陈守义的指甲停在一行字上：老葛，六万。","他想起老葛那间平房，床底下的铁皮饼干筒，还有那个在倒扣的纸箱上写作业的孩子。去年老葛打电话来，说孩子高中没读完，跟着同乡去厂里打工了。","“外地的，送不过去，”他说，“也闹不起来。先本地。”","挂了电话，他在本子那一页的边上，写下六个名字。写到第七行，笔尖顿了顿，写了“老葛”两个字。他看了一会儿，用笔把这两个字划掉了，划了两道。","十二月，钱分六笔，从岑启明的卡上打到陈守义的卡上。每到一笔，罗维民就骑车过来，把金额、日期抄进他的账簿，抄完，喝一杯茶就走。","取现金要预约。陈守义跑了四趟银行，每趟取一点，柜员认得他了，问他是不是家里要买房。他说，帮人取的。","钱拿回来，用旧报纸包着，锁在柜台底下的铁柜里。","十二月十七日夜里，小舅子打来电话。","“姐夫，下个礼拜付首付。那十万，你再不拿来，我去老街上喊。”","“下个礼拜给你。”","“你四年前也这么讲。”","电话挂了。后屋里，卢彩娣在摔东西。先是一只碗，然后是一个锅盖，锅盖在水泥地上转了好几圈才停。","“你自家借出去十五万，四年了，一分不去要。”她在门帘后面喊，“老屋征地补的十六万，你一笔一笔，全垫给了别人家。厂又不是你开的！阿拉弟弟的房子要是买不成，你叫我回娘家怎么做人？”","陈守义没有回答。","这个月，他去过两趟信用社。管贷款的小周是他看着长大的，表格翻了半天，讲铺子是租的，没有抵押，最多贷两万，还要找一个人担保。他想了一圈，能找的担保人，都是借了钱给厂里、到现在还没拿回来的。","他翻开小本子，翻到中间那一页。四十八户，一户一行。他自己那一行：陈守义，十五万。","九十万就锁在柜台底下。先还最急的，是他自己讲的。他不是最急的那一户。","他把本子往后翻，翻到垫款那几页。钟家，五万五。俞家，五万二。邬家，三万六。许家，一万二。","每一笔，都是讲过不用还的。","他把卷帘门拉到底，把铁柜打开，把那几包报纸拿出来，摊在柜台上。","信封是在小店里买的，牛皮纸的，一摞二十个。","他先拿了一个，写上“许家”，开始数钱。一百张一扎，一扎一扎往里放。数到二十扎，他停下来，又从头数了一遍。二十万，一张不少。","他把信封封上，放在柜台左边。","然后他翻开小本子，翻到后面几页。那几页记的不是借款，是这几年他替人垫的钱。一笔一笔，日期、事由、金额，字写得很工整。","许家那一行：二〇一四年九月，许家小孩学费，一万二。","他看着那一行，看了一会儿，在后面写了一个字：免。","应家，十五万。老胡，十五万。他数得很快，封好，放在许家的信封旁边。","钟家。","他数到第十五扎，手停住了。","本子上，钟家那一行写着：二〇一二年至二〇一四年，钟师傅化疗，垫医药费，五万五千。底下还有几行小字，是哪一次住院、哪一次送去的。他每次送钱去，钟家老太都拉着他的手，说守义，这钱阿拉一定还你。他每次都说，拿去用，不用还。","铺子里很静，后屋的电视开着，听不清在播什么。","他从信封里抽出五扎，放在柜台的另一边。","然后他从抽屉里找出一支红笔。那是他当车间主任时改工时单用的，笔帽上缠着一圈胶布。他在钟家那一行垫款的金额上，用红笔划了一道，在旁边写：冲五万。又在后面添了两个字：免五千。","他拿起钟家的信封，在正面写：钟家　拾万。","俞家、邬家，他也是这样：数完，停一会儿，抽出几扎，拿起红笔。","柜台左边，是六只封好的信封。柜台右边，是十三扎钱。","后屋的电视关了。卢彩娣没有再摔东西。","陈守义又拿了一个空信封，在正面写了两个字：娘舅。他从右边那十三扎里，数出十扎，装了进去。剩下的三扎，锁回了铁柜。","他把七只信封并排摆在柜台上，一只一只看过去。","明天一早，他要骑三轮车，先去许家，再去应家、老胡家。下午去三塘边上的钟家、俞家，晚上去邬家。他已经想好了跟钟家老太说什么：岑老板凑的钱，不够还所有人。就这一句。人家要是问，他不答。","收条的格式也想好了：本金已全部结清。不写数目。写了数目，传出去，大家一比，更难听。","他把小本子翻到最后，在那一页，每一笔垫款，每一道红线，每一个“免”字，都对齐了。借方和贷方，一分不差。","他合上本子，关了柜台上的灯。","“账平了。”他对着黑下来的铺子说。","第二天下午，三塘边上，钟家。","老太把信封接过去，没有拆，先拉住了他的手。他当着她的面，把钱一张一张数了一遍，然后说了想好的那一句：岑老板凑的钱，不够还所有人。","老太看着信封上的“拾万”，过了一会儿，自己算出来了：“那是打了七折。”","陈守义没有说话。","“又叫你去求人了。”老太说。她在收条上按了手印，手还是没松，“你垫的那些，等孙子工作了，阿拉一定还你。”","“不用还。”陈守义说。","从钟家出来，他推着三轮车走了一段，才骑上去。"],"recap":"陈守义被刑拘，老胡转述他的话：他是替阿拉大家挡的。联名信到晚上签了十九个名字。钟家老太说，守义送来的是十万，岑老板“打了七折”。许知川对上账簿，岑启明打给陈守义的是十五万。深夜，卢彩娣来说：那台电暖器，他修到快十一点。","date":"二〇一五年","mood":"cha"},{"n":16,"cn":"十六","title":"小本子","era":"","chars":1544,"mins":4,"html":"<p data-p=\"0\">正月初六上午，<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>把卷帘门拉起来一半，让我们弯腰进去。<\/p>\n<p data-p=\"1\">铺子里一股机油和冷灰的味道。柜台上的电饭煲、电风扇、收音机都还在原地，等着它们的主人回来拧最后一颗螺丝。那台电暖器搁在柜台角上，后盖拧得严严实实。<\/p>\n<p data-p=\"2\">技术员戴上手套，拿螺丝刀一颗一颗往下拧。一共八颗，他拧下来，排在一张报纸上，跟<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>平常排的一样整齐。<\/p>\n<p data-p=\"3\">后盖掀开，里面是发热管、温控器、一圈线。线圈和外壳之间，塞着一个塑料袋，袋口打着结。<\/p>\n<p data-p=\"4\">袋子里是一个巴掌大的小本子，封皮是蓝色的人造革，四个角磨得发白。<\/p>\n<p data-p=\"5\">卢彩娣站在门口，看着那个本子，嘴唇动了一下，什么也没说。<\/p>\n<p data-p=\"6\"><b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>把本子装进证物袋，递给我：“你看。你看得懂。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">我隔着证物袋，一页一页往后翻。<\/p>\n<p data-p=\"8\">最前面几十页，是九几年的字，铅笔写的，已经淡了：某月某日，三号机床，某某加班两小时；某月某日，扳手一把，借给<b class=\"rn\" data-c=\"hu\">胡国良<\/b>。后面没有“已还”。<\/p>\n<p data-p=\"9\">我想起老胡在活动室打牌的样子，差一点笑出来，又没笑出来。<\/p>\n<p data-p=\"10\">往后，是二〇一一年。四十八户，一户一行，名字，金额，日期，跟<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>那本登记簿一模一样。最后一行，单独写着：<\/p>\n<div class=\"doc note\"><p data-p=\"11\">四十八户，欠。<\/p><div class=\"blank\"><\/div><\/div>\n<p data-p=\"12\">再往后，二〇一三年开始，每年一页。头一页最上面写着：委托书四十八户签齐，原件交罗会计。底下是：催款函四十八封，一户一封，寄<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>老家的地址，挂号，邮费多少；回执四十八张，寄回各家收着。二〇一九年那一页，邮费涨了，他在旁边记了一笔：比去年多九块六。外地户那几行，地址改过好几回，旁边有小字：<b class=\"rn\" data-c=\"ge\">老葛<\/b>搬了，问他儿子要的新地址；某某回了四川，电话打了三次才通。<\/p>\n<p data-p=\"13\">十四年，一年没断。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"14\">二〇一五年那一页，是一个名单。<\/p>\n<p data-p=\"15\">许家，应家，钟家，俞家，邬家，胡国良。六个名字，第七行写着“老葛”，被划掉了，划了两道。<\/p>\n<p data-p=\"16\">那两道线划得很重，笔尖把纸都划毛了。<\/p>\n<p data-p=\"17\">老葛在汽车站上车之前说：剩下的那点钱，俺不急。他是真的不急吗？他儿子高中没读完，现在在哪个厂里打工，我都不知道。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"18\">再往后翻，是垫款。<\/p>\n<p data-p=\"19\">一笔一笔，日期、事由、金额。钟家，二〇一二年到二〇一四年，钟师傅化疗，五万五千。俞家，轮椅、护工，五万二千。邬家，小孩学费，三万六千。<\/p>\n<p data-p=\"20\">每一笔垫款的金额上，都有一道红线。<\/p>\n<p data-p=\"21\">钟家那一行，红笔写着：<span class=\"redpen\">冲五万，免五千。<\/span><\/p>\n<p data-p=\"22\">俞家：<span class=\"redpen\">冲五万，免二千。<\/span><\/p>\n<p data-p=\"23\">邬家：<span class=\"redpen\">冲三万，免六千。<\/span><\/p>\n<p data-p=\"24\">我在会计学里学过这个。红字冲销：一笔账记错了，或者要抵掉，就用红字再记一遍，正负相抵，账面归零。陈守义没学过会计。可他会。<\/p>\n<p data-p=\"25\">夹在这一页里，有一张折起来的纸。我隔着证物袋看不清，邵峻替我打开了：<span class=\"pencil\">五千，两千，六千，一万三千。<\/span><\/p>\n<p data-p=\"26\">我把罗维民那本账簿的照片打开，放在旁边。<\/p>\n<p data-p=\"27\">钟家，岑启明打来十五万，送去十万，冲五万。俞家，十五万，送去十万，冲五万。邬家，十万，送去七万，冲三万。<\/p>\n<p class=\"num\" data-p=\"28\">十三万。<\/p>\n<p data-p=\"29\">可<b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>记着的，是“岑老板只肯打七折，守义求了好几回”。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\">许家那一行，在垫款的最后。<\/p>\n<div class=\"doc note\"><p data-p=\"31\">二〇一四年九月，许家小孩学费，一万二。<\/p><div class=\"blank\"><\/div><\/div>\n<p data-p=\"32\">后面一个字：<span class=\"hand\">免。<\/span><\/p>\n<p data-p=\"33\">没有红线。<\/p>\n<p data-p=\"34\">我拿着证物袋站在柜台前面，没有动。<\/p>\n<p data-p=\"35\">二〇一四年九月，我大一，第一次一个人坐大巴去外地报到。学费是开学前一个礼拜打到卡上的。<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>说，是你守义叔想的办法。<\/p>\n<p data-p=\"36\">那一万二是真的。我的学费里，真的有一万二是他给的。<\/p>\n<p data-p=\"37\">它也是一行账。他记下了，然后免了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"38\">卢彩娣一直站在门口。邵峻转过去问她，二〇一五年那十万，是怎么还给她弟弟的。<\/p>\n<p data-p=\"39\">她扶着门框，过了很久才开口。<\/p>\n<p data-p=\"40\">“他拿回来一个信封，写着娘舅。”她说，“我问他哪里来的钱。他讲，是钟家他们还的。我就信了。”<\/p>\n<p data-p=\"41\">她低下头。<\/p>\n<p data-p=\"42\">“我也没问是怎么还的。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"43\">本子的最后几页，是今年的。<\/p>\n<p data-p=\"44\">腊月二十二：矿泉水两箱，三十六元。橘子一袋，二十元。那天早上在老厂门口，我亲眼看着他记的。<\/p>\n<p data-p=\"45\">同一天，下一行：盒饭五份，一份不辣，七十五元。<\/p>\n<p data-p=\"46\">再下面一行，是同一天的日期。日期后面，只写了一个字：<\/p>\n<div class=\"doc note big\"><p data-p=\"47\">岑。<\/p><div class=\"blank\"><\/div><div class=\"blank\"><\/div><\/div>\n<p data-p=\"48\">后面是空的。<\/p>\n<p class=\"last\" data-p=\"49\">我想起档案室那张稿纸。关于借款余额的说明。标题下面，只有一个“一”字，一个顿号。<\/p>","paras":["正月初六上午，卢彩娣把卷帘门拉起来一半，让我们弯腰进去。","铺子里一股机油和冷灰的味道。柜台上的电饭煲、电风扇、收音机都还在原地，等着它们的主人回来拧最后一颗螺丝。那台电暖器搁在柜台角上，后盖拧得严严实实。","技术员戴上手套，拿螺丝刀一颗一颗往下拧。一共八颗，他拧下来，排在一张报纸上，跟陈守义平常排的一样整齐。","后盖掀开，里面是发热管、温控器、一圈线。线圈和外壳之间，塞着一个塑料袋，袋口打着结。","袋子里是一个巴掌大的小本子，封皮是蓝色的人造革，四个角磨得发白。","卢彩娣站在门口，看着那个本子，嘴唇动了一下，什么也没说。","邵峻把本子装进证物袋，递给我：“你看。你看得懂。”","我隔着证物袋，一页一页往后翻。","最前面几十页，是九几年的字，铅笔写的，已经淡了：某月某日，三号机床，某某加班两小时；某月某日，扳手一把，借给胡国良。后面没有“已还”。","我想起老胡在活动室打牌的样子，差一点笑出来，又没笑出来。","往后，是二〇一一年。四十八户，一户一行，名字，金额，日期，跟罗维民那本登记簿一模一样。最后一行，单独写着：","四十八户，欠。","再往后，二〇一三年开始，每年一页。头一页最上面写着：委托书四十八户签齐，原件交罗会计。底下是：催款函四十八封，一户一封，寄岑启明老家的地址，挂号，邮费多少；回执四十八张，寄回各家收着。二〇一九年那一页，邮费涨了，他在旁边记了一笔：比去年多九块六。外地户那几行，地址改过好几回，旁边有小字：老葛搬了，问他儿子要的新地址；某某回了四川，电话打了三次才通。","十四年，一年没断。","二〇一五年那一页，是一个名单。","许家，应家，钟家，俞家，邬家，胡国良。六个名字，第七行写着“老葛”，被划掉了，划了两道。","那两道线划得很重，笔尖把纸都划毛了。","老葛在汽车站上车之前说：剩下的那点钱，俺不急。他是真的不急吗？他儿子高中没读完，现在在哪个厂里打工，我都不知道。","再往后翻，是垫款。","一笔一笔，日期、事由、金额。钟家，二〇一二年到二〇一四年，钟师傅化疗，五万五千。俞家，轮椅、护工，五万二千。邬家，小孩学费，三万六千。","每一笔垫款的金额上，都有一道红线。","钟家那一行，红笔写着：冲五万，免五千。","俞家：冲五万，免二千。","邬家：冲三万，免六千。","我在会计学里学过这个。红字冲销：一笔账记错了，或者要抵掉，就用红字再记一遍，正负相抵，账面归零。陈守义没学过会计。可他会。","夹在这一页里，有一张折起来的纸。我隔着证物袋看不清，邵峻替我打开了：五千，两千，六千，一万三千。","我把罗维民那本账簿的照片打开，放在旁边。","钟家，岑启明打来十五万，送去十万，冲五万。俞家，十五万，送去十万，冲五万。邬家，十万，送去七万，冲三万。","十三万。","可钟家老太记着的，是“岑老板只肯打七折，守义求了好几回”。","许家那一行，在垫款的最后。","二〇一四年九月，许家小孩学费，一万二。","后面一个字：免。","没有红线。","我拿着证物袋站在柜台前面，没有动。","二〇一四年九月，我大一，第一次一个人坐大巴去外地报到。学费是开学前一个礼拜打到卡上的。我妈说，是你守义叔想的办法。","那一万二是真的。我的学费里，真的有一万二是他给的。","它也是一行账。他记下了，然后免了。","卢彩娣一直站在门口。邵峻转过去问她，二〇一五年那十万，是怎么还给她弟弟的。","她扶着门框，过了很久才开口。","“他拿回来一个信封，写着娘舅。”她说，“我问他哪里来的钱。他讲，是钟家他们还的。我就信了。”","她低下头。","“我也没问是怎么还的。”","本子的最后几页，是今年的。","腊月二十二：矿泉水两箱，三十六元。橘子一袋，二十元。那天早上在老厂门口，我亲眼看着他记的。","同一天，下一行：盒饭五份，一份不辣，七十五元。","再下面一行，是同一天的日期。日期后面，只写了一个字：","岑。","后面是空的。","我想起档案室那张稿纸。关于借款余额的说明。标题下面，只有一个“一”字，一个顿号。"],"recap":"二〇一五年，岑启明凑出九十万，陈守义定名单。他自己欠着小舅子的十万，垫给钟、俞、邬三家的钱一笔没收回。十二月十七日夜里，他把九十万数了一遍，从三只信封里各抽出几扎，又装了一只写着“娘舅”的信封。","date":"正月初六","mood":"deng"},{"n":17,"cn":"十七","title":"钟家老太","era":"","chars":1693,"mins":4,"html":"<p data-p=\"0\">初七，假期结束了。我给公司发了邮件，把剩下的年假一次请完。财务总监回了一句：家里的事处理好再回来，账我们先替你做着。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>也在等。她在电话里说，父亲的后事办完了，那二百一十万，扣掉腊月二十二先付给<b class=\"rn\" data-c=\"ge\">老葛<\/b>的五万，剩下的她认，可她要一份能拿给律师看的核对报告，一户一户，谁借了多少，谁收过多少，谁还没收到。<\/p>\n<p data-p=\"2\">“我爸那天说，明天让各家自己说拿了多少。”她说，“他没等到。你替他问。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"3\">正月初十，我去了三塘边上的钟家。<\/p>\n<p data-p=\"4\"><b class=\"rn\" data-c=\"zhongsun\">钟家孙子<\/b>在门口等我，他过完年就要回学校，背包已经收拾好了，搁在门边。屋里很暗，八仙桌上供着老头的遗像，香炉里插着三根香，烟一直往上走。<\/p>\n<p data-p=\"5\">老太坐在桌边，穿着一件深蓝色的罩衫，袖口别着一根针。她耳朵背，孙子凑在她耳边，把我的来意说了一遍。<\/p>\n<p data-p=\"6\">她听完，起身进了里屋。过了好一会儿，抱出来一只铁皮饼干盒，跟<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>那只差不多，盖子上的花早磨掉了。<\/p>\n<p data-p=\"7\">盒子里是老头的病历，一本一本，用橡皮筋捆着。病历底下，压着一只牛皮纸信封，边角软了，口子拆开过。<\/p>\n<p data-p=\"8\">信封正面，是<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>的字：钟家　拾万。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">“那年守义送来的。”老太说，“十万，一张不少，当着我的面数的。”<\/p>\n<p data-p=\"10\">“奶奶，”我说，“当年你们家借给厂里的，是十五万。”<\/p>\n<p data-p=\"11\">她点点头：“我晓得。借据上写着的。”<\/p>\n<p data-p=\"12\">“那另外五万……”<\/p>\n<p data-p=\"13\">“守义讲，<b class=\"rn\" data-c=\"cenqiming\">岑老板<\/b>的钱不够。我一看，是打了七折，晓得是他去求下来的。”她看着那只信封，“厂都倒了，还能拿回来十万，我谢了守义好几年。”<\/p>\n<p data-p=\"14\">我把手机里<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>那页账的照片调出来，放大，递到她面前。第四行：钟德明，十五万。<\/p>\n<p data-p=\"15\">“奶奶，这是罗伯的账。”我说，“那年岑老板打给守义叔的，是十五万，没有打折。”<\/p>\n<p data-p=\"16\">孙子凑到她耳边，又说了一遍。<\/p>\n<p data-p=\"17\">老太把手机推回给我，没有说话。<\/p>\n<p data-p=\"18\">她把病历本一本一本拆开，翻到最后一本的封底。封底内侧，用圆珠笔写着一列数字，字歪歪扭扭，是老人的手写的：<\/p>\n<div class=\"doc medical\"><p data-p=\"19\">二〇一二年三月，守义送来，一万。<\/p><p data-p=\"20\">二〇一二年十月，一万五。<\/p><p data-p=\"21\">二〇一三年，两万。<\/p><p data-p=\"22\">二〇一四年正月，一万。<\/p><p data-p=\"23\">合计，<span class=\"scratch-t\">五万五<\/span>。<\/p><\/div>\n<p data-p=\"24\">“老头子化疗那两年，守义前前后后送来的。”老太说，“每回我讲，守义，这钱阿拉一定还你。他每回都讲，拿去用，不用还。”<\/p>\n<p data-p=\"25\" data-fx=\"scratch\">她用指甲在“五万五”那几个字底下划了一下。<\/p>\n<p data-p=\"26\">“我记着，不是为了算。是怕自己老糊涂了，忘了人家的好。”<\/p>\n<p data-p=\"27\">钟家孙子站在旁边，一句话也没有。<\/p>\n<p data-p=\"28\">“十五万，送到我手里十万。”老太把那只信封按在那一列数字旁边，“那就对了。守义拿回去五万，是他垫的钱。他还少拿了五千。”<\/p>\n<p data-p=\"29\">她把信封放回盒子里，把病历本一本一本码好。<\/p>\n<p data-p=\"30\">“他拿回去，是应该的。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"31\">我问她，年前岑老板有没有来过。<\/p>\n<p data-p=\"32\">“来过。腊月十几，提了一箱牛奶。”她说，“十几年没见了，人瘦了。我拉着他的手谢他，讲那年那十万，救了老头子的命，多活了三年。”<\/p>\n<p data-p=\"33\">“他怎么说？”<\/p>\n<p data-p=\"34\">“他愣了一下，问我：十万？我讲是啊，你钱不够，打了七折，是守义求了好几回才求下来的。”老太停住了，“他脸色一下子就不对了，坐了一会儿就走了，牛奶都没让我拆。”<\/p>\n<p data-p=\"35\">她看着我，眼睛浑浊，可看得很直。<\/p>\n<p data-p=\"36\">“许家儿子，是不是我讲错话了？”<\/p>\n<p data-p=\"37\">我没有回答。窗外有人家在放炮仗，是初十，有人家接灶神。香炉里那三根香，烧到了一半。<\/p>\n<p data-p=\"38\">腊月二十二下午四点，档案室的门关着，岑启明的手指在桌上点着，一下，一下，像在报数。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"39\">从钟家出来，我又去了俞家。<\/p>\n<p data-p=\"40\"><b class=\"rn\" data-c=\"yusao\">俞家媳妇<\/b>听我讲完，站在门口，脸一下子涨红了。<\/p>\n<p data-p=\"41\">“他就讲一句钱不够，我们就当是打了折……那五万是他自己拿了？”她的声音越来越高，“他垫的钱，我们又不是不认！他开口讲一声，阿拉卖房子也还他！为什么不讲？”<\/p>\n<p data-p=\"42\">轮椅上的老人醒了，问出了什么事。她转身进屋，把门关上了，门里还在骂，骂着骂着，没声了。<\/p>\n<p data-p=\"43\">邬家的门开得很慢。<b class=\"rn\" data-c=\"wudaughter\">邬家女人<\/b>听我讲到一半，就开始哭。她儿子今年考上了大学，门口那张红纸还贴着。<\/p>\n<p data-p=\"44\">“他给我们大女儿垫的学费，三万六。”她哭着说，“这些年，我们一直当是他白给的，过年过节都要送两只鸡过去。”<\/p>\n<p data-p=\"45\">她没说下去，用手背擦了擦眼睛，又说：“现在晓得了，是借的，也是还了的。”<\/p>\n<p data-p=\"46\">她把门轻轻关上了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"47\">傍晚，钟家孙子追到村口的公交站，把一个塑料袋塞给我，里面是两包他奶奶做的年糕。<\/p>\n<p data-p=\"48\">“我奶奶让你带给你妈。”他说，“还有一句话，让你带给守义叔。”<\/p>\n<p data-p=\"49\">公交车来了，车门开着，司机在按喇叭。<\/p>\n<p class=\"last\" data-p=\"50\">“她讲：你跟守义讲，我没怪过他。”<\/p>","paras":["初七，假期结束了。我给公司发了邮件，把剩下的年假一次请完。财务总监回了一句：家里的事处理好再回来，账我们先替你做着。","岑悦也在等。她在电话里说，父亲的后事办完了，那二百一十万，扣掉腊月二十二先付给老葛的五万，剩下的她认，可她要一份能拿给律师看的核对报告，一户一户，谁借了多少，谁收过多少，谁还没收到。","“我爸那天说，明天让各家自己说拿了多少。”她说，“他没等到。你替他问。”","正月初十，我去了三塘边上的钟家。","钟家孙子在门口等我，他过完年就要回学校，背包已经收拾好了，搁在门边。屋里很暗，八仙桌上供着老头的遗像，香炉里插着三根香，烟一直往上走。","老太坐在桌边，穿着一件深蓝色的罩衫，袖口别着一根针。她耳朵背，孙子凑在她耳边，把我的来意说了一遍。","她听完，起身进了里屋。过了好一会儿，抱出来一只铁皮饼干盒，跟我妈那只差不多，盖子上的花早磨掉了。","盒子里是老头的病历，一本一本，用橡皮筋捆着。病历底下，压着一只牛皮纸信封，边角软了，口子拆开过。","信封正面，是陈守义的字：钟家　拾万。","“那年守义送来的。”老太说，“十万，一张不少，当着我的面数的。”","“奶奶，”我说，“当年你们家借给厂里的，是十五万。”","她点点头：“我晓得。借据上写着的。”","“那另外五万……”","“守义讲，岑老板的钱不够。我一看，是打了七折，晓得是他去求下来的。”她看着那只信封，“厂都倒了，还能拿回来十万，我谢了守义好几年。”","我把手机里罗维民那页账的照片调出来，放大，递到她面前。第四行：钟德明，十五万。","“奶奶，这是罗伯的账。”我说，“那年岑老板打给守义叔的，是十五万，没有打折。”","孙子凑到她耳边，又说了一遍。","老太把手机推回给我，没有说话。","她把病历本一本一本拆开，翻到最后一本的封底。封底内侧，用圆珠笔写着一列数字，字歪歪扭扭，是老人的手写的：","二〇一二年三月，守义送来，一万。","二〇一二年十月，一万五。","二〇一三年，两万。","二〇一四年正月，一万。","合计，五万五。","“老头子化疗那两年，守义前前后后送来的。”老太说，“每回我讲，守义，这钱阿拉一定还你。他每回都讲，拿去用，不用还。”","她用指甲在“五万五”那几个字底下划了一下。","“我记着，不是为了算。是怕自己老糊涂了，忘了人家的好。”","钟家孙子站在旁边，一句话也没有。","“十五万，送到我手里十万。”老太把那只信封按在那一列数字旁边，“那就对了。守义拿回去五万，是他垫的钱。他还少拿了五千。”","她把信封放回盒子里，把病历本一本一本码好。","“他拿回去，是应该的。”","我问她，年前岑老板有没有来过。","“来过。腊月十几，提了一箱牛奶。”她说，“十几年没见了，人瘦了。我拉着他的手谢他，讲那年那十万，救了老头子的命，多活了三年。”","“他怎么说？”","“他愣了一下，问我：十万？我讲是啊，你钱不够，打了七折，是守义求了好几回才求下来的。”老太停住了，“他脸色一下子就不对了，坐了一会儿就走了，牛奶都没让我拆。”","她看着我，眼睛浑浊，可看得很直。","“许家儿子，是不是我讲错话了？”","我没有回答。窗外有人家在放炮仗，是初十，有人家接灶神。香炉里那三根香，烧到了一半。","腊月二十二下午四点，档案室的门关着，岑启明的手指在桌上点着，一下，一下，像在报数。","从钟家出来，我又去了俞家。","俞家媳妇听我讲完，站在门口，脸一下子涨红了。","“他就讲一句钱不够，我们就当是打了折……那五万是他自己拿了？”她的声音越来越高，“他垫的钱，我们又不是不认！他开口讲一声，阿拉卖房子也还他！为什么不讲？”","轮椅上的老人醒了，问出了什么事。她转身进屋，把门关上了，门里还在骂，骂着骂着，没声了。","邬家的门开得很慢。邬家女人听我讲到一半，就开始哭。她儿子今年考上了大学，门口那张红纸还贴着。","“他给我们大女儿垫的学费，三万六。”她哭着说，“这些年，我们一直当是他白给的，过年过节都要送两只鸡过去。”","她没说下去，用手背擦了擦眼睛，又说：“现在晓得了，是借的，也是还了的。”","她把门轻轻关上了。","傍晚，钟家孙子追到村口的公交站，把一个塑料袋塞给我，里面是两包他奶奶做的年糕。","“我奶奶让你带给你妈。”他说，“还有一句话，让你带给守义叔。”","公交车来了，车门开着，司机在按喇叭。","“她讲：你跟守义讲，我没怪过他。”"],"recap":"电暖器里藏着陈守义的小本子：十四年的催款函，一笔笔垫款，红线冲销，一个“免”字。二〇一五年的名单里，老葛被划掉了两道。最后几页写着：岑。后面是空的。","date":"正月初十","mood":"deng"},{"n":18,"cn":"十八","title":"母亲那一行","era":"","chars":1733,"mins":4,"html":"<p data-p=\"0\">正月十一，我在<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>家的饭桌上开始写那份报告。<\/p>\n<p data-p=\"1\">饭桌是我写了九年作业的那张。桌面上有一道划痕，是我初三那年用圆规划的，我妈拿抹布擦了好几年，越擦越亮。<\/p>\n<p data-p=\"2\">报告要给三个地方：<b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>和她的律师，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>，还有工友群。四十八户，每一户都要看到自己那一行，确认无误，自己签字。<\/p>\n<p data-p=\"3\">我先画了一张表。四十八行，七列：户名，借款人，二〇一一年借款金额，二〇一五年已还，实际到户，本次应付，备注。<\/p>\n<p data-p=\"4\">前面四十二行，写得很快。都是一样的：二〇一五年已还，零；实际到户，零；本次应付，等于借款金额。只有<b class=\"rn\" data-c=\"ge\">老葛<\/b>那一行，备注里多了一句：腊月二十二已先付五万，本次应付一万。<\/p>\n<p data-p=\"5\">然后是六户。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"6\">应家，<b class=\"rn\" data-c=\"yingguoqing\">应国庆<\/b>，十五万，已还十五万，实际到户十五万，本次应付零。<\/p>\n<p data-p=\"7\"><b class=\"rn\" data-c=\"hu\">胡国良<\/b>，十五万，十五万，十五万，零。<\/p>\n<p data-p=\"8\">钟家，钟德明，十五万，已还十五万，实际到户十万。<\/p>\n<p data-p=\"9\">写到“实际到户”这一列，我停了一下，在备注里写：差额五万，见附注一。<\/p>\n<p data-p=\"10\">俞家，十五万，十五万，十万，见附注一。邬家，十万，十万，七万，见附注一。<\/p>\n<p data-p=\"11\">然后是许家。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">我手边有两支笔，一支铅笔，一支红笔。红笔是从我妈的针线盒里找出来的，平常她用来给食堂的菜单画圈。<\/p>\n<p data-p=\"13\">这一行，我得先改一笔旧账。<\/p>\n<p data-p=\"14\">腊月二十六早上七点十二分，我交给邵峻的那张表上，许家这一行写的是：戴秀琴，二〇一一年三月，二十万，原件，未还。后来我改过一次，可那张表已经交出去了，邵峻那里有，岑悦那里也有。<\/p>\n<p data-p=\"15\">账记错了，改的办法有好几种。最省事的，是在错的那一笔上划一道线，旁边写上对的。我这份是报告，不是账簿，本来用不着别的。可我选了最麻烦的那一种：用红字把原来那一笔原样再记一遍，正负相抵，再另起一行，把对的记上。这样以后谁来翻，都看得出错在哪里、改在哪里。<\/p>\n<p data-p=\"16\">我拿起红笔，在许家那一行上面，另起一行，写：<\/p>\n<div class=\"doc entry red\"><p data-p=\"17\">戴秀琴，二十万，未还。<\/p><\/div>\n<p class=\"beat red\" data-p=\"18\">红字。<\/p>\n<p data-p=\"19\">我妈从厨房出来，手里端着一碗汤圆，正月里，是芝麻馅的。她走到桌边，看见那一行红字，站住了。<\/p>\n<p data-p=\"20\">红笔写名字不吉利。这是她说了三十年的话。我从小到大，核账也好，写作业也好，从来没用红笔写过一个人的名字。<\/p>\n<p data-p=\"21\">她把汤圆放在桌角，没有说话。<\/p>\n<p data-p=\"22\">我在红字底下，用铅笔写对的那一行：<\/p>\n<div class=\"doc entry pencil\"><p data-p=\"23\">许家，戴秀琴，借款二十万；二〇一五年十二月十八日已还二十万，实际到户二十万；本次应付，零。备注：经手人陈守义、罗维民，收条原件附后。<\/p><\/div>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"24\">附注我写了两条。<\/p>\n<p class=\"fn\" data-p=\"25\"><b>附注一：<\/b>二〇一五年十二月，岑启明分六笔向陈守义汇款九十万，委托其转交六户。经核对，实际到户七十七万。差额十三万，系陈守义以此前为钟家、俞家、邬家垫付的医药费、护理费、学费冲抵，冲抵时三户不知情，收条只写“已全部结清”，未写金额。陈守义另免除三户垫款零头共一万三千元。<\/p>\n<p class=\"fn slow\" data-p=\"26\"><b>附注二：<\/b>二〇一四年九月，陈守义为许家垫付学费一万二千元。该笔未还，陈守义本人记录为“免”。<\/p>\n<p data-p=\"27\">写附注二的时候，我写得很慢。这一条，跟<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>的账没有关系，跟四十八户也没有关系。它不写，谁也不知道。<\/p>\n<p data-p=\"28\">我写了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"29\">正月十二，老胡打来电话。<\/p>\n<p data-p=\"30\">“<b class=\"rn\" data-c=\"zhichuan\">许会计<\/b>，那张表，听讲你要发群里？”<\/p>\n<p data-p=\"31\">“要发。每户都要自己核，自己签。”<\/p>\n<p data-p=\"32\">“我那一行……‘实际到户’那一列，能不能不写？就写个已还，不要写十五万。人家一看，我拿足了，钟家、俞家打了七折……”<\/p>\n<p data-p=\"33\">“胡叔，那一列每户都有。”<\/p>\n<p data-p=\"34\">他沉默了一会儿，又问：“听讲<b class=\"rn\" data-c=\"shouyi\">守义<\/b>那个本子上，还记着我九八年借的一把扳手？”<\/p>\n<p data-p=\"35\">“记着。后面没写还。”<\/p>\n<p data-p=\"36\">电话那头，老胡骂了一句什么，听不清，然后笑了一声，笑得很难听：“那把扳手，早就生锈了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"37\">正月十三，<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>来了。他站在楼梯口，没上来，手里拎着一袋年糕。<\/p>\n<p data-p=\"38\">“应家那一行，”他说，“写进去，我老婆又要哭一场。”<\/p>\n<p data-p=\"39\">“罗伯，你的账上，那一行也写着。”<\/p>\n<p data-p=\"40\">他点点头，把年糕递给我，转身下楼。走到一半，又回过头：“附注写得好。账要两头对，你做到了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">正月十四夜里，报告写完了。十一页，四十八行，两条附注，后面附着十九张收条和借据的照片。<\/p>\n<p data-p=\"42\">我把它从头到尾核了一遍，又核了一遍。借款金额那一列，加起来是三百万。二〇一五年已还九十万，其中实际到户七十七万，冲抵十三万；这次应付二百零五万；腊月二十二先付给老葛五万。三笔加起来，还是三百万。<\/p>\n<p data-p=\"43\">我妈一直坐在饭桌对面，没睡。她半夜煮的那碗汤圆早就凉了，也没去热。<\/p>\n<p data-p=\"44\">快十二点的时候，她站起来，进了房间。过了一会儿出来，手里抱着那只饼干铁盒。<\/p>\n<p data-p=\"45\">她把铁盒放在报告旁边，推到我面前。<\/p>\n<p class=\"last\" data-p=\"46\">“原件，”她说，“你都附上。”<\/p>","paras":["正月十一，我在我妈家的饭桌上开始写那份报告。","饭桌是我写了九年作业的那张。桌面上有一道划痕，是我初三那年用圆规划的，我妈拿抹布擦了好几年，越擦越亮。","报告要给三个地方：岑悦和她的律师，邵峻，还有工友群。四十八户，每一户都要看到自己那一行，确认无误，自己签字。","我先画了一张表。四十八行，七列：户名，借款人，二〇一一年借款金额，二〇一五年已还，实际到户，本次应付，备注。","前面四十二行，写得很快。都是一样的：二〇一五年已还，零；实际到户，零；本次应付，等于借款金额。只有老葛那一行，备注里多了一句：腊月二十二已先付五万，本次应付一万。","然后是六户。","应家，应国庆，十五万，已还十五万，实际到户十五万，本次应付零。","胡国良，十五万，十五万，十五万，零。","钟家，钟德明，十五万，已还十五万，实际到户十万。","写到“实际到户”这一列，我停了一下，在备注里写：差额五万，见附注一。","俞家，十五万，十五万，十万，见附注一。邬家，十万，十万，七万，见附注一。","然后是许家。","我手边有两支笔，一支铅笔，一支红笔。红笔是从我妈的针线盒里找出来的，平常她用来给食堂的菜单画圈。","这一行，我得先改一笔旧账。","腊月二十六早上七点十二分，我交给邵峻的那张表上，许家这一行写的是：戴秀琴，二〇一一年三月，二十万，原件，未还。后来我改过一次，可那张表已经交出去了，邵峻那里有，岑悦那里也有。","账记错了，改的办法有好几种。最省事的，是在错的那一笔上划一道线，旁边写上对的。我这份是报告，不是账簿，本来用不着别的。可我选了最麻烦的那一种：用红字把原来那一笔原样再记一遍，正负相抵，再另起一行，把对的记上。这样以后谁来翻，都看得出错在哪里、改在哪里。","我拿起红笔，在许家那一行上面，另起一行，写：","戴秀琴，二十万，未还。","红字。","我妈从厨房出来，手里端着一碗汤圆，正月里，是芝麻馅的。她走到桌边，看见那一行红字，站住了。","红笔写名字不吉利。这是她说了三十年的话。我从小到大，核账也好，写作业也好，从来没用红笔写过一个人的名字。","她把汤圆放在桌角，没有说话。","我在红字底下，用铅笔写对的那一行：","许家，戴秀琴，借款二十万；二〇一五年十二月十八日已还二十万，实际到户二十万；本次应付，零。备注：经手人陈守义、罗维民，收条原件附后。","附注我写了两条。","附注一：二〇一五年十二月，岑启明分六笔向陈守义汇款九十万，委托其转交六户。经核对，实际到户七十七万。差额十三万，系陈守义以此前为钟家、俞家、邬家垫付的医药费、护理费、学费冲抵，冲抵时三户不知情，收条只写“已全部结清”，未写金额。陈守义另免除三户垫款零头共一万三千元。","附注二：二〇一四年九月，陈守义为许家垫付学费一万二千元。该笔未还，陈守义本人记录为“免”。","写附注二的时候，我写得很慢。这一条，跟岑启明的账没有关系，跟四十八户也没有关系。它不写，谁也不知道。","我写了。","正月十二，老胡打来电话。","“许会计，那张表，听讲你要发群里？”","“要发。每户都要自己核，自己签。”","“我那一行……‘实际到户’那一列，能不能不写？就写个已还，不要写十五万。人家一看，我拿足了，钟家、俞家打了七折……”","“胡叔，那一列每户都有。”","他沉默了一会儿，又问：“听讲守义那个本子上，还记着我九八年借的一把扳手？”","“记着。后面没写还。”","电话那头，老胡骂了一句什么，听不清，然后笑了一声，笑得很难听：“那把扳手，早就生锈了。”","正月十三，罗维民来了。他站在楼梯口，没上来，手里拎着一袋年糕。","“应家那一行，”他说，“写进去，我老婆又要哭一场。”","“罗伯，你的账上，那一行也写着。”","他点点头，把年糕递给我，转身下楼。走到一半，又回过头：“附注写得好。账要两头对，你做到了。”","正月十四夜里，报告写完了。十一页，四十八行，两条附注，后面附着十九张收条和借据的照片。","我把它从头到尾核了一遍，又核了一遍。借款金额那一列，加起来是三百万。二〇一五年已还九十万，其中实际到户七十七万，冲抵十三万；这次应付二百零五万；腊月二十二先付给老葛五万。三笔加起来，还是三百万。","我妈一直坐在饭桌对面，没睡。她半夜煮的那碗汤圆早就凉了，也没去热。","快十二点的时候，她站起来，进了房间。过了一会儿出来，手里抱着那只饼干铁盒。","她把铁盒放在报告旁边，推到我面前。","“原件，”她说，“你都附上。”"],"recap":"钟家老太从病历本封底内侧翻出一列数字：守义送来五万五，十五万里拿回五万。她说，拿回去是应该的。腊月里，岑启明去看过她，听到“十万”，脸色变了。她让带话：我没怪过他。","date":"正月十一","mood":"deng"},{"n":19,"cn":"十九","title":"各自签字","era":"","chars":2788,"mins":7,"html":"<p data-p=\"0\">元宵节早上八点，我把报告发进了群里。<\/p>\n<p data-p=\"1\">十一页，一个PDF。我在下面加了一句：每户请核对自己那一行，有不对的，直接跟我讲。<\/p>\n<p data-p=\"2\">群里静了很久。<\/p>\n<p data-p=\"3\">第一个回的是金彩凤的儿子：<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>那一行，对的。<\/p>\n<p data-p=\"4\">然后是<b class=\"rn\" data-c=\"zhongsun\">钟家孙子<\/b>：附注一，我念给我奶奶听了，她讲，对的。<\/p>\n<p data-p=\"5\">应家的头像亮了一下，发了两个字：对的。<\/p>\n<p data-p=\"6\"><b class=\"rn\" data-c=\"hu\">老胡<\/b>隔了一个钟头才回：对的。后面又跟了一句：扳手过两天还。<\/p>\n<p data-p=\"7\">有人发了一个笑脸，又撤回了。<\/p>\n<p data-p=\"8\">外地户那边，回得最慢。快中午的时候，<b class=\"rn\" data-c=\"ge\">老葛<\/b>的儿子发来一段语音，安徽口音，说他念给他爸听了，他爸讲，一万块，对的，不急。<\/p>\n<p data-p=\"9\">到晚上，四十八户里，回了三十一户。没有一户说不对。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"10\">那天上午，我妈去了菜场。<\/p>\n<p data-p=\"11\">她出门前换了一件干净的外套，在镜子前面站了一会儿，把头发重新梳了一遍。<\/p>\n<p data-p=\"12\">我在楼上的窗口看着她走出老街。快中午她回来了，篮子里是两把青菜、一条带鱼、一块豆腐。<\/p>\n<p data-p=\"13\">“碰到谁了？”我问。<\/p>\n<p data-p=\"14\">“碰到好几个。”她把菜放进水池，“有的人讲话，有的人不讲话。金彩凤拉着我讲了半天，讲她儿子在苏州又换工作了。”<\/p>\n<p data-p=\"15\">她拧开水龙头，水哗哗地响。<\/p>\n<p data-p=\"16\">“卖鱼的老王，多送了我一根葱。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">二月初，<b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>带着律师来了上林。<\/p>\n<p data-p=\"18\">签字定在社区居委会的会议室，不是老厂。岑悦说，她不想再去那栋楼。<\/p>\n<p data-p=\"19\">律师四十多岁，戴一副无框眼镜，把报告翻得很仔细。翻到最后，他抬起头：“按规矩，这些借款早就过了诉讼时效，继承人可以不认。”<\/p>\n<p data-p=\"20\">岑悦没说话。<\/p>\n<p data-p=\"21\">“可是这里有十四年的催款函。”律师从包里拿出一沓复印件，是<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>帮着从各家找出来的，挂号信的回执，一年一张，“每年都催过，时效每年都断一次。这笔债，在法律上一直是活的。”<\/p>\n<p data-p=\"22\">我想起那个小本子。二〇一九年那一页：邮费，比去年多九块六。<\/p>\n<p data-p=\"23\">岑悦翻开报告第一页。第一页最上面一行，是我按她的要求写的：<\/p>\n<p data-p=\"24\">二〇一五年十二月，<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>已偿还六户借款本金九十万元，有转账记录为证。<\/p>\n<p data-p=\"25\">她的手指在“已偿还”三个字上按住，过了好一会儿才松开。<\/p>\n<p data-p=\"26\">“我爸的账，我认。”她说，“二百零五万，从遗产里付。”<\/p>\n<p data-p=\"27\">她在继承人那一栏签了字，签完，把笔放下，没有抬头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"28\">签字签了三个礼拜。<\/p>\n<p data-p=\"29\">规矩是律师定的：每户本人来，核对自己那一行，在“本人核对无误”后面签名，按手印。不能代签。<\/p>\n<p data-p=\"30\">本地的工友，大多是自己来的。年纪大的，儿女陪着。有人签得很快，有人签之前要我把那一行念三遍。有一个老师傅，签完了又要回笔，在自己名字后面添了一个“已”字，说是怕人家看不出来他签过了。<\/p>\n<p data-p=\"31\"><b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>是她孙子扶着来的。她签字的手抖得厉害，一个“钟”字写了半天。签完，她没走，问律师：“<b class=\"rn\" data-c=\"shouyi\">守义<\/b>拿回去的那五万，要我追吗？”<\/p>\n<p data-p=\"32\">律师说，那是刑事案子里的事，到时候法院会问您。<\/p>\n<p data-p=\"33\">“到时候再讲。”老太说。<\/p>\n<p data-p=\"34\"><b class=\"rn\" data-c=\"yusao\">俞家媳妇<\/b>签得很用力，纸背上都印出了字。邬家来的是那个大女儿，她签完，站着看了一会儿附注一，然后把报告翻过去，扣在桌上。<\/p>\n<p data-p=\"35\"><b class=\"rn\" data-c=\"yingguoqing\">应国庆<\/b>是一个人来的。他签完自己那一行，没有走，坐在门口的长凳上等。<\/p>\n<p data-p=\"36\">罗维民来得晚，快十一点才到。他要签的不是借款人那一栏，是经手人。二〇一五年那六笔，每一笔后面，都要他再签一次名字，证明钱是从哪里来、到哪里去的。<\/p>\n<p data-p=\"37\">他进门的时候，外套的扣子扣错了一粒。<\/p>\n<p data-p=\"38\">“来晚了。”他说，“家里那个，不让出门。”<\/p>\n<p data-p=\"39\">应国庆站起来，看了他一眼，转过来跟我说：“我姐早上讲，签了，我们家那十五万就白纸黑字摆在四十八户面前了。”他停了一下，“我跟她讲，姐，账上写着的，都是真的。”<\/p>\n<p data-p=\"40\">罗维民坐下来，在六个“经手人”后面，一个一个签上自己的名字。签到第六个，他把笔帽盖上，又打开，把最后一笔重新描了一遍。<\/p>\n<p data-p=\"41\">老胡来的时候，拎着一个塑料袋。他签完字，把袋子放在桌上，里面是一把扳手，锈得发红。<\/p>\n<p data-p=\"42\">“守义的。”他说，“等他出来，你交给他。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"43\">外地的十四户，签得最难。<\/p>\n<p data-p=\"44\">律师要视频核对，再把签好字的纸寄回来。有的人在工地上，背景里全是机器声；有的人在流水线上，休息十分钟，对着手机把那一行念一遍；有一个四川的工友，视频接通了，屏幕里是他八十岁的老娘，他人在新疆，信号断了三回。<\/p>\n<p data-p=\"45\">老葛不肯视频。他坐了一夜的车，自己来了。<\/p>\n<p data-p=\"46\">他儿子陪着。那个当年在倒扣的纸箱上写作业的孩子，现在三十岁了，比我高半个头，手很粗，指关节上有几道旧口子。他在苏州一个电子厂里，带一条线。<\/p>\n<p data-p=\"47\">老葛不太会写字，儿子替他把名字写在旁边，老葛自己按了手印。按完，他看着那一行，用手指头一个字一个字地点过去：借款六万，已付五万，本次应付一万。<\/p>\n<p data-p=\"48\">“对的。”他说。<\/p>\n<p data-p=\"49\">他儿子在见证人那一栏签了名，签得很快，一笔下来，像在流水线上贴标签。<\/p>\n<p data-p=\"50\">签完，他把笔递给我，看了我一眼：“你就是许家那个，读大学的？”<\/p>\n<p data-p=\"51\">“是。”<\/p>\n<p data-p=\"52\">“我爸讲过你。”他说，“讲你小时候算术好。”<\/p>\n<p data-p=\"53\">他把笔帽盖上，扶着老葛出了门。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"54\">晚饭是在我家吃的。<\/p>\n<p data-p=\"55\">他儿子签完字就去赶车了，苏州那边夜里还有一个班。老葛本来也要跟着走，我妈听说他来了，叫我去车站把他拦了回来。<\/p>\n<p data-p=\"56\">饭桌上摆了六个菜，中间一锅黄鱼年糕汤。我妈拿出两只碗，一只是好的，一只是那只碗沿有缺口的青瓷碗。她把好的那只推到老葛面前，自己端起了那只缺口的。<\/p>\n<p data-p=\"57\">老葛看着面前那只碗，没有动。<\/p>\n<p data-p=\"58\">“戴师傅。”他说。<\/p>\n<p data-p=\"59\">我妈放下筷子。<\/p>\n<p data-p=\"60\">“那年你家先拿了钱，俺晓得了。”老葛说，“老许那时候在医院透析，一个礼拜三回。换了俺，俺也拿。”<\/p>\n<p data-p=\"61\">“那年你儿子……”我妈说到一半，说不下去了。<\/p>\n<p data-p=\"62\">“他书没读完，不怪你家。”老葛说，“怪那几年。”<\/p>\n<p data-p=\"63\">他从蛇皮袋里掏出一包苔干，放在桌上，推到我妈面前，然后站了起来。<\/p>\n<p data-p=\"64\">“戴师傅，饭俺就不吃了。”他说，“等明年吧。”<\/p>\n<p data-p=\"65\">他拎起蛇皮袋，出了门。楼道里他的脚步声，一级一级，往下去了。<\/p>\n<p data-p=\"66\">我妈坐在那里，面前是那只缺口的青瓷碗，碗里是空的。桌子对面，那只好碗也是空的。中间那锅黄鱼年糕汤，还冒着热气。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"67\">四十八户里，最后一户的签字，是律师从看守所带回来的。<\/p>\n<p data-p=\"68\">陈守义那一行：借款十五万，二〇一五年已还，零；本次应付，十五万。<\/p>\n<p data-p=\"69\">“本人核对无误”后面，是他的名字。字还是那么工整，一笔一画，像他记账。<\/p>\n<p data-p=\"70\">名字底下，多了一行小字，也是他的笔迹：<\/p>\n<div class=\"doc sign\"><p data-p=\"71\">本户应付十五万，其中五万转付钟家，五万转付俞家，三万转付邬家。<\/p><\/div>\n<p data-p=\"72\">再底下，还有两个字：<\/p>\n<div class=\"doc sign big\"><p data-p=\"73\">零头免。<\/p><\/div>\n<p data-p=\"74\">律师问过他，“零头免”是什么意思。他说：当年免掉的那一万三，还是免。律师又说，这几行是陈守义自己要求加的，他问过，这样写在法律上算主动退赔，对量刑有好处。陈守义说，他不是为了这个。<\/p>\n<p data-p=\"75\">那天晚上，我把陈守义这一户，单独算了一遍。<\/p>\n<p data-p=\"76\">二〇一一年，借给厂里十五万，里面有十万，是向<b class=\"rn\" data-c=\"zhigang\">小舅子<\/b>借的。<\/p>\n<p data-p=\"77\">二〇一二年到二〇一四年，垫钟家五万五，俞家五万二，邬家三万六，许家一万二，合计十五万五。<\/p>\n<p data-p=\"78\">二〇一五年，冲回十三万。其中十万，装在写着“娘舅”的信封里，还了小舅子。<\/p>\n<p data-p=\"79\">今年，本户应付十五万，转付钟家、俞家、邬家十三万，零头免。<\/p>\n<p data-p=\"80\">进出相抵，这一户少了十五万五千，正好是他这些年垫出去的数。<\/p>\n<p data-p=\"81\">十四年的催款函，邮费都记在小本子上，没有算进来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"82\">三月底，四十八户都签完了。<\/p>\n<p data-p=\"83\">我把签字页一张一张扫描，排在报告后面。四十八个名字，四十八个手印，没有一个是别人代签的。<\/p>\n<p data-p=\"84\">那天晚上，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>打来电话。<\/p>\n<p class=\"last\" data-p=\"85\">“开庭定了，”他说，“六月。”<\/p>","paras":["元宵节早上八点，我把报告发进了群里。","十一页，一个PDF。我在下面加了一句：每户请核对自己那一行，有不对的，直接跟我讲。","群里静了很久。","第一个回的是金彩凤的儿子：我妈那一行，对的。","然后是钟家孙子：附注一，我念给我奶奶听了，她讲，对的。","应家的头像亮了一下，发了两个字：对的。","老胡隔了一个钟头才回：对的。后面又跟了一句：扳手过两天还。","有人发了一个笑脸，又撤回了。","外地户那边，回得最慢。快中午的时候，老葛的儿子发来一段语音，安徽口音，说他念给他爸听了，他爸讲，一万块，对的，不急。","到晚上，四十八户里，回了三十一户。没有一户说不对。","那天上午，我妈去了菜场。","她出门前换了一件干净的外套，在镜子前面站了一会儿，把头发重新梳了一遍。","我在楼上的窗口看着她走出老街。快中午她回来了，篮子里是两把青菜、一条带鱼、一块豆腐。","“碰到谁了？”我问。","“碰到好几个。”她把菜放进水池，“有的人讲话，有的人不讲话。金彩凤拉着我讲了半天，讲她儿子在苏州又换工作了。”","她拧开水龙头，水哗哗地响。","“卖鱼的老王，多送了我一根葱。”","二月初，岑悦带着律师来了上林。","签字定在社区居委会的会议室，不是老厂。岑悦说，她不想再去那栋楼。","律师四十多岁，戴一副无框眼镜，把报告翻得很仔细。翻到最后，他抬起头：“按规矩，这些借款早就过了诉讼时效，继承人可以不认。”","岑悦没说话。","“可是这里有十四年的催款函。”律师从包里拿出一沓复印件，是罗维民帮着从各家找出来的，挂号信的回执，一年一张，“每年都催过，时效每年都断一次。这笔债，在法律上一直是活的。”","我想起那个小本子。二〇一九年那一页：邮费，比去年多九块六。","岑悦翻开报告第一页。第一页最上面一行，是我按她的要求写的：","二〇一五年十二月，岑启明已偿还六户借款本金九十万元，有转账记录为证。","她的手指在“已偿还”三个字上按住，过了好一会儿才松开。","“我爸的账，我认。”她说，“二百零五万，从遗产里付。”","她在继承人那一栏签了字，签完，把笔放下，没有抬头。","签字签了三个礼拜。","规矩是律师定的：每户本人来，核对自己那一行，在“本人核对无误”后面签名，按手印。不能代签。","本地的工友，大多是自己来的。年纪大的，儿女陪着。有人签得很快，有人签之前要我把那一行念三遍。有一个老师傅，签完了又要回笔，在自己名字后面添了一个“已”字，说是怕人家看不出来他签过了。","钟家老太是她孙子扶着来的。她签字的手抖得厉害，一个“钟”字写了半天。签完，她没走，问律师：“守义拿回去的那五万，要我追吗？”","律师说，那是刑事案子里的事，到时候法院会问您。","“到时候再讲。”老太说。","俞家媳妇签得很用力，纸背上都印出了字。邬家来的是那个大女儿，她签完，站着看了一会儿附注一，然后把报告翻过去，扣在桌上。","应国庆是一个人来的。他签完自己那一行，没有走，坐在门口的长凳上等。","罗维民来得晚，快十一点才到。他要签的不是借款人那一栏，是经手人。二〇一五年那六笔，每一笔后面，都要他再签一次名字，证明钱是从哪里来、到哪里去的。","他进门的时候，外套的扣子扣错了一粒。","“来晚了。”他说，“家里那个，不让出门。”","应国庆站起来，看了他一眼，转过来跟我说：“我姐早上讲，签了，我们家那十五万就白纸黑字摆在四十八户面前了。”他停了一下，“我跟她讲，姐，账上写着的，都是真的。”","罗维民坐下来，在六个“经手人”后面，一个一个签上自己的名字。签到第六个，他把笔帽盖上，又打开，把最后一笔重新描了一遍。","老胡来的时候，拎着一个塑料袋。他签完字，把袋子放在桌上，里面是一把扳手，锈得发红。","“守义的。”他说，“等他出来，你交给他。”","外地的十四户，签得最难。","律师要视频核对，再把签好字的纸寄回来。有的人在工地上，背景里全是机器声；有的人在流水线上，休息十分钟，对着手机把那一行念一遍；有一个四川的工友，视频接通了，屏幕里是他八十岁的老娘，他人在新疆，信号断了三回。","老葛不肯视频。他坐了一夜的车，自己来了。","他儿子陪着。那个当年在倒扣的纸箱上写作业的孩子，现在三十岁了，比我高半个头，手很粗，指关节上有几道旧口子。他在苏州一个电子厂里，带一条线。","老葛不太会写字，儿子替他把名字写在旁边，老葛自己按了手印。按完，他看着那一行，用手指头一个字一个字地点过去：借款六万，已付五万，本次应付一万。","“对的。”他说。","他儿子在见证人那一栏签了名，签得很快，一笔下来，像在流水线上贴标签。","签完，他把笔递给我，看了我一眼：“你就是许家那个，读大学的？”","“是。”","“我爸讲过你。”他说，“讲你小时候算术好。”","他把笔帽盖上，扶着老葛出了门。","晚饭是在我家吃的。","他儿子签完字就去赶车了，苏州那边夜里还有一个班。老葛本来也要跟着走，我妈听说他来了，叫我去车站把他拦了回来。","饭桌上摆了六个菜，中间一锅黄鱼年糕汤。我妈拿出两只碗，一只是好的，一只是那只碗沿有缺口的青瓷碗。她把好的那只推到老葛面前，自己端起了那只缺口的。","老葛看着面前那只碗，没有动。","“戴师傅。”他说。","我妈放下筷子。","“那年你家先拿了钱，俺晓得了。”老葛说，“老许那时候在医院透析，一个礼拜三回。换了俺，俺也拿。”","“那年你儿子……”我妈说到一半，说不下去了。","“他书没读完，不怪你家。”老葛说，“怪那几年。”","他从蛇皮袋里掏出一包苔干，放在桌上，推到我妈面前，然后站了起来。","“戴师傅，饭俺就不吃了。”他说，“等明年吧。”","他拎起蛇皮袋，出了门。楼道里他的脚步声，一级一级，往下去了。","我妈坐在那里，面前是那只缺口的青瓷碗，碗里是空的。桌子对面，那只好碗也是空的。中间那锅黄鱼年糕汤，还冒着热气。","四十八户里，最后一户的签字，是律师从看守所带回来的。","陈守义那一行：借款十五万，二〇一五年已还，零；本次应付，十五万。","“本人核对无误”后面，是他的名字。字还是那么工整，一笔一画，像他记账。","名字底下，多了一行小字，也是他的笔迹：","本户应付十五万，其中五万转付钟家，五万转付俞家，三万转付邬家。","再底下，还有两个字：","零头免。","律师问过他，“零头免”是什么意思。他说：当年免掉的那一万三，还是免。律师又说，这几行是陈守义自己要求加的，他问过，这样写在法律上算主动退赔，对量刑有好处。陈守义说，他不是为了这个。","那天晚上，我把陈守义这一户，单独算了一遍。","二〇一一年，借给厂里十五万，里面有十万，是向小舅子借的。","二〇一二年到二〇一四年，垫钟家五万五，俞家五万二，邬家三万六，许家一万二，合计十五万五。","二〇一五年，冲回十三万。其中十万，装在写着“娘舅”的信封里，还了小舅子。","今年，本户应付十五万，转付钟家、俞家、邬家十三万，零头免。","进出相抵，这一户少了十五万五千，正好是他这些年垫出去的数。","十四年的催款函，邮费都记在小本子上，没有算进来。","三月底，四十八户都签完了。","我把签字页一张一张扫描，排在报告后面。四十八个名字，四十八个手印，没有一个是别人代签的。","那天晚上，邵峻打来电话。","“开庭定了，”他说，“六月。”"],"recap":"许知川写核对报告：四十八户，七列，两条附注。许家那一行，他用红字冲销了自己交出去的错账，再用铅笔写对的。罗维民说：账要两头对，你做到了。母亲把铁盒推到他面前：原件，你都附上。","date":"元宵","mood":"deng"},{"n":20,"cn":"二十","title":"余账","era":"","chars":1913,"mins":5,"html":"<p data-p=\"0\">六月，上林的杨梅熟了。<\/p>\n<p data-p=\"1\">老街口一溜排开七八个挑子，竹篮里垫着杨梅叶子，果子紫得发黑。卖杨梅的人见人就喊：“刚落树的，不甜不要钱！”<\/p>\n<p data-p=\"2\">开庭前一天，我从明州回来。<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>挑了两篮最好的，一篮装进冰箱，一篮用纱罩罩着。<\/p>\n<p data-p=\"3\">“这篮，你拿下楼去。”她说。<\/p>\n<p data-p=\"4\">楼下电器铺的卷帘门拉着一半。<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>坐在柜台后面，<b class=\"rn\" data-c=\"shouyi\">守义<\/b>坐惯的那张凳子上，在择豇豆。我把杨梅放在柜台上，又把<b class=\"rn\" data-c=\"hu\">老胡<\/b>那把扳手递给她。锈还在，老胡用砂纸打过，打掉了一层，露出一点铁的颜色。<\/p>\n<p data-p=\"5\">“胡叔讲，等守义叔出来，交给他。”<\/p>\n<p data-p=\"6\">她接过去，看了一会儿，放进了柜台底下的抽屉里。<\/p>\n<p data-p=\"7\">“那五万，<b class=\"rn\" data-c=\"zhongsun\">钟家孙子<\/b>退回来了。”她说，“讲是他奶奶的意思：老头子化疗用的是守义的钱，这五万，本来就该还他。俞家收了，没说话。邬家那个女人，收到钱那天，站在我家门口哭了半天，我也陪着哭了半天。”<\/p>\n<p data-p=\"8\">她把抽屉推上。<\/p>\n<p data-p=\"9\">“他那一万三，还是免着。”<\/p>\n<p data-p=\"10\">她把抽屉又拉开，从里面拿出一张作业本纸，叠得方方正正。<\/p>\n<p data-p=\"11\">“昨天，邬家那个大女儿送来的。”她说，“现在在明州一家厂里上班，一个月才四千多。站在柜台外面，不肯进门。”<\/p>\n<p data-p=\"12\">纸上是一个小姑娘的字：今借到陈守义人民币叁万陆仟元整，分五年还清。底下按了手印。<\/p>\n<p data-p=\"13\">“我讲不用，”卢彩娣说，“她讲，不用还是守义叔讲的，还不还，是她自己的事。”<\/p>\n<p data-p=\"14\">她把那张纸压在老胡的扳手底下，把抽屉推上了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"15\">法庭在县城新区，楼很新，走廊里一股油漆味。<\/p>\n<p data-p=\"16\">旁听席坐了二十几个人。第一排是<b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>，穿一件黑色的衬衫。她后面是卢彩娣，头发全白了，坐得笔直。我妈坐在卢彩娣旁边。钟家孙子扶着老太坐在靠过道的位置，老胡、<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>、<b class=\"rn\" data-c=\"yusao\">俞家媳妇<\/b>坐在后面。最后一排，是<b class=\"rn\" data-c=\"ge\">老葛<\/b>。他又坐了一夜的车。<\/p>\n<p data-p=\"17\">陈守义被带进来的时候，旁听席上有人动了一下。<\/p>\n<p data-p=\"18\">他瘦了很多，头发剃短了，全白。他朝旁听席看了一眼，看到老胡，看到卢彩娣，看到我，又看到最后一排的老葛，停了一下，转过身去，站好。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"19\">起诉书念了两项。一项是<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>的死，一项是那十三万。<\/p>\n<p data-p=\"20\">审判长问他，对起诉书有没有意见。<\/p>\n<p data-p=\"21\">“推，是推的。”陈守义说，“他站起来了，还骂人，指着门叫滚。走的时候，他好好的。”<\/p>\n<p data-p=\"22\">他说得很急，跟正月初二在楼梯口说的一模一样。<\/p>\n<p data-p=\"23\">公诉人随后念了他在看守所的一段供述。那天晚上八点多，他进档案室收饭盒，老岑叫他把门关上，讲：<b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>讲，她那年拿到手的是十万。明天外地的工友到齐，我当着大家，一户一户问。<\/p>\n<p data-p=\"24\">后来法医出庭。是一个五十来岁的女人，说话很慢，一个字一个字。她讲颅骨的裂缝，讲裂缝底下慢慢积起来的血，讲这种伤人当场不一定倒，能站起来，能骂人，能写字。<\/p>\n<p data-p=\"25\">“这个阶段，医学上叫中间清醒期。”她说，“伤者通常会有头痛、头晕、恶心。如果这个时候送医，开颅减压，不少是能救回来的。”<\/p>\n<p data-p=\"26\">这些话，正月里在审讯室，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>大概跟他讲过。律师后来说，他一直摇头，只说老岑站起来了，还骂了人。<\/p>\n<p data-p=\"27\">陈守义抬起头。<\/p>\n<p data-p=\"28\">我坐在旁听席上，看见他的手抓住了被告席前面的栏杆，指节一点一点发白。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"29\">钟家老太是作为证人出庭的。她走不快，孙子扶她走到证人席，又被法警请了回去。<\/p>\n<p data-p=\"30\">公诉人问她，那年陈守义送去的是多少钱。<\/p>\n<p data-p=\"31\">“十万。”<\/p>\n<p data-p=\"32\">“您知道您家当年借出去的是十五万吗？”<\/p>\n<p data-p=\"33\">“晓得。”<\/p>\n<p data-p=\"34\">“您知道另外五万去了哪里吗？”<\/p>\n<p data-p=\"35\">“晓得。守义拿回去了。”老太说，“老头子化疗那两年，守义前前后后送来五万五。他拿回去五万，还少拿了五千。”<\/p>\n<p data-p=\"36\">审判长问她，对这五万的退赔，有什么意见。<\/p>\n<p data-p=\"37\">老太没有马上回答。她转过头，朝被告席看了一眼。陈守义也在看她。<\/p>\n<p data-p=\"38\">“那五万，我不要。”她说，“本来就是守义的钱。”<\/p>\n<p data-p=\"39\">她停了一下，声音大了一点，像是怕他听不见：<\/p>\n<p data-p=\"40\">“守义，我没怪过你。”<\/p>\n<p data-p=\"41\">陈守义低下了头。他的肩膀在抖，抖了很久。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"42\">岑悦是作为被害人家属发言的。她站起来，没有看稿子。<\/p>\n<p data-p=\"43\">“他的道歉，我不接受。”她说。<\/p>\n<p data-p=\"44\">法庭里很静。<\/p>\n<p data-p=\"45\">“我爸最后打的那个电话，是想打给一个看得懂账的人。”她看着被告席，“他没打出去。”<\/p>\n<p data-p=\"46\">她坐下了，一直到休庭，都没有再抬头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"47\">最后陈述的时候，审判长问陈守义还有什么要说。<\/p>\n<p data-p=\"48\">他站了很久，久到书记员抬起头来看他。<\/p>\n<p data-p=\"49\">“那天晚上，”他说，“他讲头晕，叫我把门带上。”<\/p>\n<p data-p=\"50\">他的声音很哑。<\/p>\n<p data-p=\"51\">“我在门口站了一分钟。”<\/p>\n<p data-p=\"52\">他没有再说下去。法警扶他坐下的时候，他的嘴唇还在动，没有声音。<\/p>\n<p data-p=\"53\">那是守义叔第一次在我面前，单说一个“我”字。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"54\">宣判定在一个月以后。<\/p>\n<p data-p=\"55\">那天夜里，我翻群。<\/p>\n<p data-p=\"56\">群名不知道什么时候改了。“恒成老工友”后面那个括号，被人删掉了。<\/p>\n<div class=\"gname\" role=\"img\" aria-label=\"群名：恒成老工友，括号里的“年前结清”被删掉了\"><small>群聊名称<\/small>恒成老工友<s>（年前结清）<\/s><\/div>\n<p data-p=\"57\">群里没人问是谁删的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"58\">第二天一早，我去了二塘。<\/p>\n<p data-p=\"59\">老厂那栋楼还在，一楼的仓库照样打包，门口的绿色垃圾桶换了一只新的。我没有进去，沿着塘路一直往北走。<\/p>\n<p data-p=\"60\">二塘外面是三塘，三塘外面是四塘，一道一道排到看不见的地方。最外面那道塘的外头，是退了潮的海涂。<\/p>\n<p data-p=\"61\">泥滩上一道一道全是潮水留下的印子，深的浅的，一层压着一层。几只白鹭在泥里走，走一步，停一下。<\/p>\n<p class=\"ending\" data-p=\"62\" data-fx=\"ending\">远处，又有人在打桩。<\/p><div class=\"thud\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>","paras":["六月，上林的杨梅熟了。","老街口一溜排开七八个挑子，竹篮里垫着杨梅叶子，果子紫得发黑。卖杨梅的人见人就喊：“刚落树的，不甜不要钱！”","开庭前一天，我从明州回来。我妈挑了两篮最好的，一篮装进冰箱，一篮用纱罩罩着。","“这篮，你拿下楼去。”她说。","楼下电器铺的卷帘门拉着一半。卢彩娣坐在柜台后面，守义坐惯的那张凳子上，在择豇豆。我把杨梅放在柜台上，又把老胡那把扳手递给她。锈还在，老胡用砂纸打过，打掉了一层，露出一点铁的颜色。","“胡叔讲，等守义叔出来，交给他。”","她接过去，看了一会儿，放进了柜台底下的抽屉里。","“那五万，钟家孙子退回来了。”她说，“讲是他奶奶的意思：老头子化疗用的是守义的钱，这五万，本来就该还他。俞家收了，没说话。邬家那个女人，收到钱那天，站在我家门口哭了半天，我也陪着哭了半天。”","她把抽屉推上。","“他那一万三，还是免着。”","她把抽屉又拉开，从里面拿出一张作业本纸，叠得方方正正。","“昨天，邬家那个大女儿送来的。”她说，“现在在明州一家厂里上班，一个月才四千多。站在柜台外面，不肯进门。”","纸上是一个小姑娘的字：今借到陈守义人民币叁万陆仟元整，分五年还清。底下按了手印。","“我讲不用，”卢彩娣说，“她讲，不用还是守义叔讲的，还不还，是她自己的事。”","她把那张纸压在老胡的扳手底下，把抽屉推上了。","法庭在县城新区，楼很新，走廊里一股油漆味。","旁听席坐了二十几个人。第一排是岑悦，穿一件黑色的衬衫。她后面是卢彩娣，头发全白了，坐得笔直。我妈坐在卢彩娣旁边。钟家孙子扶着老太坐在靠过道的位置，老胡、罗维民、俞家媳妇坐在后面。最后一排，是老葛。他又坐了一夜的车。","陈守义被带进来的时候，旁听席上有人动了一下。","他瘦了很多，头发剃短了，全白。他朝旁听席看了一眼，看到老胡，看到卢彩娣，看到我，又看到最后一排的老葛，停了一下，转过身去，站好。","起诉书念了两项。一项是岑启明的死，一项是那十三万。","审判长问他，对起诉书有没有意见。","“推，是推的。”陈守义说，“他站起来了，还骂人，指着门叫滚。走的时候，他好
