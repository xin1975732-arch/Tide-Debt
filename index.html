正月初二补笔录，说出八点钟陈守义手腕上没有伤"},{"ch":16,"t":"在铺子里当着邵峻的面翻开小本子"},{"ch":17,"t":"走访钟、俞、邬三家，问出“打七折”的真相"},{"ch":18,"t":"写核对报告，用红字冲销自己交出去的那一行"},{"ch":19,"t":"收齐四十八户的签字"},{"ch":20,"t":"旁听开庭，第二天一早走到二塘外的海涂"}],"rel":[{"to":"daixiuqin","label":"母子","ch":1},{"to":"shouyi","label":"叔侄相称，后来直呼其名","ch":1},{"to":"luoweimin","label":"向他核对旧账","ch":1},{"to":"shaojun","label":"配合调查","ch":3},{"to":"cenyue","label":"替她核对账目","ch":5}]},{"id":"daixiuqin","name":"戴秀琴","aliases":["戴秀琴","戴师傅","我妈"],"group":"now","mark":["戴秀琴","戴师傅","我妈"],"role":"许知川的母亲，社区食堂的帮厨","intro":"抱着一只饼干铁盒，里头装着借据。红笔写名字不吉利，这是她说了三十年的话。老街上谁家有事，她比谁都先知道。","events":[{"ch":1,"t":"带着借据来老厂，站在门口，没有进会议室"},{"ch":3,"t":"接到儿子的电话，没有问人是怎么没的"},{"ch":6,"t":"从儿子摊开的复印件里抽走了自己的那一张"},{"ch":8,"t":"说出二〇一四年那二十万的来历：守义当着她的面数了二十万"},{"ch":14,"t":"在联名信上签了名：他替我们家挡的"},{"ch":18,"t":"看着儿子写下红字，把铁盒推过去：原件，你都附上"},{"ch":19,"t":"留老葛吃饭，老葛说：等明年吧"}],"rel":[{"to":"shouyi","label":"受过他的照应","ch":1}]},{"id":"shouyi","name":"陈守义","aliases":["陈守义","守义叔","守义阿哥","守义","老陈","陈主任"],"group":"now","mark":["陈守义","守义叔","守义阿哥","守义","老陈","陈主任"],"role":"恒成电器原车间主任，老街上电器铺的老板","intro":"修电器不收钱，扳手借出去也要记一笔。四十八户的账是他一户一户跑下来的，工友们遇事先说一句：守义来了。他一压手，屋里的人就坐下。","events":[{"ch":1,"t":"带着矿泉水和橘子到老厂，在小本子上记下每一笔小账"},{"ch":2,"t":"接过“附件二”，和罗维民先对；晚上收盒饭，拎走一只系着死结的塑料袋"},{"ch":3,"t":"被问话；左手腕有一道划痕，说是电暖器铁皮划的"},{"ch":4,"t":"二〇一〇年，向小舅子借十万，拿出十五万，带头借钱给厂里"},{"ch":6,"t":"承认指甲里的东西是岑启明的，说是下午争执时被抓了一把"},{"ch":9,"t":"（从罗维民口中）九十万的名单是他定的，钱先打到他卡上"},{"ch":10,"t":"在铺子里对知川说：这件事到这里停下来"},{"ch":13,"t":"在楼梯口戴上手铐，说：那天晚上……推了他一把"},{"ch":15,"t":"二〇一四年十二月，把九十万数了一遍，分成七只信封"},{"ch":16,"t":"电暖器里的小本子：催款函、垫款、红线，一个“免”字"},{"ch":19,"t":"在看守所签下自己那一行，加了一句：零头免"},{"ch":20,"t":"庭上说：推，是推的。最后陈述：我在门口站了一分钟"}],"rel":[{"to":"caidi","label":"夫妻","ch":1},{"to":"luoweimin","label":"当年的搭档","ch":1},{"to":"cenqiming","label":"车间主任与老板","ch":1},{"to":"zhigang","label":"姐夫与小舅子","ch":4},{"to":"zhongtai","label":"化疗那两年送去五万五","ch":17},{"to":"hu","label":"他叫他守义阿哥","ch":1},{"to":"ge","label":"外地户“更要有个靠头”","ch":4}]},{"id":"caidi","name":"卢彩娣","aliases":["卢彩娣","彩娣"],"group":"now" 一个提保温杯的人，往二塘河边走。","13":"出纳小姚说，老葛那笔钱是九点三十八分点的网银，和岑启明死没死没有关系。许知川想明白了，付款和到账是两个时间。小姚还说，岑启明前一天下午接过韩岚的电话，说“八点半以后，让她自己上来”。许知川去二塘河边量了从后门走回罗家的时间。老厂门口的垃圾桶，那天傍晚刚清过，桶里只有一个外卖盒。","14":"正月初二，许知川补笔录，说出八点钟陈守义手腕上没有伤。邵峻讲了法医的结论：后脑撞在柜角，九点半前后死亡。铺子里那只拆开的电饭煲，内胆底下压着附件二。陈守义戴上手铐，在楼梯口说：那天晚上……推了他一把，可他站起来了。","15":"陈守义被刑拘，老胡转述他的话：他是替阿拉大家挡的。联名信到晚上签了十九个名字。钟家老太说，守义送来的是十万，岑老板“打了七折”。许知川对上账簿，岑启明打给陈守义的是十五万。深夜，卢彩娣来说：那台电暖器，他修到十点多。","16":"二〇一四年，岑启明凑出九十万，陈守义定名单。他自己欠着小舅子的十万，垫给钟、俞、邬三家的钱一笔没收回。十二月十七日夜里，他把九十万数了一遍，从三只信封里各抽出几扎，又装了一只写着“娘舅”的信封。","17":"电暖器里藏着陈守义的小本子：十四年的催款函，一笔笔垫款，红线冲销，一个“免”字。二〇一四年的名单里，老葛被划掉了两道。最后几页写着：岑。后面是空的。","18":"钟家老太从病历本封底内侧翻出一列数字：守义送来五万五，十五万里拿回五万。她说，拿回去是应该的。腊月里，岑启明去看过她，听到“十万”，脸色变了。她让带话：我没怪过他。","19":"许知川写核对报告：四十八户，七列，两条附注。许家那一行，他用红字冲销了自己交出去的错账，再用铅笔写对的。罗维民说：账要两头对，你做到了。母亲把铁盒推到他面前：原件，你都附上。","20":"元宵节，报告发进群里，回了三十一户，没有一户说不对。岑悦认下二百零五万，从遗产里付。四十八户一户一户签字，老葛一家也来了。陈守义那一行是在看守所签的，后面多了一行小字：零头免。开庭定在六月。"},"rules":{"special":{"1":{"关于借款余额的说明":["gaozhi"],"四十八户，共计三百万元。":["fly"]},"2":{"“钱到了钱到了谢谢陈老板陈老板是好人”":["chat",{"who":"老葛","voice":true,"time":"21:41"}],"“对啊陈老板”":["chat",{"who":"老葛","voice":true}],"“山今岑！”":["chat",{}],"“我说的就是陈老板啊”":["chat",{"who":"老葛","voice":true}],"钱到了钱到了谢谢陈老板陈老板是好人":["lock",{"who":"老葛","time":"21:41"}]},"4":{"四十八户，欠。":["note"]},"6":{"“她早上在会议室，坐得离门最近。”":["chat",{}],"“副厂长当年先跑的，谁不晓得。”":["chat",{}],"“十五年前她就把厂掏空了，现在又来灭口。”":["chat",{}],"“守义阿哥替我们跟姓岑的拼命，被抓了一把。”":["chat",{}],"“九十万，也就他敢当面去要。”":["chat",{}],"“警察还叫他去问话，有没有良心？”":["chat",{}],"一道抓痕，在群里变成了一枚勋章。":["beat"],"“钱到了钱到了谢谢陈老板陈老板是好人”":["chat",{"quote":"老葛 · 腊月二十一 21:41"}],"“九点四十一分还在打钱，说明人那时候还活着，还在办事。”":["chat",{}],"“韩岚九点十九分走的，监控后头再没人进去。”":["chat",{}],"“那就是她走之前推了他，他自己爬起来，打完钱，才倒下去的。”":["chat",{}],"“也可能是自己摔的。痛风的人，脚底下没根。”":["chat",{}]},"7":{"今戴秀琴出借岑启明之借款本金贰拾万元整，已全部结清。":["slip"],"收款人：戴秀琴":["slip",{"r":true}],"经手人：陈守义　罗维民":["slip",{"r":true}],"二〇一四年十二月十八日":["slip",{"r":true}]},"8":{"四十八户里，我交上去的第一行假账，是我自己家的。":["beat"]},"9":{"二〇一四年十二月，岑启明汇陈守义：":["ledger",{"head":true}],"戴秀琴，二十万；":["ledger"],"应国庆，十五万；":["ledger"],"胡国良，十五万；":["ledger"],"钟德明，十五万；":["ledger"],"俞阿桂，
