间"},{"ch":13,"t":"正月初二补笔录，说出八点钟陈守义手腕上没有伤"},{"ch":16,"t":"在铺子里当着邵峻的面翻开小本子"},{"ch":17,"t":"走访钟、俞、邬三家，问出“打七折”的真相"},{"ch":18,"t":"写核对报告，用红字冲销自己交出去的那一行"},{"ch":19,"t":"收齐四十八户的签字"},{"ch":20,"t":"旁听开庭，第二天一早走到二塘外的海涂"}],"rel":[{"to":"daixiuqin","label":"母子","ch":1},{"to":"shouyi","label":"叔侄相称，后来直呼其名","ch":1},{"to":"luoweimin","label":"向他核对旧账","ch":1},{"to":"shaojun","label":"配合调查","ch":3},{"to":"cenyue","label":"替她核对账目","ch":5}]},{"id":"daixiuqin","name":"戴秀琴","aliases":["戴秀琴","戴师傅","我妈"],"group":"now","mark":["戴秀琴","戴师傅","我妈"],"role":"许知川的母亲，社区食堂的帮厨","intro":"抱着一只饼干铁盒，里头装着借据。红笔写名字不吉利，这是她说了三十年的话。老街上谁家有事，她比谁都先知道。","events":[{"ch":1,"t":"带着借据来老厂，站在门口，没有进会议室"},{"ch":3,"t":"接到儿子的电话，没有问人是怎么没的"},{"ch":6,"t":"从儿子摊开的复印件里抽走了自己的那一张"},{"ch":8,"t":"说出二〇一五年那二十万的来历：守义当着她的面数了二十万"},{"ch":14,"t":"在联名信上签了名：他替我们家挡的"},{"ch":18,"t":"看着儿子写下红字，把铁盒推过去：原件，你都附上"},{"ch":19,"t":"留老葛吃饭，老葛说：等明年吧"}],"rel":[{"to":"shouyi","label":"受过他的照应","ch":1}]},{"id":"shouyi","name":"陈守义","aliases":["陈守义","守义叔","守义阿哥","守义","老陈","陈主任"],"group":"now","mark":["陈守义","守义叔","守义阿哥","守义","老陈","陈主任"],"role":"恒成电器原车间主任，老街上电器铺的老板","intro":"修电器不收钱，扳手借出去也要记一笔。四十八户的账是他一户一户跑下来的，工友们遇事先说一句：守义来了。他一压手，屋里的人就坐下。","events":[{"ch":1,"t":"带着矿泉水和橘子到老厂，在小本子上记下每一笔小账"},{"ch":2,"t":"接过“附件二”，和罗维民先对；晚上收盒饭，拎走一只系着死结的塑料袋"},{"ch":3,"t":"被问话；左手腕有一道划痕，说是电暖器铁皮划的"},{"ch":4,"t":"二〇一一年，向小舅子借十万，拿出十五万，带头借钱给厂里"},{"ch":6,"t":"承认指甲里的东西是岑启明的，说是下午争执时被抓了一把"},{"ch":9,"t":"（从罗维民口中）九十万的名单是他定的，钱先打到他卡上"},{"ch":10,"t":"在铺子里对知川说：这件事到这里停下来"},{"ch":13,"t":"在楼梯口戴上手铐，说：那天晚上……推了他一把"},{"ch":15,"t":"二〇一五年十二月，把九十万数了一遍，分成七只信封"},{"ch":16,"t":"电暖器里的小本子：催款函、垫款、红线，一个“免”字"},{"ch":19,"t":"在看守所签下自己那一行，加了一句：零头免"},{"ch":20,"t":"庭上说：推，是推的。最后陈述：我在门口站了一分钟"}],"rel":[{"to":"caidi","label":"夫妻","ch":1},{"to":"luoweimin","label":"当年的搭档","ch":1},{"to":"cenqiming","label":"车间主任与老板","ch":1},{"to":"zhigang","label":"姐夫与小舅子","ch":4},{"to":"zhongtai","label":"化疗那两年送去五万五","ch":17},{"to":"hu","label":"他叫他守义阿哥","ch":1},{"to":"ge","label":"外地户“更要有个靠头”","ch":4}]},{"id":"caidi","name":"卢彩娣","aliases":["卢彩娣","彩娣"],"group":"now","mark":["卢彩娣","彩娣"],"role":"陈守义的妻子","intro":"后屋里的电视声永远开得比人说话大。别人家的电暖器修到半夜一分钱不收，自家的饭倒热了三回，这话她说得不低，也不高，刚好让外面听见。","events":[{"ch":1,"t":"在后屋说：别人家的电暖器修到半夜，一分钱不收"},{"ch":6,"t":"又往家里领人：老葛的行军床"},{"ch":13,"t":"后门的铁桶里烧的是“旧挂历”"},{"ch":14,"t":"深夜敲开许家的门：那台电暖器修了快十一点"},{"ch":15,"t":"二〇一五年十二月十七日夜里：厂又不是你开的！"},{"ch":20,"t":"坐在守义坐惯的凳子上择豇豆，把邬家的借条压在扳手底下"}],"rel":[{"to":"zhigang","label":"姐弟","ch":4},{"to":"daixiuqin","label":"半夜去敲她家的门","ch":14}]},{"id":"zhigang","name":"卢志刚","aliases":["卢志刚","志刚","小舅子","娘舅"],"group":"now","mark":["卢志刚","小舅子"],"role":"卢彩娣的弟弟，陈守义的小舅子","intro":"拿到老房子的征地款，存折压在电视机底下。姐夫一开口就是十万，他看了一眼姐姐。","events":[{"ch":4,"t":"借给守义十万，守义写了借条，又在小本子上记了一行"},{"ch":15,"t":"二〇一五年催首付：你四年前也这么讲"}],"rel":[]},{"id":"cenqiming","name":"岑启明","aliases":["岑启明","老岑","岑总","岑老板","岑"],"group":"mg","mark":["岑启明","老岑","岑总","岑老板"],"role":"恒成电器当年的老板，十五年没在上林露面","intro":"开一辆十年前的灰色轿车回来的，穿一件像是特意挑过的深色夹克。痛风，吃不了辣。他说，他回来还钱。","events":[{"ch":1,"t":"核账日：认二百一十万，簿子上写的是三百万"},{"ch":2,"t":"下午拿出“附件二”，傍晚在档案室里写“关于借款余额的说明”"},{"ch":3,"t":"八点四十一分拨出一个没有接通的电话"},{"ch":4,"t":"二〇一一年，请陈守义在车间带头借钱，月息一分"},{"ch":15,"t":"二〇一五年，凑出九十万，打给陈守义，让他先还几户最急的"},{"ch":17,"t":"腊月里去看过钟家老太，听到“十万”，脸色变了"}],"rel":[{"to":"cenyue","label":"父女","ch":5},{"to":"hanlan","label":"当年的合作者","ch":3},{"to":"luoweimin","label":"账由他记","ch":1},{"to":"xiaoyao","label":"出纳与老板","ch":12}]},{"id":"cenyue","name":"岑悦","aliases":["岑悦","岑家姑娘","岑家那个姑娘"],"group":"mg","mark":["岑悦","岑家姑娘"],"role":"岑启明的女儿","intro":"黑大衣，头发扎得很紧，眼睛是红的，脸上没有泪。到了老厂，先看的不是楼，是院子里这一群人。","events":[{"ch":5,"t":"赶到老厂，当着工友问：我爸到底欠你们多少"},{"ch":7,"t":"来电话要名单：我爸的账，我认，但我要知道哪一笔是真的"},{"ch":17,"t":"等一份能拿给律师看的核对报告"},{"ch":19,"t":"带律师回上林，认下二百零五万，从遗产里付"},{"ch":20,"t":"庭上发言：他的道歉，我不接受"}],"rel":[{"to":"shouyi","label":"父亲说他是唯一信得过的人","ch":5}]},{"id":"hanlan","name":"韩岚","aliases":["韩岚"],"group":"mg","mark":["韩岚"],"role":"恒成电器原副厂长，现在是开外贸公司的大老板","intro":"驼色大衣，进门还在讲英文电话。会议室里坐在离门最近的位置。","events":[{"ch":1,"t":"九点二十到老厂，在离门最近的位置坐下"},{"ch":2,"t":"在楼梯拐角对岑启明说：当年签的那份东西，你今天别拿出来"},{"ch":3,"t":"监控里：九点零八分进楼，十九分出来，手里压 a":"now","d":"腊月二十九","t":"行车记录仪","s":"邵峻让知川看韩岚车里的录音和一份二〇一一年的协议。法医说：岑启明受伤后清醒过一阵子。","ch":11,"who":["hanlan","shaojun","zhichuan"]},{"k":"2026-02-16","era":"now","d":"除夕","t":"付款与到账","s":"出纳小姚说，老葛那笔钱是九点三十八分点的网银。老厂门口的垃圾桶，那天傍晚刚清过。","ch":12,"who":["xiaoyao","zhichuan","shaojun"]},{"k":"2026-02-18-1","era":"now","d":"正月初二　上午","t":"补笔录","s":"邵峻问：八点钟，陈守义左手腕上有没有伤。许知川说：没有。中间清醒期。","ch":13,"who":["shaojun","zhichuan","shouyi"]},{"k":"2026-02-18-2","era":"now","d":"正月初二　中午","t":"铁桶里的纸角","s":"铺子后门的铁皮桶里，没烧透的纸角印着表格的横线，格子里剩半个金字旁。陈守义戴上手铐。","ch":13,"who":["shouyi","caidi","shaojun"]},{"k":"2026-02-20","era":"now","d":"正月初四","t":"替大家","s":"老胡转述守义的话：他是替阿拉大家挡的。联名信到晚上签了十九个名字。","ch":14,"who":["hu","zhongsun","daixiuqin","yusao"]},{"k":"2026-02-21","era":"now","d":"正月初五","t":"打七折","s":"钟家老太说守义送来的是十万，岑老板“打了七折”。知川对上账簿：打给陈守义的是十五万。","ch":14,"who":["zhongsun","zhongtai","zhichuan","daixiuqin"]},{"k":"2026-02-21-2","era":"now","d":"正月初五　夜","t":"电暖器","s":"卢彩娣敲开许家的门：那台电暖器，他修到快十一点。","ch":14,"who":["caidi","daixiuqin","zhichuan"]},{"k":"2026-02-22","era":"now","d":"正月初六","t":"小本子","s":"电暖器后盖里的塑料袋：催款函、垫款、红线、免。二〇一五年的名单里，老葛被划掉了两道。","ch":16,"who":["shaojun","zhichuan","caidi","shouyi"]},{"k":"2026-02-26","era":"now","d":"正月初十","t":"钟家老太","s":"病历本封底内侧一列数字：五万五。十五万里，守义拿回去五万。","ch":17,"who":["zhichuan","zhongtai","zhongsun","yusao","wudaughter"]},{"k":"2026-02-27","era":"now","d":"正月十一　到十四","t":"母亲那一行","s":"许知川写核对报告，用红字冲销自己交出去的那一行，用铅笔写对的。","ch":18,"who":["zhichuan","daixiuqin","hu","luoweimin"]},{"k":"2026-03-03","era":"now","d":"元宵","t":"报告发进群里","s":"到晚上，四十八户里回了三十一户，没有一户说不对。","ch":19,"who":["zhichuan","hu","zhongsun"]},{"k":"2026-03-20","era":"now","d":"二月初起","t":"各自签字","s":"岑悦认下二百零五万。四十八户一户一户来签，老葛一家也来了。最后一户，是律师从看守所带回来的。","ch":19,"who":["cenyue","ge","luoweimin","yingguoqing","shouyi"]},{"k":"2026-07-01","era":"now","d":"六月","t":"开庭","s":"钟家老太：那五万，我不要。岑悦：他的道歉，我不接受。陈守义：我在门口站了一分钟。","ch":20,"who":["shouyi","zhongtai","cenyue","caidi","wudaughter"]},{"k":"2026-07-02","era":"now","d":"开庭后第二天","t":"二塘外","s":"许知川沿着塘路往北走，到最外面那道塘的外头：退了潮的海涂，远处，又有人在打桩。","ch":20,"who":["zhichuan"]}]},"chapters":[{"n":1,"cn":"一","title":"旧群","era":"","chars":3451,"mins":9,"html":"<p data-p=\"0\">门缝底下漏出一线黄光。<\/p>\n<p data-p=\"1\">我敲了两下门，没有人应。<\/p>\n<p data-p=\"2\">我推开门。<\/p>\n<p data-p=\"3\">台灯开着，灯罩歪向一边。地上撒了一地炒年糕，白的，一点红都没有。两排铁皮柜中间伸出一只手，手指朝着门口，像是要够什么东西，又没够着。<\/p>\n<p data-p=\"4\">桌上压着一沓稿纸，第一页写着一行标题：<\/p>\n<figure class=\"doc gaozhi\" data-p=\"5\" role=\"img\" aria-label=\"稿纸：关于借款余额的说明，下面一行只有“一、”\"><div class=\"gz-row\"><span><\/span><span>关<\/span><span>于<\/span><span>借<\/span><span>款<\/span><span>余<\/span><span>额<\/span><span>的<\/span><span>说<\/span><span>明<\/span><\/div><div class=\"gz-row\"><span><\/span><span><\/span><span>一<\/span><span>、<\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><\/div><div class=\"gz-row\"><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><\/div><\/figure>\n<p data-p=\"6\">标题下面只有一个“一”字，后面跟着一个顿号。<\/p>\n<p data-p=\"7\">窗缝里漏进来的海风，把稿纸的边角掀起来，又放下。<\/p>\n<p data-p=\"8\">十三个小时以前，这只手还在楼下会议室里打开一个文件夹。它的主人说，他回来还钱。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">腊月二十一，我坐末班大巴回上林。手机在口袋里震了一路。<\/p>\n<p data-p=\"10\">工友群改过三次名。二〇一一年建群的时候还是QQ群，叫“恒成电器职工”。厂倒以后第二年，有人把它改成“恒成讨债”。第二天，<b class=\"rn\" data-c=\"shouyi\">守义叔<\/b>又改了回来，改成“恒成老工友”。他在群里说，阿拉是工友，不是讨债的。<\/p>\n<p data-p=\"11\">二〇一四年搬到微信，群名一直没再动过。直到上个月，后面多了一个括号：恒成老工友（年前结清）。<\/p>\n<p data-p=\"12\">置顶的是守义叔的通知：“腊月二十二上午九点，老厂办公楼二楼会议室，核对借款。原借据带好，复印件也行。外地的工友二十三号到，车票自己先垫，回头一并算。<b class=\"rn\" data-c=\"zhichuan\">许知川<\/b>会计负责复核，有问题找他，也可以来铺子里寻。”<\/p>\n<p data-p=\"13\">我就是那个许知川。我在明州一家汽车零部件公司做成本会计，一年到头跟螺栓和垫片的单价打交道，不知怎么就成了四十八户人家眼里“懂账的那个”。推举我的是守义叔，群里跟了一排大拇指，<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>也在里面。<\/p>\n<p data-p=\"14\">下面跟了两百多条。<\/p>\n<p data-p=\"15\"><b class=\"rn\" data-c=\"ge\">老葛<\/b>发了一条六十秒的语音。我转成文字，转出来一段被机器猜坏了的安徽话，大意是：钱是当场给，还是打到卡里？他的卡是老家开的，跨行要不要手续费？<\/p>\n<p data-p=\"16\">有人问利息怎么算。有人发来一张住院收费单，没写字。有人问，他要是再跑呢？<\/p>\n<p data-p=\"17\">守义叔回：“阿拉大家放心，这次有人看着。”后面跟着一个@，@的是我。<\/p>\n<p data-p=\"18\">有人发了一个“财神到”的表情。又有人问能不能带孙子来，说孩子放寒假，家里没人看。守义叔说可以，会议室有暖气。<\/p>\n<p data-p=\"19\">大巴拐上塘路。路两边是一道一道的海塘，老塘最早，往北是二塘、三塘，一直排到看不见的地方。我小时候以为那些塘是挡水的，后来才知道，每往北修一道，就从海里多借出一片地来。恒成的厂就盖在二塘边上，盖的时候，那块地刚干了没几年。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"20\">我妈住在老街。楼下是守义叔的电器铺，卷帘门拉了一半。他坐在柜台后面，面前一台电暖器开着后盖，螺丝一颗颗排在报纸上。<\/p>\n<p data-p=\"21\">后屋的门帘里传出他老婆的声音：“别人家的电暖器修到半夜，一分钱不收，自家的饭倒热了三回。”<\/p>\n<p data-p=\"22\">守义叔冲我笑笑，没回嘴，拿螺丝刀朝楼上指了指：“你妈等你一晚上了。”<\/p>\n<p data-p=\"23\">我上楼的时候，我妈正坐在饭桌边。桌上放着一只饼干铁盒，盖子开着。听见钥匙响，她把盖子扣上，起身去热菜。<\/p>\n<p data-p=\"24\">“借据你带了没有？”我问。<\/p>\n<p data-p=\"25\">“带了，在盒子里。”<\/p>\n<p data-p=\"26\">“给我看一下，明天要对。”<\/p>\n<p data-p=\"27\">“明天我自己带过去。”她背对着我，把一碗黄鱼年糕汤端上桌，“你吃。”<\/p>\n<p data-p=\"28\">饭桌上两只碗。她把完好的那只推给我，自己端起另一只。那只是青瓷的，碗沿缺了一个小口，用了很多年，缺口已经磨得不扎嘴了。<\/p>\n<p data-p=\"29\">“妈，二十万要是明天能拿回来，你想干什么？”<\/p>\n<p data-p=\"30\">她喝了一口汤，过了一会儿才说：“你账算好了，就回明州去。别的事，你别多管。”<\/p>\n<p data-p=\"31\">“什么叫别的事？”<\/p>\n<p data-p=\"32\">“你听你守义叔的。”<\/p>\n<p data-p=\"33\">我没再问。我爸透析那几年，我在外地读大学，学费一回也没断过。我妈说，是守义叔四处想的办法。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"34\">腊月二十二，天阴，海风从北边一直吹过来。<\/p>\n<p data-p=\"35\">老厂办公楼一楼租给了一家跨境电商，门口堆着半人高的纸箱。几个年轻姑娘戴着手套在打包，胶带撕起来刺啦刺啦地响。门框上新装了一个摄像头，对着大门和停车的空地，门边立着一只绿色的大垃圾桶。<\/p>\n<p data-p=\"36\">守义叔已经到了。他的电动三轮车停在纸箱旁边，车斗里两箱矿泉水、一袋橘子。他穿一件旧羽绒服，袖口磨亮了，正低头在一个巴掌大的小本子上写字。我瞥见一眼：矿泉水两箱，三十六元；橘子一袋，二十元。<\/p>\n<p data-p=\"37\">“老习惯，”他把本子揣回羽绒服内袋，“当车间主任落下的，扳手借出去都要记一笔。”<\/p>\n<p data-p=\"38\">他从车斗里拿起一个透明塑料文件袋，递给我：“知川，十五年了，这本东西一直压在床底下。今天交给你。”<\/p>\n<p data-p=\"39\">文件袋里是一本蓝色硬壳的登记簿，边角卷起来了。翻开扉页，是<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>的字，一笔一画：<\/p>\n<div class=\"doc fly\"><p data-p=\"40\">四十八户，共计三百万元。<\/p><\/div>\n<p data-p=\"41\">我拿着簿子，比想象中沉。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"42\">会议室在二楼。楼梯口的墙角挂着一个厂里当年的摄像头，壳子发黄，线头从底下垂出来，早就不亮了。会议室里暖气开得太足，窗玻璃上起了一层雾。<\/p>\n<p data-p=\"43\">罗维民坐在靠窗的位置，面前一把算盘、一只保温杯。他退休好几年了，还在给几家作坊代账，对数还用算盘，说电脑算得快，算错了也快。<\/p>\n<p data-p=\"44\">来了十几个工友，有人带原件，有人带复印件，有人把橘子剥了一桌子皮。我把登记簿摊开，拿出一支铅笔。我核账只用铅笔打勾，不用红笔。我妈说红笔写名字不吉利，我就一直没用过。<\/p>\n<p data-p=\"45\">九点二十，<b class=\"rn\" data-c=\"hanlan\">韩岚<\/b>到了。驼色大衣，进门还在讲电话，说的是英文：“OK, OK, talk tomorrow.”她冲屋里点了点头：“美国那边还没睡，不好意思。”有人小声说，副厂长现在是大老板了。韩岚没接话，在离门最近的位置坐下。<\/p>\n<p data-p=\"46\">九点半，<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>到了。<\/p>\n<p data-p=\"47\">他开一辆十年前的灰色轿车，人比我想的瘦，穿一件深色夹克，像是特意挑过的。进门没有寒暄，先跟每个人点了一下头，点到守义叔的时候，停了半秒。<\/p>\n<p data-p=\"48\">他坐下，打开文件夹。手机响了。<\/p>\n<p data-p=\"49\">“嗯。年前那几笔，按流程走，我今天批。”他挂了电话，对大家说，“公司财务，催我签字。”<\/p>\n<p data-p=\"50\">有人笑了一声：“岑总现在签字还管用啊。”<\/p>\n<p data-p=\"51\">岑启明没理会。“我说一下这次的安排。我准备偿还的，是当年借款中未还的本金，二百一十万元。今天先核收款情况，有争议的逐户对，明天外地的工友到了，确认无误就付。”<\/p>\n<p data-p=\"52\">会议室安静了两秒。<\/p>\n<p data-p=\"53\">“多少？”<\/p>\n<p data-p=\"54\">“二百一十万。”<\/p>\n<p data-p=\"55\">“簿子上写着三百万！”有人一巴掌拍在桌上，杯子跳了一下。<\/p>\n<p data-p=\"56\">“九十万，你又想赖掉？”<\/p>\n<p data-p=\"57\">“十五年了，利息我们不讲，本金你还要打折？”<\/p>\n<p data-p=\"58\">有人已经在掏手机。屋里一下子全是声音，暖气好像更闷了。<\/p>\n<p data-p=\"59\">我站起来：“岑总，三百万和二百一十万之间差了九十万。请你逐笔说明。”<\/p>\n<p data-p=\"60\">岑启明看着我，看了一会儿。然后目光移开，落在守义叔身上。<\/p>\n<p data-p=\"61\">“先核收款，”他说，“再谈余额。”<\/p>\n<p data-p=\"62\">守义叔站了起来。他没有发火，两只手往下压了压，像这十五年里每一次那样：“大家先坐下。人回来了，钱也带来了，今天不吵。一笔一笔对，对不上的，知川会写下来。”<\/p>\n<p data-p=\"63\">屋里慢慢坐下了。他一说话，大家总会坐下。<\/p>\n<p data-p=\"64\">我在白纸上写下“90”，后面打了一个问号。桌上的手机亮了一下，群里已经有人发出去了：“姓岑的又要赖九十万。”<\/p>\n<p data-p=\"65\">我抬头的时候，屋里只有一个人没动。罗维民的手放在算盘上，岑启明报出那个数以后，他一颗珠子都没拨过。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"66\">核对从十点开始。我念名字，念到谁，谁把借据拿出来；罗维民在登记簿上找到那一行，报一遍金额，我打一个勾。<\/p>\n<p data-p=\"67\">到第七户，卡住了。<b class=\"rn\" data-c=\"qi\">戚师傅<\/b>的借据写着叁万，登记簿上是八万。<\/p>\n<p data-p=\"68\">“你们账上多记了五万？”有人笑，“多出来的算谁的？”<\/p>\n<p data-p=\"69\">罗维民没抬头：“你是两笔。一笔三万，你自己的名字；一笔五万，借据写的是你阿哥，后来你阿哥说钱是你的，并到你这一行。那张借据，你阿哥收着。”<\/p>\n<p data-p=\"70\">戚师傅想了半天，说好像是有这么回事。他阿哥前年过世了，东西都在嫂子那里，他说下午去找，晚上拿过来。<\/p>\n<p data-p=\"71\">我在那一行旁边写“另一张借据待补”，又看了罗维民一眼。十五年前的事，这个老会计记得比当事人还清楚。<\/p>\n<p data-p=\"72\">快到中午，<b class=\"rn\" data-c=\"hu\">老胡<\/b>提起了利息。<\/p>\n<p data-p=\"73\">“当年银行定期才三厘多，你说月息一分，阿拉才借的。”老胡说，“我家那点钱，是征地拿的补偿，放着也是放着。现在利息不讲了，本金还打折？”<\/p>\n<p data-p=\"74\">“利息我不付。”岑启明说，“借据上没写。”<\/p>\n<p data-p=\"75\">“写了一分！”<\/p>\n<p data-p=\"76\">“那是口头说的。”<\/p>\n<p data-p=\"77\">两边又吵起来。吵到一半，老胡冷笑一声：“姓岑的，你也别觉得自己多讲良心。要不是守义阿哥年年给你寄催款信，这笔账早过时效了，你一分不还，也没人告得赢你。”<\/p>\n<p data-p=\"78\">我看向守义叔。他坐在后排，两只手揣在羽绒服口袋里，只是摇了摇头，像在说这点事不值得提。<\/p>\n<p data-p=\"79\">岑启明过了一会儿才说：“我知道。所以我回来了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"80\">中午，我妈来了。<\/p>\n<p data-p=\"81\">她抱着那只饼干铁盒，站在门口，没有进来。我去接，她把借据从盒子里抽出来递给我，盒盖马上又扣上了。<\/p>\n<p data-p=\"82\">借据是二〇一一年三月写的：借款人岑启明，出借人戴秀琴，二十万元，经手人陈守义、罗维民。纸已经发黄，折痕处起了毛。<\/p>\n<p data-p=\"83\">我把借据摊在桌上，念了一遍。罗维民在登记簿上找到这一行，没有报数。他看着那张借据，看了很久，久到旁边的人都转过头来。<\/p>\n<p data-p=\"84\">“二十万。”他终于说。<\/p>\n<p data-p=\"85\">我打了一个勾。<\/p>\n<p data-p=\"86\">“妈，你坐一会儿，吃了饭再走。”<\/p>\n<p data-p=\"87\">“食堂还有事。”她看了守义叔一眼，又看了岑启明一眼，转身下楼了。铁盒一直抱在胸前。<\/p>\n<p class=\"last\" data-p=\"88\">那天上午，罗维民报了十九户的数。只有这一户，他停了这么久。我当时以为，他是年纪大了，眼睛不好。<\/p>","paras":["门缝底下漏出一线黄光。","我敲了两下门，没有人应。","我推开门。","台灯开着，灯罩歪向一边。地上撒了一地炒年糕，白的，一点红都没有。两排铁皮柜中间伸出一只手，手指朝着门口，像是要够什么东西，又没够着。","桌上压着一沓稿纸，第一页写着一行标题：","关于借款余额的说明一、","标题下面只有一个“一”字，后面跟着一个顿号。","窗缝里漏进来的海风，把稿纸的边角掀起来，又放下。","十三个小时以前，这只手还在楼下会议室里打开一个文件夹。它的主人说，他回来还钱。","腊月二十一，我坐末班大巴回上林。手机在口袋里震了一路。","工友群改过三次名。二〇一一年建群的时候还是QQ群，叫“恒成电器职工”。厂倒以后第二年，有人把它改成“恒成讨债”。第二天，守义叔又改了回来，改成“恒成老工友”。他在群里说，阿拉是工友，不是讨债的。","二〇一四年搬到微信，群名一直没再动过。直到上个月，后面多了一个括号：恒成老工友（年前结清）。","置顶的是守义叔的通知：“腊月二十二上午九点，老厂办公楼二楼会议室，核对借款。原借据带好，复印件也行。外地的工友二十三号到，车票自己先垫，回头一并算。许知川会计负责复核，有问题找他，也可以来铺子里寻。”","我就是那个许知川。我在明州一家汽车零部件公司做成本会计，一年到头跟螺栓和垫片的单价打交道，不知怎么就成了四十八户人家眼里“懂账的那个”。推举我的是守义叔，群里跟了一排大拇指，我妈也在里面。","下面跟了两百多条。","老葛发了一条六十秒的语音。我转成文字，转出来一段被机器猜坏了的安徽话，大意是：钱是当场给，还是打到卡里？他的卡是老家开的，跨行要不要手续费？","有人问利息怎么算。有人发来一张住院收费单，没写字。有人问，他要是再跑呢？","守义叔回：“阿拉大家放心，这次有人看着。”后面跟着一个@，@的是我。","有人发了一个“财神到”的表情。又有人问能不能带孙子来，说孩子放寒假，家里没人看。守义叔说可以，会议室有暖气。","大巴拐上塘路。路两边是一道一道的海塘，老塘最早，往北是二塘、三塘，一直排到看不见的地方。我小时候以为那些塘是挡水的，后来才知道，每往北修一道，就从海里多借出一片地来。恒成的厂就盖在二塘边上，盖的时候，那块地刚干了没几年。","我妈住在老街。楼下是守义叔的电器铺，卷帘门拉了一半。他坐在柜台后面，面前一台电暖器开着后盖，螺丝一颗颗排在报纸上。","后屋的门帘里传出他老婆的声音：“别人家的电暖器修到半夜，一分钱不收，自家的饭倒热了三回。”","守义叔冲我笑笑，没回嘴，拿螺丝刀朝楼上指了指：“你妈等你一晚上了。”","我上楼的时候，我妈正坐在饭桌边。桌上放着一只饼干铁盒，盖子开着。听见钥匙响，她把盖子扣上，起身去热菜。","“借据你带了没有？”我问。","“带了，在盒子里。”","“给我看一下，明天要对。”","“明天我自己带过去。”她背对着我，把一碗黄鱼年糕汤端上桌，“你吃。”","饭桌上两只碗。她把完好的那只推给我，自己端起另一只。那只是青瓷的，碗沿缺了一个小口，用了很多年，缺口已经磨得不扎嘴了。","“妈，二十万要是明天能拿回来，你想干什么？”","她喝了一口汤，过了一会儿才说：“你账算好了，就回明州去。别的事，你别多管。”","“什么叫别的事？”","“你听你守义叔的。”","我没再问。我爸透析那几年，我在外地读大学，学费一回也没断过。我妈说，是守义叔四处想的办法。","腊月二十二，天阴，海风从北边一直吹过来。","老厂办公楼一楼租给了一家跨境电商，门口堆着半人高的纸箱。几个年轻姑娘戴着手套在打包，胶带撕起来刺啦刺啦地响。门框上新装了一个摄像头，对着大门和停车的空地，门边立着一只绿色的大垃圾桶。","守义叔已经到了。他的电动三轮车停在纸箱旁边，车斗里两箱矿泉水、一袋橘子。他穿一件旧羽绒服，袖口磨亮了，正低头在一个巴掌大的小本子上写字。我瞥见一眼：矿泉水两箱，三十六元；橘子一袋，二十元。","“老习惯，”他把本子揣回羽绒服内袋，“当车间主任落下的，扳手借出去都要记一笔。”","他从车斗里拿起一个透明塑料文件袋，递给我：“知川，十五年了，这本东西一直压在床底下。今天交给你。”","文件袋里是一本蓝色硬壳的登记簿，边角卷起来了。翻开扉页，是罗维民的字，一笔一画：","四十八户，共计三百万元。","我拿着簿子，比想象中沉。","会议室在二楼。楼梯口的墙角挂着一个厂里当年的摄像头，壳子发黄，线头从底下垂出来，早就不亮了。会议室里暖气开得太足，窗玻璃上起了一层雾。","罗维民坐在靠窗的位置，面前一把算盘、一只保温杯。他退休好几年了，还在给几家作坊代账，对数还用算盘，说电脑算得快，算错了也快。","来了十几个工友，有人带原件，有人带复印件，有人把橘子剥了一桌子皮。我把登记簿摊开，拿出一支铅笔。我核账只用铅笔打勾，不用红笔。我妈说红笔写名字不吉利，我就一直没用过。","九点二十，韩岚到了。驼色大衣，进门还在讲电话，说的是英文：“OK, OK, talk tomorrow.”她冲屋里点了点头：“美国那边还没睡，不好意思。”有人小声说，副厂长现在是大老板了。韩岚没接话，在离门最近的位置坐下。","九点半，岑启明到了。","他开一辆十年前的灰色轿车，人比我想的瘦，穿一件深色夹克，像是特意挑过的。进门没有寒暄，先跟每个人点了一下头，点到守义叔的时候，停了半秒。","他坐下，打开文件夹。手机响了。","“嗯。年前那几笔，按流程走，我今天批。”他挂了电话，对大家说，“公司财务，催我签字。”","有人笑了一声：“岑总现在签字还管用啊。”","岑启明没理会。“我说一下这次的安排。我准备偿还的，是当年借款中未还的本金，二百一十万元。今天先核收款情况，有争议的逐户对，明天外地的工友到了，确认无误就付。”","会议室安静了两秒。","“多少？”","“二百一十万。”","“簿子上写着三百万！”有人一巴掌拍在桌上，杯子跳了一下。","“九十万，你又想赖掉？”","“十五年了，利息我们不讲，本金你还要打折？”","有人已经在掏手机。屋里一下子全是声音，暖气好像更闷了。","我站起来：“岑总，三百万和二百一十万之间差了九十万。请你逐笔说明。”","岑启明看着我，看了一会儿。然后目光移开，落在守义叔身上。","“先核收款，”他说，“再谈余额。”","守义叔站了起来。他没有发火，两只手往下压了压，像这十五年里每一次那样：“大家先坐下。人回来了，钱也带来了，今天不吵。一笔一笔对，对不上的，知川会写下来。”","屋里慢慢坐下了。他一说话，大家总会坐下。","我在白纸上写下“90”，后面打了一个问号。桌上的手机亮了一下，群里已经有人发出去了：“姓岑的又要赖九十万。”","我抬头的时候，屋里只有一个人没动。罗维民的手放在算盘上，岑启明报出那个数以后，他一颗珠子都没拨过。","核对从十点开始。我念名字，念到谁，谁把借据拿出来；罗维民在登记簿上找到那一行，报一遍金额，我打一个勾。","到第七户，卡住了。戚师傅的借据写着叁万，登记簿上是八万。","“你们账上多记了五万？”有人笑，“多出来的算谁的？”","罗维民没抬头：“你是两笔。一笔三万，你自己的名字；一笔五万，借据写的是你阿哥，后来你阿哥说钱是你的，并到你这一行。那张借据，你阿哥收着。”","戚师傅想了半天，说好像是有这么回事。他阿哥前年过世了，东西都在嫂子那里，他说下午去找，晚上拿过来。","我在那一行旁边写“另一张借据待补”，又看了罗维民一眼。十五年前的事，这个老会计记得比当事人还清楚。","快到中午，老胡提起了利息。","“当年银行定期才三厘多，你说月息一分，阿拉才借的。”老胡说，“我家那点钱，是征地拿的补偿，放着也是放着。现在利息不讲了，本金还打折？”","“利息我不付。”岑启明说，“借据上没写。”","“写了一分！”","“那是口头说的。”","两边又吵起来。吵到一半，老胡冷笑一声：“姓岑的，你也别觉得自己多讲良心。要不是守义阿哥年年给你寄催款信，这笔账早过时效了，你一分不还，也没人告得赢你。”","我看向守义叔。他坐在后排，两只手揣在羽绒服口袋里，只是摇了摇头，像在说这点事不值得提。","岑启明过了一会儿才说：“我知道。所以我回来了。”","中午，我妈来了。","她抱着那只饼干铁盒，站在门口，没有进来。我去接，她把借据从盒子里抽出来递给我，盒盖马上又扣上了。","借据是二〇一一年三月写的：借款人岑启明，出借人戴秀琴，二十万元，经手人陈守义、罗维民。纸已经发黄，折痕处起了毛。","我把借据摊在桌上，念了一遍。罗维民在登记簿上找到这一行，没有报数。他看着那张借据，看了很久，久到旁边的人都转过头来。","“二十万。”他终于说。","我打了一个勾。","“妈，你坐一会儿，吃了饭再走。”","“食堂还有事。”她看了守义叔一眼，又看了岑启明一眼，转身下楼了。铁盒一直抱在胸前。","那天上午，罗维民报了十九户的数。只有这一户，他停了这么久。我当时以为，他是年纪大了，眼睛不好。"],"recap":"","date":"腊月二十二","mood":"jin"},{"n":2,"cn":"二","title":"盒饭","era":"","chars":3340,"mins":8,"html":"<p data-p=\"0\">午饭是楼下快餐店送来的炒年糕，一人一盒。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>没下楼，在走廊尽头打电话。我去洗手间，路过时听见他说：“……<b class=\"rn\" data-c=\"ge\">老葛<\/b>那笔，算在本金里，先付五万，他孙子在住院。流程我现在批，你回公司以后跟年前那几笔一起走。几点都行，走掉就好。”<\/p>\n<p data-p=\"2\">老葛上午打来过视频。他人在安徽，明天才到，镜头里是县医院的走廊，他把住院单举到屏幕前面，举了很久，手一直在抖。<\/p>\n<p data-p=\"3\">我在心里过了一遍：OA上批了，只说明老板同意；钱什么时候出去，要看出纳几点去点网银。年底了，谁也说不准。我们公司也是这样，我没多想。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"4\">下午两点，岑启明从包里拿出一个牛皮纸档案袋，封口用订书机订着，上面手写“附件二”。<\/p>\n<p data-p=\"5\">“这一份，<b class=\"rn\" data-c=\"luoweimin\">罗会计<\/b>和<b class=\"rn\" data-c=\"shouyi\">守义<\/b>先对。对完，经手人签字，晚上给<b class=\"rn\" data-c=\"zhichuan\">许会计<\/b>。”<\/p>\n<p data-p=\"6\">“里面是什么？”我问。<\/p>\n<p data-p=\"7\">“跟那九十万有关的。”<\/p>\n<p data-p=\"8\">“那应该现在拿出来，大家一起看。”<\/p>\n<p data-p=\"9\">守义叔把档案袋接过去：“知川，这里面是各家签字的单子，有身份证复印件，有家里的事。先让经手的人对一遍，晚上原样给你。你是复核，最后一道是你。”<\/p>\n<p data-p=\"10\">他说得平和，也在理。上午各家的借据，也都只给我一个人看。我点了点头。<\/p>\n<p data-p=\"11\">罗维民和守义叔进了走廊另一头的档案室。那间屋子过去放厂里的旧账，铁皮柜一排排靠着墙，门上的玻璃糊着旧报纸，只露出上面一条缝。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">三点多，我下楼拿矿泉水，在楼梯拐角碰见<b class=\"rn\" data-c=\"hanlan\">韩岚<\/b>和岑启明。两个人站得很近，声音压得很低。我只听见一句：<\/p>\n<p data-p=\"13\">“当年签的那份东西，你今天别拿出来。”<\/p>\n<p data-p=\"14\">岑启明看见了我，没说话。韩岚侧身从我旁边下楼去了。院子里叉车在倒车，嘀嘀地响。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"15\">四点，罗维民从档案室出来，脸色发白，端着保温杯去接热水，接了满满一杯，一口没喝。<\/p>\n<p data-p=\"16\">岑启明在会议室门口站了一会儿：“守义，你再来一下。”<\/p>\n<p data-p=\"17\">两个人进了档案室，门关上了。<\/p>\n<p data-p=\"18\">二十分钟。门上那条缝里，能看见岑启明在说话，手指在桌上点着，一下，一下，像在报数。守义叔一直站着，没坐。<\/p>\n<p data-p=\"19\">门开了。守义叔先出来，神色和进去时没什么两样。他对还没走的几个工友说：<\/p>\n<p data-p=\"20\">“岑总的意思，明天外地的工友到齐，一户一户当面对。各家拿了多少、该拿多少，自己说，自己签字，钱直接打到各家卡上。今天先到这里。经手的留一下，晚上岑总把余额说明写出来。”<\/p>\n<p data-p=\"21\">有人问：“余额说明是什么？”<\/p>\n<p data-p=\"22\">“就是那九十万，”守义叔说，“明天说清楚。”<\/p>\n<p data-p=\"23\">他掏出手机，给楼下快餐店打电话订晚饭。<\/p>\n<p data-p=\"24\">“五份。一份不要辣。”挂了电话，他对我说，“老岑痛风，吃不了辣。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"25\">盒饭五点半送到。快餐店老板娘拎着塑料袋上楼，站在门口问：“哪个不要辣？”<\/p>\n<p data-p=\"26\">“档案室那个。”<\/p>\n<p data-p=\"27\">老板娘把最上面那盒抽出来，用记号笔在盒盖上画了一个圈。她在老街开了二十年快餐店，上林县城谁吃辣、谁痛风、谁家小孩不吃葱，她心里都有一本账。<\/p>\n<p data-p=\"28\">罗维民没动筷子。六点半，他老婆打来电话，他嗯了几声，站起来穿外套。<\/p>\n<p data-p=\"29\">“附件我对过了，字也签了。”他扣扣子，扣到最后一粒，停了停，看着我，“账上写着的，都是真的。”<\/p>\n<p data-p=\"30\">我等他往下说。罗维民把算盘夹在胳膊底下，走了。他那盒饭，盖子都没掀开。岑启明的公文包还搁在他上午坐过的那把椅子上，拉链半开着。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"31\">我把画了圈的那盒送到档案室。<\/p>\n<p data-p=\"32\">岑启明坐在两排铁皮柜中间的旧办公桌后面，台灯照着一沓稿纸。他看见我进来，把稿纸翻过去，扣在桌上。档案袋摊在他手边，口已经拆开了。<\/p>\n<p data-p=\"33\">“登记簿能不能留给我？写说明要对着看。”<\/p>\n<p data-p=\"34\">我犹豫了一下，把登记簿放在台灯底下。<\/p>\n<p data-p=\"35\">岑启明掀开盒盖，没动筷子。“你爸那个病，后来怎么样了？”<\/p>\n<p data-p=\"36\">“走了五年了。”<\/p>\n<p data-p=\"37\">“嗯。”他低头去拆筷子，塑料纸撕了半天没撕开。我想，大概是群里传的。这些年，工友群里谁家有事，没有传不到的。<\/p>\n<p data-p=\"38\">我转身要走，他叫住了我。<\/p>\n<p data-p=\"39\">“许会计。明天你核到的，可能比你想核的多。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"40\">七点半，<b class=\"rn\" data-c=\"qi\">戚师傅<\/b>回来了，满头是汗，手里攥着一张对折的纸。<\/p>\n<p data-p=\"41\">“你们猜在哪里找到的？结婚证里面！”他把纸拍在桌上，“我阿哥把要紧的东西都夹在一起，结婚证、房产证、户口本。我嫂子说，在你阿哥心里，这张纸跟房产证一样要紧。我说那不一样，房子还在，钱没了。”<\/p>\n<p data-p=\"42\">五万元，出借人戚国平，经手人陈守义、罗维民。和罗维民上午说的一字不差。<\/p>\n<p data-p=\"43\">岑启明出来看了一眼，点点头：“对，是两笔。”又回去了，门没有关严。<\/p>\n<p data-p=\"44\">桌上还剩一盒饭。戚师傅看看守义叔：“这盒是我的？”<\/p>\n<p data-p=\"45\">“算到你的。晓得你今晚肯定回来。”<\/p>\n<p data-p=\"46\">戚师傅扒了两口，抬起头：“守义阿哥，你连我回不回来都算到了。”<\/p>\n<p data-p=\"47\">“你阿哥的钱，你不会不来拿。”<\/p>\n<p data-p=\"48\">戚师傅想了想，觉得这话没毛病。吃完，他打了个饱嗝，说明天一早要跟<b class=\"rn\" data-c=\"hu\">老胡<\/b>比谁先到。七点五十，他走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">八点，守义叔把空盒子一个个摞起来，装进一只大塑料袋。他把羽绒服的袖子撸到胳膊肘，两只手腕上沾着酱油，在袋口系了个死结。<\/p>\n<p data-p=\"50\">“知川，你先回去陪陪你妈。老岑说明写好，发你手机上，你明天一早来复核。等他写完，锁了门再走。”<\/p>\n<p data-p=\"51\">我看了看走廊。档案室的门缝里透出一道黄光，偶尔有翻纸的声音。<\/p>\n<p data-p=\"52\">“那我走了。”<\/p>\n<p data-p=\"53\">“路上慢点，塘路没有路灯。”<\/p>\n<p data-p=\"54\">下楼的时候，一个戴毛线帽的姑娘抱着一摞纸箱从我身边挤过去，说了声不好意思，胶带在她手腕上缠了好几圈，像戴着一只镯子。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"55\">到家八点二十。<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>坐在电视机前，电视开着，声音关了。<\/p>\n<p data-p=\"56\">“那个岑老板，今天跟你说什么了？”<\/p>\n<p data-p=\"57\">“他说，明天我核到的，可能比我想核的多。”<\/p>\n<p data-p=\"58\">她起身去厨房，水龙头开了很久。我听见碗碰在水池边上，一下，又一下。<\/p>\n<p data-p=\"59\">快九点，楼下卷帘门哗啦啦响了一阵。我妈走到窗边看了一眼：“你守义叔回来了。”<\/p>\n<p data-p=\"60\">我趴到窗口。电器铺的灯亮了，守义叔坐在柜台后面，把那台开着后盖的电暖器搬到腿上，拿螺丝刀一颗一颗地拧螺丝。门口站着一个老头跟他说话，他一边听，一边拧。<\/p>\n<p data-p=\"61\">窗缝里飘进来一股烧纸的味道。腊月里家家谢年，老街上到处在烧，我没在意，把窗关上了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"62\">九点四十一分，群里炸了。<\/p>\n<p data-p=\"63\">最先是老葛。他不会打字，平常都用语音输入，说一句，手机替他打出来一句：<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><span class=\"t\">21:41<\/span><\/div><div class=\"msg\"><span class=\"av\" aria-hidden=\"true\">葛<\/span><div><p class=\"wwho\"><span>老葛<\/span><span class=\"vt\"><svg viewBox=\"0 0 12 12\" aria-hidden=\"true\"><rect x=\"4\" y=\"1\" width=\"4\" height=\"6.5\" rx=\"2\" fill=\"currentColor\"/><path d=\"M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11\" stroke=\"currentColor\" stroke-width=\"1.1\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>语音转文字<\/span><\/p><p class=\"wbub\" data-p=\"64\">钱到了钱到了谢谢陈老板陈老板是好人<\/p><\/div><\/div><\/div>\n<p data-p=\"65\">马上有人回：“老葛，钱是岑老板打的，不是守义阿哥。”<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"msg\"><span class=\"av\" aria-hidden=\"true\">葛<\/span><div><p class=\"wwho\"><span>老葛<\/span><span class=\"vt\"><svg viewBox=\"0 0 12 12\" aria-hidden=\"true\"><rect x=\"4\" y=\"1\" width=\"4\" height=\"6.5\" rx=\"2\" fill=\"currentColor\"/><path d=\"M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11\" stroke=\"currentColor\" stroke-width=\"1.1\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>语音转文字<\/span><\/p><p class=\"wbub\" data-p=\"66\">对啊陈老板<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"67\">山今岑！<\/p><\/div><\/div><div class=\"msg\"><span class=\"av\" aria-hidden=\"true\">葛<\/span><div><p class=\"wwho\"><span>老葛<\/span><span class=\"vt\"><svg viewBox=\"0 0 12 12\" aria-hidden=\"true\"><rect x=\"4\" y=\"1\" width=\"4\" height=\"6.5\" rx=\"2\" fill=\"currentColor\"/><path d=\"M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11\" stroke=\"currentColor\" stroke-width=\"1.1\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>语音转文字<\/span><\/p><p class=\"wbub\" data-p=\"68\">我说的就是陈老板啊<\/p><\/div><\/div><\/div>\n<p data-p=\"69\">有人发了一串笑脸。有人说，老葛那边的口音，岑和陈本来就分不清，他自己分不清，手机也分不清。又有人说，分不清也好，反正十五年了，钱的事大家都记在守义阿哥头上。<\/p>\n<p data-p=\"70\">后面的话就不太好听了。老胡问，凭什么他先拿？有人回，人家孙子在住院。老胡说，住院的就他一家？<\/p>\n<p data-p=\"71\">金彩凤的儿子发来一张借据照片，拍得清清楚楚，附了一句：这张够清楚了吧，我妈一晚上给我发了十一条语音。<\/p>\n<p data-p=\"72\">群里吵了二十多分钟。我一条条往下翻，翻到最后，发现少了一个人。<\/p>\n<p data-p=\"73\">守义叔一句话也没回。<\/p>\n<p data-p=\"74\">十五年来，群里但凡有人吵架，他总是第一个出来打圆场，事情就慢慢平了。我走到窗边，楼下电器铺的灯还亮着。他低着头，还在拧那台电暖器，手机反扣在柜台上。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"75\">十点过了，说明还没发来。<\/p>\n<p data-p=\"76\">我给岑启明打电话，没人接。五分钟后又打，还是没人接。第三次，我听完了整整一遍提示音。<\/p>\n<p data-p=\"77\">我披上外套下楼。守义叔正在拉卷帘门，拉到一半，看见我，停住了。后屋的门帘后头，他老婆问了一句：“又要出去？”他没答。<\/p>\n<p data-p=\"78\">“岑总电话一直不接。”<\/p>\n<p data-p=\"79\">“他写东西的时候，不接电话。”守义叔左手腕上贴着一张创可贴，我看了一眼。他也低头看了一眼：“电暖器的铁皮，划了一下。”<\/p>\n<p data-p=\"80\">他把卷帘门拉到底，锁好，跨上电动三轮车：“上来，一道去看看。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"81\">塘路没有路灯。三轮车的前灯照出一小块路面，两边的海塘黑沉沉的，像一道一道躺倒的墙。<\/p>\n<p data-p=\"82\">仓库的灯还亮着，年前的货打不完。那个戴毛线帽的姑娘蹲在门口吃外卖，一盒麻辣烫，看见我们，抬了一下头。吃完，她把外卖盒连袋子一起扔进门边那只绿色垃圾桶。<\/p>\n<p data-p=\"83\">二楼走廊是黑的，只有档案室门缝底下漏出一线黄光。<\/p>\n<p data-p=\"84\">我敲了敲门：“岑总？”<\/p>\n<p data-p=\"85\">没有回音。<\/p>\n<p data-p=\"86\">我推开门。<\/p>\n<p data-p=\"87\">台灯还开着，灯罩歪向一边。岑启明侧躺在两排铁皮柜之间，一只手伸向门口。椅子倒了，盒饭翻在地上，那是不放辣的一盒，撒出来的年糕是白的。铁皮柜的一个角上，有一块深色的东西，已经干了。<\/p>\n<p data-p=\"88\">我站在门口，一步也没能往前走。<\/p>\n<p data-p=\"89\">守义叔从我身后走过去，蹲下来，叫了两声“老岑”。他把手指按在岑启明的脖子上，按了很久。然后他站起来，掏出手机。<\/p>\n<p data-p=\"90\">“喂，110吗？”他的声音很稳，拿手机的那只手却一直在抖，“二塘，老恒成厂的办公楼，二楼。有人死了。”<\/p>\n<p data-p=\"91\">桌上，登记簿摊开在扉页：四十八户，共计三百万元。旁边那沓稿纸翻过来了，标题下面，只有一个“一”字，跟着一个顿号。<\/p>\n<p data-p=\"92\">地上，岑启明的手机屏幕亮了一下，又暗下去。锁屏上停着老葛发来的一条微信：<\/p>\n<div class=\"lock\" data-fx=\"lock\" role=\"group\" aria-label=\"锁屏通知，老葛\"><div class=\"lock-h\"><span class=\"av\" aria-hidden=\"true\">葛<\/span><b>老葛<\/b><span class=\"t\">21:41<\/span><\/div><p data-p=\"93\">钱到了钱到了谢谢陈老板陈老板是好人<\/p><\/div>","paras":["午饭是楼下快餐店送来的炒年糕，一人一盒。","岑启明没下楼，在走廊尽头打电话。我去洗手间，路过时听见他说：“……老葛那笔，算在本金里，先付五万，他孙子在住院。流程我现在批，你回公司以后跟年前那几笔一起走。几点都行，走掉就好。”","老葛上午打来过视频。他人在安徽，明天才到，镜头里是县医院的走廊，他把住院单举到屏幕前面，举了很久，手一直在抖。","我在心里过了一遍：OA上批了，只说明老板同意；钱什么时候出去，要看出纳几点去点网银。年底了，谁也说不准。我们公司也是这样，我没多想。","下午两点，岑启明从包里拿出一个牛皮纸档案袋，封口用订书机订着，上面手写“附件二”。","“这一份，罗会计和守义先对。对完，经手人签字，晚上给许会计。”","“里面是什么？”我问。","“跟那九十万有关的。”","“那应该现在拿出来，大家一起看。”","守义叔把档案袋接过去：“知川，这里面是各家签字的单子，有身份证复印件，有家里的事。先让经手的人对一遍，晚上原样给你。你是复核，最后一道是你。”","他说得平和，也在理。上午各家的借据，也都只给我一个人看。我点了点头。","罗维民和守义叔进了走廊另一头的档案室。那间屋子过去放厂里的旧账，铁皮柜一排排靠着墙，门上的玻璃糊着旧报纸，只露出上面一条缝。","三点多，我下楼拿矿泉水，在楼梯拐角碰见韩岚和岑启明。两个人站得很近，声音压得很低。我只听见一句：","“当年签的那份东西，你今天别拿出来。”","岑启明看见了我，没说话。韩岚侧身从我旁边下楼去了。院子里叉车在倒车，嘀嘀地响。","四点，罗维民从档案室出来，脸色发白，端着保温杯去接热水，接了满满一杯，一口没喝。","岑启明在会议室门口站了一会儿：“守义，你再来一下。”","两个人进了档案室，门关上了。","二十分钟。门上那条缝里，能看见岑启明在说话，手指在桌上点着，一下，一下，像在报数。守义叔一直站着，没坐。","门开了。守义叔先出来，神色和进去时没什么两样。他对还没走的几个工友说：","“岑总的意思，明天外地的工友到齐，一户一户当面对。各家拿了多少、该拿多少，自己说，自己签字，钱直接打到各家卡上。今天先到这里。经手的留一下，晚上岑总把余额说明写出来。”","有人问：“余额说明是什么？”","“就是那九十万，”守义叔说，“明天说清楚。”","他掏出手机，给楼下快餐店打电话订晚饭。","“五份。一份不要辣。”挂了电话，他对我说，“老岑痛风，吃不了辣。”","盒饭五点半送到。快餐店老板娘拎着塑料袋上楼，站在门口问：“哪个不要辣？”","“档案室那个。”","老板娘把最上面那盒抽出来，用记号笔在盒盖上画了一个圈。她在老街开了二十年快餐店，上林县城谁吃辣、谁痛风、谁家小孩不吃葱，她心里都有一本账。","罗维民没动筷子。六点半，他老婆打来电话，他嗯了几声，站起来穿外套。","“附件我对过了，字也签了。”他扣扣子，扣到最后一粒，停了停，看着我，“账上写着的，都是真的。”","我等他往下说。罗维民把算盘夹在胳膊底下，走了。他那盒饭，盖子都没掀开。岑启明的公文包还搁在他上午坐过的那把椅子上，拉链半开着。","我把画了圈的那盒送到档案室。","岑启明坐在两排铁皮柜中间的旧办公桌后面，台灯照着一沓稿纸。他看见我进来，把稿纸翻过去，扣在桌上。档案袋摊在他手边，口已经拆开了。","“登记簿能不能留给我？写说明要对着看。”","我犹豫了一下，把登记簿放在台灯底下。","岑启明掀开盒盖，没动筷子。“你爸那个病，后来怎么样了？”","“走了五年了。”","“嗯。”他低头去拆筷子，塑料纸撕了半天没撕开。我想，大概是群里传的。这些年，工友群里谁家有事，没有传不到的。","我转身要走，他叫住了我。","“许会计。明天你核到的，可能比你想核的多。”","七点半，戚师傅回来了，满头是汗，手里攥着一张对折的纸。","“你们猜在哪里找到的？结婚证里面！”他把纸拍在桌上，“我阿哥把要紧的东西都夹在一起，结婚证、房产证、户口本。我嫂子说，在你阿哥心里，这张纸跟房产证一样要紧。我说那不一样，房子还在，钱没了。”","五万元，出借人戚国平，经手人陈守义、罗维民。和罗维民上午说的一字不差。","岑启明出来看了一眼，点点头：“对，是两笔。”又回去了，门没有关严。","桌上还剩一盒饭。戚师傅看看守义叔：“这盒是我的？”","“算到你的。晓得你今晚肯定回来。”","戚师傅扒了两口，抬起头：“守义阿哥，你连我回不回来都算到了。”","“你阿哥的钱，你不会不来拿。”","戚师傅想了想，觉得这话没毛病。吃完，他打了个饱嗝，说明天一早要跟老胡比谁先到。七点五十，他走了。","八点，守义叔把空盒子一个个摞起来，装进一只大塑料袋。他把羽绒服的袖子撸到胳膊肘，两只手腕上沾着酱油，在袋口系了个死结。","“知川，你先回去陪陪你妈。老岑说明写好，发你手机上，你明天一早来复核。等他写完，锁了门再走。”","我看了看走廊。档案室的门缝里透出一道黄光，偶尔有翻纸的声音。","“那我走了。”","“路上慢点，塘路没有路灯。”","下楼的时候，一个戴毛线帽的姑娘抱着一摞纸箱从我身边挤过去，说了声不好意思，胶带在她手腕上缠了好几圈，像戴着一只镯子。","到家八点二十。我妈坐在电视机前，电视开着，声音关了。","“那个岑老板，今天跟你说什么了？”","“他说，明天我核到的，可能比我想核的多。”","她起身去厨房，水龙头开了很久。我听见碗碰在水池边上，一下，又一下。","快九点，楼下卷帘门哗啦啦响了一阵。我妈走到窗边看了一眼：“你守义叔回来了。”","我趴到窗口。电器铺的灯亮了，守义叔坐在柜台后面，把那台开着后盖的电暖器搬到腿上，拿螺丝刀一颗一颗地拧螺丝。门口站着一个老头跟他说话，他一边听，一边拧。","窗缝里飘进来一股烧纸的味道。腊月里家家谢年，老街上到处在烧，我没在意，把窗关上了。","九点四十一分，群里炸了。","最先是老葛。他不会打字，平常都用语音输入，说一句，手机替他打出来一句：","钱到了钱到了谢谢陈老板陈老板是好人","马上有人回：“老葛，钱是岑老板打的，不是守义阿哥。”","对啊陈老板","山今岑！","我说的就是陈老板啊","有人发了一串笑脸。有人说，老葛那边的口音，岑和陈本来就分不清，他自己分不清，手机也分不清。又有人说，分不清也好，反正十五年了，钱的事大家都记在守义阿哥头上。","后面的话就不太好听了。老胡问，凭什么他先拿？有人回，人家孙子在住院。老胡说，住院的就他一家？","金彩凤的儿子发来一张借据照片，拍得清清楚楚，附了一句：这张够清楚了吧，我妈一晚上给我发了十一条语音。","群里吵了二十多分钟。我一条条往下翻，翻到最后，发现少了一个人。","守义叔一句话也没回。","十五年来，群里但凡有人吵架，他总是第一个出来打圆场，事情就慢慢平了。我走到窗边，楼下电器铺的灯还亮着。他低着头，还在拧那台电暖器，手机反扣在柜台上。","十点过了，说明还没发来。","我给岑启明打电话，没人接。五分钟后又打，还是没人接。第三次，我听完了整整一遍提示音。","我披上外套下楼。守义叔正在拉卷帘门，拉到一半，看见我，停住了。后屋的门帘后头，他老婆问了一句：“又要出去？”他没答。","“岑总电话一直不接。”","“他写东西的时候，不接电话。”守义叔左手腕上贴着一张创可贴，我看了一眼。他也低头看了一眼：“电暖器的铁皮，划了一下。”","他把卷帘门拉到底，锁好，跨上电动三轮车：“上来，一道去看看。”","塘路没有路灯。三轮车的前灯照出一小块路面，两边的海塘黑沉沉的，像一道一道躺倒的墙。","仓库的灯还亮着，年前的货打不完。那个戴毛线帽的姑娘蹲在门口吃外卖，一盒麻辣烫，看见我们，抬了一下头。吃完，她把外卖盒连袋子一起扔进门边那只绿色垃圾桶。","二楼走廊是黑的，只有档案室门缝底下漏出一线黄光。","我敲了敲门：“岑总？”","没有回音。","我推开门。","台灯还开着，灯罩歪向一边。岑启明侧躺在两排铁皮柜之间，一只手伸向门口。椅子倒了，盒饭翻在地上，那是不放辣的一盒，撒出来的年糕是白的。铁皮柜的一个角上，有一块深色的东西，已经干了。","我站在门口，一步也没能往前走。","守义叔从我身后走过去，蹲下来，叫了两声“老岑”。他把手指按在岑启明的脖子上，按了很久。然后他站起来，掏出手机。","“喂，110吗？”他的声音很稳，拿手机的那只手却一直在抖，“二塘，老恒成厂的办公楼，二楼。有人死了。”","桌上，登记簿摊开在扉页：四十八户，共计三百万元。旁边那沓稿纸翻过来了，标题下面，只有一个“一”字，跟着一个顿号。","地上，岑启明的手机屏幕亮了一下，又暗下去。锁屏上停着老葛发来的一条微信：","钱到了钱到了谢谢陈老板陈老板是好人"],"recap":"腊月二十一，许知川回上林，被工友们推举来核四十八户的借款。腊月二十二，岑启明回到老厂，认二百一十万，登记簿上写的是三百万，差了九十万。他说，明天把余额说清楚。","date":"腊月二十二","mood":"jin"},{"n":3,"cn":"三","title":"最后见面","era":"","chars":2033,"mins":5,"html":"<p data-p=\"0\">警车是十点五十到的，两辆，没开警笛。蓝灯一路沿着塘路晃过来，把两边的海塘照得一明一暗。<\/p>\n<p data-p=\"1\">仓库的人全停了手。戴毛线帽的姑娘手里还拎着外卖袋子，站在门口，主管从里面跑出来，第一句话问的是：“警察同志，我们今晚这批货还发不发得出去？年前最后一班物流。”<\/p>\n<p data-p=\"2\">没人回答他。<\/p>\n<p data-p=\"3\">下车的人里有一个四十出头，个子不高，羽绒服拉链拉到下巴。他进门先抬头看了一眼楼梯口，墙角那个旧摄像头的线头垂着，在风里晃。<\/p>\n<p data-p=\"4\">“这个是好的吗？”<\/p>\n<p data-p=\"5\">“厂里的，”<b class=\"rn\" data-c=\"shouyi\">守义叔<\/b>说，“倒了以后就没人管了。”<\/p>\n<p data-p=\"6\">他点点头，上楼去了。后来做笔录时他报了名字：<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>，县局刑侦大队。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">我和守义叔被请到一楼仓库的值班室。屋里一股纸箱和麻辣烫的味道，墙上贴着发货排班表，腊月二十三那一格用红笔圈了三遍。<\/p>\n<p data-p=\"8\">一个年轻警察给我们倒了两杯热水。守义叔捧着杯子，没喝。他的手机在口袋里震了两回，他掏出来看一眼，按掉了。我看见屏幕上的两个字：<b class=\"rn\" data-c=\"caidi\">彩娣<\/b>。<\/p>\n<p data-p=\"9\">我给<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>打电话。她接得很快，像是一直攥着手机。<\/p>\n<p data-p=\"10\">“<b class=\"rn\" data-c=\"cenqiming\">岑老板<\/b>，”我说，“人没了。”<\/p>\n<p data-p=\"11\">那头很久没有声音。我以为断了线，喂了两声。<\/p>\n<p data-p=\"12\">“你守义叔在不在你旁边？”<\/p>\n<p data-p=\"13\">“在。”<\/p>\n<p data-p=\"14\">“那就好。”她说，“你早点回来。”<\/p>\n<p data-p=\"15\">挂了电话，我才想起来，她没问人是怎么没的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"16\">十二点过后，群里知道了。<\/p>\n<p data-p=\"17\">不知道是谁先说的，大概是仓库里有人认识工友的家里人。第一条是：“听说二塘老厂出事了？”<\/p>\n<p data-p=\"18\">第二条：“岑老板死了？”<\/p>\n<p data-p=\"19\">第三条：“那钱还给不给？”<\/p>\n<p data-p=\"20\">后面跟了一长串。有人说人死了债还在，有人说他有个女儿，女儿认不认还两说。有人问明天外地的工友还来不来，车票都买好了。<b class=\"rn\" data-c=\"hu\">老胡<\/b>发了一条，两秒钟后撤回了，群里显示“胡国良撤回了一条消息”。我没看见他写的是什么，也没人问。<\/p>\n<p data-p=\"21\">守义叔的手机一直扣在桌上。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"22\">一点左右，邵峻下来了。<\/p>\n<p data-p=\"23\">“<b class=\"rn\" data-c=\"zhichuan\">许知川<\/b>？”<\/p>\n<p data-p=\"24\">“是我。”<\/p>\n<p data-p=\"25\">“桌上那本蓝皮登记簿，是谁、什么时候放上去的？”<\/p>\n<p data-p=\"26\">“我放的。五点四十左右，他说写说明要对着看。”<\/p>\n<p data-p=\"27\">“那沓稿纸呢？”<\/p>\n<p data-p=\"28\">“他自己带的。我送盒饭进去，他把稿纸翻过去扣着。”<\/p>\n<p data-p=\"29\">“桌上原来还有什么？”<\/p>\n<p data-p=\"30\">我闭上眼睛想了一遍：台灯，盒饭，登记簿，稿纸，一支笔，一副老花镜。好像还有一样，一时想不起来。<\/p>\n<p data-p=\"31\">“想起来再告诉我。”<\/p>\n<p data-p=\"32\">他举起一个证物袋，里面是岑启明的手机。<\/p>\n<p data-p=\"33\">“八点四十一分，他给你打过电话。你知道吗？”<\/p>\n<p data-p=\"34\">我掏出手机翻通话记录。最上面是我十点多打给他的，三个，都没接通。再往下，是下午我妈打来的。八点四十一分，什么也没有。<\/p>\n<p data-p=\"35\">“没有未接来电。”<\/p>\n<p data-p=\"36\">“没拨出去，”邵峻说，“拨了，没通，就挂了。”<\/p>\n<p data-p=\"37\">我盯着自己的手机。八点四十一分，我在我妈家，厨房的水龙头开着，碗一下一下碰在水池边上。<\/p>\n<p data-p=\"38\">“老岑讲要叫你回来看说明，”守义叔在旁边说，“号码拨了一半，又说算了，写好了再叫你。”<\/p>\n<p data-p=\"39\">邵峻看了他一眼：“那时候你还在？”<\/p>\n<p data-p=\"40\">“在，在会议室收拾。他在档案室门口喊了一声。”<\/p>\n<p data-p=\"41\">“你几点走的？”<\/p>\n<p data-p=\"42\">“八点四十几。老岑讲他自己锁门，叫先回去。”<\/p>\n<p data-p=\"43\">“走的时候他在干什么？”<\/p>\n<p data-p=\"44\">“在写。”守义叔说，“台灯开着，在写。”<\/p>\n<p data-p=\"45\">邵峻在本子上记了几笔，转过来问我：“你八点二十到家，之后呢？”<\/p>\n<p data-p=\"46\">“一直在家。九点不到，我听见楼下卷帘门响，守义叔回铺子了。我在窗口看见他在修电暖器，门口还有个老头跟他说话。”<\/p>\n<p data-p=\"47\">我说完，邵峻没抬头，在本子上又记了一行。<\/p>\n<p data-p=\"48\">岑启明最后想找的人，是我。那个电话要是拨通了，我会在洗碗的水声里听见吗？我不知道。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">两点多，一个技术员进来，拿着棉签和小纸袋。<\/p>\n<p data-p=\"50\">“在场的每个人都要采一下，例行的。”<\/p>\n<p data-p=\"51\">棉签在我嘴里刮了两下，有一股塑料味。守义叔张嘴的时候很配合，张得比要求的还大。<\/p>\n<p data-p=\"52\">技术员又让他把左手伸出来。他撕开创可贴，下面是一道细长的划痕，从手腕外侧斜着拉到手背，边上还在往外渗血珠。<\/p>\n<p data-p=\"53\">“怎么弄的？”<\/p>\n<p data-p=\"54\">“电暖器的铁皮，”守义叔说，“修东西，常有的事。”<\/p>\n<p data-p=\"55\">相机闪了两下。他把创可贴按回去，按得很平。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"56\">快三点，邵峻叫我去认几个人。<\/p>\n<p data-p=\"57\">仓库主管把门口的监控调出来，在值班室的电脑上一格一格往前拖，嘴里还在念叨那批货。画面是黑白的，院子里的灯照不远，人走进来都只有半截影子。<\/p>\n<p data-p=\"58\">18:31，一个夹着算盘的老人出门。“<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>，原厂会计。”<\/p>\n<p data-p=\"59\">19:52，<b class=\"rn\" data-c=\"qi\">戚师傅<\/b>，手里拎着一个空塑料袋，走到门口，肩膀一抖，打了个饱嗝。<\/p>\n<p data-p=\"60\">20:06，是我自己。我从来没见过自己在监控里走路的样子，背比我以为的要弯。<\/p>\n<p data-p=\"61\">20:47，守义叔。羽绒服，手里拎着一只鼓鼓的大塑料袋，袋口系着结。他走到三轮车边，把袋子放进车斗，跨上车，出了画面。<\/p>\n<p data-p=\"62\">“他说是盒饭垃圾。”邵峻说。<\/p>\n<p data-p=\"63\">我点点头。那袋子是我看着他装的。<\/p>\n<p data-p=\"64\">主管又往后拖。院子空了很久，只有叉车偶尔开过去。<\/p>\n<p data-p=\"65\">21:08，一辆车开进来，停在离门最近的地方。车门开了，下来一个女人，一手把手机贴在耳边，一手拢着大衣领子。她没关车门，快步进了楼。<\/p>\n<p data-p=\"66\">21:19，她出来了。手机已经不在耳边，手里压着一个文件夹一样的东西，贴在胸前。她上车，倒车时差点蹭到纸箱，画面晃了一下，车开走了。<\/p>\n<p data-p=\"67\">邵峻按了暂停：“认识吗？”<\/p>\n<p data-p=\"68\">画面上那件大衣是浅色的，在黑白里几乎发白。可我知道它是什么颜色。早上九点二十，它站在会议室门口，冲屋里点了点头，说美国那边还没睡。<\/p>\n<p class=\"last\" data-p=\"69\">“驼色的，”我说，“是<b class=\"rn\" data-c=\"hanlan\">韩岚<\/b>。”<\/p>","paras":["警车是十点五十到的，两辆，没开警笛。蓝灯一路沿着塘路晃过来，把两边的海塘照得一明一暗。","仓库的人全停了手。戴毛线帽的姑娘手里还拎着外卖袋子，站在门口，主管从里面跑出来，第一句话问的是：“警察同志，我们今晚这批货还发不发得出去？年前最后一班物流。”","没人回答他。","下车的人里有一个四十出头，个子不高，羽绒服拉链拉到下巴。他进门先抬头看了一眼楼梯口，墙角那个旧摄像头的线头垂着，在风里晃。","“这个是好的吗？”","“厂里的，”守义叔说，“倒了以后就没人管了。”","他点点头，上楼去了。后来做笔录时他报了名字：邵峻，县局刑侦大队。","我和守义叔被请到一楼仓库的值班室。屋里一股纸箱和麻辣烫的味道，墙上贴着发货排班表，腊月二十三那一格用红笔圈了三遍。","一个年轻警察给我们倒了两杯热水。守义叔捧着杯子，没喝。他的手机在口袋里震了两回，他掏出来看一眼，按掉了。我看见屏幕上的两个字：彩娣。","我给我妈打电话。她接得很快，像是一直攥着手机。","“岑老板，”我说，“人没了。”","那头很久没有声音。我以为断了线，喂了两声。","“你守义叔在不在你旁边？”","“在。”","“那就好。”她说，“你早点回来。”","挂了电话，我才想起来，她没问人是怎么没的。","十二点过后，群里知道了。","不知道是谁先说的，大概是仓库里有人认识工友的家里人。第一条是：“听说二塘老厂出事了？”","第二条：“岑老板死了？”","第三条：“那钱还给不给？”","后面跟了一长串。有人说人死了债还在，有人说他有个女儿，女儿认不认还两说。有人问明天外地的工友还来不来，车票都买好了。老胡发了一条，两秒钟后撤回了，群里显示“胡国良撤回了一条消息”。我没看见他写的是什么，也没人问。","守义叔的手机一直扣在桌上。","一点左右，邵峻下来了。","“许知川？”","“是我。”","“桌上那本蓝皮登记簿，是谁、什么时候放上去的？”","“我放的。五点四十左右，他说写说明要对着看。”","“那沓稿纸呢？”","“他自己带的。我送盒饭进去，他把稿纸翻过去扣着。”","“桌上原来还有什么？”","我闭上眼睛想了一遍：台灯，盒饭，登记簿，稿纸，一支笔，一副老花镜。好像还有一样，一时想不起来。","“想起来再告诉我。”","他举起一个证物袋，里面是岑启明的手机。","“八点四十一分，他给你打过电话。你知道吗？”","我掏出手机翻通话记录。最上面是我十点多打给他的，三个，都没接通。再往下，是下午我妈打来的。八点四十一分，什么也没有。","“没有未接来电。”","“没拨出去，”邵峻说，“拨了，没通，就挂了。”","我盯着自己的手机。八点四十一分，我在我妈家，厨房的水龙头开着，碗一下一下碰在水池边上。","“老岑讲要叫你回来看说明，”守义叔在旁边说，“号码拨了一半，又说算了，写好了再叫你。”","邵峻看了他一眼：“那时候你还在？”","“在，在会议室收拾。他在档案室门口喊了一声。”","“你几点走的？”","“八点四十几。老岑讲他自己锁门，叫先回去。”","“走的时候他在干什么？”","“在写。”守义叔说，“台灯开着，在写。”","邵峻在本子上记了几笔，转过来问我：“你八点二十到家，之后呢？”","“一直在家。九点不到，我听见楼下卷帘门响，守义叔回铺子了。我在窗口看见他在修电暖器，门口还有个老头跟他说话。”","我说完，邵峻没抬头，在本子上又记了一行。","岑启明最后想找的人，是我。那个电话要是拨通了，我会在洗碗的水声里听见吗？我不知道。","两点多，一个技术员进来，拿着棉签和小纸袋。","“在场的每个人都要采一下，例行的。”","棉签在我嘴里刮了两下，有一股塑料味。守义叔张嘴的时候很配合，张得比要求的还大。","技术员又让他把左手伸出来。他撕开创可贴，下面是一道细长的划痕，从手腕外侧斜着拉到手背，边上还在往外渗血珠。","“怎么弄的？”","“电暖器的铁皮，”守义叔说，“修东西，常有的事。”","相机闪了两下。他把创可贴按回去，按得很平。","快三点，邵峻叫我去认几个人。","仓库主管把门口的监控调出来，在值班室的电脑上一格一格往前拖，嘴里还在念叨那批货。画面是黑白的，院子里的灯照不远，人走进来都只有半截影子。","18:31，一个夹着算盘的老人出门。“罗维民，原厂会计。”","19:52，戚师傅，手里拎着一个空塑料袋，走到门口，肩膀一抖，打了个饱嗝。","20:06，是我自己。我从来没见过自己在监控里走路的样子，背比我以为的要弯。","20:47，守义叔。羽绒服，手里拎着一只鼓鼓的大塑料袋，袋口系着结。他走到三轮车边，把袋子放进车斗，跨上车，出了画面。","“他说是盒饭垃圾。”邵峻说。","我点点头。那袋子是我看着他装的。","主管又往后拖。院子空了很久，只有叉车偶尔开过去。","21:08，一辆车开进来，停在离门最近的地方。车门开了，下来一个女人，一手把手机贴在耳边，一手拢着大衣领子。她没关车门，快步进了楼。","21:19，她出来了。手机已经不在耳边，手里压着一个文件夹一样的东西，贴在胸前。她上车，倒车时差点蹭到纸箱，画面晃了一下，车开走了。","邵峻按了暂停：“认识吗？”","画面上那件大衣是浅色的，在黑白里几乎发白。可我知道它是什么颜色。早上九点二十，它站在会议室门口，冲屋里点了点头，说美国那边还没睡。","“驼色的，”我说，“是韩岚。”"],"recap":"盒饭送到，岑启明在档案室里写“余额说明”，罗维民先走了。夜里九点四十一分，老葛的五万到账，群里吵了起来。十点过后，许知川和陈守义去老厂，岑启明死在档案室里。","date":"腊月二十二 · 夜","mood":"jin"},{"n":4,"cn":"四","title":"二〇一一","era":"插章","chars":1190,"mins":3,"html":"<p data-p=\"0\">三月，<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>把<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>叫进办公室，关上门，递过来一根烟。<\/p>\n<p data-p=\"1\">银行的贷款到期不肯续，替上家担保的那笔又落到了恒成头上。“守义，工资先发不出了。先打借条，按月息一分算，比银行高三倍。你在车间讲一句，比我讲十句好使。”<\/p>\n<p data-p=\"2\">陈守义把烟接过来，夹在耳朵上，没点。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"3\">他先去了<b class=\"rn\" data-c=\"zhigang\">小舅子<\/b>家。卢志刚刚拿到老房子的征地款，存折压在电视机底下。陈守义开口要十万，卢志刚看他姐姐。<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>剥着毛豆，头也没抬：“他要带头。他不先拿出来，谁肯拿？”<\/p>\n<p data-p=\"4\">陈守义当场写了借条：今借到卢志刚人民币拾万元整。又从内袋摸出那个巴掌大的本子，记下一行：志刚，十万。<\/p>\n<p data-p=\"5\">“自家人，还写这个。”卢志刚说。<\/p>\n<p data-p=\"6\">“账要清。”陈守义说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">四月，车间停了机器。陈守义把自家的存折摊在工作台上：十五万。<\/p>\n<p data-p=\"8\">“厂里的钱，有守义在。”<\/p>\n<p data-p=\"9\"><b class=\"rn\" data-c=\"hu\">胡国良<\/b>第一个挤过来：“守义阿哥都拿出来了，我们怕什么。”后面的人排起了队，有人拿存折，有人拿报纸包着的现金。一个刚进厂两年的小伙子问，他那三个月没发的工资，是不是也算借给厂里了。<\/p>\n<p data-p=\"10\">“按一分算，年底连本带利。”<\/p>\n<p data-p=\"11\">小伙子签字签得很慢。<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>一户一户往登记簿上写，陈守义站在他身后，每写一户，就在自己的本子上也记一笔。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">许家是晚上去的。老许手上的机油没洗干净，<b class=\"rn\" data-c=\"daixiuqin\">戴秀琴<\/b>添了一副碗筷。桌上一只青瓷碗，碗沿是齐的。老屋征地补了二十万，是留给儿子读书的。戴秀琴把存折拿出来，放回去，又拿出来。<\/p>\n<p data-p=\"13\">“守义讲的，”老许说，“不会错。”<\/p>\n<p data-p=\"14\">他们的儿子在饭桌另一头写作业，十五岁，草稿纸上全是数字。陈守义摸了摸他的头：“账算得清，以后当会计。”<\/p>\n<p data-p=\"15\"><b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>烧了一锅汤圆，把十五万的存折塞到他手里，借条看也不看：“守义，钱给你，我是放心的。”陈守义把借条一个字一个字念给她听。<\/p>\n<p data-p=\"16\"><b class=\"rn\" data-c=\"ge\">老葛<\/b>住在二塘外面的平房里。他从床底下拖出一只铁皮饼干筒，五万块钱，是他在上林打了九年工攒下的，再加两个月没发的工资，一共六万。<\/p>\n<p data-p=\"17\">“陈主任，俺们外地人，厂倒了，上哪儿找人去？”<\/p>\n<p data-p=\"18\">“找守义。外地人，更要有个靠头。”<\/p>\n<p data-p=\"19\">老葛按了手印。他儿子在屋角写作业，桌子是一只倒扣的纸箱，也是十五岁。陈守义记下：老葛，六万。他又朝屋角看了一眼。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"20\">六月，罗维民把四十八户的数加了两遍，在扉页上一笔一画写下：四十八户，共计三百万元。陈守义站在他身后，看着墨干。<\/p>\n<p data-p=\"21\">九月，副厂长<b class=\"rn\" data-c=\"hanlan\">韩岚<\/b>不来上班了，车间里传她带走了几个美国客户。订单少了一半。<\/p>\n<p data-p=\"22\">腊月二十，厂门上绕了三圈铁链，锁头上落着霜。岑启明的电话打不通了。<\/p>\n<p data-p=\"23\">门口的人越聚越多。有人拍门，有人蹲在地上抽烟，有人哭。老葛带着儿子蹲在墙根，两个人都没戴手套。<\/p>\n<p data-p=\"24\">“守义，钱呢？”<\/p>\n<p data-p=\"25\">“守义阿哥，你讲话呀！”<\/p>\n<p data-p=\"26\">陈守义喉咙里像塞着什么，半天才说出一句：“有守义在。”<\/p>\n<p data-p=\"27\">罗维民挤过来，把那本蓝皮登记簿塞到他怀里：“这本东西你收着。你讲话，他们听。”<\/p>\n<p data-p=\"28\">他抱着登记簿站了一上午，没有一个人走。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"29\">那天晚上，卢彩娣在厨房里问：“志刚那十万呢？”<\/p>\n<p data-p=\"30\">他没有回答。他开了台灯，摸出小本子，翻到最后一页，笔尖停了很久，写下一行：<\/p>\n<div class=\"doc note\"><p data-p=\"31\">四十八户，欠。<\/p><div class=\"blank\"><\/div><\/div>","paras":["三月，岑启明把陈守义叫进办公室，关上门，递过来一根烟。","银行的贷款到期不肯续，替上家担保的那笔又落到了恒成头上。“守义，工资先发不出了。先打借条，按月息一分算，比银行高三倍。你在车间讲一句，比我讲十句好使。”","陈守义把烟接过来，夹在耳朵上，没点。","他先去了小舅子家。卢志刚刚拿到老房子的征地款，存折压在电视机底下。陈守义开口要十万，卢志刚看他姐姐。卢彩娣剥着毛豆，头也没抬：“他要带头。他不先拿出来，谁肯拿？”","陈守义当场写了借条：今借到卢志刚人民币拾万元整。又从内袋摸出那个巴掌大的本子，记下一行：志刚，十万。","“自家人，还写这个。”卢志刚说。","“账要清。”陈守义说。","四月，车间停了机器。陈守义把自家的存折摊在工作台上：十五万。","“厂里的钱，有守义在。”","胡国良第一个挤过来：“守义阿哥都拿出来了，我们怕什么。”后面的人排起了队，有人拿存折，有人拿报纸包着的现金。一个刚进厂两年的小伙子问，他那三个月没发的工资，是不是也算借给厂里了。","“按一分算，年底连本带利。”","小伙子签字签得很慢。罗维民一户一户往登记簿上写，陈守义站在他身后，每写一户，就在自己的本子上也记一笔。","许家是晚上去的。老许手上的机油没洗干净，戴秀琴添了一副碗筷。桌上一只青瓷碗，碗沿是齐的。老屋征地补了二十万，是留给儿子读书的。戴秀琴把存折拿出来，放回去，又拿出来。","“守义讲的，”老许说，“不会错。”","他们的儿子在饭桌另一头写作业，十五岁，草稿纸上全是数字。陈守义摸了摸他的头：“账算得清，以后当会计。”","钟家老太烧了一锅汤圆，把十五万的存折塞到他手里，借条看也不看：“守义，钱给你，我是放心的。”陈守义把借条一个字一个字念给她听。","老葛住在二塘外面的平房里。他从床底下拖出一只铁皮饼干筒，五万块钱，是他在上林打了九年工攒下的，再加两个月没发的工资，一共六万。","“陈主任，俺们外地人，厂倒了，上哪儿找人去？”","“找守义。外地人，更要有个靠头。”","老葛按了手印。他儿子在屋角写作业，桌子是一只倒扣的纸箱，也是十五岁。陈守义记下：老葛，六万。他又朝屋角看了一眼。","六月，罗维民把四十八户的数加了两遍，在扉页上一笔一画写下：四十八户，共计三百万元。陈守义站在他身后，看着墨干。","九月，副厂长韩岚不来上班了，车间里传她带走了几个美国客户。订单少了一半。","腊月二十，厂门上绕了三圈铁链，锁头上落着霜。岑启明的电话打不通了。","门口的人越聚越多。有人拍门，有人蹲在地上抽烟，有人哭。老葛带着儿子蹲在墙根，两个人都没戴手套。","“守义，钱呢？”","“守义阿哥，你讲话呀！”","陈守义喉咙里像塞着什么，半天才说出一句：“有守义在。”","罗维民挤过来，把那本蓝皮登记簿塞到他怀里：“这本东西你收着。你讲话，他们听。”","他抱着登记簿站了一上午，没有一个人走。","那天晚上，卢彩娣在厨房里问：“志刚那十万呢？”","他没有回答。他开了台灯，摸出小本子，翻到最后一页，笔尖停了很久，写下一行：","四十八户，欠。"],"recap":"警察来了，带队的是邵峻。陈守义左手腕有一道划痕，说是电暖器铁皮划的。监控里，罗维民、戚师傅、许知川、陈守义先后离开；九点零八分，穿驼色大衣的韩岚进了楼，九点十九分出来。","date":"二〇一一年","mood":"cha"},{"n":5,"cn":"五","title":"少了一份","era":"","chars":1821,"mins":5,"html":"<p data-p=\"0\">腊月二十三，我一夜没睡。八点多，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>打电话来，说十点要我去老厂认几样东西。<\/p>\n<p data-p=\"1\">我到的时候，门口已经站了二十几个人。<\/p>\n<p data-p=\"2\">是外地的工友。他们坐了一夜的车，有人拖着行李箱，有人背着蛇皮袋，车票是群里说好的，自己先垫，回头一并算。院子里拉着警戒线，仓库的纸箱堆在线外头，像一道临时的墙。他们就站在纸箱和警戒线中间，不知道该进还是该走。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"shouyi\">守义叔<\/b>也在。他一早就来了，一个一个递矿泉水，跟每个人说同一句话：“先回去，人的事先办。”<\/p>\n<p data-p=\"4\"><b class=\"rn\" data-c=\"ge\">老葛<\/b>是最后到的。他从大巴站一路走过来，蛇皮袋扛在肩上，看见守义叔，袋子往地上一放，两只手就攥住了守义叔的手。<\/p>\n<p data-p=\"5\">“陈主任，钱收到了，五万，一分不少。”<\/p>\n<p data-p=\"6\">“是<b class=\"rn\" data-c=\"cenqiming\">老岑<\/b>打的。”守义叔说。<\/p>\n<p data-p=\"7\">“都一样，都一样。”<\/p>\n<p data-p=\"8\">老葛不太识字，群里的消息都是他儿子念给他听。他儿子昨晚在厂里上夜班，没顾上念。他从蛇皮袋里掏出两包东西，用报纸裹着，是家乡的苔干。<\/p>\n<p data-p=\"9\">“这包给陈主任。这包给岑老板，人家先给俺打的钱。”<\/p>\n<p data-p=\"10\">没人接那一包。<\/p>\n<p data-p=\"11\">守义叔看着他，嘴张了一下，没说出话来。旁边有人低声告诉了他。老葛听完，站在原地，两包苔干一手一包，像两只拎不起来的秤砣。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">十点不到，一辆警车开进院子，下来一个年轻女人。黑大衣，头发扎得很紧，眼睛是红的，脸上没有泪。<\/p>\n<p data-p=\"13\">是岑启明的女儿，<b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>。她从外地连夜赶过来，一早去了殡仪馆，又要求来看看她父亲最后待的地方。<\/p>\n<p data-p=\"14\">她没有往楼里看，先看的是我们这一群人。看了一圈，问了第一句话：<\/p>\n<p data-p=\"15\">“我爸到底欠你们多少？”<\/p>\n<p data-p=\"16\">院子里静了一下，然后一下子全是声音。<\/p>\n<p data-p=\"17\">“三百万！”<\/p>\n<p data-p=\"18\">“他只认二百一十万，九十万还赖着！”<\/p>\n<p data-p=\"19\">“人死了，钱还给不给？”<\/p>\n<p data-p=\"20\">她站着没动，等声音小下去，又问了一遍：“到底多少？”<\/p>\n<p data-p=\"21\">大家都看向我。我手里没有登记簿，那本东西还在楼上的证物袋里，可那几个数我闭着眼睛也背得出来。<\/p>\n<p data-p=\"22\">“登记簿上，四十八户，三百万。”我说，“你爸昨天说未还的是二百一十万。中间九十万，他说今天讲清楚。”<\/p>\n<p data-p=\"23\">“他讲清楚之前，就死了。”她说。<\/p>\n<p data-p=\"24\">没有人接这句话。<\/p>\n<p data-p=\"25\">老葛从人群后面挤过来，把那包没人接的苔干递给她：“岑老板的。”<\/p>\n<p data-p=\"26\">她低头看着那包报纸，看了一会儿，接了过去，抱在胸前。<\/p>\n<p data-p=\"27\">守义叔走过来，在她面前站住：“姑娘，节哀。”<\/p>\n<p data-p=\"28\">她抬头看他：“你是陈守义？”<\/p>\n<p data-p=\"29\">“是。”<\/p>\n<p data-p=\"30\">“我爸提过你。”她说，“他说你是他在上林唯一信得过的人。”<\/p>\n<p data-p=\"31\">守义叔的眼圈一下子红了，别过脸去，抬起袖口在眼睛上按了按。老葛在旁边拍了拍他的背。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"32\">十点，邵峻带我和<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>上楼。<\/p>\n<p data-p=\"33\">走廊里拉着线，档案室门口贴着封条，又被揭开了一半。地上那一片年糕已经收走了，铁皮柜的角上贴着一张编号的小黄牌，数字是7。<\/p>\n<p data-p=\"34\">邵峻没让我们碰任何东西，只让我们站在门口看。<\/p>\n<p data-p=\"35\">“这屋里的纸，哪些是昨天新放进来的？”<\/p>\n<p data-p=\"36\">我一样一样认：台灯底下原来放登记簿的地方，现在空着，登记簿已经装进了证物袋；那沓稿纸还在，翻过来的那一页上，“关于借款余额的说明”，下面一个“一”字，一个顿号；笔；老花镜，一条腿折了。<\/p>\n<p data-p=\"37\">“还有吗？”<\/p>\n<p data-p=\"38\">我盯着桌面。台灯照着的那一圈，昨天傍晚摊着一样东西，口已经拆开了，就在岑启明手边。<\/p>\n<p data-p=\"39\">“档案袋。”我说，“牛皮纸的，封口用订书机订着，上面写着附件二。昨天五点四十我送盒饭进来，它就在这里。”<\/p>\n<p data-p=\"40\">邵峻看了我一眼，转身对屋里的技术员说了句什么。两个人把桌子上下、抽屉、铁皮柜一格一格翻了一遍，又去走廊、会议室、楼梯间看了一圈。<\/p>\n<p data-p=\"41\">没有。<\/p>\n<p data-p=\"42\">技术员从走廊另一头回来，说后门的门闩是拉开的。那扇门通到二塘边上的小路，邵峻问平时锁不锁。罗维民说门闩坏了好几年，一推就开，厂里的人都晓得。他说这话的时候没看邵峻，看的是走廊尽头那扇门。<\/p>\n<p data-p=\"43\">我这才想起来，罗维民家就住在二塘河边。从那条小路走过来，不过十分钟。<\/p>\n<p data-p=\"44\">罗维民站在我旁边，两只手一直揣在袖筒里。技术员拉开铁皮柜最底下两格的时候，他往前凑了半步。那两格里是厂里的旧账，一本本码着，纸页起了波浪，边上一圈一圈黄色的水渍。<\/p>\n<p data-p=\"45\">“那年台风，”罗维民说，“二塘进过水。”<\/p>\n<p data-p=\"46\">邵峻点点头，没往下问。他回到桌边，看着那片空出来的地方。<\/p>\n<p data-p=\"47\">“账本不拿，拿附件。”他说，“拿的人，知道哪份要紧。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"48\">下楼的时候，邵峻在楼梯口叫住了罗维民。<\/p>\n<p data-p=\"49\">“附件里是什么？”<\/p>\n<p data-p=\"50\">“各家签字的单子。”<\/p>\n<p data-p=\"51\">“哪几家？”<\/p>\n<p data-p=\"52\">罗维民没回答。他看着墙角那个线头垂下来的旧摄像头，看了一会儿，说：“我只管记账。”<\/p>\n<p data-p=\"53\">“谁看过那份附件？”<\/p>\n<p data-p=\"54\">“岑启明。”罗维民说，“还有我，还有守义。”<\/p>\n<p data-p=\"55\">他说完这句，把保温杯换到另一只手上，慢慢下楼去了。<\/p>\n<p class=\"last\" data-p=\"56\">院子里，岑悦抱着那包苔干，站在警车旁边。罗维民从她身边走过，脚步顿了一下，像是想说什么，最后低着头出了院门，往二塘河边那条小路去了。<\/p>","paras":["腊月二十三，我一夜没睡。八点多，邵峻打电话来，说十点要我去老厂认几样东西。","我到的时候，门口已经站了二十几个人。","是外地的工友。他们坐了一夜的车，有人拖着行李箱，有人背着蛇皮袋，车票是群里说好的，自己先垫，回头一并算。院子里拉着警戒线，仓库的纸箱堆在线外头，像一道临时的墙。他们就站在纸箱和警戒线中间，不知道该进还是该走。","守义叔也在。他一早就来了，一个一个递矿泉水，跟每个人说同一句话：“先回去，人的事先办。”","老葛是最后到的。他从大巴站一路走过来，蛇皮袋扛在肩上，看见守义叔，袋子往地上一放，两只手就攥住了守义叔的手。","“陈主任，钱收到了，五万，一分不少。”","“是老岑打的。”守义叔说。","“都一样，都一样。”","老葛不太识字，群里的消息都是他儿子念给他听。他儿子昨晚在厂里上夜班，没顾上念。他从蛇皮袋里掏出两包东西，用报纸裹着，是家乡的苔干。","“这包给陈主任。这包给岑老板，人家先给俺打的钱。”","没人接那一包。","守义叔看着他，嘴张了一下，没说出话来。旁边有人低声告诉了他。老葛听完，站在原地，两包苔干一手一包，像两只拎不起来的秤砣。","十点不到，一辆警车开进院子，下来一个年轻女人。黑大衣，头发扎得很紧，眼睛是红的，脸上没有泪。","是岑启明的女儿，岑悦。她从外地连夜赶过来，一早去了殡仪馆，又要求来看看她父亲最后待的地方。","她没有往楼里看，先看的是我们这一群人。看了一圈，问了第一句话：","“我爸到底欠你们多少？”","院子里静了一下，然后一下子全是声音。","“三百万！”","“他只认二百一十万，九十万还赖着！”","“人死了，钱还给不给？”","她站着没动，等声音小下去，又问了一遍：“到底多少？”","大家都看向我。我手里没有登记簿，那本东西还在楼上的证物袋里，可那几个数我闭着眼睛也背得出来。","“登记簿上，四十八户，三百万。”我说，“你爸昨天说未还的是二百一十万。中间九十万，他说今天讲清楚。”","“他讲清楚之前，就死了。”她说。","没有人接这句话。","老葛从人群后面挤过来，把那包没人接的苔干递给她：“岑老板的。”","她低头看着那包报纸，看了一会儿，接了过去，抱在胸前。","守义叔走过来，在她面前站住：“姑娘，节哀。”","她抬头看他：“你是陈守义？”","“是。”","“我爸提过你。”她说，“他说你是他在上林唯一信得过的人。”","守义叔的眼圈一下子红了，别过脸去，抬起袖口在眼睛上按了按。老葛在旁边拍了拍他的背。","十点，邵峻带我和罗维民上楼。","走廊里拉着线，档案室门口贴着封条，又被揭开了一半。地上那一片年糕已经收走了，铁皮柜的角上贴着一张编号的小黄牌，数字是7。","邵峻没让我们碰任何东西，只让我们站在门口看。","“这屋里的纸，哪些是昨天新放进来的？”","我一样一样认：台灯底下原来放登记簿的地方，现在空着，登记簿已经装进了证物袋；那沓稿纸还在，翻过来的那一页上，“关于借款余额的说明”，下面一个“一”字，一个顿号；笔；老花镜，一条腿折了。","“还有吗？”","我盯着桌面。台灯照着的那一圈，昨天傍晚摊着一样东西，口已经拆开了，就在岑启明手边。","“档案袋。”我说，“牛皮纸的，封口用订书机订着，上面写着附件二。昨天五点四十我送盒饭进来，它就在这里。”","邵峻看了我一眼，转身对屋里的技术员说了句什么。两个人把桌子上下、抽屉、铁皮柜一格一格翻了一遍，又去走廊、会议室、楼梯间看了一圈。","没有。","技术员从走廊另一头回来，说后门的门闩是拉开的。那扇门通到二塘边上的小路，邵峻问平时锁不锁。罗维民说门闩坏了好几年，一推就开，厂里的人都晓得。他说这话的时候没看邵峻，看的是走廊尽头那扇门。","我这才想起来，罗维民家就住在二塘河边。从那条小路走过来，不过十分钟。","罗维民站在我旁边，两只手一直揣在袖筒里。技术员拉开铁皮柜最底下两格的时候，他往前凑了半步。那两格里是厂里的旧账，一本本码着，纸页起了波浪，边上一圈一圈黄色的水渍。","“那年台风，”罗维民说，“二塘进过水。”","邵峻点点头，没往下问。他回到桌边，看着那片空出来的地方。","“账本不拿，拿附件。”他说，“拿的人，知道哪份要紧。”","下楼的时候，邵峻在楼梯口叫住了罗维民。","“附件里是什么？”","“各家签字的单子。”","“哪几家？”","罗维民没回答。他看着墙角那个线头垂下来的旧摄像头，看了一会儿，说：“我只管记账。”","“谁看过那份附件？”","“岑启明。”罗维民说，“还有我，还有守义。”","他说完这句，把保温杯换到另一只手上，慢慢下楼去了。","院子里，岑悦抱着那包苔干，站在警车旁边。罗维民从她身边走过，脚步顿了一下，像是想说什么，最后低着头出了院门，往二塘河边那条小路去了。"],"recap":"二〇一一年，岑启明请陈守义带头借钱。陈守义向小舅子借了十万，拿出十五万，四十八户跟着签字，罗维民把总数写在登记簿上：三百万。厂倒了，陈守义在小本子最后一页写下：四十八户，欠。","date":"腊月二十三","mood":"jin"},{"n":6,"cn":"六","title":"到账","era":"","chars":2395,"mins":6,"html":"<p data-p=\"0\">外地的工友，第二天走了一大半。车票是群里说好的，自己先垫，回头一并算。现在谁也不知道回头是什么时候。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"ge\">老葛<\/b>没走。他说孙子的五万已经到了，剩下的那点，他等。<b class=\"rn\" data-c=\"shouyi\">守义叔<\/b>把他领回电器铺，在后屋支了一张行军床。<\/p>\n<p data-p=\"2\">“又往家里领人。”<b class=\"rn\" data-c=\"caidi\">卢彩娣<\/b>在厨房里说，声音不大，刚好让外面听见。<\/p>\n<p data-p=\"3\">守义叔没回嘴。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"4\">腊月二十四，守义叔骑三轮车带我去走访。他说<b class=\"rn\" data-c=\"cenyue\">岑家姑娘<\/b>在办后事，钱的事早晚要接着谈，各家的情况，我得心里有数。<\/p>\n<p data-p=\"5\">第一家是钟家，住在三塘边上。<b class=\"rn\" data-c=\"zhongtai\">钟家老太<\/b>八十多了，耳朵背，看见守义叔，老远就喊：“守义来了！”<\/p>\n<p data-p=\"6\">守义叔从车斗里拿出一条电热毯，是上个礼拜拿去修的，插头换了新的。老太非要给钱，守义叔把她的手推回去：“一个插头，几块钱的事。”<\/p>\n<p data-p=\"7\">老太拉着我的手，说我小时候她抱过我。又指着墙上老头的遗像说，那年老头子生病，要不是守义送来的那笔钱，人早就没了，还能多活三年。<\/p>\n<p data-p=\"8\">回去的路上，我问守义叔，那笔钱是怎么回事。<\/p>\n<p data-p=\"9\">“救命钱，”他说，“那年他家实在没办法。”<\/p>\n<p data-p=\"10\">他没往下说，我也没再问。三轮车颠了一下，车斗里的工具箱哐当响。<\/p>\n<p data-p=\"11\">俞家的老人瘫了十年，轮椅的刹车坏了，守义叔蹲在地上修了二十分钟，满手是油。邬家的小孩今年考上了大学，在门口贴了一张红纸，守义叔伸手把红纸翘起来的一角按平，说：“读书好。”<\/p>\n<p data-p=\"12\">一上午走了七家。每一家开门，第一句话都是“守义来了”，或者“守义阿哥来了”。没有一家问起我是谁。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"13\">中午回到铺子，老葛在门口等着。他手里拿着一条烟，是在老街小卖部买的，塑料膜还没拆。<\/p>\n<p data-p=\"14\">“陈主任，这些年……”<\/p>\n<p data-p=\"15\">守义叔没让他说完，把那条烟塞回老葛的蛇皮袋里，拉链拉上：“留着回去给你儿子。”<\/p>\n<p data-p=\"16\">老葛站在那里，拉链拉开又拉上，最后还是没拿出来。<\/p>\n<p data-p=\"17\">守义叔进了后屋。卢彩娣端着一盆洗好的青菜出来，看了一眼他的背影，跟我说：“他这个人，自己家的事从来排最后。”<\/p>\n<p data-p=\"18\">我当她是在夸他。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"19\">下午，<b class=\"rn\" data-c=\"hanlan\">韩岚<\/b>给我打了电话。<\/p>\n<p data-p=\"20\">我不知道她从哪里弄到我的号码。她说话很快，像是怕我挂断：“<b class=\"rn\" data-c=\"zhichuan\">许会计<\/b>，我是韩岚。我知道外面在传什么。”<\/p>\n<p data-p=\"21\">“警察找过你了？”<\/p>\n<p data-p=\"22\">“找过两次。我回去是拿一份文件，我自己的文件，跟钱没关系。”她停了一下，“我上楼的时候，他在档案室里，好好的。我们隔着门吵了两句，我就走了。老葛那笔钱，九点四十一分才到账，那时候他还在办事。”<\/p>\n<p data-p=\"23\">“吵什么？”<\/p>\n<p data-p=\"24\">“十五年前的事。”她说，“你跟工友们讲一声，我没有杀人。”<\/p>\n<p data-p=\"25\">她挂了电话。我站在老街上，手机还贴在耳朵边上。<\/p>\n<p data-p=\"26\">晚上群里就知道了，不知道是仓库里谁说出去的，说监控拍到韩岚九点多又回了厂里。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"27\">她早上在会议室，坐得离门最近。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"28\">副厂长当年先跑的，谁不晓得。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"29\">十五年前她就把厂掏空了，现在又来灭口。<\/p><\/div><\/div><\/div>\n<p data-p=\"30\">一条比一条狠。有人把她公司的地址发了出来，过了一会儿，又有人发，算了，让警察去查。<\/p>\n<p data-p=\"31\">也有人提到<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>。那天他走得最早，脸色不对；警察找他问了两回；他家就住在二塘河边，后门一推就开。<\/p>\n<p data-p=\"32\"><b class=\"rn\" data-c=\"hu\">老胡<\/b>说，罗会计连杀鸡都不敢。<\/p>\n<p data-p=\"33\">没人再接话。可第二天早上，罗维民去菜场买菜，好几个人看见他，都把脸转开了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"34\">腊月二十五上午，守义叔被叫去了县局。<\/p>\n<p data-p=\"35\">他是下午三点回来的。我在铺子门口等他，他把三轮车停好，没进门，在门槛上坐了下来，摸出一根烟，夹在耳朵上，没点。<\/p>\n<p data-p=\"36\">“指甲里的东西，化验出来了。”他说，“是阿拉的。”<\/p>\n<p data-p=\"37\">我没说话。<\/p>\n<p data-p=\"38\">他把左手翻过来，创可贴已经换了一张新的。<\/p>\n<p data-p=\"39\">“下午四点，在档案室里，跟<b class=\"rn\" data-c=\"cenqiming\">老岑<\/b>争那九十万，争急了，他一把抓过来。那天晚上跟你讲是铁皮划的，是不好意思。”他看着地上，“一把年纪了，被人抓了一把，讲出去难听。”<\/p>\n<p data-p=\"40\">“警察信了？”<\/p>\n<p data-p=\"41\">“信不信，阿拉也讲不出别的。”他说，“八点四十几走的时候，他还在写。”<\/p>\n<p data-p=\"42\">他走了以后，岑启明又活到了九点十分以后，韩岚说的；又活到了九点四十一分，钱还在往外打。八点五十五以后，守义叔在铺子里修电暖器，是我在窗口看见的。<\/p>\n<p data-p=\"43\">这些我都知道。我把这些在心里又过了一遍，像核一张对得上的表。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"44\">这件事傍晚就传开了。<\/p>\n<p data-p=\"45\">我以为群里会有人起疑。结果没有。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"46\">守义阿哥替我们跟姓岑的拼命，被抓了一把。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"47\">九十万，也就他敢当面去要。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"48\">警察还叫他去问话，有没有良心？<\/p><\/div><\/div><\/div>\n<p data-p=\"49\">老胡发了一条长语音，转成文字是：守义阿哥这十五年，谁家有事他不到？今天谁要是在背后讲他一句，先来跟我讲。<\/p>\n<p data-p=\"50\">下面一排大拇指。<\/p>\n<p class=\"beat\" data-p=\"51\">一道抓痕，在群里变成了一枚勋章。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"52\">晚上九点四十一分，群里有人翻出了老葛那天的消息。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"53\"><span class=\"wq\">老葛 · 腊月二十二 21:41<\/span>钱到了钱到了谢谢陈老板陈老板是好人<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"54\">九点四十一分还在打钱，说明人那时候还活着，还在办事。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"55\">韩岚九点十九分走的，监控后头再没人进去。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"56\">那就是她走之前推了他，他自己爬起来，打完钱，才倒下去的。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"57\">也可能是自己摔的。痛风的人，脚底下没根。<\/p><\/div><\/div><\/div>\n<p data-p=\"58\">我盯着那个时间看。<\/p>\n<p data-p=\"59\">九点四十一分是到账的时间，不是付款的时间。那天中午，岑启明在走廊尽头说的是：流程我现在批，你回公司以后跟年前那几笔一起走，几点都行。OA上批了，只说明老板同意；钱什么时候出去，要看出纳几点去点网银。<\/p>\n<p data-p=\"60\">岑启明九点四十一分是不是还活着，这笔钱证明不了。<\/p>\n<p data-p=\"61\">我翻出岑启明公司的电话，想打给财务问一句。打过去，是总机的录音：春节放假，正月初八上班。我正要找别的号码，守义叔在楼下喊我，叫我下去帮老葛把行军床搬到靠墙的地方。<\/p>\n<p data-p=\"62\">我下了楼。搬完床，我跟他提了一句，那笔钱可能是出纳晚上点的。<\/p>\n<p data-p=\"63\">“警察会查的。”他说，“你别掺和。岑家姑娘那边，人家在办后事，你一个电话打过去，问的是钱，像什么样子。”<\/p>\n<p data-p=\"64\">他说得在理。我把手机放回了口袋。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"65\">回到楼上，<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>的短信来了，叫我明天把各家借据的金额整理一份给他。最后一句是：岑启明的卡是外省开的，流水要发协查，过了年才调得出来。<\/p>\n<p data-p=\"66\">我把这些天收的借据复印件摊在饭桌上，一户一户往表里填。四十八户，填到一半，<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>从房间里出来，站在桌边看了一会儿，伸手从那摞复印件里抽走了一张。<\/p>\n<p data-p=\"67\">“妈？”<\/p>\n<p data-p=\"68\">“我的身份证复印件。”她说，“不想给人看。”<\/p>\n<p data-p=\"69\">她把那张纸对折了两下，攥在手里，回房间去了，门轻轻关上。<\/p>\n<p class=\"last\" data-p=\"70\">我低头看那摞复印件。她抽走的不只是身份证。那一张上面，还复印着她的借据：二十万元，出借人戴秀琴。<\/p>","paras":["外地的工友，第二天走了一大半。车票是群里说好的，自己先垫，回头一并算。现在谁也不知道回头是什么时候。","老葛没走。他说孙子的五万已经到了，剩下的那点，他等。守义叔把他领回电器铺，在后屋支了一张行军床。","“又往家里领人。”卢彩娣在厨房里说，声音不大，刚好让外面听见。","守义叔没回嘴。","腊月二十四，守义叔骑三轮车带我去走访。他说岑家姑娘在办后事，钱的事早晚要接着谈，各家的情况，我得心里有数。","第一家是钟家，住在三塘边上。钟家老太八十多了，耳朵背，看见守义叔，老远就喊：“守义来了！”","守义叔从车斗里拿出一条电热毯，是上个礼拜拿去修的，插头换了新的。老太非要给钱，守义叔把她的手推回去：“一个插头，几块钱的事。”","老太拉着我的手，说我小时候她抱过我。又指着墙上老头的遗像说，那年老头子生病，要不是守义送来的那笔钱，人早就没了，还能多活三年。","回去的路上，我问守义叔，那笔钱是怎么回事。","“救命钱，”他说，“那年他家实在没办法。”","他没往下说，我也没再问。三轮车颠了一下，车斗里的工具箱哐当响。","俞家的老人瘫了十年，轮椅的刹车坏了，守义叔蹲在地上修了二十分钟，满手是油。邬家的小孩今年考上了大学，在门口贴了一张红纸，守义叔伸手把红纸翘起来的一角按平，说：“读书好。”","一上午走了七家。每一家开门，第一句话都是“守义来了”，或者“守义阿哥来了”。没有一家问起我是谁。","中午回到铺子，老葛在门口等着。他手里拿着一条烟，是在老街小卖部买的，塑料膜还没拆。","“陈主任，这些年……”","守义叔没让他说完，把那条烟塞回老葛的蛇皮袋里，拉链拉上：“留着回去给你儿子。”","老葛站在那里，拉链拉开又拉上，最后还是没拿出来。","守义叔进了后屋。卢彩娣端着一盆洗好的青菜出来，看了一眼他的背影，跟我说：“他这个人，自己家的事从来排最后。”","我当她是在夸他。","下午，韩岚给我打了电话。","我不知道她从哪里弄到我的号码。她说话很快，像是怕我挂断：“许会计，我是韩岚。我知道外面在传什么。”","“警察找过你了？”","“找过两次。我回去是拿一份文件，我自己的文件，跟钱没关系。”她停了一下，“我上楼的时候，他在档案室里，好好的。我们隔着门吵了两句，我就走了。老葛那笔钱，九点四十一分才到账，那时候他还在办事。”","“吵什么？”","“十五年前的事。”她说，“你跟工友们讲一声，我没有杀人。”","她挂了电话。我站在老街上，手机还贴在耳朵边上。","晚上群里就知道了，不知道是仓库里谁说出去的，说监控拍到韩岚九点多又回了厂里。","她早上在会议室，坐得离门最近。","副厂长当年先跑的，谁不晓得。","十五年前她就把厂掏空了，现在又来灭口。","一条比一条狠。有人把她公司的地址发了出来，过了一会儿，又有人发，算了，让警察去查。","也有人提到罗维民。那天他走得最早，脸色不对；警察找他问了两回；他家就住在二塘河边，后门一推就开。","老胡说，罗会计连杀鸡都不敢。","没人再接话。可第二天早上，罗维民去菜场买菜，好几个人看见他，都把脸转开了。","腊月二十五上午，守义叔被叫去了县局。","他是下午三点回来的。我在铺子门口等他，他把三轮车停好，没进门，在门槛上坐了下来，摸出一根烟，夹在耳朵上，没点。","“指甲里的东西，化验出来了。”他说，“是阿拉的。”","我没说话。","他把左手翻过来，创可贴已经换了一张新的。","“下午四点，在档案室里，跟老岑争那九十万，争急了，他一把抓过来。那天晚上跟你讲是铁皮划的，是不好意思。”他看着地上，“一把年纪了，被人抓了一把，讲出去难听。”","“警察信了？”","“信不信，阿拉也讲不出别的。”他说，“八点四十几走的时候，他还在写。”","他走了以后，岑启明又活到了九点十分以后，韩岚说的；又活到了九点四十一分，钱还在往外打。八点五十五以后，守义叔在铺子里修电暖器，是我在窗口看见的。","这些我都知道。我把这些在心里又过了一遍，像核一张对得上的表。","这件事傍晚就传开了。","我以为群里会有人起疑。结果没有。","守义阿哥替我们跟姓岑的拼命，被抓了一把。","九十万，也就他敢当面去要。","警察还叫他去问话，有没有良心？","老胡发了一条长语音，转成文字是：守义阿哥这十五年，谁家有事他不到？今天谁要是在背后讲他一句，先来跟我讲。","下面一排大拇指。","一道抓痕，在群里变成了一枚勋章。","晚上九点四十一分，群里有人翻出了老葛那天的消息。","老葛 · 腊月二十二 21:41钱到了钱到了谢谢陈老板陈老板是好人","九点四十一分还在打钱，说明人那时候还活着，还在办事。","韩岚九点十九分走的，监控后头再没人进去。","那就是她走之前推了他，他自己爬起来，打完钱，才倒下去的。","也可能是自己摔的。痛风的人，脚底下没根。","我盯着那个时间看。","九点四十一分是到账的时间，不是付款的时间。那天中午，岑启明在走廊尽头说的是：流程我现在批，你回公司以后跟年前那几笔一起走，几点都行。OA上批了，只说明老板同意；钱什么时候出去，要看出纳几点去点网银。","岑启明九点四十一分是不是还活着，这笔钱证明不了。","我翻出岑启明公司的电话，想打给财务问一句。打过去，是总机的录音：春节放假，正月初八上班。我正要找别的号码，守义叔在楼下喊我，叫我下去帮老葛把行军床搬到靠墙的地方。","我下了楼。搬完床，我跟他提了一句，那笔钱可能是出纳晚上点的。","“警察会查的。”他说，“你别掺和。岑家姑娘那边，人家在办后事，你一个电话打过去，问的是钱，像什么样子。”","他说得在理。我把手机放回了口袋。","回到楼上，邵峻的短信来了，叫我明天把各家借据的金额整理一份给他。最后一句是：岑启明的卡是外省开的，流水要发协查，过了年才调得出来。","我把这些天收的借据复印件摊在饭桌上，一户一户往表里填。四十八户，填到一半，我妈从房间里出来，站在桌边看了一会儿，伸手从那摞复印件里抽走了一张。","“妈？”","“我的身份证复印件。”她说，“不想给人看。”","她把那张纸对折了两下，攥在手里，回房间去了，门轻轻关上。","我低头看那摞复印件。她抽走的不只是身份证。那一张上面，还复印着她的借据：二十万元，出借人戴秀琴。"],"recap":"岑启明的女儿岑悦赶到，当着工友问：我爸到底欠你们多少？邵峻带许知川和罗维民认现场，发现“附件二”档案袋不见了，后门的门闩是拉开的。罗维民说：我只管记账。","date":"腊月二十四","mood":"jin"},{"n":7,"cn":"七","title":"复印件","era":"","chars":1829,"mins":5,"html":"<p data-p=\"0\">腊月二十六一早，我把那张表发给了<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>。<\/p>\n<p data-p=\"1\">四十八户，一户一行：姓名，借款日期，借据金额，已还金额，原件还是复印件。<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>那一行，我照样填了：戴秀琴，二〇一一年三月，二十万元，已还：零，原件。<\/p>\n<p data-p=\"2\">填到这一行的时候，我停了一下。她昨晚抽走的那张复印件，我手里没有了，可原件我亲眼看过，<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>也报过数。我把光标移到下一行，接着往下填。<\/p>\n<p data-p=\"3\">发出去的时候是七点十二分。我妈在厨房里蒸年糕，蒸汽把窗玻璃糊得什么也看不见。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"4\">上午，<b class=\"rn\" data-c=\"ge\">老葛<\/b>要回安徽了。<\/p>\n<p data-p=\"5\">他孙子出院了，儿子在电话里催他回去过年。他把蛇皮袋重新扎好，那条烟还在里面，塑料膜都没拆。<b class=\"rn\" data-c=\"shouyi\">守义叔<\/b>陪他去汽车站，我跟着去帮他在手机上买票。<\/p>\n<p data-p=\"6\">老葛的手机是儿子淘汰下来的，屏幕裂了一道。买票的软件要验证码，验证码发过来，他把手机举得老远，眯着眼睛念，念一个数字，看我一眼，像在报一笔账。<\/p>\n<p data-p=\"7\">“陈主任，”上车前他说，“剩下的那点钱，俺不急。”<\/p>\n<p data-p=\"8\">“回去过年，”守义叔说，“钱的事有数。”<\/p>\n<p data-p=\"9\">大巴开出站，老葛隔着车窗挥手，挥了很久。守义叔站在原地，等车拐过塘路，才转身去推三轮车。<\/p>\n<p data-p=\"10\">回来的路上他一句话也没说。我问他那天下午四点在档案室吵的到底是什么，他把车把一拐，绕开路上的一个坑：“吵的就是那九十万。人都走了，还讲它做什么。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"11\">中午，<b class=\"rn\" data-c=\"cenyue\">岑悦<\/b>打来电话。号码是邵峻给她的。<\/p>\n<p data-p=\"12\">“<b class=\"rn\" data-c=\"zhichuan\">许会计<\/b>，我想要一份名单。”她说，“我爸欠的是谁，欠多少。”<\/p>\n<p data-p=\"13\">“警察那边有一份。”<\/p>\n<p data-p=\"14\">“警察那份是给警察的。”她说，“我爸的账，我认。但我要知道哪一笔是真的。”<\/p>\n<p data-p=\"15\">“九十万那一块，我也说不清。”<\/p>\n<p data-p=\"16\">她在电话那头停了一会儿：“他回来之前跟我说过，这次要把账做干净，做干净了，他才好回上林过年。”<\/p>\n<p data-p=\"17\">“他跟你说过那九十万吗？”<\/p>\n<p data-p=\"18\">“没有。他只说，有几户人家他早就还过了，钱是托人送去的。”<\/p>\n<p data-p=\"19\">“托谁？”<\/p>\n<p data-p=\"20\">“他没说。”<\/p>\n<p data-p=\"21\">我拿着电话站在老街上。对面电器铺的卷帘门开着一半，守义叔蹲在门口给一台电风扇换叶片。有几户人家早就还过了，钱是托人送去的。我把这句话在心里过了一遍，像过一张对不上的凭证，过完了，没有往下想。<\/p>\n<p data-p=\"22\">“名单我晚上发给你。”我说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"23\">下午，我去二塘河边找罗维民。<\/p>\n<p data-p=\"24\">他家是一排老房子的最后一间，门口晒着两串酱鸭，屋檐下堆着蜂窝煤。我敲了三下门，开门的是他老婆，看见是我，脸一下子沉下来。<\/p>\n<p data-p=\"25\">“他不在。”<\/p>\n<p data-p=\"26\">屋里传出算盘珠子的声音，噼噼啪啪，又停了。<\/p>\n<p data-p=\"27\">“罗伯，”我隔着他老婆的肩膀喊了一声，“就问一句，那份附件里，写的是哪几户？”<\/p>\n<p data-p=\"28\">算盘声没有再响。过了一会儿，罗维民的声音从里屋传出来，很慢：“我老了，记不清了。”<\/p>\n<p data-p=\"29\">门关上了。<\/p>\n<p data-p=\"30\">回去的路上经过菜场，两个卖菜的阿姨在议论，说罗会计那天走得最早，又住在河边，后门一推就开。另一个说，人家连杀鸡都不敢。前一个说，不敢杀鸡，不等于不敢推人。<\/p>\n<p data-p=\"31\">她们看见我，不讲了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"32\">晚饭的时候，我妈问：“那张表，你交上去了？”<\/p>\n<p data-p=\"33\">“早上交的。”<\/p>\n<p data-p=\"34\">“我那一行，你也写了？”<\/p>\n<p data-p=\"35\">“写了。二十万，已还零，原件。”<\/p>\n<p data-p=\"36\">她把一筷子青菜夹到我碗里。她自己用的还是那只缺口的青瓷碗，吃得很慢，吃到一半，放下筷子，起身去厨房洗碗。水龙头又开了很久。<\/p>\n<p data-p=\"37\">七点多，她穿上外套，说社区食堂明天有人订年夜饭，要去帮着备菜。<\/p>\n<p data-p=\"38\">我从窗口往下看。她没有往食堂的方向走，在楼下电器铺门口站住了。守义叔放下手里的电风扇，站起来。两个人说了几句话，我听不见。我妈的手比画了一下，守义叔摇了摇头，又摇了摇头。<\/p>\n<p data-p=\"39\">我妈站了一会儿，往老街另一头走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"40\">岑悦要的名单，我得附上原件照片。四十八户，有原件的我都拍了，只差我妈那一张。<\/p>\n<p data-p=\"41\">饼干铁盒不在饭桌上，也不在电视柜里。我在衣柜顶上找到了它，压在一床旧棉被下面。<\/p>\n<p data-p=\"42\">盒盖有点紧，我用指甲抠了两下才打开。<\/p>\n<p data-p=\"43\">最上面是那张借据，二〇一一年三月，二十万元，出借人戴秀琴，纸已经发黄。借据底下是一沓奖状，我小学、初中的，三好学生，数学竞赛三等奖，每一张都压得平平整整。我不知道她还留着这些。<\/p>\n<p data-p=\"44\">奖状底下，还有一张纸，对折着。<\/p>\n<p data-p=\"45\">我打开它。是一张收条，蓝色圆珠笔写的，字很工整：<\/p>\n<div class=\"doc slip\"><p data-p=\"46\">今戴秀琴出借岑启明之借款本金贰拾万元整，已全部结清。<\/p><p class=\"r\" data-p=\"47\">收款人：戴秀琴<\/p><p class=\"r\" data-p=\"48\">经手人：陈守义　罗维民<\/p><p class=\"r\" data-p=\"49\">二〇一五年十二月十八日<\/p><\/div>\n<p data-p=\"50\">我拿着那张纸，在衣柜前站了很久。<\/p>\n<p data-p=\"51\">二〇一五年冬天，我大二。那年寒假前，下学期的学费打到了我卡上，我爸在医院做透析，一周三次。我妈在电话里说，是你守义叔四处想的办法。<\/p>\n<p data-p=\"52\">我看了第二遍。收条写得有点怪，只写了“已全部结清”，没写收到多少钱。我核了七年的账，第一眼就看出来了。我把这个念头按下去，又看了一遍日期。<\/p>\n<p data-p=\"53\">我要替我妈讨的二十万，十一年前就已经还过了。<\/p>\n<p class=\"last\" data-p=\"54\">楼下的卷帘门响了一声。我妈上楼的脚步声，一级一级，近了。<\/p>","paras":["腊月二十六一早，我把那张表发给了邵峻。","四十八户，一户一行：姓名，借款日期，借据金额，已还金额，原件还是复印件。我妈那一行，我照样填了：戴秀琴，二〇一一年三月，二十万元，已还：零，原件。","填到这一行的时候，我停了一下。她昨晚抽走的那张复印件，我手里没有了，可原件我亲眼看过，罗维民也报过数。我把光标移到下一行，接着往下填。","发出去的时候是七点十二分。我妈在厨房里蒸年糕，蒸汽把窗玻璃糊得什么也看不见。","上午，老葛要回安徽了。","他孙子出院了，儿子在电话里催他回去过年。他把蛇皮袋重新扎好，那条烟还在里面，塑料膜都没拆。守义叔陪他去汽车站，我跟着去帮他在手机上买票。","老葛的手机是儿子淘汰下来的，屏幕裂了一道。买票的软件要验证码，验证码发过来，他把手机举得老远，眯着眼睛念，念一个数字，看我一眼，像在报一笔账。","“陈主任，”上车前他说，“剩下的那点钱，俺不急。”","“回去过年，”守义叔说，“钱的事有数。”","大巴开出站，老葛隔着车窗挥手，挥了很久。守义叔站在原地，等车拐过塘路，才转身去推三轮车。","回来的路上他一句话也没说。我问他那天下午四点在档案室吵的到底是什么，他把车把一拐，绕开路上的一个坑：“吵的就是那九十万。人都走了，还讲它做什么。”","中午，岑悦打来电话。号码是邵峻给她的。","“许会计，我想要一份名单。”她说，“我爸欠的是谁，欠多少。”","“警察那边有一份。”","“警察那份是给警察的。”她说，“我爸的账，我认。但我要知道哪一笔是真的。”","“九十万那一块，我也说不清。”","她在电话那头停了一会儿：“他回来之前跟我说过，这次要把账做干净，做干净了，他才好回上林过年。”","“他跟你说过那九十万吗？”","“没有。他只说，有几户人家他早就还过了，钱是托人送去的。”","“托谁？”","“他没说。”","我拿着电话站在老街上。对面电器铺的卷帘门开着一半，守义叔蹲在门口给一台电风扇换叶片。有几户人家早就还过了，钱是托人送去的。我把这句话在心里过了一遍，像过一张对不上的凭证，过完了，没有往下想。","“名单我晚上发给你。”我说。","下午，我去二塘河边找罗维民。","他家是一排老房子的最后一间，门口晒着两串酱鸭，屋檐下堆着蜂窝煤。我敲了三下门，开门的是他老婆，看见是我，脸一下子沉下来。","“他不在。”","屋里传出算盘珠子的声音，噼噼啪啪，又停了。","“罗伯，”我隔着他老婆的肩膀喊了一声，“就问一句，那份附件里，写的是哪几户？”","算盘声没有再响。过了一会儿，罗维民的声音从里屋传出来，很慢：“我老了，记不清了。”","门关上了。","回去的路上经过菜场，两个卖菜的阿姨在议论，说罗会计那天走得最早，又住在河边，后门一推就开。另一个说，人家连杀鸡都不敢。前一个说，不敢杀鸡，不等于不敢推人。","她们看见我，不讲了。","晚饭的时候，我妈问：“那张表，你交上去了？”","“早上交的。”","“我那一行，你也写了？”","“写了。二十万，已还零，原件。”","她把一筷子青菜夹到我碗里。她自己用的还是那只缺口的青瓷碗，吃得很慢，吃到一半，放下筷子，起身去厨房洗碗。水龙头又开了很久。","七点多，她穿上外套，说社区食堂明天有人订年夜饭，要去帮着备菜。","我从窗口往下看。她没有往食堂的方向走，在楼下电器铺门口站住了。守义叔放下手里的电风扇，站起来。两个人说了几句话，我听不见。我妈的手比画了一下，守义叔摇了摇头，又摇了摇头。","我妈站了一会儿，往老街另一头走了。","岑悦要的名单，我得附上原件照片。四十八户，有原件的我都拍了，只差我妈那一张。","饼干铁盒不在饭桌上，也不在电视柜里。我在衣柜顶上找到了它，压在一床旧棉被下面。","盒盖有点紧，我用指甲抠了两下才打开。","最上面是那张借据，二〇一一年三月，二十万元，出借人戴秀琴，纸已经发黄。借据底下是一沓奖状，我小学、初中的，三好学生，数学竞赛三等奖，每一张都压得平平整整。我不知道她还留着这些。","奖状底下，还有一张纸，对折着。","我打开它。是一张收条，蓝色圆珠笔写的，字很工整：","今戴秀琴出借岑启明之借款本金贰拾万元整，已全部结清。","收款人：戴秀琴","经手人：陈守义　罗维民","二〇一五年十二月十八日","我拿着那张纸，在衣柜前站了很久。","二〇一五年冬天，我大二。那年寒假前，下学期的学费打到了我卡上，我爸在医院做透析，一周三次。我妈在电话里说，是你守义叔四处想的办法。","我看了第二遍。收条写得有点怪，只写了“已全部结清”，没写收到多少钱。我核了七年的账，第一眼就看出来了。我把这个念头按下去，又看了一遍日期。","我要替我妈讨的二十万，十一年前就已经还过了。","楼下的卷帘门响了一声。我妈上楼的脚步声，一级一级，近了。"],"recap":"群里把韩岚和罗维民当成了嫌疑人。陈守义说指甲里的东西是岑启明的，下午争执时被抓。许知川看出老葛的钱“九点四十一分到账”不等于“九点四十一分付款”，被劝别掺和。整理借据表时，母亲抽走了她那一张复印件。","date":"腊月二十六","mood":"jin"},{"n":8,"cn":"八","title":"二十万","era":"","chars":1541,"mins":4,"html":"<p data-p=\"0\"><b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>推开门，第一眼就看见了衣柜前的我，和我手里那张纸。<\/p>\n<p data-p=\"1\">她没有叫，也没有过来抢。她把门关上，把外套脱下来，挂在门后的钩子上，挂了两次才挂住。然后她在饭桌边坐下，两只手放在膝盖上，像在等一个人把话说完。<\/p>\n<p data-p=\"2\">我把收条放在她面前。<\/p>\n<p data-p=\"3\">“二〇一五年十二月。”我说。<\/p>\n<p data-p=\"4\">“你大二那年。”<\/p>\n<p data-p=\"5\">窗外有人家在谢年，鞭炮一挂接一挂，响完了，远处又起来一挂。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"6\">“那年你爸一个礼拜透析三次，”她说，“医保报一半，剩下一半，我在食堂一个月挣两千八。你下学期的学费交不上，我去寻<b class=\"rn\" data-c=\"shouyi\">守义<\/b>。”<\/p>\n<p data-p=\"7\">“他怎么说？”<\/p>\n<p data-p=\"8\">“他讲，<b class=\"rn\" data-c=\"cenqiming\">岑老板<\/b>那边凑出一笔钱，不够还所有人，先还几户最急的。我们家排在前面。”她看着那张收条，“他讲，这件事不能讲出去。讲出去，四十几户都要来闹，钱就谁也拿不到了。排在后面的，也要恨我们。”<\/p>\n<p data-p=\"9\">“钱是谁送来的？”<\/p>\n<p data-p=\"10\">“守义。现金，一个信封，当着我的面数的。二十万，一张不少。”<\/p>\n<p data-p=\"11\">“然后你签了这个。”<\/p>\n<p data-p=\"12\">“签了。<b class=\"rn\" data-c=\"luoweimin\">罗会计<\/b>也在，他记了账。”<\/p>\n<p data-p=\"13\">我想起罗维民那天在会议室，看着她那张借据，看了很久，久到旁边的人都转过头来。<\/p>\n<p data-p=\"14\">“那你为什么跟我说，是守义叔想的办法？”<\/p>\n<p data-p=\"15\">“本来就是他想的办法。”她抬起头，“没有他，岑老板的钱轮不到我们家。你读书的钱，有他一份心。我想让你记着他的好。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"16\">“那你那天为什么还拿着借据去核账？”<\/p>\n<p data-p=\"17\">她不说话了。<\/p>\n<p data-p=\"18\">过了一会儿，她说：“守义没讲。是我自己想的。人家都拿着借据，我们不拿，大家就晓得我们拿过了。”<\/p>\n<p data-p=\"19\">“钱你还打算再拿一次？”<\/p>\n<p data-p=\"20\">“我不会再拿的。”她的声音一下子高了，又低下去，“到时候岑老板不给我们打，我就讲我们自己不要了，讲你在明州挣得多，不缺这点。”<\/p>\n<p data-p=\"21\">“今天晚上，你去找守义叔，说什么？”<\/p>\n<p data-p=\"22\">“我问他，人都死了，警察来了，那张表你交上去了，我们怎么办。”<\/p>\n<p data-p=\"23\">“他怎么说？”<\/p>\n<p data-p=\"24\">“他讲，不要动，等过了年再讲。”<\/p>\n<p data-p=\"25\">她说完，低头看着自己的手。手背上有烫伤的旧疤，是在食堂炸春卷落下的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"26\">我在饭桌另一头坐下来。<\/p>\n<p data-p=\"27\">那天在会议室，我站起来，对岑启明说，三百万和二百一十万之间差了九十万，请你逐笔说明。屋里的人都看着我，我说得很稳，觉得自己是在替四十八户讨一个公道。<\/p>\n<p data-p=\"28\">守义叔就坐在后排，两只手揣在羽绒服口袋里。<\/p>\n<p data-p=\"29\">他知道。九十万里有二十万是我家的，他知道。他看着我站起来，看着我对一个已经还过钱的人说“请你逐笔说明”，看着群里骂了一晚上“姓岑的又要赖九十万”。他什么也没说，只是两只手往下压了压：大家先坐下。<\/p>\n<p data-p=\"30\">岑启明那天看了我一会儿，然后目光移开，落在守义叔身上。<\/p>\n<p data-p=\"31\">“先核收款，”他说，“再谈余额。”<\/p>\n<p data-p=\"32\">我那时候以为他在推。现在我知道，他是在等。等收过钱的人自己开口，等守义叔开口。没有人开口。<\/p>\n<p data-p=\"33\">傍晚我给他送盒饭，他问：你爸那个病，后来怎么样了？他记得。那二十万是他打出去的，他知道那是一个透析病人家里的钱。<\/p>\n<p data-p=\"34\">他还说：明天你核到的，可能比你想核的多。<\/p>\n<p data-p=\"35\">他说对了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"36\">今天早上七点十二分，我给<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>发了一张表。我妈那一行：二十万元，原件。<\/p>\n<p data-p=\"37\">那是一个已经不存在的数字。我是这次核账的复核，四十八户里，我交上去的第一行假账，是我自己家的。<\/p>\n<p data-p=\"38\">我把手机拿出来，打开那张表，光标停在我妈那一行。改成“已结清”，邵峻明天就会来问是谁送的、谁经手、还有哪几户。群里会知道，老街会知道，我妈去菜场，会有人把脸转开，像今天对罗维民那样。<\/p>\n<p data-p=\"39\">我把手机扣在桌上。<\/p>\n<p data-p=\"40\">我妈一直看着我，没有劝，也没有求。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">那天晚上以后，我在心里再提到他，就不叫守义叔了。我叫他陈守义。<\/p>\n<p data-p=\"42\">他确实帮了我家，那二十万确实是他一家一家跑出来、一张一张数过来的。可他也确实看着我站起来，替他把一句谎话说得理直气壮。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"43\">快十一点了，鞭炮停了。<\/p>\n<p data-p=\"44\">我问我妈：“九十万，你那二十万只是其中一份。其余七十万呢？”<\/p>\n<p data-p=\"45\">她没回答。她把那张收条拿起来，对折，再对折，攥在手心里。<\/p>\n<p data-p=\"46\">“还有谁？”<\/p>\n<p data-p=\"47\">她看着窗外。楼下电器铺的灯早就灭了，老街上只剩一盏路灯，照着一地鞭炮的红纸屑。<\/p>\n<p class=\"last\" data-p=\"48\">“不止阿拉一家。”她说。<\/p>","paras":["我妈推开门，第一眼就看见了衣柜前的我，和我手里那张纸。","她没有叫，也没有过来抢。她把门关上，把外套脱下来，挂在门后的钩子上，挂了两次才挂住。然后她在饭桌边坐下，两只手放在膝盖上，像在等一个人把话说完。","我把收条放在她面前。","“二〇一五年十二月。”我说。","“你大二那年。”","窗外有人家在谢年，鞭炮一挂接一挂，响完了，远处又起来一挂。","“那年你爸一个礼拜透析三次，”她说，“医保报一半，剩下一半，我在食堂一个月挣两千八。你下学期的学费交不上，我去寻守义。”","“他怎么说？”","“他讲，岑老板那边凑出一笔钱，不够还所有人，先还几户最急的。我们家排在前面。”她看着那张收条，“他讲，这件事不能讲出去。讲出去，四十几户都要来闹，钱就谁也拿不到了。排在后面的，也要恨我们。”","“钱是谁送来的？”","“守义。现金，一个信封，当着我的面数的。二十万，一张不少。”","“然后你签了这个。”","“签了。罗会计也在，他记了账。”","我想起罗维民那天在会议室，看着她那张借据，看了很久，久到旁边的人都转过头来。","“那你为什么跟我说，是守义叔想的办法？”","“本来就是他想的办法。”她抬起头，“没有他，岑老板的钱轮不到我们家。你读书的钱，有他一份心。我想让你记着他的好。”","“那你那天为什么还拿着借据去核账？”","她不说话了。","过了一会儿，她说：“守义没讲。是我自己想的。人家都拿着借据，我们不拿，大家就晓得我们拿过了。”","“钱你还打算再拿一次？”","“我不会再拿的。”她的声音一下子高了，又低下去，“到时候岑老板不给我们打，我就讲我们自己不要了，讲你在明州挣得多，不缺这点。”","“今天晚上，你去找守义叔，说什么？”","“我问他，人都死了，警察来了，那张表你交上去了，我们怎么办。”","“他怎么说？”","“他讲，不要动，等过了年再讲。”","她说完，低头看着自己的手。手背上有烫伤的旧疤，是在食堂炸春卷落下的。","我在饭桌另一头坐下来。","那天在会议室，我站起来，对岑启明说，三百万和二百一十万之间差了九十万，请你逐笔说明。屋里的人都看着我，我说得很稳，觉得自己是在替四十八户讨一个公道。","守义叔就坐在后排，两只手揣在羽绒服口袋里。","他知道。九十万里有二十万是我家的，他知道。他看着我站起来，看着我对一个已经还过钱的人说“请你逐笔说明”，看着群里骂了一晚上“姓岑的又要赖九十万”。他什么也没说，只是两只手往下压了压：大家先坐下。","岑启明那天看了我一会儿，然后目光移开，落在守义叔身上。","“先核收款，”他说，“再谈余额。”","我那时候以为他在推。现在我知道，他是在等。等收过钱的人自己开口，等守义叔开口。没有人开口。","傍晚我给他送盒饭，他问：你爸那个病，后来怎么样了？他记得。那二十万是他打出去的，他知道那是一个透析病人家里的钱。","他还说：明天你核到的，可能比你想核的多。","他说对了。","今天早上七点十二分，我给邵峻发了一张表。我妈那一行：二十万元，原件。","那是一个已经不存在的数字。我是这次核账的复核，四十八户里，我交上去的第一行假账，是我自己家的。","我把手机拿出来，打开那张表，光标停在我妈那一行。改成“已结清”，邵峻明天就会来问是谁送的、谁经手、还有哪几户。群里会知道，老街会知道，我妈去菜场，会有人把脸转开，像今天对罗维民那样。","我把手机扣在桌上。","我妈一直看着我，没有劝，也没有求。","那天晚上以后，我在心里再提到他，就不叫守义叔了。我叫他陈守义。","他确实帮了我家，那二十万确实是他一家一家跑出来、一张一张数过来的。可他也确实看着我站起来，替他把一句谎话说得理直气壮。","快十一点了，鞭炮停了。","我问我妈：“九十万，你那二十万只是其中一份。其余七十万呢？”","她没回答。她把那张收条拿起来，对折，再对折，攥在手心里。","“还有谁？”","她看着窗外。楼下电器铺的灯早就灭了，老街上只剩一盏路灯，照着一地鞭炮的红纸屑。","“不止阿拉一家。”她说。"],"recap":"许知川把表交给邵峻，母亲那一行填的是“已还：零”。老葛回了安徽，岑悦想要一份名单，说有几户“早就还过了”。罗维民隔着门说：我老了，记不清了。晚上，许知川在衣柜顶的铁盒里找到一张收条：二十万，二〇一五年十二月已全部结清。","date":"腊月二十六 · 夜","mood":"deng"},{"n":9,"cn":"九","title":"冰箱","era":"","chars":1981,"mins":5,"html":"<p data-p=\"0\">腊月二十七，我又去了二塘河边。<\/p>\n<p data-p=\"1\">这回开门的是<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>自己。他穿着一件洗得发白的毛背心，手里还捏着一支铅笔，看见是我，没让开，也没关门。<\/p>\n<p data-p=\"2\">“罗伯，<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>那一行，我晓得了。”我把收条的照片给他看，“二〇一五年十二月十八日，经手人<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>、罗维民。”<\/p>\n<p data-p=\"3\">他看了一眼，又看了一眼，把铅笔夹到耳朵上。<\/p>\n<p data-p=\"4\">“账上没写的，我不晓得。”<\/p>\n<p data-p=\"5\">“这张就是账。”我说，“上面写着你的名字。”<\/p>\n<p data-p=\"6\">屋里他老婆在喊，问是谁。罗维民回头说，是戴师傅家的儿子。他老婆的声音停了一下，接着说，叫他走。<\/p>\n<p data-p=\"7\">“罗伯，”我把声音放低，“菜场上的人，现在把你当凶手看。<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>在调<b class=\"rn\" data-c=\"cenqiming\">岑启明<\/b>的银行流水，过了年就出来。到时候不用你讲，谁都晓得。”<\/p>\n<p data-p=\"8\">他站在门口，背后是一屋子算盘和账本的味道。过了很久，他转过身，对里屋说：“你去小店买两斤年糕回来。”<\/p>\n<p data-p=\"9\">“家里有年糕。”<\/p>\n<p data-p=\"10\">“再买两斤。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"11\">他老婆出门以后，罗维民没往书桌那边走，而是拉开了厨房里冰箱的冷冻层。<\/p>\n<p data-p=\"12\">冷冻层塞得满满当当：一袋年糕，两条带鱼，一包冻汤圆，一块咸肉。他把这些一样一样拿出来，摆在灶台上，从最里面抽出一个塑料袋，袋子外面结着一层霜。<\/p>\n<p data-p=\"13\">袋子里是三本账簿，硬壳，边角泡得发软，冻成了硬邦邦的一块。<\/p>\n<p data-p=\"14\">“那年台风，二塘进过水。”他说，“厂里留下的几本旧账，我搬回来的那几本，泡在水里一夜。”<\/p>\n<p data-p=\"15\">“那你冻起来做什么？”<\/p>\n<p data-p=\"16\">“台风过后，市里的号转过一篇文章，是一水阁写的，讲泡了水的书不能晒，晒了要烂，先冻起来，冻住了就不坏，以后再慢慢化。”他把塑料袋放在桌上，“我看了，就冻上了。冻了一年多，一直没舍得化。”<\/p>\n<p data-p=\"17\">我看着那袋冻硬的账簿，又看了看灶台上那两条带鱼。<\/p>\n<p data-p=\"18\">“你老婆不晓得？”<\/p>\n<p data-p=\"19\">“她晓得冰箱里有账，不晓得是哪本。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"20\">账簿要化开，得等。罗维民把它放在暖气片旁边，垫了两层报纸，泡了一壶茶，在桌子另一头坐下，开始讲。<\/p>\n<p data-p=\"21\">“二〇一五年冬天，岑启明凑出九十万。不够还所有人，守义跟他讲，先还几户最急的，不要声张，声张了，四十几户都要堵上门，钱就谁也拿不到。”<\/p>\n<p data-p=\"22\">“名单是谁定的？”<\/p>\n<p data-p=\"23\">“守义定的。岑启明那几年不敢回上林，人都见不着，只信守义。”<\/p>\n<p data-p=\"24\">“钱怎么走？”<\/p>\n<p data-p=\"25\">“岑启明从他卡上，一笔一笔打到守义卡上。守义取现金，装信封，一家一家送去。收条是守义拟的格式，各家签了字，他拿回来，我在经手人那一栏补签。打过来多少，每一笔我都记。信封里装了多少，我没看见，也没问。”<\/p>\n<p data-p=\"26\">“收条为什么只写结清，不写收到多少？”<\/p>\n<p data-p=\"27\">罗维民抬头看了我一眼：“守义讲，写结清就够了。写数目，万一传出去，人家一看就晓得拿了多少，更难听。”<\/p>\n<p data-p=\"28\">他说得很自然，像是这个道理他自己也信过很多年。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"29\">一个多钟头以后，账簿的封面软了。罗维民用一把裁纸刀，顺着页边一点一点挑开。有两页粘在一起，他挑了十几分钟，额头上出了一层汗。<\/p>\n<p data-p=\"30\">纸页起了波浪，蓝墨水洇开了，像是隔着一层水在看字。可每一行还认得出来。<\/p>\n<div class=\"doc ledger\"><p class=\"lh\" data-p=\"31\">二〇一五年十二月，岑启明汇陈守义：<\/p><p class=\"li\" data-p=\"32\"><span>戴秀琴，<\/span><span>二十万；<\/span><\/p><p class=\"li\" data-p=\"33\"><span>应国庆，<\/span><span>十五万；<\/span><\/p><p class=\"li\" data-p=\"34\"><span>胡国良，<\/span><span>十五万；<\/span><\/p><p class=\"li\" data-p=\"35\"><span>钟德明，<\/span><span>十五万；<\/span><\/p><p class=\"li\" data-p=\"36\"><span>俞阿桂，<\/span><span>十五万；<\/span><\/p><p class=\"li\" data-p=\"37\"><span>邬长海，<\/span><span>十万。<\/span><\/p><\/div>\n<p data-p=\"38\">合计九十万。每一笔后面，都有收条日期和罗维民的签名。<\/p>\n<p data-p=\"39\">我在心里算了一遍，又用手机算了一遍。三百万减九十万，二百一十万。<\/p>\n<p data-p=\"40\">岑启明那天在会议室说的数，一分没少。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">我盯着那几个名字。<\/p>\n<p data-p=\"42\">钟家，三塘边上，老太太拉着我的手，说要不是守义送来的那笔钱，老头子早就没了。陈守义跟我说，那是救命钱。救命是真的，那笔钱是岑启明还的。<\/p>\n<p data-p=\"43\">俞家，轮椅的刹车，他蹲在地上修了二十分钟。邬家，门口贴着考上大学的红纸。<\/p>\n<p data-p=\"44\"><b class=\"rn\" data-c=\"hu\">胡国良<\/b>。老胡。那天在会议室骂得最凶的是他：“姓岑的，你也别觉得自己多讲良心。”群里那句“凭什么他先拿”，也是他。<\/p>\n<p data-p=\"45\">还有<b class=\"rn\" data-c=\"yingguoqing\">应国庆<\/b>。<\/p>\n<p data-p=\"46\">“应国庆是你内弟。”我说。<\/p>\n<p data-p=\"47\">罗维民没有否认。他把裁纸刀放下，两只手摊在桌上，看着那一行。<\/p>\n<p data-p=\"48\">“我老婆的弟弟。”他说，“那年他儿子要做手术。守义问我，应家排不排前面。我讲排。”<\/p>\n<p data-p=\"49\">“所以你一直不讲。”<\/p>\n<p data-p=\"50\">“我讲了，我老婆娘家在上林就没法做人。”他停了一下，“核账那天，我晓得那九十万是怎么回事。姓岑的被人骂赖账，我坐在那里，一颗算珠都没拨。”<\/p>\n<p data-p=\"51\">他说的“姓岑的”，跟那天会议室里别人说的，是一个口气。可他说完，自己先低下了头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"52\">“罗伯，附件二里写的，就是这些？”<\/p>\n<p data-p=\"53\">“就是这些。转账记录，收条复印件，六户。”<\/p>\n<p data-p=\"54\">“那天晚上谁拿走了它，你晓得吗？”<\/p>\n<p data-p=\"55\">“我不晓得。”他说，“我六点半就回来了，我老婆可以作证。后门那条路，我十几年没走过。”<\/p>\n<p data-p=\"56\">他说完这句，抬头看我，眼睛里有一点我没见过的东西，像是怕，又像是松了一口气。<\/p>\n<p data-p=\"57\">我把那一页拍了下来，又拍了一张整本的封面。罗维民没有拦我。<\/p>\n<p data-p=\"58\">门外有脚步声，是他老婆买年糕回来了。他赶紧把账簿合上，用报纸裹好，又想了想，没有放回冰箱，推到了我面前。<\/p>\n<p data-p=\"59\">“你拿去。”他说，“反正过了年，都要晓得的。”<\/p>\n<p data-p=\"60\">我抱着那包湿漉漉的账簿走出门，二塘河边的风一吹，报纸都冻硬了。<\/p>\n<p data-p=\"61\">走到半路，我又把照片打开，看了一遍那一页的抬头。<\/p>\n<div class=\"doc ledger crop\"><p data-p=\"62\">岑启明汇陈守义。<\/p><\/div>\n<p class=\"last\" data-p=\"63\">九十万，六户人家。每一笔，都是先打到陈守义卡上，再由他送去的。<\/p>","paras":["腊月二十七，我又去了二塘河边。","这回开门的是罗维民自己。他穿着一件洗得发白的毛背心，手里还捏着一支铅笔，看见是我，没让开，也没关门。","“罗伯，我妈那一行，我晓得了。”我把收条的照片给他看，“二〇一五年十二月十八日，经手人陈守义、罗维民。”","他看了一眼，又看了一眼，把铅笔夹到耳朵上。","“账上没写的，我不晓得。”","“这张就是账。”我说，“上面写着你的名字。”","屋里他老婆在喊，问是谁。罗维民回头说，是戴师傅家的儿子。他老婆的声音停了一下，接着说，叫他走。","“罗伯，”我把声音放低，“菜场上的人，现在把你当凶手看。邵峻在调岑启明的银行流水，过了年就出来。到时候不用你讲，谁都晓得。”","他站在门口，背后是一屋子算盘和账本的味道。过了很久，他转过身，对里屋说：“你去小店买两斤年糕回来。”","“家里有年糕。”","“再买两斤。”","他老婆出门以后，罗维民没往书桌那边走，而是拉开了厨房里冰箱的冷冻层。","冷冻层塞得满满当当：一袋年糕，两条带鱼，一包冻汤圆，一块咸肉。他把这些一样一样拿出来，摆在灶台上，从最里面抽出一个塑料袋，袋子外面结着一层霜。","袋子里是三本账簿，硬壳，边角泡得发软，冻成了硬邦邦的一块。","“那年台风，二塘进过水。”他说，“厂里留下的几本旧账，我搬回来的那几本，泡在水里一夜。”","“那你冻起来做什么？”","“台风过后，市里的号转过一篇文章，是一水阁写的，讲泡了水的书不能晒，晒了要烂，先冻起来，冻住了就不坏，以后再慢慢化。”他把塑料袋放在桌上，“我看了，就冻上了。冻了一年多，一直没舍得化。”","我看着那袋冻硬的账簿，又看了看灶台上那两条带鱼。","“你老婆不晓得？”","“她晓得冰箱里有账，不晓得是哪本。”","账簿要化开，得等。罗维民把它放在暖气片旁边，垫了两层报纸，泡了一壶茶，在桌子另一头坐下，开始讲。","“二〇一五年冬天，岑启明凑出九十万。不够还所有人，守义跟他讲，先还几户最急的，不要声张，声张了，四十几户都要堵上门，钱就谁也拿不到。”","“名单是谁定的？”","“守义定的。岑启明那几年不敢回上林，人都见不着，只信守义。”","“钱怎么走？”","“岑启明从他卡上，一笔一笔打到守义卡上。守义取现金，装信封，一家一家送去。收条是守义拟的格式，各家签了字，他拿回来，我在经手人那一栏补签。打过来多少，每一笔我都记。信封里装了多少，我没看见，也没问。”","“收条为什么只写结清，不写收到多少？”","罗维民抬头看了我一眼：“守义讲，写结清就够了。写数目，万一传出去，人家一看就晓得拿了多少，更难听。”","他说得很自然，像是这个道理他自己也信过很多年。","一个多钟头以后，账簿的封面软了。罗维民用一把裁纸刀，顺着页边一点一点挑开。有两页粘在一起，他挑了十几分钟，额头上出了一层汗。","纸页起了波浪，蓝墨水洇开了，像是隔着一层水在看字。可每一行还认得出来。","二〇一五年十二月，岑启明汇陈守义：","戴秀琴，二十万；","应国庆，十五万；","胡国良，十五万；","钟德明，十五万；","俞阿桂，十五万；","邬长海，十万。","合计九十万。每一笔后面，都有收条日期和罗维民的签名。","我在心里算了一遍，又用手机算了一遍。三百万减九十万，二百一十万。","岑启明那天在会议室说的数，一分没少。","我盯着那几个名字。","钟家，三塘边上，老太太拉着我的手，说要不是守义送来的那笔钱，老头子早就没了。陈守义跟我说，那是救命钱。救命是真的，那笔钱是岑启明还的。","俞家，轮椅的刹车，他蹲在地上修了二十分钟。邬家，门口贴着考上大学的红纸。","胡国良。老胡。那天在会议室骂得最凶的是他：“姓岑的，你也别觉得自己多讲良心。”群里那句“凭什么他先拿”，也是他。","还有应国庆。","“应国庆是你内弟。”我说。","罗维民没有否认。他把裁纸刀放下，两只手摊在桌上，看着那一行。","“我老婆的弟弟。”他说，“那年他儿子要做手术。守义问我，应家排不排前面。我讲排。”","“所以你一直不讲。”","“我讲了，我老婆娘家在上林就没法做人。”他停了一下，“核账那天，我晓得那九十万是怎么回事。姓岑的被人骂赖账，我坐在那里，一颗算珠都没拨。”","他说的“姓岑的”，跟那天会议室里别人说的，是一个口气。可他说完，自己先低下了头。","“罗伯，附件二里写的，就是这些？”","“就是这些。转账记录，收条复印件，六户。”","“那天晚上谁拿走了它，你晓得吗？”","“我不晓得。”他说，“我六点半就回来了，我老婆可以作证。后门那条路，我十几年没走过。”","他说完这句，抬头看我，眼睛里有一点我没见过的东西，像是怕，又像是松了一口气。","我把那一页拍了下来，又拍了一张整本的封面。罗维民没有拦我。","门外有脚步声，是他老婆买年糕回来了。他赶紧把账簿合上，用报纸裹好，又想了想，没有放回冰箱，推到了我面前。","“你拿去。”他说，“反正过了年，都要晓得的。”","我抱着那包湿漉漉的账簿走出门，二塘河边的风一吹，报纸都冻硬了。","走到半路，我又把照片打开，看了一遍那一页的抬头。","岑启明汇陈守义。","九十万，六户人家。每一笔，都是先打到陈守义卡上，再由他送去的。"],"recap":"母亲说，二〇一五年守义当着她的面数了二十万，叫她签了收条，别说出去。许知川明白了：会议室里他请岑启明“逐笔说明”的时候，陈守义是知道的。他不再叫守义叔，叫他陈守义。母亲说：不止阿拉一家。","date":"腊月二十七","mood":"jin"},{"n":10,"cn":"十","title":"先拿的人","era":"","chars":1843,"mins":5,"html":"<p data-p=\"0\">腊月二十八一早，我把<b class=\"rn\" data-c=\"luoweimin\">罗维民<\/b>那几页账的照片发给了<b class=\"rn\" data-c=\"shaojun\">邵峻<\/b>，附了一句：六户，九十万，经手人罗维民提供，原件在我这里。<\/p>\n<p data-p=\"1\">发之前，我先改了那张表。<b class=\"rn\" data-c=\"daixiuqin\">我妈<\/b>那一行，“已还：零”，我删掉，打上：二十万，二〇一五年十二月已结清。<\/p>\n<p data-p=\"2\">邵峻十分钟后回了两个字：收到。过了一会儿，又来一条：先别外传。<\/p>\n<p data-p=\"3\">我也没打算外传。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"4\">我去找<b class=\"rn\" data-c=\"hu\">老胡<\/b>，只是想当面问一句。<\/p>\n<p data-p=\"5\">他在老街口的老年活动室打牌，四个人一桌，桌上一壶茶，烟灰缸满了。看见我进来，他把牌往桌上一扣：“<b class=\"rn\" data-c=\"zhichuan\">许会计<\/b>，有消息了？钱什么时候打？”<\/p>\n<p data-p=\"6\">我请他出来说两句。他跟着我走到门口的屋檐下，还在说<b class=\"rn\" data-c=\"cenyue\">岑家姑娘<\/b>要是敢不认，他第一个去她公司门口拉横幅。<\/p>\n<p data-p=\"7\">“胡叔，”我说，“二〇一五年十二月，你拿过十五万。”<\/p>\n<p data-p=\"8\">他的嘴还张着，话停在半截。过了几秒，脸一下子红到脖子：“你听谁讲的？”<\/p>\n<p data-p=\"9\">“账上写着。”<\/p>\n<p data-p=\"10\">“什么账？谁的账？”他的声音高了，活动室里打牌的都往外看，“我拿什么了？你一个在明州吃皇粮的，回来搅什么搅？”<\/p>\n<p data-p=\"11\">我没再说什么，转身走了。走到老街拐角，手机响了一声。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">是工友群。老胡发了一条，不是语音，是他一个字一个字打出来的：<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av\" aria-hidden=\"true\">胡<\/span><div><p class=\"wwho\"><span>老胡<\/span><\/p><p class=\"wbub\" data-p=\"13\">许家儿子来问了，你们嘴巴紧点，就讲不晓得。<\/p><\/div><\/div><\/div>\n<p data-p=\"14\">群里安静了大概十秒钟。<\/p>\n<p data-p=\"15\">然后显示：<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><p class=\"sysm\" data-p=\"16\"><span>胡国良撤回了一条消息<\/span><\/p><\/div>\n<p data-p=\"17\">已经晚了。有三个人截了图。第一张截图发出来的时候，我还站在拐角，手里攥着手机。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"18\">你们是谁？<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"19\">嘴巴紧点什么？<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"20\">老胡，你发错群了吧？<\/p><\/div><\/div><\/div>\n<p data-p=\"21\">老胡没回话。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"22\">接下来的事，快得像一瓢水泼进了热油锅。<\/p>\n<p data-p=\"23\">先说话的是钟家的孙子，二十出头，在外地读研究生，平常在群里只发过年红包。他发了一段很长的话：<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av\" aria-hidden=\"true\">钟<\/span><div><p class=\"wwho\"><span>钟家孙子<\/span><\/p><p class=\"wbub\" data-p=\"24\">我刚问了我奶奶。二〇一五年，我爷爷化疗那年，家里拿过一笔钱，是守义叔送来的。我奶奶一直以为是守义叔帮忙要来的，她不晓得这是不能讲的事。对不起大家。<\/p><\/div><\/div><\/div>\n<p data-p=\"25\">后面他又发了一句：钱要是该退，我们家退。有人回他：小孩子别闹，钱的事大人讲。<\/p>\n<p data-p=\"26\">然后是俞家。俞家的媳妇发了一张照片，是一张收条，跟我妈那张一模一样的格式：本金已全部结清。下面一句：“我家也拿过。要骂就骂。”<\/p>\n<p data-p=\"27\">邬家没说话，邬家的人默默退了群。<\/p>\n<p data-p=\"28\">有人问：拿了多少？<\/p>\n<p data-p=\"29\">没人回答。过了一会儿，<b class=\"rn\" data-c=\"yusao\">俞家媳妇<\/b>回了一句：收条上写的是结清，结清就是结清。<\/p>\n<p data-p=\"30\">又有人说：还能拿多少，借多少还多少呗。<\/p>\n<p data-p=\"31\">这句话底下，六户里没有一家出来说不是。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"32\">还有谁？<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"33\">不止这几家。<\/p><\/div><\/div><\/div>\n<p data-p=\"34\">有人说应家。<b class=\"rn\" data-c=\"yingguoqing\">应国庆<\/b>的老婆在群里，一个字没回，头像灰了。<\/p>\n<p data-p=\"35\">然后有人说：“戴师傅那天拿的是原件。罗会计盯着看了半天，你们没看见？”<\/p>\n<p data-p=\"36\">我站在老街拐角，看着这一行字。四十八户的群，三百多条消息，这一句底下，没有一个人接话。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"37\">下午，有人另外拉了一个群，叫“恒成讨债”，四十多个人。我没被拉进去，是金彩凤的儿子私下发给我的截图，问我：许会计，你妈那一份，是真的吗？<\/p>\n<p data-p=\"38\">我回：是真的。<\/p>\n<p data-p=\"39\">他回了一个“哦”，再没说话。<\/p>\n<p data-p=\"40\">老群里，有人开始叫<b class=\"rn\" data-c=\"shouyi\">陈守义<\/b>“老陈”。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"chat-h\"><span>恒成老工友（年前结清）<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"41\">老陈早就晓得，为什么不讲？<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"42\">六户的钱都是老陈一家一家送去的，名单也是他定的。<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"43\">警察下午又把老陈叫去了。<\/p><\/div><\/div><\/div>\n<p data-p=\"44\">也有人照旧叫他守义阿哥：“守义阿哥是为了大家好，讲出去，那年谁家都拿不到。”<\/p>\n<p data-p=\"45\">两种叫法在群里来来回回。<\/p>\n<p data-p=\"46\">然后有人翻出了一张旧截图，是腊月二十二夜里，老胡撤回的那条消息。原来那天晚上就有人截了，一直没发。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"群聊消息\"><div class=\"msg shot\"><span class=\"av\" aria-hidden=\"true\">胡<\/span><div><p class=\"wwho\"><span>老胡<\/span><span>旧截图 · 已撤回<\/span><\/p><p class=\"wbub\" data-p=\"47\">死得好，那九十万再也对不出来了。<\/p><\/div><\/div><\/div>\n<p data-p=\"48\">底下有人问：“老胡，对不出来，对你有什么好处？”<\/p>\n<p data-p=\"49\">老胡退群了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"50\">我妈一整天没出门。<\/p>\n<p data-p=\"51\">她的手机响了七八回，她一个都没接，把手机扣在饭桌上，跟陈守义扣手机的样子一模一样。傍晚，她说要去菜场买点菜，走到楼梯口，又回来了，说家里还有。<\/p>\n<p data-p=\"52\">快天黑的时候，我的手机开始收到私信。<\/p>\n<div class=\"chat\" role=\"group\" aria-label=\"私信\"><div class=\"chat-h\"><span>私信<\/span><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"53\">小许，你一个在明州的人，回来搅这一摊做什么？<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"54\">人都死了，钱的事过了年再讲不行吗？非要让活人过不了年？<\/p><\/div><\/div><div class=\"msg\"><span class=\"av anon\" aria-hidden=\"true\"><\/span><div><p class=\"wbub\" data-p=\"55\">你妈也拿了，你还查？<\/p><\/div><\/div><\/div>\n<p data-p=\"56\">还有一条，是一个很少说话的老工友发
