<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="《围涂》完整二十章交互式阅读器，账本三部曲第三部。">
  <title>围涂</title>
  <script>
// 首屏绘制前恢复设置，避免主题和字号闪动。存储受限时仍可阅读。
(function() {
  try {
    var root = document.documentElement;
    var tone = localStorage.getItem("wt.tone");
    if (["ye", "juan", "dang"].indexOf(tone) >= 0) {
      root.setAttribute("data-read", tone);
    }
    var size = Number(localStorage.getItem("wt.fs"));
    if ([16, 17, 18, 19, 20, 22, 24].indexOf(size) >= 0) {
      root.style.setProperty("--fs", size + "px");
    }
    if (localStorage.getItem("wt.anim") === "off") {
      root.setAttribute("data-anim", "off");
    }
  } catch (error) {
    // 隐私模式或本地文件权限可能禁止访问 localStorage。
  }
})();
</script>
  <!-- 全部样式内嵌。字体只使用本机已安装字体，不请求在线字体。 -->
  <style>
/* 围涂 · 阅读 —— 共用样式
   版式：夜里的海涂，地平线上一线门缝里漏出来的黄光；正文像摊在台灯底下的卷宗。
   默认跟随系统：深色是“夜涂”，浅色是“卷宗”；读者也可以在 Aa 里选“档案袋”。
   章首和书封永远是夜里。紧的章节偏冷，煽情的章节灯亮着，插章是旧账页。 */

/* ---------- 色板：夜涂（默认，深色在前） ---------- */
:root {
  --bg-base: #0F1315;
  --bg2-base: #161C1F;
  --rule-base: #263236;
  --bg-warm: #17110C;
  --bg2-warm: #201911;
  --rule-warm: #3A2D20;
  --bg-cha: #14120F;
  --bg2-cha: #1C1915;
  --rule-cha: #332D25;
  --ink: #E3DED2;
  --ink-2: #B3AEA2;
  --ink-3: #7F8684;
  --lamp: #E9B04A;
  /* 台灯黄：门缝里那一线 */
  --lamp-ink: #F0C46E;
  --lamp-glow: rgba(233, 176, 74, .16);
  --red: #E5574B;
  /* 红笔 */
  --red-ink: #F07A6F;
  --paper: #D6CEBC;
  /* 台灯底下的纸 */
  --paper-2: #CBC2AE;
  --paper-ink: #23211D;
  --paper-ink-2: #5B564C;
  --paper-rule: rgba(52, 76, 120, .22);
  --paper-pen: #24418C;
  /* 蓝色圆珠笔 */
  --paper-wet: #23396B;
  /* 洇开的蓝墨水 */
  --paper-red: #B3271D;
  --paper-pencil: #55554F;
  --card: #C9CDBC;
  /* 病历本的封底卡纸 */
  --cover: #2B4A78;
  /* 蓝皮登记簿 / 人造革小本子 */
  --chat: #141B1E;
  --bubble: #232D31;
  --bubble-ink: #DAD5C9;
  --av: #2F3B40;
  --av-ink: #C9D2D0;
  --sys: #7F8684;
  --bar: rgba(15, 19, 21, .86);
  --panel: #161D20;
  --sel: rgba(233, 176, 74, .28);
  --shadow: 0 22px 40px -22px rgba(0, 0, 0, .95);
  --doc-shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 18px 34px -18px rgba(0, 0, 0, .9);

  /* 夜：书封和章首，不随底色变 */
  --n-bg: #0A0E10;
  --n-bg-warm: #120C07;
  --n-bg-cha: #15110C;
  --n-ink: #ECE6D8;
  --n-ink-2: #A9AEAA;
  --n-ink-3: #737B79;
  --n-tide: #3D5B63;
  --n-lamp: #F2B544;
  --n-red: #E0483E;
  --n-line: rgba(236, 230, 216, .32);
  --n-on-lamp: #17110A;
  --lock-bg: #1B2225;
  --lock-ink: #EDEAE3;
  --lock-av: #3A4549;
  /* 书封插图：夕阳海涂（一幅画，不随底色变） */
  --s-sky1: #9AB2C5;
  --s-sky2: #C6D2D8;
  --s-sky3: #EBD8C6;
  --s-sky4: #F7E3C4;
  --s-sun: #FFF5DE;
  --s-text: #22292D;
  --s-text-2: rgba(34, 41, 45, .74);
  --s-line: rgba(34, 41, 45, .3);
  --s-ink: #FFF8EE;
  --s-chip: rgba(255, 250, 242, .72);
  --s-glow: rgba(255, 255, 255, .55);
  --s-shade: rgba(242, 236, 226, .5);
  --s-cloud: #E6C9BC;
  --s-mist: #FFFFFF;
  --s-fly: #5C6570;
  --s-far: #8D949B;
  --s-sea: #F4E2C6;
  --s-mud1: #A59B92;
  --s-mud2: #5B544E;
  --s-pool1: #F9ECD6;
  --s-pool2: #B6C7D0;
  --s-ripple: rgba(250, 244, 234, .4);
  --s-shim: #FFF7E2;
  --s-dark: #4A4542;
  --s-egret: #FFFFFF;
  --gz-line: rgba(196, 72, 52, .45);
  /* 稿纸格子、本子边线：纸上的颜色，不随底色变 */
  --stain: rgba(126, 98, 58, .2);

  /* 底色样片（不随模式变） */
  --sw-ye: #0F1315;
  --sw-ye-ink: #E9B04A;
  --sw-juan: #ECE9E2;
  --sw-juan-ink: #1B2023;
  --sw-dang: #E2D3B5;
  --sw-dang-ink: #2A2016;

  --fs: 19px;
  --bar-h: 52px;
  --serif: "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "Ma Shan Zheng", "Noto Serif SC", serif;
  /* 工整的手写 */
  --pen: "Long Cang", "Kaiti SC", "STKaiti", "KaiTi", "Ma Shan Zheng", cursive;
  /* 随手的圆珠笔 */
  color-scheme: dark;
}

/* ---------- 卷宗：跟随系统浅色（读者没自己选的时候） ---------- */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-read]) {
    --bg-base: #ECE9E2;
    --bg2-base: #E2DED5;
    --rule-base: #CFC9BD;
    --bg-warm: #F3EADA;
    --bg2-warm: #EADFCB;
    --rule-warm: #DCCAAB;
    --bg-cha: #EAE4D7;
    --bg2-cha: #E0D8C8;
    --rule-cha: #D3C8B4;
    --ink: #1B2023;
    --ink-2: #464C4F;
    --ink-3: #6C7376;
    --lamp: #B07510;
    --lamp-ink: #875A06;
    --lamp-glow: rgba(214, 150, 30, .16);
    --red: #B7362A;
    --red-ink: #A02C21;
    --paper: #FBF9F3;
    --paper-2: #F2EEE4;
    --card: #DDE1D2;
    --chat: #E0DCD2;
    --bubble: #FBFAF6;
    --bubble-ink: #202528;
    --av: #C9CFCB;
    --av-ink: #34413F;
    --sys: #6F7578;
    --bar: rgba(236, 233, 226, .9);
    --panel: #F7F5F0;
    --sel: rgba(214, 150, 30, .25);
    --shadow: 0 16px 36px -22px rgba(30, 40, 45, .45);
    --doc-shadow: 0 1px 0 rgba(30, 40, 45, .08), 0 14px 30px -18px rgba(30, 40, 45, .45);
    color-scheme: light;
  }
}

:root[data-theme="light"]:not([data-read]),
:root[data-read="juan"] {
  --bg-base: #ECE9E2;
  --bg2-base: #E2DED5;
  --rule-base: #CFC9BD;
  --bg-warm: #F3EADA;
  --bg2-warm: #EADFCB;
  --rule-warm: #DCCAAB;
  --bg-cha: #EAE4D7;
  --bg2-cha: #E0D8C8;
  --rule-cha: #D3C8B4;
  --ink: #1B2023;
  --ink-2: #464C4F;
  --ink-3: #6C7376;
  --lamp: #B07510;
  --lamp-ink: #875A06;
  --lamp-glow: rgba(214, 150, 30, .16);
  --red: #B7362A;
  --red-ink: #A02C21;
  --paper: #FBF9F3;
  --paper-2: #F2EEE4;
  --card: #DDE1D2;
  --chat: #E0DCD2;
  --bubble: #FBFAF6;
  --bubble-ink: #202528;
  --av: #C9CFCB;
  --av-ink: #34413F;
  --sys: #6F7578;
  --bar: rgba(236, 233, 226, .9);
  --panel: #F7F5F0;
  --sel: rgba(214, 150, 30, .25);
  --shadow: 0 16px 36px -22px rgba(30, 40, 45, .45);
  --doc-shadow: 0 1px 0 rgba(30, 40, 45, .08), 0 14px 30px -18px rgba(30, 40, 45, .45);
  color-scheme: light;
}

/* ---------- 档案袋（读者自选：牛皮纸） ---------- */
:root[data-read="dang"] {
  --bg-base: #E2D3B5;
  --bg2-base: #D8C7A5;
  --rule-base: #C4AF88;
  --bg-warm: #E9D4AC;
  --bg2-warm: #E0C89C;
  --rule-warm: #CBAE7F;
  --bg-cha: #DCCAA6;
  --bg2-cha: #D2BE96;
  --rule-cha: #BFA67C;
  --ink: #2A2016;
  --ink-2: #54473A;
  --ink-3: #6B5C48;
  --lamp: #8F5C08;
  --lamp-ink: #774C04;
  --lamp-glow: rgba(170, 110, 10, .16);
  --red: #A8321F;
  --red-ink: #922A19;
  --paper: #F6EFE0;
  --paper-2: #ECE2CD;
  --card: #DCDCC6;
  --chat: #D5C4A1;
  --bubble: #F5EEDF;
  --bubble-ink: #2A2016;
  --av: #C3AF8A;
  --av-ink: #3B2F22;
  --sys: #6B5C48;
  --bar: rgba(226, 211, 181, .92);
  --panel: #F0E6D2;
  --sel: rgba(143, 92, 8, .22);
  --shadow: 0 16px 36px -22px rgba(80, 55, 20, .5);
  --doc-shadow: 0 1px 0 rgba(80, 55, 20, .1), 0 14px 30px -18px rgba(80, 55, 20, .5);
  color-scheme: light;
}

/* 读者在浅色系统里明确选了“夜涂”：用 :root 上的深色值 */
:root[data-read="ye"] {
  color-scheme: dark;
}

/* ---------- 章节的情绪：紧 / 灯 / 插章 ---------- */
:root {
  --bg: var(--bg-base);
  --bg-2: var(--bg2-base);
  --rule: var(--rule-base);
  --mood: var(--ink-3);
  --head-bg: var(--n-bg);
}

:root[data-mood="deng"] {
  --bg: var(--bg-warm);
  --bg-2: var(--bg2-warm);
  --rule: var(--rule-warm);
  --mood: var(--lamp);
  --head-bg: var(--n-bg-warm);
}

:root[data-mood="cha"] {
  --bg: var(--bg-cha);
  --bg-2: var(--bg2-cha);
  --rule: var(--rule-cha);
  --mood: var(--red);
  --head-bg: var(--n-bg-cha);
}

@media (max-width: 600px) {
  :root {
    --fs: 18px;
    --bar-h: 48px;
  }
}

/* ---------- 基础 ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-text-size-adjust: 100%;
}

[hidden] {
  display: none !important;
}

img,
svg,
canvas {
  max-width: 100%;
}

html {
  scroll-padding-top: calc(var(--bar-h) + 16px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color .4s ease, color .4s ease;
}

::selection {
  background: var(--sel);
}

a {
  color: inherit;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--lamp);
  outline-offset: 3px;
  border-radius: 4px;
}

.page {
  min-height: 100vh;
  overflow-x: clip;
}

/* ---------- 顶栏 ---------- */
.bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(1.2) blur(12px);
  backdrop-filter: saturate(1.2) blur(12px);
  border-bottom: 1px solid var(--rule);
  font-family: var(--sans);
  color: var(--ink);
  transition: background-color .3s ease, border-color .3s ease, color .3s ease;
}

.bar.over {
  background: transparent;
  border-color: transparent;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  color: var(--n-ink);
}

.bar-home {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  text-decoration: none;
  font-size: 14px;
  letter-spacing: .14em;
  padding: 8px 8px 8px 2px;
  border-radius: 8px;
  flex: none;
}

.bar-home svg {
  width: 20px;
  height: 20px;
}

.bar-home.mark {
  font-family: var(--serif);
  font-weight: 900;
  font-size: 17px;
  letter-spacing: .3em;
  padding-left: 6px;
}

.bar-mid {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: .16em;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
}

.bar.show-title .bar-mid {
  opacity: 1;
  transform: none;
}

.bar-tools {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
  margin-left: auto;
}

.tool {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 36px;
  padding: 0 10px;
  border-radius: 999px;
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: .12em;
}

.tool svg {
  width: 20px;
  height: 20px;
}

.tool:hover {
  border-color: var(--rule);
}

.bar.over .tool:hover {
  border-color: var(--n-line);
}

.tool[aria-pressed="true"] {
  color: var(--lamp-ink);
  border-color: var(--lamp);
}

.bar.over .tool[aria-pressed="true"] {
  color: var(--n-lamp);
  border-color: var(--n-lamp);
}

.tool.armed {
  border-style: dashed;
  border-color: var(--lamp);
}

.aa {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: .02em;
}

@media (max-width: 380px) {
  .tool-l {
    display: none;
  }
}

.bar-prog {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  overflow: hidden;
  transition: opacity .3s ease;
}

.bar.over .bar-prog {
  opacity: 0;
}

.bar-prog i {
  display: block;
  height: 100%;
  background: var(--lamp);
  transform-origin: 0 50%;
  transform: scaleX(0);
}

/* ---------- 设置面板 ---------- */
.panel {
  position: fixed;
  z-index: 40;
  top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 8px);
  right: max(12px, env(safe-area-inset-right, 0px));
  width: min(330px, calc(100vw - 24px));
  display: grid;
  gap: 18px;
  padding: 18px;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 14px;
  box-shadow: var(--shadow);
  font-family: var(--sans);
}

.set-label {
  display: block;
  margin-bottom: 8px;
  font-size: 12px;
  letter-spacing: .3em;
  color: var(--ink-3);
}

.swatches {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.sw {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 10px 4px 8px;
  border-radius: 10px;
  background: transparent;
  border: 1px solid var(--rule);
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--ink-2);
  cursor: pointer;
}

.sw i {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  font-style: normal;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 18px;
  box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .25);
}

.sw[data-read="ye"] i {
  background: var(--sw-ye);
  color: var(--sw-ye-ink);
}

.sw[data-read="juan"] i {
  background: var(--sw-juan);
  color: var(--sw-juan-ink);
}

.sw[data-read="dang"] i {
  background: var(--sw-dang);
  color: var(--sw-dang-ink);
}

.sw[aria-pressed="true"] {
  border-color: var(--lamp);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--lamp);
}

.stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stepper button {
  width: 44px;
  height: 38px;
  border-radius: 10px;
  background: var(--bg-2);
  border: 1px solid var(--rule);
  cursor: pointer;
  font-family: var(--serif);
}

.stepper button:disabled {
  opacity: .35;
  cursor: default;
}

.stepper .s {
  font-size: 13px;
}

.stepper .l {
  font-size: 20px;
}

.stepper output {
  flex: 1;
  text-align: center;
  font-size: 14px;
  letter-spacing: .1em;
  font-variant-numeric: tabular-nums;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.switch-row .set-label {
  margin: 0;
}

.switch {
  position: relative;
  width: 48px;
  height: 26px;
  flex: none;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: var(--bg-2);
  cursor: pointer;
  transition: background-color .2s ease, border-color .2s ease;
}

.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink-3);
  transition: transform .2s ease, background-color .2s ease;
}

.switch[aria-checked="true"] {
  border-color: var(--lamp);
  background: var(--lamp-glow);
}

.switch[aria-checked="true"]::after {
  transform: translateX(22px);
  background: var(--lamp);
}

.panel-note {
  margin: 0;
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink-3);
  letter-spacing: .04em;
}

/* ---------- 章首：夜里的海涂 ---------- */
.ch-head {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: var(--head-bg);
  color: var(--n-ink);
  min-height: clamp(360px, 60vh, 580px);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 28px) 16px 34px;
}

.ch-head .scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  display: block;
}

.ch-head::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 120px;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(rgba(0, 0, 0, .45), transparent);
}

.ch-head::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 58%;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--head-bg) 88%);
}

.ch-head-in {
  width: 100%;
  max-width: 32em;
  margin: 0 auto;
  font-size: var(--fs);
}

.case {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--n-ink-3);
}

.case i {
  flex: 0 0 34px;
  height: 1px;
  background: var(--n-ink-3);
  opacity: .6;
}

.case b {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .22em;
  color: var(--n-lamp);
}

:root[data-mood="cha"] .case b {
  color: var(--n-red);
}

.ch-no {
  margin: 18px 0 6px;
  font-size: 15px;
  letter-spacing: .4em;
  color: var(--n-ink-2);
}

.ch-title {
  margin: 0;
  font-size: clamp(42px, 10.5vw, 78px);
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: .06em;
  text-wrap: balance;
}

:root[data-mood="cha"] .ch-title {
  font-weight: 600;
  letter-spacing: .14em;
}

.ch-meta {
  margin: 16px 0 0;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: .12em;
  color: var(--n-ink-3);
  font-variant-numeric: tabular-nums;
}

/* ---------- 正文 ---------- */
.text {
  max-width: 32em;
  margin: 0 auto;
  padding: 44px 16px 8px;
  font-size: var(--fs);
  line-height: 1.92;
  letter-spacing: .01em;
}

:root[data-mood="deng"] .text {
  line-height: 2.02;
}

.text>p {
  margin: 0 0 .9em;
  text-indent: 2em;
  text-align: justify;
}

.text>* {
  scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 18px);
}

.text>p.beat {
  text-indent: 0;
  margin: 1.5em 0;
  font-weight: 600;
  letter-spacing: .03em;
}

.text>p.beat.red {
  color: var(--red-ink);
}

.text>p.num {
  text-indent: 0;
  margin: .7em 0 .8em;
  font-size: 1.9em;
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1.3;
  color: var(--red-ink);
}

.text>p.last {
  margin-top: 1.3em;
  font-weight: 600;
}

:root[data-mood="deng"] .text>p.last {
  color: var(--lamp-ink);
}

.text>p.ending {
  text-indent: 0;
  margin: 3.4em 0 0;
  font-size: 1.14em;
  font-weight: 600;
  letter-spacing: .08em;
}

/* 换场：三道由近及远的塘 */
.brk {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  margin: 2.3em auto 2.2em;
}

.brk i {
  display: block;
  height: 1px;
  background: var(--mood);
  opacity: .75;
}

.brk i:nth-child(1) {
  width: 46px;
}

.brk i:nth-child(2) {
  width: 28px;
  opacity: .55;
}

.brk i:nth-child(3) {
  width: 12px;
  opacity: .4;
}

:root[data-mood="deng"] .brk i {
  height: 1.5px;
}

/* 行内：红笔、手写、铅笔 */
.redpen {
  font-family: var(--pen);
  color: var(--red-ink);
  font-size: 1.12em;
  letter-spacing: .04em;
}

.hand {
  font-family: var(--kai);
  font-size: 1.08em;
  letter-spacing: .04em;
}

.pencil {
  font-family: var(--pen);
  color: var(--ink-2);
  font-size: 1.1em;
  letter-spacing: .04em;
}

/* ---------- 证物：纸 ---------- */
.doc {
  position: relative;
  margin: 1.9em auto;
  max-width: 25em;
  text-indent: 0;
  color: var(--paper-ink);
  background: var(--paper);
  box-shadow: var(--doc-shadow);
}

.doc p {
  margin: 0;
  text-indent: 0;
}

/* 稿纸：关于余额的说明 */
.gaozhi {
  --cell: 1.55em;
  --gz: var(--gz-line);
  width: fit-content;
  max-width: 100%;
  padding: 1em 1.1em 1.1em;
  font-family: var(--kai);
  transform: rotate(-.6deg);
}

.gz-row {
  display: grid;
  grid-template-columns: repeat(10, var(--cell));
  border-left: 1px solid var(--gz);
}

.gz-row+.gz-row {
  margin-top: .42em;
}

.gz-row span {
  display: grid;
  place-items: center;
  height: var(--cell);
  border: 1px solid var(--gz);
  border-left: 0;
  font-size: 1.04em;
  line-height: 1;
  color: var(--paper-ink);
}

@media (max-width: 400px) {
  .gaozhi {
    --cell: 1.42em;
    padding-inline: .8em;
  }
}

/* 登记簿扉页 */
.fly {
  max-width: 21em;
  padding: 2.2em 1.2em 2em 1.5em;
  border-left: 12px solid var(--cover);
  text-align: center;
  font-family: var(--kai);
  font-size: 1.12em;
  letter-spacing: .08em;
  color: var(--paper-wet);
  transform: rotate(.4deg);
}

/* 收条：蓝色圆珠笔，对折过 */
.slip {
  max-width: 24em;
  padding: 1.3em 1.4em 1.2em;
  font-family: var(--kai);
  color: var(--paper-pen);
  line-height: 2.25;
  background:
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(0, 0, 0, .07) 50%, transparent calc(50% + 1px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.25em - 1px), var(--paper-rule) calc(2.25em - 1px), var(--paper-rule) 2.25em) 0 1.3em / 100% calc(100% - 2.5em) no-repeat,
    var(--paper);
  transform: rotate(-.7deg);
}

.slip p:first-child {
  text-indent: 2em;
}

.slip .r {
  text-align: right;
}

/* 罗维民的账簿：泡过水，蓝墨水洇开 */
.ledger {
  max-width: 24em;
  padding: 1.3em 1.5em 1.4em;
  font-family: var(--kai);
  color: var(--paper-wet);
  line-height: 2.05;
  text-shadow: 0 0 1.2px rgba(35, 57, 107, .7), 0 0 5px rgba(35, 57, 107, .28);
  background:
    radial-gradient(ellipse 60% 38% at 18% 26%, rgba(126, 98, 58, .2), transparent 70%),
    radial-gradient(ellipse 48% 30% at 84% 74%, rgba(126, 98, 58, .17), transparent 70%),
    radial-gradient(ellipse 30% 22% at 60% 12%, rgba(126, 98, 58, .12), transparent 70%),
    var(--paper-2);
  border-radius: 2px 6px 3px 8px / 6px 3px 8px 2px;
  transform: rotate(.5deg) skewX(-.6deg);
}

.ledger .lh {
  padding-bottom: .2em;
  margin-bottom: .3em;
  border-bottom: 1px solid var(--paper-rule);
}

.ledger .li {
  display: grid;
  grid-template-columns: 5.2em auto;
  gap: .4em;
  padding-left: 1em;
}

.ledger.crop {
  max-width: 17em;
  padding: .8em 1.2em;
  text-align: center;
  font-size: 1.08em;
  letter-spacing: .1em;
}

/* 协议复印件 */
.contract {
  max-width: 26em;
  padding: 1.7em 1.5em 1.4em;
  font-size: .93em;
  line-height: 1.95;
  color: var(--paper-ink);
  background:
    radial-gradient(rgba(0, 0, 0, .09) .6px, transparent .9px) 0 0 / 7px 9px,
    radial-gradient(rgba(0, 0, 0, .06) .5px, transparent .8px) 3px 4px / 11px 13px,
    linear-gradient(90deg, rgba(0, 0, 0, .06), transparent 6%, transparent 94%, rgba(0, 0, 0, .08)),
    var(--paper-2);
  filter: grayscale(1);
}

.contract::before {
  content: "复印件";
  position: absolute;
  top: .55em;
  right: .8em;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .3em;
  color: var(--paper-ink-2);
  opacity: .8;
}

.contract p+p {
  margin-top: .55em;
}

.contract b {
  font-family: var(--sans);
  font-weight: 700;
}

/* 守义的小本子：巴掌大，蓝色人造革 */
.note {
  max-width: 15.5em;
  padding: 1em 1.1em .9em 2em;
  border-top: 9px solid var(--cover);
  border-radius: 3px 3px 2px 2px;
  font-family: var(--kai);
  color: var(--paper-ink);
  line-height: 2.1;
  background:
    linear-gradient(90deg, transparent 1.45em, var(--gz-line) 1.45em, var(--gz-line) calc(1.45em + 1px), transparent calc(1.45em + 1px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.1em - 1px), var(--paper-rule) calc(2.1em - 1px), var(--paper-rule) 2.1em) 0 1em / 100% 100% no-repeat,
    var(--paper);
  transform: rotate(-.8deg);
}

.note p {
  font-size: 1.12em;
  letter-spacing: .08em;
}

.note .blank {
  height: 2.1em;
}

.note.big p {
  font-size: 2.1em;
  line-height: 1;
  padding: .2em 0 .1em;
}

/* 钟家老太的病历本，封底内侧 */
.medical {
  max-width: 21em;
  padding: 1.1em 1.1em 1.2em 1.2em;
  font-family: var(--pen);
  color: var(--paper-pen);
  line-height: 1.95;
  font-size: 1.02em;
  background:
    radial-gradient(ellipse at 90% 10%, rgba(0, 0, 0, .06), transparent 50%),
    var(--card);
  border-radius: 2px;
  transform: rotate(.9deg);
}

.medical p:nth-child(1) {
  transform: rotate(-1.4deg) translateX(.1em);
}

.medical p:nth-child(2) {
  transform: rotate(.9deg) translateX(.5em);
}

.medical p:nth-child(3) {
  transform: rotate(-.6deg) translateX(.25em);
}

.medical p:nth-child(4) {
  transform: rotate(1.3deg) translateX(.45em);
}

.medical p:nth-child(5) {
  transform: rotate(-1deg) translateX(.15em);
  margin-top: .35em;
}

.scratch-t {
  position: relative;
  display: inline-block;
}

.scratch-t::after {
  content: "";
  position: absolute;
  left: -.1em;
  right: -.15em;
  bottom: .02em;
  height: 2px;
  background: var(--paper-ink-2);
  border-radius: 2px;
  opacity: .75;
  transform: scaleX(0) rotate(-2deg);
  transform-origin: 0 50%;
  transition: transform .9s cubic-bezier(.3, .7, .2, 1) .2s;
}

.scratch-t.on::after {
  transform: scaleX(1) rotate(-2deg);
}

/* 母亲那一行：红字一行，铅笔一行 */
.entry {
  max-width: 26em;
  padding: .55em 1.1em;
  font-family: var(--pen);
  font-size: 1.12em;
  line-height: 1.85;
  background:
    linear-gradient(to bottom, var(--paper-rule) 1px, transparent 1px) 0 0 / 100% 100%,
    linear-gradient(to top, var(--paper-rule) 1px, transparent 1px) 0 0 / 100% 100%,
    var(--paper);
}

.entry.red {
  color: var(--paper-red);
  letter-spacing: .08em;
}

.entry.pencil {
  color: var(--paper-pencil);
  font-size: 1.02em;
  letter-spacing: .02em;
}

/* 报告附注 */
.text>.fn {
  margin: 1.1em 0;
  padding: .85em 1em .9em 1.1em;
  border-left: 3px solid var(--rule);
  background: var(--bg-2);
  font-size: .93em;
  line-height: 1.85;
  text-indent: 0;
  text-align: justify;
}

.text>.fn.slow {
  border-left-color: var(--lamp);
}

.fn b {
  font-family: var(--sans);
  font-weight: 700;
  letter-spacing: .12em;
  margin-right: .2em;
}

/* 守义的签字页：工整，一笔一画 */
.sign {
  max-width: 24em;
  padding: 1em 1.3em;
  font-family: var(--kai);
  color: var(--paper-ink);
  line-height: 1.9;
  letter-spacing: .05em;
  background:
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.9em - 1px), var(--paper-rule) calc(1.9em - 1px), var(--paper-rule) 1.9em) 0 1em / 100% calc(100% - 2em) no-repeat,
    var(--paper);
}

.sign.big {
  max-width: 10em;
  text-align: center;
  font-size: 1.5em;
  letter-spacing: .22em;
  padding: .55em 1em;
}

/* ---------- 手机：群聊、私信、锁屏 ---------- */
.chat {
  margin: 1.7em auto;
  max-width: 25em;
  padding: 10px 12px 12px;
  border-radius: 16px;
  background: var(--chat);
  font-family: var(--sans);
  font-size: .84em;
  line-height: 1.6;
  text-indent: 0;
  letter-spacing: .01em;
}

.chat-h {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .5em;
  margin: 0 0 4px;
  padding: 2px 0 8px;
  border-bottom: 1px solid var(--rule);
  font-size: .82em;
  color: var(--sys);
  letter-spacing: .06em;
}

.chat-h .t {
  font-family: var(--mono);
  font-size: .95em;
}

.msg {
  display: grid;
  grid-template-columns: 2.3em minmax(0, 1fr);
  gap: 9px;
  margin-top: 10px;
  align-items: start;
}

.av {
  width: 2.3em;
  height: 2.3em;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: var(--av);
  color: var(--av-ink);
  font-size: .9em;
  font-weight: 600;
}

.av.anon::before {
  content: "";
  width: 42%;
  height: 42%;
  border-radius: 50%;
  background: currentColor;
  opacity: .35;
}

.who {
  margin: 0 0 2px;
  font-size: .8em;
  color: var(--sys);
  display: flex;
  gap: .6em;
  align-items: center;
  flex-wrap: wrap;
}

.vt {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: .92em;
  opacity: .9;
}

.vt svg {
  width: 11px;
  height: 11px;
}

.bub {
  display: inline-block;
  max-width: 100%;
  padding: 7px 11px;
  border-radius: 3px 12px 12px 12px;
  background: var(--bubble);
  color: var(--bubble-ink);
  overflow-wrap: anywhere;
}

.bub .q {
  display: block;
  margin: 0 0 5px;
  padding: 4px 8px;
  border-left: 2px solid var(--sys);
  border-radius: 2px;
  font-size: .86em;
  color: var(--sys);
}

.msg.shot .bub {
  outline: 1px dashed var(--sys);
  outline-offset: 4px;
}

.sysm {
  margin: 10px 0 2px;
  text-align: center;
  font-size: .8em;
  color: var(--sys);
}

.sysm span {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 6px;
  background: var(--bg-2);
}

.lock {
  margin: 2em auto .6em;
  max-width: 22em;
  padding: 12px 14px 13px;
  border-radius: 18px;
  background: var(--lock-bg);
  color: var(--lock-ink);
  font-family: var(--sans);
  font-size: .84em;
  line-height: 1.5;
  text-indent: 0;
  box-shadow: var(--shadow);
  opacity: .5;
  filter: brightness(.6);
}

.lock.lit {
  animation: lockLit 3.6s ease-out .2s both;
}

@keyframes lockLit {
  0% {
    opacity: .5;
    filter: brightness(.6);
  }

  12% {
    opacity: 1;
    filter: brightness(1.15);
  }

  58% {
    opacity: 1;
    filter: brightness(1);
  }

  100% {
    opacity: .42;
    filter: brightness(.55);
  }
}

.lock-h {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.lock-h b {
  font-weight: 600;
}

.lock-h .t {
  margin-left: auto;
  font-family: var(--mono);
  font-size: .9em;
  opacity: .7;
}

.lock-h .av {
  width: 1.9em;
  height: 1.9em;
  border-radius: 6px;
  background: var(--lock-av);
  color: var(--lock-ink);
  font-size: .8em;
}

.lock p {
  margin: 0;
}

.gname {
  margin: 1.4em auto;
  max-width: 20em;
  padding: .65em 1em;
  border-radius: 12px;
  background: var(--chat);
  font-family: var(--sans);
  font-size: .86em;
  text-align: center;
  text-indent: 0;
}

.gname small {
  display: block;
  font-size: .78em;
  letter-spacing: .2em;
  color: var(--sys);
  margin-bottom: 2px;
}

.gname s {
  color: var(--sys);
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
}

/* 结尾：远处的打桩声 */
.thud {
  display: flex;
  gap: 12px;
  margin: 1.4em 0 0;
}

.thud i {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-3);
  opacity: .22;
}

.thud.go i {
  animation: thud 1.5s ease-out both;
}

.thud.go i:nth-child(2) {
  animation-delay: 1.4s;
}

.thud.go i:nth-child(3) {
  animation-delay: 2.8s;
}

@keyframes thud {
  0% {
    opacity: .22;
    transform: scale(1);
  }

  10% {
    opacity: 1;
    transform: scale(1.7);
  }

  45% {
    opacity: .55;
    transform: scale(1);
  }

  100% {
    opacity: .55;
    transform: scale(1);
  }
}

/* ---------- 章末与翻章 ---------- */
.ch-end {
  display: grid;
  justify-items: center;
  gap: 10px;
  margin: 3.2em auto 0;
  padding: 0 16px;
  font-size: 14px;
  letter-spacing: .5em;
  color: var(--ink-3);
}

.ch-end svg {
  width: 64px;
  height: 22px;
  color: var(--mood);
}

.ch-end p {
  margin: 0;
  text-indent: .5em;
}

.fin {
  display: grid;
  justify-items: center;
  gap: 14px;
  margin: 3.6em auto 0;
  padding: 0 16px;
  text-align: center;
}

.fin .fin-t {
  margin: 0;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: .6em;
  text-indent: .6em;
}

.fin .fin-s {
  margin: 0;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: .3em;
  color: var(--ink-3);
}

.fin .tri {
  margin: 0;
}

.epi-end {
  margin: 1.6em 0 1.2em;
  display: grid;
  gap: 8px;
}

.epi-end blockquote {
  margin: 0;
}

.epi-end p {
  margin: 0;
  font-family: var(--kai);
  font-size: 26px;
  letter-spacing: .16em;
  text-indent: .16em;
  color: var(--ink);
}

.epi-end figcaption {
  font-size: 13px;
  letter-spacing: .06em;
  line-height: 1.7;
  color: var(--ink-3);
}

.fin svg {
  width: 64px;
  height: 22px;
  color: var(--mood);
}

.tri {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .1em 1.1em;
  font-size: 15px;
  letter-spacing: .1em;
  color: var(--ink-2);
  line-height: 2;
}

.tri>span {
  white-space: nowrap;
}

.tri .tri-l {
  flex-basis: 100%;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .4em;
  text-indent: .4em;
  color: var(--ink-3);
}

.tri a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.tri a:hover {
  border-color: var(--lamp);
}

.tri b {
  color: var(--lamp-ink);
  font-weight: 600;
}

.ch-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: min(32em, calc(100% - 32px));
  margin: 2.6em auto 4.5em;
  font-size: var(--fs);
}

.ch-nav a {
  display: grid;
  gap: 4px;
  min-width: 0;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--rule);
  background: var(--bg-2);
  text-decoration: none;
  font-size: 16px;
  transition: border-color .2s ease, transform .2s ease;
}

.ch-nav a:hover {
  border-color: var(--lamp);
  transform: translateY(-2px);
}

.ch-nav small {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .2em;
  color: var(--ink-3);
}

.ch-nav b {
  font-weight: 600;
  font-size: 16px;
  letter-spacing: .1em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ch-nav .nx {
  grid-column: 2;
  text-align: right;
}

.ch-nav .nx small {
  color: var(--lamp-ink);
}

.ch-nav .pv {
  grid-column: 1;
}

@media (max-width: 420px) {
  .ch-nav {
    grid-template-columns: 1fr;
  }

  .ch-nav .nx,
  .ch-nav .pv {
    grid-column: 1;
  }

  .ch-nav .nx {
    order: -1;
  }
}

/* ---------- 宽屏：围垦进度，读一段，往外多筑一道塘 ---------- */
.gauge {
  position: fixed;
  right: 26px;
  top: 50%;
  z-index: 10;
  transform: translateY(-50%);

<section class="intro" aria-label="简介">
  <p class="intro-k">上林县 · 二塘 · 中篇小说</p>
  <div class="blurb">
    <p>腊月二十二，欠了四十八户工友十五年的老板回到上林，说他回来还钱。登记簿上写着三百万，他只认二百一十万。</p>
    <p>当天夜里，他死在老厂二楼的档案室。桌上一沓稿纸，标题是《关于借款余额的说明》，下面只写了一个“一”。</p>
    <p>我是大家推举来核账的会计。差的那九十万，我得一笔一笔对出来。</p>
  </div>
</section>

<b>腊月二十二</b>
</p>
    <p class="ch-no">第一章</p>
    <h1 class="ch-title">旧群</h1>
    <p class="ch-meta">3,451 字 · 约 9 分钟</p>
  </div>

<article class="text" lang="zh-CN">
<p>门缝底下漏出一线黄光。</p>
<p>我敲了两下门，没有人应。</p>
<p>我推开门。</p>
<p>台灯开着，灯罩歪向一边。地上撒了一地炒年糕，白的，一点红都没有。两排铁皮柜中间伸出一只手，手指朝着门口，像是要够什么东西，又没够着。</p>
<p>桌上压着一沓稿纸，第一页写着一行标题：</p>
<figure class="doc gaozhi" role="img" aria-label="稿纸：关于借款余额的说明，下面一行只有“一、”">
<div class="gz-row">
<span>
</span>
<span>关</span>
<span>于</span>
<span>借</span>
<span>款</span>
<span>余</span>
<span>额</span>
<span>的</span>
<span>说</span>
<span>明</span>
</div>
<div class="gz-row">
<span>
</span>
<span>
</span>
<span>一</span>
<span>、</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
</div>
<div class="gz-row">
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
<span>
</span>
</div>
</figure>
<p>标题下面只有一个“一”字，后面跟着一个顿号。</p>
<p>窗缝里漏进来的海风，把稿纸的边角掀起来，又放下。</p>
<p>十三个小时以前，这只手还在楼下会议室里打开一个文件夹。它的主人说，他回来还钱。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>腊月二十一，我坐末班大巴回上林。手机在口袋里震了一路。</p>
<p>工友群改过三次名。二〇一一年建群的时候还是QQ群，叫“恒成电器职工”。厂倒以后第二年，有人把它改成“恒成讨债”。第二天，守义叔又改了回来，改成“恒成老工友”。他在群里说，阿拉是工友，不是讨债的。</p>
<p>二〇一四年搬到微信，群名一直没再动过。直到上个月，后面多了一个括号：恒成老工友（年前结清）。</p>
<p>置顶的是守义叔的通知：“腊月二十二上午九点，老厂办公楼二楼会议室，核对借款。原借据带好，复印件也行。外地的工友二十三号到，车票自己先垫，回头一并算。许知川会计负责复核，有问题找他，也可以来铺子里寻。”</p>
<p>我就是那个许知川。我在明州一家汽车零部件公司做成本会计，一年到头跟螺栓和垫片的单价打交道，不知怎么就成了四十八户人家眼里“懂账的那个”。推举我的是守义叔，群里跟了一排大拇指，我妈也在里面。</p>
<p>下面跟了两百多条。</p>
<p>老葛发了一条六十秒的语音。我转成文字，转出来一段被机器猜坏了的安徽话，大意是：钱是当场给，还是打到卡里？他的卡是老家开的，跨行要不要手续费？</p>
<p>有人问利息怎么算。有人发来一张住院收费单，没写字。有人问，他要是再跑呢？</p>
<p>守义叔回：“阿拉大家放心，这次有人看着。”后面跟着一个@，@的是我。</p>
<p>有人发了一个“财神到”的表情。又有人问能不能带孙子来，说孩子放寒假，家里没人看。守义叔说可以，会议室有暖气。</p>
<p>大巴拐上塘路。路两边是一道一道的海塘，老塘最早，往北是二塘、三塘，一直排到看不见的地方。我小时候以为那些塘是挡水的，后来才知道，每往北修一道，就从海里多借出一片地来。恒成的厂就盖在二塘边上，盖的时候，那块地刚干了没几年。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我妈住在老街。楼下是守义叔的电器铺，卷帘门拉了一半。他坐在柜台后面，面前一台电暖器开着后盖，螺丝一颗颗排在报纸上。</p>
<p>后屋的门帘里传出他老婆的声音：“别人家的电暖器修到半夜，一分钱不收，自家的饭倒热了三回。”</p>
<p>守义叔冲我笑笑，没回嘴，拿螺丝刀朝楼上指了指：“你妈等你一晚上了。”</p>
<p>我上楼的时候，我妈正坐在饭桌边。桌上放着一只饼干铁盒，盖子开着。听见钥匙响，她把盖子扣上，起身去热菜。</p>
<p>“借据你带了没有？”我问。</p>
<p>“带了，在盒子里。”</p>
<p>“给我看一下，明天要对。”</p>
<p>“明天我自己带过去。”她背对着我，把一碗黄鱼年糕汤端上桌，“你吃。”</p>
<p>饭桌上两只碗。她把完好的那只推给我，自己端起另一只。那只是青瓷的，碗沿缺了一个小口，用了很多年，缺口已经磨得不扎嘴了。</p>
<p>“妈，二十万要是明天能拿回来，你想干什么？”</p>
<p>她喝了一口汤，过了一会儿才说：“你账算好了，就回明州去。别的事，你别多管。”</p>
<p>“什么叫别的事？”</p>
<p>“你听你守义叔的。”</p>
<p>我没再问。我爸透析那几年，我在外地读大学，学费一回也没断过。我妈说，是守义叔四处想的办法。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>腊月二十二，天阴，海风从北边一直吹过来。</p>
<p>老厂办公楼一楼租给了一家跨境电商，门口堆着半人高的纸箱。几个年轻姑娘戴着手套在打包，胶带撕起来刺啦刺啦地响。门框上新装了一个摄像头，对着大门和停车的空地，门边立着一只绿色的大垃圾桶。</p>
<p>守义叔已经到了。他的电动三轮车停在纸箱旁边，车斗里两箱矿泉水、一袋橘子。他穿一件旧羽绒服，袖口磨亮了，正低头在一个巴掌大的小本子上写字。我瞥见一眼：矿泉水两箱，三十六元；橘子一袋，二十元。</p>
<p>“老习惯，”他把本子揣回羽绒服内袋，“当车间主任落下的，扳手借出去都要记一笔。”</p>
<p>他从车斗里拿起一个透明塑料文件袋，递给我：“知川，十五年了，这本东西一直压在床底下。今天交给你。”</p>
<p>文件袋里是一本蓝色硬壳的登记簿，边角卷起来了。翻开扉页，是罗维民的字，一笔一画：</p>
<div class="doc fly">
<p>四十八户，共计三百万元。</p>
</div>
<p>我拿着簿子，比想象中沉。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>会议室在二楼。楼梯口的墙角挂着一个厂里当年的摄像头，壳子发黄，线头从底下垂出来，早就不亮了。会议室里暖气开得太足，窗玻璃上起了一层雾。</p>
<p>罗维民坐在靠窗的位置，面前一把算盘、一只保温杯。他退休好几年了，还在给几家作坊代账，对数还用算盘，说电脑算得快，算错了也快。</p>
<p>来了十几个工友，有人带原件，有人带复印件，有人把橘子剥了一桌子皮。我把登记簿摊开，拿出一支铅笔。我核账只用铅笔打勾，不用红笔。我妈说红笔写名字不吉利，我就一直没用过。</p>
<p>九点二十，韩岚到了。驼色大衣，进门还在讲电话，说的是英文：“OK, OK, talk tomorrow.”她冲屋里点了点头：“美国那边还没睡，不好意思。”有人小声说，副厂长现在是大老板了。韩岚没接话，在离门最近的位置坐下。</p>
<p>九点半，岑启明到了。</p>
<p>他开一辆十年前的灰色轿车，人比我想的瘦，穿一件深色夹克，像是特意挑过的。进门没有寒暄，先跟每个人点了一下头，点到守义叔的时候，停了半秒。</p>
<p>他坐下，打开文件夹。手机响了。</p>
<p>“嗯。年前那几笔，按流程走，我今天批。”他挂了电话，对大家说，“公司财务，催我签字。”</p>
<p>有人笑了一声：“岑总现在签字还管用啊。”</p>
<p>岑启明没理会。“我说一下这次的安排。我准备偿还的，是当年借款中未还的本金，二百一十万元。今天先核收款情况，有争议的逐户对，明天外地的工友到了，确认无误就付。”</p>
<p>会议室安静了两秒。</p>
<p>“多少？”</p>
<p>“二百一十万。”</p>
<p>“簿子上写着三百万！”有人一巴掌拍在桌上，杯子跳了一下。</p>
<p>“九十万，你又想赖掉？”</p>
<p>“十五年了，利息我们不讲，本金你还要打折？”</p>
<p>有人已经在掏手机。屋里一下子全是声音，暖气好像更闷了。</p>
<p>我站起来：“岑总，三百万和二百一十万之间差了九十万。请你逐笔说明。”</p>
<p>岑启明看着我，看了一会儿。然后目光移开，落在守义叔身上。</p>
<p>“先核收款，”他说，“再谈余额。”</p>
<p>守义叔站了起来。他没有发火，两只手往下压了压，像这十五年里每一次那样：“大家先坐下。人回来了，钱也带来了，今天不吵。一笔一笔对，对不上的，知川会写下来。”</p>
<p>屋里慢慢坐下了。他一说话，大家总会坐下。</p>
<p>我在白纸上写下“90”，后面打了一个问号。桌上的手机亮了一下，群里已经有人发出去了：“姓岑的又要赖九十万。”</p>
<p>我抬头的时候，屋里只有一个人没动。罗维民的手放在算盘上，岑启明报出那个数以后，他一颗珠子都没拨过。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>核对从十点开始。我念名字，念到谁，谁把借据拿出来；罗维民在登记簿上找到那一行，报一遍金额，我打一个勾。</p>
<p>到第七户，卡住了。戚师傅的借据写着叁万，登记簿上是八万。</p>
<p>“你们账上多记了五万？”有人笑，“多出来的算谁的？”</p>
<p>罗维民没抬头：“你是两笔。一笔三万，你自己的名字；一笔五万，借据写的是你阿哥，后来你阿哥说钱是你的，并到你这一行。那张借据，你阿哥收着。”</p>
<p>戚师傅想了半天，说好像是有这么回事。他阿哥前年过世了，东西都在嫂子那里，他说下午去找，晚上拿过来。</p>
<p>我在那一行旁边写“另一张借据待补”，又看了罗维民一眼。十五年前的事，这个老会计记得比当事人还清楚。</p>
<p>快到中午，老胡提起了利息。</p>
<p>“当年银行定期才三厘多，你说月息一分，阿拉才借的。”老胡说，“我家那点钱，是征地拿的补偿，放着也是放着。现在利息不讲了，本金还打折？”</p>
<p>“利息我不付。”岑启明说，“借据上没写。”</p>
<p>“写了一分！”</p>
<p>“那是口头说的。”</p>
<p>两边又吵起来。吵到一半，老胡冷笑一声：“姓岑的，你也别觉得自己多讲良心。要不是守义阿哥年年给你寄催款信，这笔账早过时效了，你一分不还，也没人告得赢你。”</p>
<p>我看向守义叔。他坐在后排，两只手揣在羽绒服口袋里，只是摇了摇头，像在说这点事不值得提。</p>
<p>岑启明过了一会儿才说：“我知道。所以我回来了。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>中午，我妈来了。</p>
<p>她抱着那只饼干铁盒，站在门口，没有进来。我去接，她把借据从盒子里抽出来递给我，盒盖马上又扣上了。</p>
<p>借据是二〇一一年三月写的：借款人岑启明，出借人戴秀琴，二十万元，经手人陈守义、罗维民。纸已经发黄，折痕处起了毛。</p>
<p>我把借据摊在桌上，念了一遍。罗维民在登记簿上找到这一行，没有报数。他看着那张借据，看了很久，久到旁边的人都转过头来。</p>
<p>“二十万。”他终于说。</p>
<p>我打了一个勾。</p>
<p>“妈，你坐一会儿，吃了饭再走。”</p>
<p>“食堂还有事。”她看了守义叔一眼，又看了岑启明一眼，转身下楼了。铁盒一直抱在胸前。</p>
<p class="last">那天上午，罗维民报了十九户的数。只有这一户，他停了这么久。我当时以为，他是年纪大了，眼睛不好。</p>
</article>

<b>腊月二十二</b>

    <p class="ch-no">第二章</p>
    <h1 class="ch-title">盒饭</h1>
    <p class="ch-meta">3,340 字 · 约 8 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>午饭是楼下快餐店送来的炒年糕，一人一盒。</p>
<p>岑启明没下楼，在走廊尽头打电话。我去洗手间，路过时听见他说：“……老葛那笔，算在本金里，先付五万，他孙子在住院。流程我现在批，你回公司以后跟年前那几笔一起走。几点都行，走掉就好。”</p>
<p>老葛上午打来过视频。他人在安徽，明天才到，镜头里是县医院的走廊，他把住院单举到屏幕前面，举了很久，手一直在抖。</p>
<p>我在心里过了一遍：OA上批了，只说明老板同意；钱什么时候出去，要看出纳几点去点网银。年底了，谁也说不准。我们公司也是这样，我没多想。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>下午两点，岑启明从包里拿出一个牛皮纸档案袋，封口用订书机订着，上面手写“附件二”。</p>
<p>“这一份，罗会计和守义先对。对完，经手人签字，晚上给许会计。”</p>
<p>“里面是什么？”我问。</p>
<p>“跟那九十万有关的。”</p>
<p>“那应该现在拿出来，大家一起看。”</p>
<p>守义叔把档案袋接过去：“知川，这里面是各家签字的单子，有身份证复印件，有家里的事。先让经手的人对一遍，晚上原样给你。你是复核，最后一道是你。”</p>
<p>他说得平和，也在理。上午各家的借据，也都只给我一个人看。我点了点头。</p>
<p>罗维民和守义叔进了走廊另一头的档案室。那间屋子过去放厂里的旧账，铁皮柜一排排靠着墙，门上的玻璃糊着旧报纸，只露出上面一条缝。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>三点多，我下楼拿矿泉水，在楼梯拐角碰见韩岚和岑启明。两个人站得很近，声音压得很低。我只听见一句：</p>
<p>“当年签的那份东西，你今天别拿出来。”</p>
<p>岑启明看见了我，没说话。韩岚侧身从我旁边下楼去了。院子里叉车在倒车，嘀嘀地响。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>四点，罗维民从档案室出来，脸色发白，端着保温杯去接热水，接了满满一杯，一口没喝。</p>
<p>岑启明在会议室门口站了一会儿：“守义，你再来一下。”</p>
<p>两个人进了档案室，门关上了。</p>
<p>二十分钟。门上那条缝里，能看见岑启明在说话，手指在桌上点着，一下，一下，像在报数。守义叔一直站着，没坐。</p>
<p>门开了。守义叔先出来，神色和进去时没什么两样。他对还没走的几个工友说：</p>
<p>“岑总的意思，明天外地的工友到齐，一户一户当面对。各家拿了多少、该拿多少，自己说，自己签字，钱直接打到各家卡上。今天先到这里。经手的留一下，晚上岑总把余额说明写出来。”</p>
<p>有人问：“余额说明是什么？”</p>
<p>“就是那九十万，”守义叔说，“明天说清楚。”</p>
<p>他掏出手机，给楼下快餐店打电话订晚饭。</p>
<p>“五份。一份不要辣。”挂了电话，他对我说，“老岑痛风，吃不了辣。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>盒饭五点半送到。快餐店老板娘拎着塑料袋上楼，站在门口问：“哪个不要辣？”</p>
<p>“档案室那个。”</p>
<p>老板娘把最上面那盒抽出来，用记号笔在盒盖上画了一个圈。她在老街开了二十年快餐店，上林县城谁吃辣、谁痛风、谁家小孩不吃葱，她心里都有一本账。</p>
<p>罗维民没动筷子。六点半，他老婆打来电话，他嗯了几声，站起来穿外套。</p>
<p>“附件我对过了，字也签了。”他扣扣子，扣到最后一粒，停了停，看着我，“账上写着的，都是真的。”</p>
<p>我等他往下说。罗维民把算盘夹在胳膊底下，走了。他那盒饭，盖子都没掀开。岑启明的公文包还搁在他上午坐过的那把椅子上，拉链半开着。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我把画了圈的那盒送到档案室。</p>
<p>岑启明坐在两排铁皮柜中间的旧办公桌后面，台灯照着一沓稿纸。他看见我进来，把稿纸翻过去，扣在桌上。档案袋摊在他手边，口已经拆开了。</p>
<p>“登记簿能不能留给我？写说明要对着看。”</p>
<p>我犹豫了一下，把登记簿放在台灯底下。</p>
<p>岑启明掀开盒盖，没动筷子。“你爸那个病，后来怎么样了？”</p>
<p>“走了五年了。”</p>
<p>“嗯。”他低头去拆筷子，塑料纸撕了半天没撕开。我想，大概是群里传的。这些年，工友群里谁家有事，没有传不到的。</p>
<p>我转身要走，他叫住了我。</p>
<p>“许会计。明天你核到的，可能比你想核的多。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>七点半，戚师傅回来了，满头是汗，手里攥着一张对折的纸。</p>
<p>“你们猜在哪里找到的？结婚证里面！”他把纸拍在桌上，“我阿哥把要紧的东西都夹在一起，结婚证、房产证、户口本。我嫂子说，在你阿哥心里，这张纸跟房产证一样要紧。我说那不一样，房子还在，钱没了。”</p>
<p>五万元，出借人戚国平，经手人陈守义、罗维民。和罗维民上午说的一字不差。</p>
<p>岑启明出来看了一眼，点点头：“对，是两笔。”又回去了，门没有关严。</p>
<p>桌上还剩一盒饭。戚师傅看看守义叔：“这盒是我的？”</p>
<p>“算到你的。晓得你今晚肯定回来。”</p>
<p>戚师傅扒了两口，抬起头：“守义阿哥，你连我回不回来都算到了。”</p>
<p>“你阿哥的钱，你不会不来拿。”</p>
<p>戚师傅想了想，觉得这话没毛病。吃完，他打了个饱嗝，说明天一早要跟老胡比谁先到。七点五十，他走了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>八点，守义叔把空盒子一个个摞起来，装进一只大塑料袋。他把羽绒服的袖子撸到胳膊肘，两只手腕上沾着酱油，在袋口系了个死结。</p>
<p>“知川，你先回去陪陪你妈。老岑说明写好，发你手机上，你明天一早来复核。等他写完，锁了门再走。”</p>
<p>我看了看走廊。档案室的门缝里透出一道黄光，偶尔有翻纸的声音。</p>
<p>“那我走了。”</p>
<p>“路上慢点，塘路没有路灯。”</p>
<p>下楼的时候，一个戴毛线帽的姑娘抱着一摞纸箱从我身边挤过去，说了声不好意思，胶带在她手腕上缠了好几圈，像戴着一只镯子。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>到家八点二十。我妈坐在电视机前，电视开着，声音关了。</p>
<p>“那个岑老板，今天跟你说什么了？”</p>
<p>“他说，明天我核到的，可能比我想核的多。”</p>
<p>她起身去厨房，水龙头开了很久。我听见碗碰在水池边上，一下，又一下。</p>
<p>快九点，楼下卷帘门哗啦啦响了一阵。我妈走到窗边看了一眼：“你守义叔回来了。”</p>
<p>我趴到窗口。电器铺的灯亮了，守义叔坐在柜台后面，把那台开着后盖的电暖器搬到腿上，拿螺丝刀一颗一颗地拧螺丝。门口站着一个老头跟他说话，他一边听，一边拧。</p>
<p>窗缝里飘进来一股烧纸的味道。腊月里家家谢年，老街上到处在烧，我没在意，把窗关上了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>九点四十一分，群里炸了。</p>
<p>最先是老葛。他不会打字，平常都用语音输入，说一句，手机替他打出来一句：</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
<span class="t">21:41</span>
</div>
<div class="msg">
<span class="av" aria-hidden="true">葛</span>
<div>
<p class="who">
<span>老葛</span>
<span class="vt">
<svg viewBox="0 0 12 12" aria-hidden="true">
<rect x="4" y="1" width="4" height="6.5" rx="2" fill="currentColor"/>
<path d="M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/>
</svg>语音转文字</span>
</p>
<p class="bub">钱到了钱到了谢谢陈老板陈老板是好人</p>
</div>
</div>
</div>
<p>马上有人回：“老葛，钱是岑老板打的，不是守义阿哥。”</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="msg">
<span class="av" aria-hidden="true">葛</span>
<div>
<p class="who">
<span>老葛</span>
<span class="vt">
<svg viewBox="0 0 12 12" aria-hidden="true">
<rect x="4" y="1" width="4" height="6.5" rx="2" fill="currentColor"/>
<path d="M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/>
</svg>语音转文字</span>
</p>
<p class="bub">对啊陈老板</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">山今岑！</p>
</div>
</div>
<div class="msg">
<span class="av" aria-hidden="true">葛</span>
<div>
<p class="who">
<span>老葛</span>
<span class="vt">
<svg viewBox="0 0 12 12" aria-hidden="true">
<rect x="4" y="1" width="4" height="6.5" rx="2" fill="currentColor"/>
<path d="M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/>
</svg>语音转文字</span>
</p>
<p class="bub">我说的就是陈老板啊</p>
</div>
</div>
</div>
<p>有人发了一串笑脸。有人说，老葛那边的口音，岑和陈本来就分不清，他自己分不清，手机也分不清。又有人说，分不清也好，反正十五年了，钱的事大家都记在守义阿哥头上。</p>
<p>后面的话就不太好听了。老胡问，凭什么他先拿？有人回，人家孙子在住院。老胡说，住院的就他一家？</p>
<p>金彩凤的儿子发来一张借据照片，拍得清清楚楚，附了一句：这张够清楚了吧，我妈一晚上给我发了十一条语音。</p>
<p>群里吵了二十多分钟。我一条条往下翻，翻到最后，发现少了一个人。</p>
<p>守义叔一句话也没回。</p>
<p>十五年来，群里但凡有人吵架，他总是第一个出来打圆场，事情就慢慢平了。我走到窗边，楼下电器铺的灯还亮着。他低着头，还在拧那台电暖器，手机反扣在柜台上。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十点过了，说明还没发来。</p>
<p>我给岑启明打电话，没人接。五分钟后又打，还是没人接。第三次，我听完了整整一遍提示音。</p>
<p>我披上外套下楼。守义叔正在拉卷帘门，拉到一半，看见我，停住了。后屋的门帘后头，他老婆问了一句：“又要出去？”他没答。</p>
<p>“岑总电话一直不接。”</p>
<p>“他写东西的时候，不接电话。”守义叔左手腕上贴着一张创可贴，我看了一眼。他也低头看了一眼：“电暖器的铁皮，划了一下。”</p>
<p>他把卷帘门拉到底，锁好，跨上电动三轮车：“上来，一道去看看。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>塘路没有路灯。三轮车的前灯照出一小块路面，两边的海塘黑沉沉的，像一道一道躺倒的墙。</p>
<p>仓库的灯还亮着，年前的货打不完。那个戴毛线帽的姑娘蹲在门口吃外卖，一盒麻辣烫，看见我们，抬了一下头。吃完，她把外卖盒连袋子一起扔进门边那只绿色垃圾桶。</p>
<p>二楼走廊是黑的，只有档案室门缝底下漏出一线黄光。</p>
<p>我敲了敲门：“岑总？”</p>
<p>没有回音。</p>
<p>我推开门。</p>
<p>台灯还开着，灯罩歪向一边。岑启明侧躺在两排铁皮柜之间，一只手伸向门口。椅子倒了，盒饭翻在地上，那是不放辣的一盒，撒出来的年糕是白的。铁皮柜的一个角上，有一块深色的东西，已经干了。</p>
<p>我站在门口，一步也没能往前走。</p>
<p>守义叔从我身后走过去，蹲下来，叫了两声“老岑”。他把手指按在岑启明的脖子上，按了很久。然后他站起来，掏出手机。</p>
<p>“喂，110吗？”他的声音很稳，拿手机的那只手却一直在抖，“二塘，老恒成厂的办公楼，二楼。有人死了。”</p>
<p>桌上，登记簿摊开在扉页：四十八户，共计三百万元。旁边那沓稿纸翻过来了，标题下面，只有一个“一”字，跟着一个顿号。</p>
<p>地上，岑启明的手机屏幕亮了一下，又暗下去。锁屏上停着老葛发来的一条微信：</p>
<div class="lock" data-fx="lock" role="img" aria-label="锁屏通知，老葛：钱到了钱到了谢谢陈老板陈老板是好人">
<div class="lock-h">
<span class="av" aria-hidden="true">葛</span>
<b>老葛</b>
<span class="t">21:41</span>
</div>
<p>钱到了钱到了谢谢陈老板陈老板是好人</p>
</div>
</article>

<span>No.03</span>

</i>
<b>腊月二十二 · 夜</b>
</p>
    <p class="ch-no">第三章</p>
    <h1 class="ch-title">最后见面</h1>
    <p class="ch-meta">2,033 字 · 约 5 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>警车是十点五十到的，两辆，没开警笛。蓝灯一路沿着塘路晃过来，把两边的海塘照得一明一暗。</p>
<p>仓库的人全停了手。戴毛线帽的姑娘手里还拎着外卖袋子，站在门口，主管从里面跑出来，第一句话问的是：“警察同志，我们今晚这批货还发不发得出去？年前最后一班物流。”</p>
<p>没人回答他。</p>
<p>下车的人里有一个四十出头，个子不高，羽绒服拉链拉到下巴。他进门先抬头看了一眼楼梯口，墙角那个旧摄像头的线头垂着，在风里晃。</p>
<p>“这个是好的吗？”</p>
<p>“厂里的，”守义叔说，“倒了以后就没人管了。”</p>
<p>他点点头，上楼去了。后来做笔录时他报了名字：邵峻，县局刑侦大队。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我和守义叔被请到一楼仓库的值班室。屋里一股纸箱和麻辣烫的味道，墙上贴着发货排班表，腊月二十三那一格用红笔圈了三遍。</p>
<p>一个年轻警察给我们倒了两杯热水。守义叔捧着杯子，没喝。他的手机在口袋里震了两回，他掏出来看一眼，按掉了。我看见屏幕上的两个字：彩娣。</p>
<p>我给我妈打电话。她接得很快，像是一直攥着手机。</p>
<p>“岑老板，”我说，“人没了。”</p>
<p>那头很久没有声音。我以为断了线，喂了两声。</p>
<p>“你守义叔在不在你旁边？”</p>
<p>“在。”</p>
<p>“那就好。”她说，“你早点回来。”</p>
<p>挂了电话，我才想起来，她没问人是怎么没的。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十二点过后，群里知道了。</p>
<p>不知道是谁先说的，大概是仓库里有人认识工友的家里人。第一条是：“听说二塘老厂出事了？”</p>
<p>第二条：“岑老板死了？”</p>
<p>第三条：“那钱还给不给？”</p>
<p>后面跟了一长串。有人说人死了债还在，有人说他有个女儿，女儿认不认还两说。有人问明天外地的工友还来不来，车票都买好了。老胡发了一条，两秒钟后撤回了，群里显示“胡国良撤回了一条消息”。我没看见他写的是什么，也没人问。</p>
<p>守义叔的手机一直扣在桌上。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>一点左右，邵峻下来了。</p>
<p>“许知川？”</p>
<p>“是我。”</p>
<p>“桌上那本蓝皮登记簿，是谁、什么时候放上去的？”</p>
<p>“我放的。五点四十左右，他说写说明要对着看。”</p>
<p>“那沓稿纸呢？”</p>
<p>“他自己带的。我送盒饭进去，他把稿纸翻过去扣着。”</p>
<p>“桌上原来还有什么？”</p>
<p>我闭上眼睛想了一遍：台灯，盒饭，登记簿，稿纸，一支笔，一副老花镜。好像还有一样，一时想不起来。</p>
<p>“想起来再告诉我。”</p>
<p>他举起一个证物袋，里面是岑启明的手机。</p>
<p>“八点四十一分，他给你打过电话。你知道吗？”</p>
<p>我掏出手机翻通话记录。最上面是我十点多打给他的，三个，都没接通。再往下，是下午我妈打来的。八点四十一分，什么也没有。</p>
<p>“没有未接来电。”</p>
<p>“没拨出去，”邵峻说，“拨了，没通，就挂了。”</p>
<p>我盯着自己的手机。八点四十一分，我在我妈家，厨房的水龙头开着，碗一下一下碰在水池边上。</p>
<p>“老岑讲要叫你回来看说明，”守义叔在旁边说，“号码拨了一半，又说算了，写好了再叫你。”</p>
<p>邵峻看了他一眼：“那时候你还在？”</p>
<p>“在，在会议室收拾。他在档案室门口喊了一声。”</p>
<p>“你几点走的？”</p>
<p>“八点四十几。老岑讲他自己锁门，叫先回去。”</p>
<p>“走的时候他在干什么？”</p>
<p>“在写。”守义叔说，“台灯开着，在写。”</p>
<p>邵峻在本子上记了几笔，转过来问我：“你八点二十到家，之后呢？”</p>
<p>“一直在家。九点不到，我听见楼下卷帘门响，守义叔回铺子了。我在窗口看见他在修电暖器，门口还有个老头跟他说话。”</p>
<p>我说完，邵峻没抬头，在本子上又记了一行。</p>
<p>岑启明最后想找的人，是我。那个电话要是拨通了，我会在洗碗的水声里听见吗？我不知道。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>两点多，一个技术员进来，拿着棉签和小纸袋。</p>
<p>“在场的每个人都要采一下，例行的。”</p>
<p>棉签在我嘴里刮了两下，有一股塑料味。守义叔张嘴的时候很配合，张得比要求的还大。</p>
<p>技术员又让他把左手伸出来。他撕开创可贴，下面是一道细长的划痕，从手腕外侧斜着拉到手背，边上还在往外渗血珠。</p>
<p>“怎么弄的？”</p>
<p>“电暖器的铁皮，”守义叔说，“修东西，常有的事。”</p>
<p>相机闪了两下。他把创可贴按回去，按得很平。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>快三点，邵峻叫我去认几个人。</p>
<p>仓库主管把门口的监控调出来，在值班室的电脑上一格一格往前拖，嘴里还在念叨那批货。画面是黑白的，院子里的灯照不远，人走进来都只有半截影子。</p>
<p>18:31，一个夹着算盘的老人出门。“罗维民，原厂会计。”</p>
<p>19:52，戚师傅，手里拎着一个空塑料袋，走到门口，肩膀一抖，打了个饱嗝。</p>
<p>20:06，是我自己。我从来没见过自己在监控里走路的样子，背比我以为的要弯。</p>
<p>20:47，守义叔。羽绒服，手里拎着一只鼓鼓的大塑料袋，袋口系着结。他走到三轮车边，把袋子放进车斗，跨上车，出了画面。</p>
<p>“他说是盒饭垃圾。”邵峻说。</p>
<p>我点点头。那袋子是我看着他装的。</p>
<p>主管又往后拖。院子空了很久，只有叉车偶尔开过去。</p>
<p>21:08，一辆车开进来，停在离门最近的地方。车门开了，下来一个女人，一手把手机贴在耳边，一手拢着大衣领子。她没关车门，快步进了楼。</p>
<p>21:19，她出来了。手机已经不在耳边，手里压着一个文件夹一样的东西，贴在胸前。她上车，倒车时差点蹭到纸箱，画面晃了一下，车开走了。</p>
<p>邵峻按了暂停：“认识吗？”</p>
<p>画面上那件大衣是浅色的，在黑白里几乎发白。可我知道它是什么颜色。早上九点二十，它站在会议室门口，冲屋里点了点头，说美国那边还没睡。</p>
<p class="last">“驼色的，”我说，“是韩岚。”</p>
</article>

    <h1 class="ch-title">二〇一一</h1>
    <p class="ch-meta">1,190 字 · 约 3 分钟</p>
  </div>

<article class="text" lang="zh-CN">
<p>三月，岑启明把陈守义叫进办公室，关上门，递过来一根烟。</p>
<p>银行的贷款到期不肯续，替上家担保的那笔又落到了恒成头上。“守义，工资先发不出了。先打借条，按月息一分算，比银行高三倍。你在车间讲一句，比我讲十句好使。”</p>
<p>陈守义把烟接过来，夹在耳朵上，没点。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>他先去了小舅子家。卢志刚刚拿到老房子的征地款，存折压在电视机底下。陈守义开口要十万，卢志刚看他姐姐。卢彩娣剥着毛豆，头也没抬：“他要带头。他不先拿出来，谁肯拿？”</p>
<p>陈守义当场写了借条：今借到卢志刚人民币拾万元整。又从内袋摸出那个巴掌大的本子，记下一行：志刚，十万。</p>
<p>“自家人，还写这个。”卢志刚说。</p>
<p>“账要清。”陈守义说。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>四月，车间停了机器。陈守义把自家的存折摊在工作台上：十五万。</p>
<p>“厂里的钱，有守义在。”</p>
<p>胡国良第一个挤过来：“守义阿哥都拿出来了，我们怕什么。”后面的人排起了队，有人拿存折，有人拿报纸包着的现金。一个刚进厂两年的小伙子问，他那三个月没发的工资，是不是也算借给厂里了。</p>
<p>“按一分算，年底连本带利。”</p>
<p>小伙子签字签得很慢。罗维民一户一户往登记簿上写，陈守义站在他身后，每写一户，就在自己的本子上也记一笔。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>许家是晚上去的。老许手上的机油没洗干净，戴秀琴添了一副碗筷。桌上一只青瓷碗，碗沿是齐的。老屋征地补了二十万，是留给儿子读书的。戴秀琴把存折拿出来，放回去，又拿出来。</p>
<p>“守义讲的，”老许说，“不会错。”</p>
<p>他们的儿子在饭桌另一头写作业，十五岁，草稿纸上全是数字。陈守义摸了摸他的头：“账算得清，以后当会计。”</p>
<p>钟家老太烧了一锅汤圆，把十五万的存折塞到他手里，借条看也不看：“守义，钱给你，我是放心的。”陈守义把借条一个字一个字念给她听。</p>
<p>老葛住在二塘外面的平房里。他从床底下拖出一只铁皮饼干筒，五万块钱，是他在上林打了九年工攒下的，再加两个月没发的工资，一共六万。</p>
<p>“陈主任，俺们外地人，厂倒了，上哪儿找人去？”</p>
<p>“找守义。外地人，更要有个靠头。”</p>
<p>老葛按了手印。他儿子在屋角写作业，桌子是一只倒扣的纸箱，也是十五岁。陈守义记下：老葛，六万。他又朝屋角看了一眼。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>六月，罗维民把四十八户的数加了两遍，在扉页上一笔一画写下：四十八户，共计三百万元。陈守义站在他身后，看着墨干。</p>
<p>九月，副厂长韩岚不来上班了，车间里传她带走了几个美国客户。订单少了一半。</p>
<p>腊月二十，厂门上绕了三圈铁链，锁头上落着霜。岑启明的电话打不通了。</p>
<p>门口的人越聚越多。有人拍门，有人蹲在地上抽烟，有人哭。老葛带着儿子蹲在墙根，两个人都没戴手套。</p>
<p>“守义，钱呢？”</p>
<p>“守义阿哥，你讲话呀！”</p>
<p>陈守义喉咙里像塞着什么，半天才说出一句：“有守义在。”</p>
<p>罗维民挤过来，把那本蓝皮登记簿塞到他怀里：“这本东西你收着。你讲话，他们听。”</p>
<p>他抱着登记簿站了一上午，没有一个人走。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>那天晚上，卢彩娣在厨房里问：“志刚那十万呢？”</p>
<p>他没有回答。他开了台灯，摸出小本子，翻到最后一页，笔尖停了很久，写下一行：</p>
<div class="doc note">
<p>四十八户，欠。</p>
<div class="blank">
</div>
</div>

<article class="text" lang="zh-CN">
<p>腊月二十三，我一夜没睡。八点多，邵峻打电话来，说十点要我去老厂认几样东西。</p>
<p>我到的时候，门口已经站了二十几个人。</p>
<p>是外地的工友。他们坐了一夜的车，有人拖着行李箱，有人背着蛇皮袋，车票是群里说好的，自己先垫，回头一并算。院子里拉着警戒线，仓库的纸箱堆在线外头，像一道临时的墙。他们就站在纸箱和警戒线中间，不知道该进还是该走。</p>
<p>守义叔也在。他一早就来了，一个一个递矿泉水，跟每个人说同一句话：“先回去，人的事先办。”</p>
<p>老葛是最后到的。他从大巴站一路走过来，蛇皮袋扛在肩上，看见守义叔，袋子往地上一放，两只手就攥住了守义叔的手。</p>
<p>“陈主任，钱收到了，五万，一分不少。”</p>
<p>“是老岑打的。”守义叔说。</p>
<p>“都一样，都一样。”</p>
<p>老葛不太识字，群里的消息都是他儿子念给他听。他儿子昨晚在厂里上夜班，没顾上念。他从蛇皮袋里掏出两包东西，用报纸裹着，是家乡的苔干。</p>
<p>“这包给陈主任。这包给岑老板，人家先给俺打的钱。”</p>
<p>没人接那一包。</p>
<p>守义叔看着他，嘴张了一下，没说出话来。旁边有人低声告诉了他。老葛听完，站在原地，两包苔干一手一包，像两只拎不起来的秤砣。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十点不到，一辆警车开进院子，下来一个年轻女人。黑大衣，头发扎得很紧，眼睛是红的，脸上没有泪。</p>
<p>是岑启明的女儿，岑悦。她从外地连夜赶过来，一早去了殡仪馆，又要求来看看她父亲最后待的地方。</p>
<p>她没有往楼里看，先看的是我们这一群人。看了一圈，问了第一句话：</p>
<p>“我爸到底欠你们多少？”</p>
<p>院子里静了一下，然后一下子全是声音。</p>
<p>“三百万！”</p>
<p>“他只认二百一十万，九十万还赖着！”</p>
<p>“人死了，钱还给不给？”</p>
<p>她站着没动，等声音小下去，又问了一遍：“到底多少？”</p>
<p>大家都看向我。我手里没有登记簿，那本东西还在楼上的证物袋里，可那几个数我闭着眼睛也背得出来。</p>
<p>“登记簿上，四十八户，三百万。”我说，“你爸昨天说未还的是二百一十万。中间九十万，他说今天讲清楚。”</p>
<p>“他讲清楚之前，就死了。”她说。</p>
<p>没有人接这句话。</p>
<p>老葛从人群后面挤过来，把那包没人接的苔干递给她：“岑老板的。”</p>
<p>她低头看着那包报纸，看了一会儿，接了过去，抱在胸前。</p>
<p>守义叔走过来，在她面前站住：“姑娘，节哀。”</p>
<p>她抬头看他：“你是陈守义？”</p>
<p>“是。”</p>
<p>“我爸提过你。”她说，“他说你是他在上林唯一信得过的人。”</p>
<p>守义叔的眼圈一下子红了，别过脸去，抬起袖口在眼睛上按了按。老葛在旁边拍了拍他的背。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十点，邵峻带我和罗维民上楼。</p>
<p>走廊里拉着线，档案室门口贴着封条，又被揭开了一半。地上那一片年糕已经收走了，铁皮柜的角上贴着一张编号的小黄牌，数字是7。</p>
<p>邵峻没让我们碰任何东西，只让我们站在门口看。</p>
<p>“这屋里的纸，哪些是昨天新放进来的？”</p>
<p>我一样一样认：台灯底下原来放登记簿的地方，现在空着，登记簿已经装进了证物袋；那沓稿纸还在，翻过来的那一页上，“关于借款余额的说明”，下面一个“一”字，一个顿号；笔；老花镜，一条腿折了。</p>
<p>“还有吗？”</p>
<p>我盯着桌面。台灯照着的那一圈，昨天傍晚摊着一样东西，口已经拆开了，就在岑启明手边。</p>
<p>“档案袋。”我说，“牛皮纸的，封口用订书机订着，上面写着附件二。昨天五点四十我送盒饭进来，它就在这里。”</p>
<p>邵峻看了我一眼，转身对屋里的技术员说了句什么。两个人把桌子上下、抽屉、铁皮柜一格一格翻了一遍，又去走廊、会议室、楼梯间看了一圈。</p>
<p>没有。</p>
<p>技术员从走廊另一头回来，说后门的门闩是拉开的。那扇门通到二塘边上的小路，邵峻问平时锁不锁。罗维民说门闩坏了好几年，一推就开，厂里的人都晓得。他说这话的时候没看邵峻，看的是走廊尽头那扇门。</p>
<p>我这才想起来，罗维民家就住在二塘河边。从那条小路走过来，不过十分钟。</p>
<p>罗维民站在我旁边，两只手一直揣在袖筒里。技术员拉开铁皮柜最底下两格的时候，他往前凑了半步。那两格里是厂里的旧账，一本本码着，纸页起了波浪，边上一圈一圈黄色的水渍。</p>
<p>“那年台风，”罗维民说，“二塘进过水。”</p>
<p>邵峻点点头，没往下问。他回到桌边，看着那片空出来的地方。</p>
<p>“账本不拿，拿附件。”他说，“拿的人，知道哪份要紧。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>下楼的时候，邵峻在楼梯口叫住了罗维民。</p>
<p>“附件里是什么？”</p>
<p>“各家签字的单子。”</p>
<p>“哪几家？”</p>
<p>罗维民没回答。他看着墙角那个线头垂下来的旧摄像头，看了一会儿，说：“我只管记账。”</p>
<p>“谁看过那份附件？”</p>
<p>“岑启明。”罗维民说，“还有我，还有守义。”</p>
<p>他说完这句，把保温杯换到另一只手上，慢慢下楼去了。</p>
<p class="last">院子里，岑悦抱着那包苔干，站在警车旁边。罗维民从她身边走过，脚步顿了一下，像是想说什么，最后低着头出了院门，往二塘河边那条小路去了。</p>
</article>

</p>
    <p class="ch-no">第六章</p>
    <h1 class="ch-title">到账</h1>
    <p class="ch-meta">2,395 字 · 约 6 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>外地的工友，第二天走了一大半。车票是群里说好的，自己先垫，回头一并算。现在谁也不知道回头是什么时候。</p>
<p>老葛没走。他说孙子的五万已经到了，剩下的那点，他等。守义叔把他领回电器铺，在后屋支了一张行军床。</p>
<p>“又往家里领人。”卢彩娣在厨房里说，声音不大，刚好让外面听见。</p>
<p>守义叔没回嘴。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>腊月二十四，守义叔骑三轮车带我去走访。他说岑家姑娘在办后事，钱的事早晚要接着谈，各家的情况，我得心里有数。</p>
<p>第一家是钟家，住在三塘边上。钟家老太八十多了，耳朵背，看见守义叔，老远就喊：“守义来了！”</p>
<p>守义叔从车斗里拿出一条电热毯，是上个礼拜拿去修的，插头换了新的。老太非要给钱，守义叔把她的手推回去：“一个插头，几块钱的事。”</p>
<p>老太拉着我的手，说我小时候她抱过我。又指着墙上老头的遗像说，那年老头子生病，要不是守义送来的那笔钱，人早就没了，还能多活三年。</p>
<p>回去的路上，我问守义叔，那笔钱是怎么回事。</p>
<p>“救命钱，”他说，“那年他家实在没办法。”</p>
<p>他没往下说，我也没再问。三轮车颠了一下，车斗里的工具箱哐当响。</p>
<p>俞家的老人瘫了十年，轮椅的刹车坏了，守义叔蹲在地上修了二十分钟，满手是油。邬家的小孩今年考上了大学，在门口贴了一张红纸，守义叔伸手把红纸翘起来的一角按平，说：“读书好。”</p>
<p>一上午走了七家。每一家开门，第一句话都是“守义来了”，或者“守义阿哥来了”。没有一家问起我是谁。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>中午回到铺子，老葛在门口等着。他手里拿着一条烟，是在老街小卖部买的，塑料膜还没拆。</p>
<p>“陈主任，这些年……”</p>
<p>守义叔没让他说完，把那条烟塞回老葛的蛇皮袋里，拉链拉上：“留着回去给你儿子。”</p>
<p>老葛站在那里，拉链拉开又拉上，最后还是没拿出来。</p>
<p>守义叔进了后屋。卢彩娣端着一盆洗好的青菜出来，看了一眼他的背影，跟我说：“他这个人，自己家的事从来排最后。”</p>
<p>我当她是在夸他。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>下午，韩岚给我打了电话。</p>
<p>我不知道她从哪里弄到我的号码。她说话很快，像是怕我挂断：“许会计，我是韩岚。我知道外面在传什么。”</p>
<p>“警察找过你了？”</p>
<p>“找过两次。我回去是拿一份文件，我自己的文件，跟钱没关系。”她停了一下，“我上楼的时候，他在档案室里，好好的。我们隔着门吵了两句，我就走了。老葛那笔钱，九点四十一分才到账，那时候他还在办事。”</p>
<p>“吵什么？”</p>
<p>“十五年前的事。”她说，“你跟工友们讲一声，我没有杀人。”</p>
<p>她挂了电话。我站在老街上，手机还贴在耳朵边上。</p>
<p>晚上群里就知道了，不知道是仓库里谁说出去的，说监控拍到韩岚九点多又回了厂里。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">她早上在会议室，坐得离门最近。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">副厂长当年先跑的，谁不晓得。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">十五年前她就把厂掏空了，现在又来灭口。</p>
</div>
</div>
</div>
<p>一条比一条狠。有人把她公司的地址发了出来，过了一会儿，又有人发，算了，让警察去查。</p>
<p>也有人提到罗维民。那天他走得最早，脸色不对；警察找他问了两回；他家就住在二塘河边，后门一推就开。</p>
<p>老胡说，罗会计连杀鸡都不敢。</p>
<p>没人再接话。可第二天早上，罗维民去菜场买菜，好几个人看见他，都把脸转开了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>腊月二十五上午，守义叔被叫去了县局。</p>
<p>他是下午三点回来的。我在铺子门口等他，他把三轮车停好，没进门，在门槛上坐了下来，摸出一根烟，夹在耳朵上，没点。</p>
<p>“指甲里的东西，化验出来了。”他说，“是阿拉的。”</p>
<p>我没说话。</p>
<p>他把左手翻过来，创可贴已经换了一张新的。</p>
<p>“下午四点，在档案室里，跟老岑争那九十万，争急了，他一把抓过来。那天晚上跟你讲是铁皮划的，是不好意思。”他看着地上，“一把年纪了，被人抓了一把，讲出去难听。”</p>
<p>“警察信了？”</p>
<p>“信不信，阿拉也讲不出别的。”他说，“八点四十几走的时候，他还在写。”</p>
<p>他走了以后，岑启明又活到了九点十分以后，韩岚说的；又活到了九点四十一分，钱还在往外打。八点五十五以后，守义叔在铺子里修电暖器，是我在窗口看见的。</p>
<p>这些我都知道。我把这些在心里又过了一遍，像核一张对得上的表。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>这件事傍晚就传开了。</p>
<p>我以为群里会有人起疑。结果没有。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">守义阿哥替我们跟姓岑的拼命，被抓了一把。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">九十万，也就他敢当面去要。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">警察还叫他去问话，有没有良心？</p>
</div>
</div>
</div>
<p>老胡发了一条长语音，转成文字是：守义阿哥这十五年，谁家有事他不到？今天谁要是在背后讲他一句，先来跟我讲。</p>
<p>下面一排大拇指。</p>
<p class="beat">一道抓痕，在群里变成了一枚勋章。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>晚上九点四十一分，群里有人翻出了老葛那天的消息。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">
<span class="q">老葛 · 腊月二十二 21:41</span>钱到了钱到了谢谢陈老板陈老板是好人</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">九点四十一分还在打钱，说明人那时候还活着，还在办事。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">韩岚九点十九分走的，监控后头再没人进去。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">那就是她走之前推了他，他自己爬起来，打完钱，才倒下去的。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">也可能是自己摔的。痛风的人，脚底下没根。</p>
</div>
</div>
</div>
<p>我盯着那个时间看。</p>
<p>九点四十一分是到账的时间，不是付款的时间。那天中午，岑启明在走廊尽头说的是：流程我现在批，你回公司以后跟年前那几笔一起走，几点都行。OA上批了，只说明老板同意；钱什么时候出去，要看出纳几点去点网银。</p>
<p>岑启明九点四十一分是不是还活着，这笔钱证明不了。</p>
<p>我翻出岑启明公司的电话，想打给财务问一句。打过去，是总机的录音：春节放假，正月初八上班。我正要找别的号码，守义叔在楼下喊我，叫我下去帮老葛把行军床搬到靠墙的地方。</p>
<p>我下了楼。搬完床，我跟他提了一句，那笔钱可能是出纳晚上点的。</p>
<p>“警察会查的。”他说，“你别掺和。岑家姑娘那边，人家在办后事，你一个电话打过去，问的是钱，像什么样子。”</p>
<p>他说得在理。我把手机放回了口袋。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>回到楼上，邵峻的短信来了，叫我明天把各家借据的金额整理一份给他。最后一句是：岑启明的卡是外省开的，流水要发协查，过了年才调得出来。</p>
<p>我把这些天收的借据复印件摊在饭桌上，一户一户往表里填。四十八户，填到一半，我妈从房间里出来，站在桌边看了一会儿，伸手从那摞复印件里抽走了一张。</p>
<p>“妈？”</p>
<p>“我的身份证复印件。”她说，“不想给人看。”</p>
<p>她把那张纸对折了两下，攥在手里，回房间去了，门轻轻关上。</p>
<p class="last">我低头看那摞复印件。她抽走的不只是身份证。那一张上面，还复印着她的借据：二十万元，出借人戴秀琴。</p>
</article>

    <p class="ch-no">第七章</p>
    <h1 class="ch-title">复印件</h1>
    <p class="ch-meta">1,829 字 · 约 5 分钟</p>
  </div>

<article class="text" lang="zh-CN">
<p>腊月二十六一早，我把那张表发给了邵峻。</p>
<p>四十八户，一户一行：姓名，借款日期，借据金额，已还金额，原件还是复印件。我妈那一行，我照样填了：戴秀琴，二〇一一年三月，二十万元，已还：零，原件。</p>
<p>填到这一行的时候，我停了一下。她昨晚抽走的那张复印件，我手里没有了，可原件我亲眼看过，罗维民也报过数。我把光标移到下一行，接着往下填。</p>
<p>发出去的时候是七点十二分。我妈在厨房里蒸年糕，蒸汽把窗玻璃糊得什么也看不见。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>上午，老葛要回安徽了。</p>
<p>他孙子出院了，儿子在电话里催他回去过年。他把蛇皮袋重新扎好，那条烟还在里面，塑料膜都没拆。守义叔陪他去汽车站，我跟着去帮他在手机上买票。</p>
<p>老葛的手机是儿子淘汰下来的，屏幕裂了一道。买票的软件要验证码，验证码发过来，他把手机举得老远，眯着眼睛念，念一个数字，看我一眼，像在报一笔账。</p>
<p>“陈主任，”上车前他说，“剩下的那点钱，俺不急。”</p>
<p>“回去过年，”守义叔说，“钱的事有数。”</p>
<p>大巴开出站，老葛隔着车窗挥手，挥了很久。守义叔站在原地，等车拐过塘路，才转身去推三轮车。</p>
<p>回来的路上他一句话也没说。我问他那天下午四点在档案室吵的到底是什么，他把车把一拐，绕开路上的一个坑：“吵的就是那九十万。人都走了，还讲它做什么。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>中午，岑悦打来电话。号码是邵峻给她的。</p>
<p>“许会计，我想要一份名单。”她说，“我爸欠的是谁，欠多少。”</p>
<p>“警察那边有一份。”</p>
<p>“警察那份是给警察的。”她说，“我爸的账，我认。但我要知道哪一笔是真的。”</p>
<p>“九十万那一块，我也说不清。”</p>
<p>她在电话那头停了一会儿：“他回来之前跟我说过，这次要把账做干净，做干净了，他才好回上林过年。”</p>
<p>“他跟你说过那九十万吗？”</p>
<p>“没有。他只说，有几户人家他早就还过了，钱是托人送去的。”</p>
<p>“托谁？”</p>
<p>“他没说。”</p>
<p>我拿着电话站在老街上。对面电器铺的卷帘门开着一半，守义叔蹲在门口给一台电风扇换叶片。有几户人家早就还过了，钱是托人送去的。我把这句话在心里过了一遍，像过一张对不上的凭证，过完了，没有往下想。</p>
<p>“名单我晚上发给你。”我说。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>下午，我去二塘河边找罗维民。</p>
<p>他家是一排老房子的最后一间，门口晒着两串酱鸭，屋檐下堆着蜂窝煤。我敲了三下门，开门的是他老婆，看见是我，脸一下子沉下来。</p>
<p>“他不在。”</p>
<p>屋里传出算盘珠子的声音，噼噼啪啪，又停了。</p>
<p>“罗伯，”我隔着他老婆的肩膀喊了一声，“就问一句，那份附件里，写的是哪几户？”</p>
<p>算盘声没有再响。过了一会儿，罗维民的声音从里屋传出来，很慢：“我老了，记不清了。”</p>
<p>门关上了。</p>
<p>回去的路上经过菜场，两个卖菜的阿姨在议论，说罗会计那天走得最早，又住在河边，后门一推就开。另一个说，人家连杀鸡都不敢。前一个说，不敢杀鸡，不等于不敢推人。</p>
<p>她们看见我，不讲了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>晚饭的时候，我妈问：“那张表，你交上去了？”</p>
<p>“早上交的。”</p>
<p>“我那一行，你也写了？”</p>
<p>“写了。二十万，已还零，原件。”</p>
<p>她把一筷子青菜夹到我碗里。她自己用的还是那只缺口的青瓷碗，吃得很慢，吃到一半，放下筷子，起身去厨房洗碗。水龙头又开了很久。</p>
<p>七点多，她穿上外套，说社区食堂明天有人订年夜饭，要去帮着备菜。</p>
<p>我从窗口往下看。她没有往食堂的方向走，在楼下电器铺门口站住了。守义叔放下手里的电风扇，站起来。两个人说了几句话，我听不见。我妈的手比画了一下，守义叔摇了摇头，又摇了摇头。</p>
<p>我妈站了一会儿，往老街另一头走了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>岑悦要的名单，我得附上原件照片。四十八户，有原件的我都拍了，只差我妈那一张。</p>
<p>饼干铁盒不在饭桌上，也不在电视柜里。我在衣柜顶上找到了它，压在一床旧棉被下面。</p>
<p>盒盖有点紧，我用指甲抠了两下才打开。</p>
<p>最上面是那张借据，二〇一一年三月，二十万元，出借人戴秀琴，纸已经发黄。借据底下是一沓奖状，我小学、初中的，三好学生，数学竞赛三等奖，每一张都压得平平整整。我不知道她还留着这些。</p>
<p>奖状底下，还有一张纸，对折着。</p>
<p>我打开它。是一张收条，蓝色圆珠笔写的，字很工整：</p>
<div class="doc slip">
<p>今戴秀琴出借岑启明之借款本金贰拾万元整，已全部结清。</p>
<p class="r">收款人：戴秀琴</p>
<p class="r">经手人：陈守义　罗维民</p>
<p class="r">二〇一五年十二月十八日</p>
</div>
<p>我拿着那张纸，在衣柜前站了很久。</p>
<p>二〇一五年冬天，我大二。那年寒假前，下学期的学费打到了我卡上，我爸在医院做透析，一周三次。我妈在电话里说，是你守义叔四处想的办法。</p>
<p>我看了第二遍。收条写得有点怪，只写了“已全部结清”，没写收到多少钱。我核了七年的账，第一眼就看出来了。我把这个念头按下去，又看了一遍日期。</p>
<p>我要替我妈讨的二十万，十一年前就已经还过了。</p>
<p class="last">楼下的卷帘门响了一声。我妈上楼的脚步声，一级一级，近了。</p>
</article>

<header class="ch-head">
  <canvas class="scene" data-kind="deng" aria-hidden="true">

  <div class="ch-head-in">
    <p class="case">
<span>No.08</span>
<i>
</i>
<b>腊月二十六 · 夜</b>
</p>
    <p class="ch-no">第八章</p>
    <h1 class="ch-title">二十万</h1>
    <p class="ch-meta">1,541 字 · 约 4 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>我妈推开门，第一眼就看见了衣柜前的我，和我手里那张纸。</p>
<p>她没有叫，也没有过来抢。她把门关上，把外套脱下来，挂在门后的钩子上，挂了两次才挂住。然后她在饭桌边坐下，两只手放在膝盖上，像在等一个人把话说完。</p>
<p>我把收条放在她面前。</p>
<p>“二〇一五年十二月。”我说。</p>
<p>“你大二那年。”</p>
<p>窗外有人家在谢年，鞭炮一挂接一挂，响完了，远处又起来一挂。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>“那年你爸一个礼拜透析三次，”她说，“医保报一半，剩下一半，我在食堂一个月挣两千八。你下学期的学费交不上，我去寻守义。”</p>
<p>“他怎么说？”</p>
<p>“他讲，岑老板那边凑出一笔钱，不够还所有人，先还几户最急的。我们家排在前面。”她看着那张收条，“他讲，这件事不能讲出去。讲出去，四十几户都要来闹，钱就谁也拿不到了。排在后面的，也要恨我们。”</p>
<p>“钱是谁送来的？”</p>
<p>“守义。现金，一个信封，当着我的面数的。二十万，一张不少。”</p>
<p>“然后你签了这个。”</p>
<p>“签了。罗会计也在，他记了账。”</p>
<p>我想起罗维民那天在会议室，看着她那张借据，看了很久，久到旁边的人都转过头来。</p>
<p>“那你为什么跟我说，是守义叔想的办法？”</p>
<p>“本来就是他想的办法。”她抬起头，“没有他，岑老板的钱轮不到我们家。你读书的钱，有他一份心。我想让你记着他的好。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>“那你那天为什么还拿着借据去核账？”</p>
<p>她不说话了。</p>
<p>过了一会儿，她说：“守义没讲。是我自己想的。人家都拿着借据，我们不拿，大家就晓得我们拿过了。”</p>
<p>“钱你还打算再拿一次？”</p>
<p>“我不会再拿的。”她的声音一下子高了，又低下去，“到时候岑老板不给我们打，我就讲我们自己不要了，讲你在明州挣得多，不缺这点。”</p>
<p>“今天晚上，你去找守义叔，说什么？”</p>
<p>“我问他，人都死了，警察来了，那张表你交上去了，我们怎么办。”</p>
<p>“他怎么说？”</p>
<p>“他讲，不要动，等过了年再讲。”</p>
<p>她说完，低头看着自己的手。手背上有烫伤的旧疤，是在食堂炸春卷落下的。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我在饭桌另一头坐下来。</p>
<p>那天在会议室，我站起来，对岑启明说，三百万和二百一十万之间差了九十万，请你逐笔说明。屋里的人都看着我，我说得很稳，觉得自己是在替四十八户讨一个公道。</p>
<p>守义叔就坐在后排，两只手揣在羽绒服口袋里。</p>
<p>他知道。九十万里有二十万是我家的，他知道。他看着我站起来，看着我对一个已经还过钱的人说“请你逐笔说明”，看着群里骂了一晚上“姓岑的又要赖九十万”。他什么也没说，只是两只手往下压了压：大家先坐下。</p>
<p>岑启明那天看了我一会儿，然后目光移开，落在守义叔身上。</p>
<p>“先核收款，”他说，“再谈余额。”</p>
<p>我那时候以为他在推。现在我知道，他是在等。等收过钱的人自己开口，等守义叔开口。没有人开口。</p>
<p>傍晚我给他送盒饭，他问：你爸那个病，后来怎么样了？他记得。那二十万是他打出去的，他知道那是一个透析病人家里的钱。</p>
<p>他还说：明天你核到的，可能比你想核的多。</p>
<p>他说对了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>今天早上七点十二分，我给邵峻发了一张表。我妈那一行：二十万元，原件。</p>
<p>那是一个已经不存在的数字。我是这次核账的复核，四十八户里，我交上去的第一行假账，是我自己家的。</p>
<p>我把手机拿出来，打开那张表，光标停在我妈那一行。改成“已结清”，邵峻明天就会来问是谁送的、谁经手、还有哪几户。群里会知道，老街会知道，我妈去菜场，会有人把脸转开，像今天对罗维民那样。</p>
<p>我把手机扣在桌上。</p>
<p>我妈一直看着我，没有劝，也没有求。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>他确实帮了我家，那二十万确实是他一家一家跑出来、一张一张数过来的。可他也确实看着我站起来，替他把一句谎话说得理直气壮。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>快十一点了，鞭炮停了。</p>
<p>我问我妈：“九十万，你那二十万只是其中一份。其余七十万呢？”</p>
<p>她没回答。她把那张收条拿起来，对折，再对折，攥在手心里。</p>
<p>“还有谁？”</p>
<p>她看着窗外。楼下电器铺的灯早就灭了，老街上只剩一盏路灯，照着一地鞭炮的红纸屑。</p>
<p class="last">“不止阿拉一家。”她说。</p>
</article>

<span>No.09</span>

</i>
<b>腊月二十七</b>
</p>
    <p class="ch-no">第九章</p>
    <h1 class="ch-title">冰箱</h1>
    <p class="ch-meta">1,981 字 · 约 5 分钟</p>
  </div>
</header>
<article class="text" lang="zh-CN">
<p>腊月二十七，我又去了二塘河边。</p>
<p>这回开门的是罗维民自己。他穿着一件洗得发白的毛背心，手里还捏着一支铅笔，看见是我，没让开，也没关门。</p>
<p>“罗伯，我妈那一行，我晓得了。”我把收条的照片给他看，“二〇一五年十二月十八日，经手人陈守义、罗维民。”</p>
<p>他看了一眼，又看了一眼，把铅笔夹到耳朵上。</p>
<p>“账上没写的，我不晓得。”</p>
<p>“这张就是账。”我说，“上面写着你的名字。”</p>
<p>屋里他老婆在喊，问是谁。罗维民回头说，是戴师傅家的儿子。他老婆的声音停了一下，接着说，叫他走。</p>
<p>“罗伯，”我把声音放低，“菜场上的人，现在把你当凶手看。邵峻在调岑启明的银行流水，过了年就出来。到时候不用你讲，谁都晓得。”</p>
<p>他站在门口，背后是一屋子算盘和账本的味道。过了很久，他转过身，对里屋说：“你去小店买两斤年糕回来。”</p>
<p>“家里有年糕。”</p>
<p>“再买两斤。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>他老婆出门以后，罗维民没往书桌那边走，而是拉开了厨房里冰箱的冷冻层。</p>
<p>冷冻层塞得满满当当：一袋年糕，两条带鱼，一包冻汤圆，一块咸肉。他把这些一样一样拿出来，摆在灶台上，从最里面抽出一个塑料袋，袋子外面结着一层霜。</p>
<p>袋子里是三本账簿，硬壳，边角泡得发软，冻成了硬邦邦的一块。</p>
<p>“那年台风，二塘进过水。”他说，“厂里留下的几本旧账，我搬回来的那几本，泡在水里一夜。”</p>
<p>“那你冻起来做什么？”</p>
<p>“台风过后，市里的号转过一篇文章，是一水阁写的，讲泡了水的书不能晒，晒了要烂，先冻起来，冻住了就不坏，以后再慢慢化。”他把塑料袋放在桌上，“我看了，就冻上了。冻了一年多，一直没舍得化。”</p>
<p>我看着那袋冻硬的账簿，又看了看灶台上那两条带鱼。</p>
<p>“你老婆不晓得？”</p>
<p>“她晓得冰箱里有账，不晓得是哪本。”</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>账簿要化开，得等。罗维民把它放在暖气片旁边，垫了两层报纸，泡了一壶茶，在桌子另一头坐下，开始讲。</p>
<p>“二〇一五年冬天，岑启明凑出九十万。不够还所有人，守义跟他讲，先还几户最急的，不要声张，声张了，四十几户都要堵上门，钱就谁也拿不到。”</p>
<p>“名单是谁定的？”</p>
<p>“守义定的。岑启明那几年不敢回上林，人都见不着，只信守义。”</p>
<p>“钱怎么走？”</p>
<p>“岑启明从他卡上，一笔一笔打到守义卡上。守义取现金，装信封，一家一家送去。收条是守义拟的格式，各家签了字，他拿回来，我在经手人那一栏补签。打过来多少，每一笔我都记。信封里装了多少，我没看见，也没问。”</p>
<p>“收条为什么只写结清，不写收到多少？”</p>
<p>罗维民抬头看了我一眼：“守义讲，写结清就够了。写数目，万一传出去，人家一看就晓得拿了多少，更难听。”</p>
<p>他说得很自然，像是这个道理他自己也信过很多年。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>一个多钟头以后，账簿的封面软了。罗维民用一把裁纸刀，顺着页边一点一点挑开。有两页粘在一起，他挑了十几分钟，额头上出了一层汗。</p>
<p>纸页起了波浪，蓝墨水洇开了，像是隔着一层水在看字。可每一行还认得出来。</p>
<div class="doc ledger">
<p class="lh">二〇一五年十二月，岑启明汇陈守义：</p>
<p class="li">
<span>戴秀琴，</span>
<span>二十万；</span>
</p>
<p class="li">
<span>应国庆，</span>
<span>十五万；</span>
</p>
<p class="li">
<span>胡国良，</span>
<span>十五万；</span>
</p>
<p class="li">
<span>钟德明，</span>
<span>十五万；</span>
</p>
<p class="li">
<span>俞阿桂，</span>
<span>十五万；</span>
</p>
<p class="li">
<span>邬长海，</span>
<span>十万。</span>
</p>
</div>
<p>合计九十万。每一笔后面，都有收条日期和罗维民的签名。</p>
<p>我在心里算了一遍，又用手机算了一遍。三百万减九十万，二百一十万。</p>
<p>岑启明那天在会议室说的数，一分没少。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我盯着那几个名字。</p>
<p>钟家，三塘边上，老太太拉着我的手，说要不是守义送来的那笔钱，老头子早就没了。陈守义跟我说，那是救命钱。救命是真的，那笔钱是岑启明还的。</p>
<p>俞家，轮椅的刹车，他蹲在地上修了二十分钟。邬家，门口贴着考上大学的红纸。</p>
<p>胡国良。老胡。那天在会议室骂得最凶的是他：“姓岑的，你也别觉得自己多讲良心。”群里那句“凭什么他先拿”，也是他。</p>
<p>还有应国庆。</p>
<p>“应国庆是你内弟。”我说。</p>
<p>罗维民没有否认。他把裁纸刀放下，两只手摊在桌上，看着那一行。</p>
<p>“我老婆的弟弟。”他说，“那年他儿子要做手术。守义问我，应家排不排前面。我讲排。”</p>
<p>“所以你一直不讲。”</p>
<p>“我讲了，我老婆娘家在上林就没法做人。”他停了一下，“核账那天，我晓得那九十万是怎么回事。姓岑的被人骂赖账，我坐在那里，一颗算珠都没拨。”</p>
<p>他说的“姓岑的”，跟那天会议室里别人说的，是一个口气。可他说完，自己先低下了头。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>“罗伯，附件二里写的，就是这些？”</p>
<p>“就是这些。转账记录，收条复印件，六户。”</p>
<p>“那天晚上谁拿走了它，你晓得吗？”</p>
<p>“我不晓得。”他说，“我六点半就回来了，我老婆可以作证。后门那条路，我十几年没走过。”</p>
<p>他说完这句，抬头看我，眼睛里有一点我没见过的东西，像是怕，又像是松了一口气。</p>
<p>我把那一页拍了下来，又拍了一张整本的封面。罗维民没有拦我。</p>
<p>门外有脚步声，是他老婆买年糕回来了。他赶紧把账簿合上，用报纸裹好，又想了想，没有放回冰箱，推到了我面前。</p>
<p>“你拿去。”他说，“反正过了年，都要晓得的。”</p>
<p>我抱着那包湿漉漉的账簿走出门，二塘河边的风一吹，报纸都冻硬了。</p>
<p>走到半路，我又把照片打开，看了一遍那一页的抬头。</p>
<div class="doc ledger crop">
<p>岑启明汇陈守义。</p>
</div>
<p class="last">九十万，六户人家。每一笔，都是先打到陈守义卡上，再由他送去的。</p>
</article>

    <p class="ch-no">第十章</p>
    <h1 class="ch-title">先拿的人</h1>
    <p class="ch-meta">1,843 字 · 约 5 分钟</p>
  </div>

<article class="text" lang="zh-CN">
<p>腊月二十八一早，我把罗维民那几页账的照片发给了邵峻，附了一句：六户，九十万，经手人罗维民提供，原件在我这里。</p>
<p>发之前，我先改了那张表。我妈那一行，“已还：零”，我删掉，打上：二十万，二〇一五年十二月已结清。</p>
<p>邵峻十分钟后回了两个字：收到。过了一会儿，又来一条：先别外传。</p>
<p>我也没打算外传。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我去找老胡，只是想当面问一句。</p>
<p>他在老街口的老年活动室打牌，四个人一桌，桌上一壶茶，烟灰缸满了。看见我进来，他把牌往桌上一扣：“许会计，有消息了？钱什么时候打？”</p>
<p>我请他出来说两句。他跟着我走到门口的屋檐下，还在说岑家姑娘要是敢不认，他第一个去她公司门口拉横幅。</p>
<p>“胡叔，”我说，“二〇一五年十二月，你拿过十五万。”</p>
<p>他的嘴还张着，话停在半截。过了几秒，脸一下子红到脖子：“你听谁讲的？”</p>
<p>“账上写着。”</p>
<p>“什么账？谁的账？”他的声音高了，活动室里打牌的都往外看，“我拿什么了？你一个在明州吃皇粮的，回来搅什么搅？”</p>
<p>我没再说什么，转身走了。走到老街拐角，手机响了一声。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>是工友群。老胡发了一条，不是语音，是他一个字一个字打出来的：</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av" aria-hidden="true">胡</span>
<div>
<p class="who">
<span>老胡</span>
</p>
<p class="bub">许家儿子来问了，你们嘴巴紧点，就讲不晓得。</p>
</div>
</div>
</div>
<p>群里安静了大概十秒钟。</p>
<p>然后显示：</p>
<div class="chat" role="group" aria-label="群聊消息">
<p class="sysm">
<span>胡国良撤回了一条消息</span>
</p>
</div>
<p>已经晚了。有三个人截了图。第一张截图发出来的时候，我还站在拐角，手里攥着手机。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">你们是谁？</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">嘴巴紧点什么？</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">老胡，你发错群了吧？</p>
</div>
</div>
</div>
<p>老胡没回话。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>接下来的事，快得像一瓢水泼进了热油锅。</p>
<p>先说话的是钟家的孙子，二十出头，在外地读研究生，平常在群里只发过年红包。他发了一段很长的话：</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av" aria-hidden="true">钟</span>
<div>
<p class="who">
<span>钟家孙子</span>
</p>
<p class="bub">我刚问了我奶奶。二〇一五年，我爷爷化疗那年，家里拿过一笔钱，是守义叔送来的。我奶奶一直以为是守义叔帮忙要来的，她不晓得这是不能讲的事。对不起大家。</p>
</div>
</div>
</div>
<p>后面他又发了一句：钱要是该退，我们家退。有人回他：小孩子别闹，钱的事大人讲。</p>
<p>然后是俞家。俞家的媳妇发了一张照片，是一张收条，跟我妈那张一模一样的格式：本金已全部结清。下面一句：“我家也拿过。要骂就骂。”</p>
<p>邬家没说话，邬家的人默默退了群。</p>
<p>有人问：拿了多少？</p>
<p>没人回答。过了一会儿，俞家媳妇回了一句：收条上写的是结清，结清就是结清。</p>
<p>又有人说：还能拿多少，借多少还多少呗。</p>
<p>这句话底下，六户里没有一家出来说不是。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">还有谁？</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">不止这几家。</p>
</div>
</div>
</div>
<p>有人说应家。应国庆的老婆在群里，一个字没回，头像灰了。</p>
<p>然后有人说：“戴师傅那天拿的是原件。罗会计盯着看了半天，你们没看见？”</p>
<p>我站在老街拐角，看着这一行字。四十八户的群，三百多条消息，这一句底下，没有一个人接话。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>下午，有人另外拉了一个群，叫“恒成讨债”，四十多个人。我没被拉进去，是金彩凤的儿子私下发给我的截图，问我：许会计，你妈那一份，是真的吗？</p>
<p>我回：是真的。</p>
<p>他回了一个“哦”，再没说话。</p>
<p>老群里，有人开始叫陈守义“老陈”。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="chat-h">
<span>恒成老工友（年前结清）</span>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">老陈早就晓得，为什么不讲？</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">六户的钱都是老陈一家一家送去的，名单也是他定的。</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">警察下午又把老陈叫去了。</p>
</div>
</div>
</div>
<p>也有人照旧叫他守义阿哥：“守义阿哥是为了大家好，讲出去，那年谁家都拿不到。”</p>
<p>两种叫法在群里来来回回。</p>
<p>然后有人翻出了一张旧截图，是腊月二十二夜里，老胡撤回的那条消息。原来那天晚上就有人截了，一直没发。</p>
<div class="chat" role="group" aria-label="群聊消息">
<div class="msg shot">
<span class="av" aria-hidden="true">胡</span>
<div>
<p class="who">
<span>老胡</span>
<span>旧截图 · 已撤回</span>
</p>
<p class="bub">死得好，那九十万再也对不出来了。</p>
</div>
</div>
</div>
<p>底下有人问：“老胡，对不出来，对你有什么好处？”</p>
<p>老胡退群了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我妈一整天没出门。</p>
<p>她的手机响了七八回，她一个都没接，把手机扣在饭桌上，跟陈守义扣手机的样子一模一样。傍晚，她说要去菜场买点菜，走到楼梯口，又回来了，说家里还有。</p>
<p>快天黑的时候，我的手机开始收到私信。</p>
<div class="chat" role="group" aria-label="私信">
<div class="chat-h">私信</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">小许，你一个在明州的人，回来搅这一摊做什么？</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">人都死了，钱的事过了年再讲不行吗？非要让活人过不了年？</p>
</div>
</div>
<div class="msg">
<span class="av anon" aria-hidden="true">
</span>
<div>
<p class="bub">你妈也拿了，你还查？</p>
</div>
</div>
</div>
<p>还有一条，是一个很少说话的老工友发的：“查清楚也好。可你妈以后在老街上怎么走路？”</p>
<p>我一条都没回。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>晚上九点，楼下有人敲门。</p>
<p>是陈守义。他没上楼，站在楼梯底下，叫了我一声。我下去，他把我领进电器铺，卷帘门拉下来一半。后屋的灯亮着，卢彩娣的电视声开得很大。</p>
<p>铺子里一股机油味。那台电暖器已经修好了，后盖拧得严严实实，搁在柜台角上。他坐在柜台后面，我站在柜台前面，中间隔着一只拆开的电饭煲。</p>
<p>“今天下午，县里又叫去问了两个钟头。”他说，“问九十万，问名单，问钱是怎么送的。”</p>
<p>“你怎么说？”</p>
<p>“照实讲。钱是老岑的，送是阿拉送的，名单是阿拉定的。”他停了一下，“这些事，当年是为大家好。”</p>
<p>我没接话。</p>
<p>他抬起头。他的眼睛里全是红丝。</p>
<p class="last">“知川，这件事到这里停下来。”他说，“再查下去，你妈会成为众矢之的。”</p>
</article>

<li data-i="9">

</i>
<span>九塘</span>

    <p class="ch-no">第十一章</p>
    <h1 class="ch-title">死人房里</h1>
    <p class="ch-meta">1,742 字 · 约 4 分钟</p>
  </div>

<article class="text" lang="zh-CN">
<p>那天晚上，我没有回答陈守义。我说了一句“我先上去了”，就上了楼。他在柜台后面坐着，没有叫住我。</p>
<p>半夜一点多，手机响了。是老胡。</p>
<p>他喝了酒，舌头有点大，开口第一句是：“许会计，我不是人。”</p>
<p>我等他往下讲。</p>
<p>“那天晚上，我在活动室打牌，听讲姓岑的死了。我第一个念头是，好了，明天不用当着大家的面对了。”他在那头喘了口气，“我那十五万是拿过的。我骂他骂得最凶，我怕他第二天当着四十几户的面，一户一户点名，点到我。他一死，那九十万就再也没人对得出来了。我就发了那一句。发出去，自己都吓了一跳，赶紧撤回。”</p>
<p>“胡叔，那天晚上你在哪里？”</p>
<p>“活动室，打到十一点。十几个人看着，警察都问过了。”他笑了一声，比哭还难听，“我连他死都没那个胆子去看。我就是嘴巴贱，心里也贱。”</p>
<p>他挂了电话。我躺在床上，听见楼下电器铺的卷帘门，一直没有响。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>腊月二十九，邵峻一早打电话来，叫我去一趟县局。</p>
<p>“有份东西，要你帮着看看。”他说，“账上的事，你比我们懂。”</p>
<p>县局刑侦大队在一栋老楼的三楼，走廊里贴着防诈骗的海报。我在走廊尽头的长椅上等，看见韩岚从一间屋里出来。</p>
<p>她没穿那件驼色大衣，穿的是一件灰色羽绒服，头发没梳，脸上一点妆也没有。看见我，她停了一下。</p>
<p>“我没见到他。”她说，声音很哑，“许会计，我从头到尾，没见到他。”</p>
<p>她身后的门里，有人叫她的名字。她转身回去了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>邵峻把我领进一间小会议室，桌上放着一台笔记本电脑，一个证物袋。</p>
<p>“韩岚的车上有行车记录仪。”他说，“她一开始讲坏了，技术科从卡里恢复出来的。”</p>
<p>他点开一段音频。先是车门关上的声音，然后是发动机，然后是韩岚的声音，很急，在打电话：</p>
<p>“……拿到了，在包里，我拿到了。……没有，没见到他。档案室门关着，灯亮着，我没敢进去。……我怎么敢进去？他要是看见我翻他的包……你别问了，回去再讲。”</p>
<p>录音停了。邵峻看了一下时间：21:19。</p>
<p>“仓库那个戴毛线帽的小姑娘，也问过了。”他说，“那天晚上九点多，她上二楼厕所，正好看见一个穿大衣的女人进了会议室，就是楼梯边上那间，几分钟就出来了，没往走廊里头走。她还讲，走廊尽头那间门缝里有光，里面椅子响了一下，像有人在挪椅子。”</p>
<p>“那就是说，九点十分，人还活着。”</p>
<p>邵峻没接这句话。他把证物袋推到我面前。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>是一份协议，三页，复印件，签着岑启明和韩岚的名字，日期是二〇一一年八月。</p>
<p>“她从岑启明的公文包里拿走的，就是这个。原件她烧了，这份是我们从她公司保险柜里找到的复印件。”邵峻说，“你看看，这里面跟钱有关的，到底是什么意思。”</p>
<p>我一页一页往下看。</p>
<div class="doc contract">
<p>
<b>第一条：</b>韩岚自愿退出恒成电器经营管理。</p>
<p>
<b>第二条：</b>恒成名下美国三家客户的后续订单，转由韩岚新设立的贸易公司承接。</p>
<p>
<b>第三条：</b>韩岚出借恒成之款项人民币伍拾万元，于本协议签订之日一次性结清。</p>
</div>
<p>我在第三条上停了很久。</p>
<p>二〇一一年八月。那年四月，车间停了机器，四十几个人站在流水线中间，一个一个在借条上签字。六月，罗维民在登记簿扉页写下三百万。八月，副厂长韩岚拿着五十万，带着三家美国客户，走了。</p>
<p>“结清。”我说，“又是结清。”</p>
<p>“什么意思？”</p>
<p>“意思是，厂还没倒，她借给厂里的五十万，先一分不少地拿回去了。工人的钱刚进去，她的钱先出来。她带走的那三家客户，是恒成最大的订单。”我把协议放下，“这份东西要是让工友们看见，她在上林就待不下去了。”</p>
<p>“所以她宁可讲自己隔着门跟一个死人吵架。”</p>
<p>“她不晓得他死了。”我说，“她以为他在里面写东西。”</p>
<p>话说出口，我自己愣了一下。</p>
<p>九点十分，韩岚在会议室翻他的包，档案室的门缝里亮着灯，椅子响了一下。她和他隔着一条走廊，不到十米。她怕他出来，他也许正想出来。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>“她算是洗清了？”我问。</p>
<p>“她讲的那一句是假的，别的基本对得上。”邵峻说，“她没进过档案室。”</p>
<p>“那九点十分以后呢？监控上再没人进去。后门呢？”</p>
<p>“后门从里面插着插销，我们第二天一早去，还是插着的。”他靠在椅背上，“罗维民那晚六点半到家，他老婆和邻居都能作证。老胡在活动室，十几个人看着。”</p>
<p>“那他是怎么死的？”</p>
<p>邵峻沉默了一会儿，从文件夹里抽出一张纸，看了一眼，又放回去。</p>
<p>“法医的初步意见出来了。后脑撞在柜角上，颅内出血。”他说，“还有一点。法医讲，他受伤以后，人还清醒过一阵子。”</p>
<p>我坐在那里，没有动。</p>
<p>清醒过一阵子。九点十分，椅子响了一下。</p>
<p class="last">那一阵子，有多长？</p>
</article>

    <p class="ch-meta">1,455 字 · 约 4 分钟</p>

<article class="text" lang="zh-CN">
<p>除夕上午，我给岑悦打了个电话，问她要她父亲公司出纳的号码。</p>
<p>她没问我要做什么，过了两分钟，把号码发了过来，又补了一句：她叫小姚，这几天一直在哭。</p>
<p>小姚接电话的时候，鼻音很重。我说我是上林这边核账的会计，想问一下那天晚上老葛那笔五万是几点付的。</p>
<p>“九点三十八。”她说，“岑总中午在OA上批的。那天下午我在银行对年底的账，排队排到七点多，回公司又吃了碗面，九点半才坐到电脑前面。”</p>
<p>“付完你告诉他了吗？”</p>
<p>“发了微信，九点三十九分，跟他说老葛那笔走掉了。”她停了一下，“他没回。他平常都回一个‘好’字的。我还以为他睡了。要是我那时候打个电话过去……”</p>
<p>她说不下去了。我这才明白她为什么一直在哭。那个“好”字，她等了七天，到现在还在想，如果那天晚上多打一个电话，会不会不一样。</p>
<p>我没告诉她，九点三十九分，他多半已经接不了电话了。</p>
<p>挂了电话，我在饭桌边坐了很久。</p>
<p>九点三十八分，是小姚点下网银的时间。九点四十一分，是钱到老葛卡上的时间。九点三十九分那条微信，到现在还是未读。</p>
<p>这笔钱从头到尾，跟岑启明那时候是死是活，没有一点关系。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>我把这件事告诉邵峻。他说出纳前天已经来过了，笔录都做完了。</p>
<p>“那到账就不算了。”我说。</p>
<p>“本来也不算。”他说，“九点十分椅子响了一下，那个才算。”他停了一下，“初二上午你来县局一趟，补一份笔录。八点钟收盒饭你在边上，有几句我想再问问。”</p>
<p>挂了电话，我脑子里一直转着一个东西，转了好几圈才抓住。</p>
<p>付款时间和到账时间，是两个时间。中间隔着一个人：出纳什么时候坐到电脑前面，银行什么时候清算。只看到账，你会以为钱是那一刻付的。</p>
<p>受伤和死，也是两个时间。法医说，他受伤以后，人还清醒过一阵子。九点十分，椅子响了一下，他还在动。可那时候，伤已经在他身上了。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>年夜饭是我妈一个人做的，八个菜，两个人吃。她照老规矩，在桌子上多摆了一副碗筷，是给我爸的。</p>
<p>电视开着，春晚的声音关了。楼下电器铺的卷帘门关得严严实实，后屋的灯亮着。</p>
<p>吃到一半，我跟我妈说，邵峻叫我初二去一趟县局，问八点钟收盒饭的事。</p>
<p>她筷子停在半空，过了一会儿放下来。</p>
<p>“问你什么？”</p>
<p>“他问什么，我讲什么。”</p>
<p>“你守义叔不是那种人。”她说，“他送钱那年，当着我的面数了三遍，一张都没少。你爸住院，他骑三轮车送了一个冬天的饭。”</p>
<p>“我没说他是那种人。”我说，“他问什么，我讲什么。”</p>
<p>她没再说话，给我夹了一块鱼，又给我爸那只空碗里夹了一块。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>十一点多，我出了门。</p>
<p>老街上到处是鞭炮的红纸屑，塘路上一盏灯也没有。我一直走到二塘，走到老厂门口。警戒线已经撤了，仓库的灯还亮着一盏。</p>
<p>门口蹲着一个人，捧着一个外卖盒在吃饺子。</p>
<p>是那个戴毛线帽的姑娘。她看见我，抬了一下头，认出来了：“你是那天楼上的。”</p>
<p>“你过年不回家？”</p>
<p>“老板讲除夕值班三倍工资。”她夹起一个饺子，“我算了一下，够我妈一个月的药钱。外卖平台上今天能点的只剩一家饺子馆，送了一个半钟头，都坨了。”</p>
<p>她是贵州的，来上林第三年。我在她旁边蹲下来。远处有人家开始放烟花，一朵一朵在海塘那边炸开。</p>
<p>“那天晚上，你吃完外卖，盒子扔在这里了？”我指了指门边那只绿色的大垃圾桶。</p>
<p>“扔了。”她说，“你们来的时候我刚吃完。”</p>
<p>“桶里还有别的吗？”</p>
<p>她想了想。</p>
<p>“空的。那天傍晚六点，环卫车刚来清过。我扔进去的时候，咚的一声，就我一个盒子。”她又夹了一个饺子，“警察那天夜里也翻过这个桶，翻了一个钟头。我还想呢，楼上你们白天吃了那么多盒饭，盒子都扔哪里去了。”</p>
<p>我蹲在那里，没有站起来。</p>
<p class="last">八点四十七分，陈守义拎着一只鼓鼓的塑料袋出了院门。他说是盒饭垃圾。袋子是我看着他装的。</p>
</article>

    <p class="ch-no">第十三章</p>
    <h1 class="ch-title">抓痕</h1>
    <p class="ch-meta">1,562 字 · 约 4 分钟</p>
  </div>

<article class="text" lang="zh-CN">
<p>大年初一，我一整天没出门。</p>
<p>楼下电器铺没开门。老街上的人来来去去拜年，有人在铺子门口站一下，喊一声“守义阿哥新年好”，后屋的门帘动一动，卢彩娣出来应一声，说他身体不大好，在睡。</p>
<p>我妈去庙里烧了香。回来的时候，手里多了一个平安符，红绳子系着，她没说是给谁求的，放在了饭桌上。</p>
<p>晚上十点，邵峻发来一条短信：明天上午九点，三楼。</p>
<p>我回了一个字：好。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>正月初二，县局三楼只有值班的几个人，走廊里的防诈骗海报被人贴上了一个福字。</p>
<p>邵峻给我倒了一杯水，翻开本子。</p>
<p>“八点钟收盒饭，你在边上。”他说，“陈守义那时候在做什么？”</p>
<p>“把盒子摞起来，装进一只大塑料袋。”</p>
<p>“他袖子是撸着的，还是放着的？”</p>
<p>我想了一下。他把羽绒服的袖子撸到了胳膊肘，两只手腕上沾着酱油，在袋口系了个死结，系得很用力，手背上的筋都绷了起来。</p>
<p>“撸着的。”</p>
<p>“左手腕上，有没有伤？有没有贴东西？”</p>
<p>纸杯被我捏瘪了一点，水漫到虎口上。</p>
<p class="beat">“没有。”</p>
<p>邵峻在本子上记了一笔，翻回前面几页，看了一会儿。</p>
<p>“你那天晚上说，八点五十五以后，他一直在铺子里。”</p>
<p>“是。”</p>
<p>“这两句话，都是真的。”</p>
<p>“都是真的。”</p>
<p>他把一份打印好的笔录推到我面前，叫我看一遍，没问题就签字。</p>
<p>我从头看到尾。上面写着我的名字、我的身份证号、我说的每一句话。最后一行空着，等我签。</p>
<p>我核了七年的账，签过几千张单子，从来没有一张签得这么慢。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>签完以后，邵峻没让我走。</p>
<p>“法医的正式意见出来了。”他说，“你懂账，我讲给你听，你听得懂。”</p>
<p>他把一张纸翻过来，指着上面的字。</p>
<p>“后脑撞在柜角上，颅骨有一道裂缝，底下是血肿。这种伤，人当场不一定倒，可以爬起来，可以讲话，可以写字，过个几十分钟，血压住了，人就不行了。法医管这个叫中间清醒期。”</p>
<p>“他写的那个‘一’。”</p>
<p>“对。清醒能有多久，因人而异，几十分钟到一两个钟头都有，法医不肯讲死。死亡大概在九点半前后。”</p>
<p>“所以时间只能靠别的东西框。”他说，“八点钟，你看见他手腕上没有伤。八点四十七分，他拎着袋子出了院门。九点十分，档案室里椅子响。前门监控上再没有人进去，后门从里面插着。”他把笔放下，“屋里剩下的，就是他们两个人。”</p>
<p>“柜角上的血，和他后脑的伤口对得上。他头发里有柜子上的漆皮。指甲里是陈守义的东西。”邵峻停了一下，“那天夜里两点多拍的伤口照片，法医也看了，讲是新伤。几点抓的，照片上看不出来。”</p>
<p>“八点四十一分那个电话……”</p>
<p>“打给你的。”他说，“没打出去。”</p>
<p>我坐在那里，手里还捏着那支签字笔。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>中午，邵峻带着人去了老街。</p>
<p>我跟在后面，没有进铺子，站在楼梯口。我妈站在楼上的窗口，没有下来。</p>
<p>卷帘门拉起来的时候，陈守义坐在柜台后面，穿着那件袖口磨亮了的羽绒服，像是早就在等。他看见邵峻，站了起来，又看见了我，没说话。</p>
<p>技术员径直去了后门。铺子后门外面是一条窄巷子，墙根下放着一只铁皮桶，桶壁熏得漆黑。卢彩娣跟出来，站在门槛上。</p>
<p>“烧什么的？”邵峻问她。</p>
<p>“旧挂历。”卢彩娣说，“过年了，清一清。”</p>
<p>技术员把桶里的灰倒在一块塑料布上，用镊子一点一点拨开。灰是黑的，有几片没烧透的纸角，卷着，一碰就碎。</p>
<p>过了一会儿，技术员夹起一样东西，举起来对着光看。是一角没烧透的纸，边上焦黄卷着，印着表格的横线，格子里还剩半个字，金字旁。</p>
<p>邵峻看着那一角纸，又看着卢彩娣：“挂历上，有表格？”</p>
<p>卢彩娣张了张嘴，没说出话来。她扶着门框站了一会儿，转身进了后屋。门帘落下来，晃了很久。</p>
<div class="brk" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
<p>他们给陈守义戴上了手铐。他没有挣，把两只手伸出去，伸得很直，像在车间里递一把扳手给人。</p>
<p>走到楼梯口，他在我面前停了下来。</p>
<p>邵峻没有催他。</p>
<p>他看着我，喉结上下动了两回，才发出声音。</p>
<p>“知川，”他说，“那天晚上……推了他一把。”</p>
<p>楼上的窗户响了一下，是我妈把窗推开了。</p>
<p class="last">“可他站起来了。”陈守义说，声音一下子急了，像是怕我不信，“他站起来了，还骂人，指着门叫滚。走的时候，他好好的。”</p>
</article>
